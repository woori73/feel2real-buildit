name: NewStart official updates connect (insert-only)

# Curated official_updates loader: k13~k42 verified sources + hand-verified
# FSC/HOPE collection. DRY_RUN is the default. WRITE inserts missing rows as
# REVIEW via admin create, then publishes each newly-created row via admin
# publish (reviewer = ADMIN login id). It never updates, deletes, rejects,
# archives, or touches knowledge/RAG/cafe rows. Service-level duplicates are
# caught and counted as skips.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "DRY_RUN only reads production; WRITE inserts missing rows and publishes them"
        required: true
        type: choice
        options:
          - DRY_RUN
          - WRITE
        default: DRY_RUN

permissions:
  contents: read

concurrency:
  group: newstart-official-updates-connect
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require configured ADMIN credentials
        env:
          ADMIN_LOGIN: ${{ secrets.NEWSTART_SEED_ADMIN_LOGIN_ID }}
          ADMIN_PASSWORD: ${{ secrets.NEWSTART_SEED_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_LOGIN" && test -n "$ADMIN_PASSWORD" || {
            echo "::error::Existing NewStart ADMIN secrets are required"; exit 1;
          }
          echo "Mode=${{ inputs.mode }}; credential values are not printed."

      - name: Checkout payload and insert-only loader
        uses: actions/checkout@v4

      - name: Verify fixed connect payload
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("docs/newstart/research-official/updates-connect/official_updates_connect_2026-10-01.json")
          rows = json.loads(p.read_text(encoding="utf-8"))
          assert len(rows) == 24, len(rows)
          for r in rows:
              assert r["sourceType"] in ("CCRS", "NEWSTART_FUND", "FSC", "CREDIT4U", "FSS", "COURT", "HOPE_RETURN_PACKAGE"), r
              assert r["title"] and r["summary"] and r["originalUrl"].startswith("https://"), r.get("officialDocumentId")
              assert r["category"] in ("POLICY", "ELIGIBILITY", "APPLICATION", "DEBT_ADJUSTMENT", "NOTICE", "OTHER"), r
          print("Fixed connect payload verified: 24 candidate rows")
          PY

      - name: Read-only production duplicate dry run
        if: ${{ inputs.mode == 'DRY_RUN' }}
        env:
          NEWSTART_SEED_ADMIN_LOGIN_ID: ${{ secrets.NEWSTART_SEED_ADMIN_LOGIN_ID }}
          NEWSTART_SEED_ADMIN_PASSWORD: ${{ secrets.NEWSTART_SEED_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          python3 docs/newstart/research-official/updates-connect/load_official_updates_prod.py \
            --payload docs/newstart/research-official/updates-connect/official_updates_connect_2026-10-01.json

      - name: Insert missing rows and publish
        if: ${{ inputs.mode == 'WRITE' }}
        env:
          NEWSTART_SEED_ADMIN_LOGIN_ID: ${{ secrets.NEWSTART_SEED_ADMIN_LOGIN_ID }}
          NEWSTART_SEED_ADMIN_PASSWORD: ${{ secrets.NEWSTART_SEED_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          python3 docs/newstart/research-official/updates-connect/load_official_updates_prod.py \
            --payload docs/newstart/research-official/updates-connect/official_updates_connect_2026-10-01.json --write
