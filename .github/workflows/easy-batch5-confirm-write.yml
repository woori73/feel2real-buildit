name: Easy Batch5 Selective Confirm (WRITE, manual, temporary)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2

      - name: Batch5 Selective Confirm via SSM (WRITE)
        shell: bash
        run: |
          cat > /tmp/mysql-confirm.json <<'PARAMS'
          {"commands":[
            "set +e",
            "echo \"=== Batch5 Selective Confirm (WRITE) ===\"",
            "source /etc/f2r/env 2>/dev/null || true",
            "curl -s -X POST http://localhost:8080/api/admin/easy/imports/5/confirm -H 'Content-Type: application/json' -d '{\"rowIds\":[130,136,137,191,237,271,272,273,274,275,276,279,353,354,360,378,440,441,442,446,448,449,506,512,542,550,569,572,573,576,577,579,595,608,609,610,626,629,632,637,657,663,676]}' 2>&1 || echo \"curl_exit=$?\"",
            "exit 0"
          ]}
          PARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09d7cabb5a42d1135" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/mysql-confirm.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135"
          echo "wait_exit=$?"
          echo "===== invocation status ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query '{Status:Status,ResponseCode:ResponseCode}' --output text
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardOutputContent' --output text
          echo "===== StandardErrorContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardErrorContent' --output text
          exit 0