name: EC2 resize pre-check (read-only AWS API, approved)
on:
  push:
    branches: ['ci/dc-step1-readonly']
    paths: ['.github/workflows/ec2-resize-readonly.yml']
permissions:
  contents: read
  id-token: write
jobs:
  readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2
          role-duration-seconds: 900
          retry-max-attempts: 1
      - name: Read-only describe calls (failures are reported, never worked around)
        run: |
          I=i-09d7cabb5a42d1135
          r() { echo; echo "### $1"; shift; "$@" 2>&1 | head -c 4000 || true; echo; }
          aws sts get-caller-identity --query '{Account:Account}' --output json
          r describe-instance aws ec2 describe-instances --instance-ids $I --output json --query 'Reservations[0].Instances[0].{type:InstanceType,state:State.Name,az:Placement.AvailabilityZone,tenancy:Placement.Tenancy,arch:Architecture,vpc:VpcId,subnet:SubnetId,privateIp:PrivateIpAddress,publicIp:PublicIpAddress,iamProfile:IamInstanceProfile.Arn,sgs:SecurityGroups[].GroupId,ebsOptimized:EbsOptimized,ena:EnaSupport,monitoring:Monitoring.State,hibernation:HibernationOptions,imds:MetadataOptions,cpu:CpuOptions,launch:LaunchTime,rootDevice:RootDeviceName,rootType:RootDeviceType,lifecycle:InstanceLifecycle,volumes:BlockDeviceMappings[].{dev:DeviceName,vol:Ebs.VolumeId,deleteOnTerm:Ebs.DeleteOnTermination},nameTag:Tags[?Key==`Name`]|[0].Value}'
          r instance-attr-stop aws ec2 describe-instance-attribute --instance-id $I --attribute disableApiStop --output json
          r instance-attr-termination aws ec2 describe-instance-attribute --instance-id $I --attribute disableApiTermination --output json
          r volumes aws ec2 describe-volumes --filters Name=attachment.instance-id,Values=$I --output json --query 'Volumes[].{id:VolumeId,size:Size,type:VolumeType,iops:Iops,throughput:Throughput,encrypted:Encrypted,state:State,az:AvailabilityZone,devices:Attachments[].Device}'
          r elastic-ip aws ec2 describe-addresses --filters Name=instance-id,Values=$I --output json --query 'Addresses[].{ip:PublicIp,alloc:AllocationId,assoc:AssociationId}'
          r all-eips-count aws ec2 describe-addresses --output json --query 'length(Addresses)'
          r security-groups aws ec2 describe-security-groups --output json --query 'SecurityGroups[?contains(`'"$(aws ec2 describe-instances --instance-ids $I --query 'Reservations[0].Instances[0].SecurityGroups[0].GroupId' --output text 2>/dev/null)"'`,GroupId)].{id:GroupId,name:GroupName,inbound:IpPermissions[].{proto:IpProtocol,from:FromPort,to:ToPort,cidrs:IpRanges[].CidrIp,groups:UserIdGroupPairs[].GroupId},outboundRules:length(IpPermissionsEgress)}'
          VOLS=$(aws ec2 describe-volumes --filters Name=attachment.instance-id,Values=$I --query 'Volumes[].VolumeId' --output text 2>/dev/null)
          for v in $VOLS; do r "snapshots-of-$v" aws ec2 describe-snapshots --owner-ids self --filters Name=volume-id,Values=$v --output json --query 'sort_by(Snapshots,&StartTime)[-3:].{id:SnapshotId,start:StartTime,state:State,size:VolumeSize,progress:Progress}'; done
          r instance-types aws ec2 describe-instance-types --instance-types t3.small t3.medium t3a.medium t3.large m6i.large --output json --query 'InstanceTypes[].{type:InstanceType,vcpu:VCpuInfo.DefaultVCpus,memMiB:MemoryInfo.SizeInMiB,burstable:BurstablePerformanceSupported,network:NetworkInfo.NetworkPerformance,ebsOpt:EbsInfo.EbsOptimizedSupport,ena:NetworkInfo.EnaSupport,arch:ProcessorInfo.SupportedArchitectures}'
          r current-type-details aws ec2 describe-instance-types --instance-types "$(aws ec2 describe-instances --instance-ids $I --query 'Reservations[0].Instances[0].InstanceType' --output text 2>/dev/null)" --output json --query 'InstanceTypes[].{type:InstanceType,vcpu:VCpuInfo.DefaultVCpus,memMiB:MemoryInfo.SizeInMiB,network:NetworkInfo.NetworkPerformance,ebsOpt:EbsInfo.EbsOptimizedSupport,burstable:BurstablePerformanceSupported,arch:ProcessorInfo.SupportedArchitectures}'
          AZ=$(aws ec2 describe-instances --instance-ids $I --query 'Reservations[0].Instances[0].Placement.AvailabilityZone' --output text 2>/dev/null)
          r offerings-in-az aws ec2 describe-instance-type-offerings --location-type availability-zone --filters Name=location,Values=$AZ Name=instance-type,Values=t3.small,t3.medium,t3a.medium,t3.large --output json --query 'InstanceTypeOfferings[].InstanceType'
          r autoscaling aws autoscaling describe-auto-scaling-instances --instance-ids $I --output json
          r target-groups aws elbv2 describe-target-groups --output json --query 'TargetGroups[].{name:TargetGroupName,arn:TargetGroupArn,port:Port,proto:Protocol,type:TargetType,lb:LoadBalancerArns}'
          for tg in $(aws elbv2 describe-target-groups --query 'TargetGroups[].TargetGroupArn' --output text 2>/dev/null); do r "tg-health-$(basename $tg)" aws elbv2 describe-target-health --target-group-arn $tg --output json --query 'TargetHealthDescriptions[].{id:Target.Id,port:Target.Port,state:TargetHealth.State}'; done
          r load-balancers aws elbv2 describe-load-balancers --output json --query 'LoadBalancers[].{name:LoadBalancerName,type:Type,scheme:Scheme,idleTimeoutNote:State.Code}'
          r ssm-ping aws ssm describe-instance-information --filters Key=InstanceIds,Values=$I --output json --query 'InstanceInformationList[].{ping:PingStatus,agent:AgentVersion,platform:PlatformName,ver:PlatformVersion}'
          END=$(date -u +%Y-%m-%dT%H:%M:%SZ); START=$(date -u -d '-7 days' +%Y-%m-%dT%H:%M:%SZ)
          for m in CPUUtilization CPUCreditBalance; do for s in Average Maximum Minimum; do r "cw-$m-$s-7d" aws cloudwatch get-metric-statistics --namespace AWS/EC2 --metric-name $m --dimensions Name=InstanceId,Value=$I --start-time $START --end-time $END --period 604800 --statistics $s --output json --query 'Datapoints[].{v:'"$s"'}'; done; done
          r cw-memory-metric-exists aws cloudwatch list-metrics --dimensions Name=InstanceId,Value=$I --output json --query 'Metrics[].MetricName'
          r backup-plans aws backup list-backup-plans --output json --query 'BackupPlansList[].BackupPlanName'
          r dlm aws dlm get-lifecycle-policies --output json --query 'Policies[].{id:PolicyId,desc:Description,state:State}'
          r rds aws rds describe-db-instances --output json --query 'DBInstances[].{id:DBInstanceIdentifier,class:DBInstanceClass,engine:Engine,status:DBInstanceStatus,multiAz:MultiAZ,backupDays:BackupRetentionPeriod,az:AvailabilityZone}'
          r pricing-t3.small aws pricing get-products --region us-east-1 --service-code AmazonEC2 --filters Type=TERM_MATCH,Field=instanceType,Value=t3.small Type=TERM_MATCH,Field=regionCode,Value=ap-northeast-2 Type=TERM_MATCH,Field=operatingSystem,Value=Linux Type=TERM_MATCH,Field=tenancy,Value=Shared Type=TERM_MATCH,Field=preInstalledSw,Value=NA Type=TERM_MATCH,Field=capacitystatus,Value=Used --max-items 1 --query 'PriceList[0]' --output text
