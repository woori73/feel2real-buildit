name: OIDC claims check (one-time, no AWS, approved)
# 일회성 진단: GitHub이 발급하는 OIDC 토큰의 공개 클레임 sub·aud·iss만 확인한다.
# AWS 접근·시크릿·checkout 없음. 토큰 원문/JWT/헤더는 출력·저장하지 않는다(add-mask + 클레임 3개만 출력).
on:
  push:
    branches: ['ci/oidc-claims-once']
    paths: ['.github/workflows/oidc-claims-once.yml']
permissions:
  id-token: write
  contents: read
jobs:
  claims:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Print public OIDC claims only
        shell: bash
        run: |
          python3 -I - <<'PY'
          import base64, fnmatch, json, os, sys, urllib.request
          try:
              url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=sts.amazonaws.com'
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
              jwt = json.load(urllib.request.urlopen(req, timeout=20))['value']
              print('::add-mask::' + jwt)
              payload = jwt.split('.')[1]
              claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
              sub, aud, iss = claims.get('sub'), claims.get('aud'), claims.get('iss')
              print('sub =', sub)
              print('aud =', aud)
              print('iss =', iss)
              print('sub matches repo:woori73/feel2real-buildit:* ->', fnmatch.fnmatchcase(str(sub), 'repo:woori73/feel2real-buildit:*'))
              print('aud == sts.amazonaws.com ->', aud == 'sts.amazonaws.com')
              print('iss == https://token.actions.githubusercontent.com ->', iss == 'https://token.actions.githubusercontent.com')
          except Exception as e:
              print('claims check failed:', type(e).__name__)
              sys.exit(1)
          PY
