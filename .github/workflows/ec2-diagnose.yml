name: EC2 Diagnose (read-only, manual)

# 운영 장애 진단 전용 수동 workflow. READ ONLY다.
# 하지 않는 것: 배포, 서비스 restart/stop/start, 파일 쓰기·삭제,
# DB 접근·변경, S3 artifact 배포, secret·환경변수·파일내용·DB내용 출력.
# SSM 진단 출력은 Actions 로그에만 남기고, 워크플로우는 진단 결과와 무관하게
# 항상 성공으로 끝난다(실패 판정이 아니라 상태 수집이 목적).

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2

      - name: Run read-only diagnosis through SSM
        shell: bash
        run: |
          cat > /tmp/ec2-diagnose-params.json <<'PARAMS'
          {"commands":[
            "set +e",
            "echo \"=== buildit-wiki active ===\"",
            "systemctl is-active buildit-wiki",
            "echo \"=== port 8000 ===\"",
            "ss -ltnp | grep ':8000' || true",
            "echo \"=== wiki health ===\"",
            "curl -fsS --max-time 5 http://127.0.0.1:8000/api/health",
            "echo",
            "echo \"curl_exit=$?\"",
            "echo \"=== buildit-wiki status ===\"",
            "systemctl status buildit-wiki --no-pager -l | head -50 || true",
            "echo \"=== recent buildit-wiki journal ===\"",
            "journalctl -u buildit-wiki --no-pager -n 150 || true",
            "echo \"=== basic system state ===\"",
            "uptime",
            "df -h",
            "free -m",
            "exit 0"
          ]}
          PARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09d7cabb5a42d1135" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ec2-diagnose-params.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135"
          echo "wait_exit=$?"
          echo "===== invocation status ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query '{Status:Status,ResponseCode:ResponseCode}' --output text
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardOutputContent' --output text
          echo "===== StandardErrorContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardErrorContent' --output text
          exit 0
