name: Collaboration isolated checks
on:
  pull_request:
    paths:
      - 'src/main/java/**/collaboration/**'
      - 'src/main/resources/db/migration/*collaboration*'
      - 'src/main/resources/templates/studio/collaboration.html'
      - 'src/main/resources/static/js/collaboration.js'
      - 'src/main/resources/static/css/collaboration.css'
      - 'src/test/java/**/collaboration/**'
      - 'scripts/ai-agent-studio/collaboration-qa.cjs'
      - 'scripts/ai-agent-studio/collaboration-*.py'
      - 'scripts/ai-agent-studio/production-qa.cjs'
      - 'scripts/ai-agent-studio/materialize-production-source.py'
      - 'e2e/collaboration/**'
      - '.github/workflows/collaboration-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: collaboration-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  collaboration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: f2r_cluster_test
          MYSQL_USER: f2r_test
          MYSQL_PASSWORD: isolated_cluster_password
          MYSQL_ROOT_PASSWORD: isolated_cluster_root
        ports:
          - 3319:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      F2R_COLLAB_MYSQL_TEST: 'true'
      F2R_COLLAB_BROWSER_TEST: 'true'
      F2R_COLLAB_SDK_TEST: 'true'
      F2R_COLLAB_PRODUCTION_TEST: 'true'
      F2R_COLLAB_PRODUCTION_SOURCE: /tmp/f2r-production-source
      NODE_PATH: ${{ github.workspace }}/e2e/collaboration/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r e2e/collaboration/requirements.txt
      - run: npm ci --prefix e2e/collaboration --ignore-scripts
      - run: cd e2e/collaboration && npx playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Materialize pinned real production documents (read-only Git objects, no PR merge)
        run: |
          git fetch --depth=1 --no-tags origin 09d62dee982e2e89e3653c90b1ee42f05bff4f9d
          python3 scripts/ai-agent-studio/materialize-production-source.py /tmp/f2r-production-source
      - name: MySQL, OAuth/PKCE, MCP draft append and real browser (no paid calls)
        run: bash gradlew test --no-daemon --tests '*CollaborationMySqlTest' --tests '*CollaborationProductionMySqlTest'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collaboration-test-evidence
          path: |
            build/reports/tests/test
            docs/collaboration/browser-results.json
            docs/collaboration/sdk-results.json
            docs/collaboration/performance-results.json
            docs/collaboration/screens
            docs/collaboration/production-results
          retention-days: 7
