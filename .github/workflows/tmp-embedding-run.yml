name: Tmp Embedding Run (one-time)
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2
      - name: Run embedding via SSM
        run: |
          set -euo pipefail
          SSM_BODY=$(cat <<'SSMEOF'
          cat > /tmp/embed_compute.py << 'PYSSMEOF'
"""EC2에서 ACTIVE 문서 임베딩 계산 (일회성)."""
import struct
import subprocess
import sys

# DB 접속 정보
env = {}
for ln in open("/etc/f2r/env"):
    ln = ln.strip()
    if ln and not ln.startswith("#") and "=" in ln:
        k, v = ln.split("=", 1)
        env[k.strip()] = v.strip().strip("'\"")

DB_HOST = env["DB_HOST"]
DB_PORT = env.get("DB_PORT", "3306")
DB_USER = env["DB_USER"]
DB_PASSWORD = env["DB_PASSWORD"]
DB_NAME = env["DB_NAME"]

def mysql_query(sql):
    cmd = ["mysql", "-h", DB_HOST, "-P", DB_PORT, "-u", DB_USER,
           f"-p{DB_PASSWORD}", DB_NAME, "--batch", "--skip-column-names", "--raw",
           "-e", sql]
    result = subprocess.run(cmd, capture_output=True, text=True)
    if result.returncode != 0:
        print(f"MySQL error: {result.stderr}", flush=True)
        sys.exit(1)
    return result.stdout

def mysql_exec(sql_file):
    cmd = ["mysql", "-h", DB_HOST, "-P", DB_PORT, "-u", DB_USER,
           f"-p{DB_PASSWORD}", DB_NAME]
    with open(sql_file) as f:
        result = subprocess.run(cmd, stdin=f, capture_output=True, text=True)
    if result.returncode != 0:
        print(f"MySQL error: {result.stderr}", flush=True)
        sys.exit(1)

print("Loading model...", flush=True)
import torch
from transformers import AutoTokenizer, AutoModel

MODEL = "google/embeddinggemma-2"
tok = AutoTokenizer.from_pretrained(MODEL, trust_remote_code=True)
model = AutoModel.from_pretrained(MODEL, trust_remote_code=True)
model.eval()
print("Model loaded", flush=True)

print("Fetching docs...", flush=True)
# knowledge_id, title, summary, content(6000자)
output = mysql_query(
    "SELECT CONCAT_WS('\x1f', knowledge_id, "
    "COALESCE(REPLACE(title, '\x1f', ' '), ''), "
    "COALESCE(REPLACE(LEFT(summary, 2000), '\x1f', ' '), ''), "
    "COALESCE(REPLACE(LEFT(content, 6000), '\x1f', ' '), '')) "
    "FROM newstart_knowledge_items WHERE status='ACTIVE' ORDER BY knowledge_id"
)
docs = []
for line in output.strip().split("\n"):
    if not line.strip():
        continue
    parts = line.split("\x1f")
    if len(parts) < 4:
        continue
    kid = int(parts[0])
    text_parts = [parts[1]]
    if parts[2]:
        text_parts.append(parts[2])
    if parts[3]:
        text_parts.append(parts[3])
    docs.append((kid, "\n".join(text_parts)))
print(f"Docs: {len(docs)}", flush=True)

# 임베딩 계산
vectors = []
for i in range(0, len(docs), 8):
    batch = docs[i:i+8]
    texts = [t for _, t in batch]
    inputs = tok(texts, padding=True, truncation=True, max_length=2048, return_tensors="pt")
    with torch.no_grad():
        outputs = model(**inputs)
        mask = inputs["attention_mask"].unsqueeze(-1).float()
        emb = (outputs.last_hidden_state * mask).sum(1) / mask.sum(1).clamp(min=1e-9)
        emb = torch.nn.functional.normalize(emb, p=2, dim=1)
    arr = emb.numpy().astype("<f4")
    for j, (kid, _) in enumerate(batch):
        vectors.append((kid, arr[j].tobytes()))
    if (i // 8) % 20 == 0:
        print(f"  {i}/{len(docs)}", flush=True)
print(f"Embeddings done: {len(vectors)}", flush=True)

# DB에 저장
print("Writing SQL...", flush=True)
with open("/tmp/vectors.sql", "w") as out:
    out.write("INSERT INTO newstart_knowledge_embedding (knowledge_id, embedding, model_version) VALUES\n")
    for idx, (kid, vec) in enumerate(vectors):
        out.write(f"({kid}, UNHEX('{vec.hex()}'), 'embeddinggemma-2')")
        out.write(",\n" if idx < len(vectors) - 1 else "\n")
    out.write("ON DUPLICATE KEY UPDATE embedding=VALUES(embedding), model_version=VALUES(model_version);\n")
print("Loading to DB...", flush=True)
mysql_exec("/tmp/vectors.sql")
count = mysql_query("SELECT COUNT(*) FROM newstart_knowledge_embedding").strip()
print(f"DB count: {count}", flush=True)
# 정리
import os
os.remove("/tmp/vectors.sql")
print("DONE", flush=True)

PYSSMEOF
          cd /tmp && python3 embed_compute.py
          SSMEOF
          )
          SSM_SCRIPT=$(printf '%s\n' "$SSM_BODY")
          PARAMS_JSON=$(python3 -c 'import json,sys; print(json.dumps({"commands": sys.stdin.read().splitlines()}))' <<< "$SSM_SCRIPT")
          CMD_ID=$(aws ssm send-command --instance-ids i-09d7cabb5a42d1135 --document-name AWS-RunShellScript --parameters "$PARAMS_JSON" --query 'Command.CommandId' --output text)
          echo "CMD: $CMD_ID"
          for i in $(seq 1 100); do sleep 60
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'Status' --output text)
            echo "[$i] $STATUS"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'StandardOutputContent' --output text | tail -30
          FINAL=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'Status' --output text)
          [ "$FINAL" = "Success" ] || exit 1
