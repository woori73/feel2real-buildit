name: Tmp Presigned URL2
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  url:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2
      - name: Generate and encode URL
        run: |
          URL=$(aws s3 presign s3://f2r-tutor-uploads-prd-067573916809-ap-northeast-2-an/tmp/embedding/docs.jsonl --expires-in 3600)
          echo "$URL" | base64 -w0 > /tmp/url.b64
          echo "Encoded URL:"
          cat /tmp/url.b64
          echo ""
