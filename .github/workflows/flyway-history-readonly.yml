name: Post-deploy read-only verification (approved, temporary)

# 소유자 승인(2026-10-16, DesignCraft 조판 엔진 읽기 전용 조사). 병합하지 않는 임시 브랜치용.
# 운영 EC2에 SSM으로 접근해 designcraft-cli 존재·권한·의존성·설정값 일치 여부만 조회한다.
# 설치·설정·파일·서비스 변경 없음. 비밀값·환경변수 전체는 출력하지 않는다(PUBLISHING_* 경로 설정만). 실패 시 우회 없이 중단.
on:
  push:
    branches: [ ci/flyway-history-readonly ]

permissions:
  id-token: write
  contents: read

jobs:
  designcraft-engine-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2

      - name: Read-only host inspection via SSM (stop on any failure)
        run: |
          set -uo pipefail
          INSTANCE="i-09d7cabb5a42d1135"
          SSM_BODY=$(cat <<'SSMEOF'
          set -u
          echo "== os / glibc =="
          grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
          ldd --version 2>&1 | head -1
          echo "== docker wrapper (non-secret script, 541 bytes) =="
          cat /opt/designcraft/designcraft-cli-docker.sh 2>&1 | head -30
          echo "== docker availability =="
          command -v docker || echo "docker: not found"
          systemctl is-active docker 2>&1 | head -1
          echo "== can service user (ec2-user) read templates / execute cli? =="
          runuser -u ec2-user -- ls /opt/designcraft/templates >/dev/null 2>&1 && echo "templates: readable by ec2-user" || echo "templates: NOT readable by ec2-user"
          runuser -u ec2-user -- test -x /opt/designcraft/designcraft-cli && echo "cli: executable by ec2-user" || echo "cli: NOT executable by ec2-user"
          echo "== recent app journal lines mentioning designcraft/publishing (max 8, truncated) =="
          journalctl -u f2r-app --since "2026-10-16 02:00:00" --no-pager 2>/dev/null | grep -iE 'designcraft|publishing' | tail -8 | cut -c1-240
          SSMEOF
          )
          PARAMS_JSON=$(python3 -c 'import json,sys; print(json.dumps({"commands": [l.lstrip() for l in sys.stdin.read().splitlines()]}))' <<< "$SSM_BODY")
          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript --parameters "$PARAMS_JSON" --query 'Command.CommandId' --output text) || { echo "SEND_COMMAND_FAILED (stopped; no workaround attempted)"; exit 1; }
          echo "SSM CommandId=$CMD_ID"
          STATUS=""
          for i in $(seq 1 24); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" --query 'Status' --output text 2>/dev/null || echo "UNKNOWN")
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          echo "FINAL_STATUS=$STATUS"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" --query '{responseCode:ResponseCode,stdout:StandardOutputContent,stderr:StandardErrorContent}' --output json || true
          [ "$STATUS" = "Success" ] || { echo "SSM did not succeed (stopped)"; exit 1; }
