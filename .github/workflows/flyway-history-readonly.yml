name: Post-deploy read-only verification (approved, temporary)

# 소유자 승인(2026-10-16, 배포 #989 사후 검증)에 따른 읽기 전용 검증. 병합하지 않는 임시 브랜치용.
# (1) 공개 URL GET/POST 상태 확인(운영 사이트에 대한 일반 사용자 요청과 동일, 쓰기 없음)
# (2) Flyway SELECT는 이미 1회 완료(run 38839174157)되어 이 실행에서는 제외한다(AWS·DB 접근 없음).
# DB 접속정보·비밀번호·환경변수·개인정보는 출력하지 않는다(집계 값만). 실패 시 우회하지 않고 중단한다.
on:
  push:
    branches: [ ci/flyway-history-readonly ]

permissions:
  id-token: none
  contents: read

jobs:
  public-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe production public URLs (read-only)
        run: |
          set +e
          set -u
          BASE=https://feel2real.co.kr
          probe() {
            local path="$1"
            local code loc title size
            code=$(curl -sS -o /tmp/body.html -D /tmp/hdr.txt -w '%{http_code}' --max-time 30 "$BASE$path" 2>/dev/null || echo CURL_FAIL)
            loc=$(grep -i '^location:' /tmp/hdr.txt 2>/dev/null | head -1 | tr -d '\r' | sed 's/^[Ll]ocation: //' | cut -c1-140)
            title=$(grep -o -m1 '<title>[^<]*</title>' /tmp/body.html 2>/dev/null | sed 's/<[^>]*>//g' | cut -c1-80)
            size=$(wc -c < /tmp/body.html 2>/dev/null || echo 0)
            echo "GET $path -> $code size=$size title=[$title] location=[$loc]"
          }
          for p in / /designcraft /designcraft/editor /builder /problem-generator /ledger /easy /testprep /testprep/guide /admissions/guide /actuator/health /lms/demo/manage /conversation/chat /tutor/conversation/dashboard /api/publishing/jobs; do probe "$p"; done
          echo "---- homepage content markers ----"
          curl -sS --max-time 30 "$BASE/" -o /tmp/home.html || true
          for m in "곧 만나요" "AcademyCraft" "StudyCraft" "DesignCraft 열어보기" "곧 준비중"; do echo "marker [$m] count=$(grep -o "$m" /tmp/home.html | wc -l)"; done
          echo "forbidden markers (NewStart/위메이드/충기) count=$(grep -o -E 'NewStart|뉴스타트|위메이드|충기' /tmp/home.html | wc -l)"
          echo "section ids: $(grep -o -E '<section[^>]*id="[a-z-]+"' /tmp/home.html | sed -E 's/.*id="([a-z-]+)"/\1/' | tr '\n' '>' )"
          echo "---- /designcraft public intro markers ----"
          curl -sS --max-time 30 "$BASE/designcraft" -o /tmp/dc.html || true
          echo "naver start link count=$(grep -o '/auth/naver/start' /tmp/dc.html | wc -l)"
          echo "---- POST /api/admissions/chat (expect 503 when public API is OFF) ----"
          code=$(curl -sS -o /tmp/adm.json -w '%{http_code}' --max-time 30 -X POST -H 'Content-Type: application/json' -d '{"message":"ping","academicYear":2027}' "$BASE/api/admissions/chat" || echo CURL_FAIL)
          echo "POST /api/admissions/chat -> $code body=$(head -c 220 /tmp/adm.json)"
