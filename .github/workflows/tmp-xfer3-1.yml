name: Tmp Xfer3 1
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2
      - name: Xfer chunk 3
        run: |
          P=$(python3 -c 'import json; print(json.dumps({"commands": ["echo CHUNK_3:; cat /tmp/chunk_ad.b64"]}))')
          C=$(aws ssm send-command --instance-ids i-09d7cabb5a42d1135 --document-name AWS-RunShellScript --parameters "$P" --query 'Command.CommandId' --output text)
          for i in $(seq 1 10); do sleep 8
            S=$(aws ssm get-command-invocation --command-id "$C" --instance-id i-09d7cabb5a42d1135 --query 'Status' --output text)
            case "$S" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$C" --instance-id i-09d7cabb5a42d1135 --query 'StandardOutputContent' --output text
