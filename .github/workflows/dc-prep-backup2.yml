name: DesignCraft pre-deploy backup 2 (env files and Wiki workspace DBs, new directory only)
on:
  push:
    branches: ['ci/dc-step1-readonly']
    paths: ['.github/workflows/dc-prep-backup2.yml', 'ops/diagnostics/dc_prep_backup2.py']
permissions:
  contents: read
  id-token: write
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  backup2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2
          role-duration-seconds: 900
          retry-max-attempts: 1
      - name: Backup on the server (fails the job on any problem)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          Path('b2.json').write_text(json.dumps({'commands': ["python3 - <<'B2EOF'\n" + Path('ops/diagnostics/dc_prep_backup2.py').read_text() + "\nB2EOF\n"]}))
          PY
          command_id=$(aws ssm send-command --instance-ids i-09d7cabb5a42d1135 --document-name AWS-RunShellScript --parameters file://b2.json --timeout-seconds 300 --query Command.CommandId --output text)
          for i in $(seq 1 90); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id i-09d7cabb5a42d1135 --query Status --output text 2>/dev/null || true)
            case "$status" in Success|Failed|TimedOut|Cancelled) break;; esac
            sleep 4
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id i-09d7cabb5a42d1135 --query '{status:Status,out:StandardOutputContent,err:StandardErrorContent}' --output json | tee b2-result.json
          test "$(python3 -c "import json;print(json.load(open('b2-result.json'))['status'])")" = Success
