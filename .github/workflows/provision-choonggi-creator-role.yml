name: Provision CHOONGGI CREATOR role (one-time, manual)

# ONE-TIME production role provisioning for the CHOONGGI content account (2026-09-23).
# Narrowly fixed to exactly one row: user_id=271 AND login_id='choonggi'. No inputs of
# any kind -- nothing here is reusable for any other user or role.
#
# Guarded twice over:
#   1. Precheck SELECT in-script gates whether the UPDATE runs at all (bash comparison).
#   2. The UPDATE's own WHERE clause (user_id=271 AND login_id='choonggi' AND
#      role='STUDENT') means even if the bash gate were wrong, the database itself
#      cannot touch any other row or any row not currently STUDENT.
# Postcheck SELECT confirms the result. No other statement runs. No secrets, no other
# user's data, and no unrelated columns are ever printed.
#
# Delete this workflow file after the provisioning is confirmed -- it is not meant to
# be a standing production-write facility.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2

      - name: Guarded CHOONGGI role provisioning via SSM
        shell: bash
        run: |
          cat > /tmp/choonggi-provision.json <<'PARAMS'
          {"commands":[
            "set +e",
            "source /etc/f2r/env 2>/dev/null || true",
            "MYSQL_CMD=\"mysql -h ${DB_HOST} -P ${DB_PORT} -u ${DB_USER} -p${DB_PASSWORD} ${DB_NAME}\"",
            "echo '=== PRECHECK ==='",
            "PRECHECK=$($MYSQL_CMD -N -e \"SELECT user_id, login_id, role FROM users WHERE user_id = 271 AND login_id = 'choonggi';\" 2>&1 | grep -v 'Using a password')",
            "echo \"$PRECHECK\"",
            "if [ \"$PRECHECK\" = \"271\tchoonggi\tSTUDENT\" ]; then echo 'PRECHECK PASS -- proceeding with guarded UPDATE'; echo '=== UPDATE ==='; $MYSQL_CMD -e \"UPDATE users SET role = 'CREATOR' WHERE user_id = 271 AND login_id = 'choonggi' AND role = 'STUDENT'; SELECT ROW_COUNT() AS affected_rows;\" 2>&1 | grep -v 'Using a password'; echo '=== POSTCHECK ==='; $MYSQL_CMD -N -e \"SELECT user_id, login_id, role FROM users WHERE user_id = 271 AND login_id = 'choonggi';\" 2>&1 | grep -v 'Using a password'; else echo \"PRECHECK FAILED -- expected exactly '271 choonggi STUDENT', got: [$PRECHECK]\"; echo 'ABORTING -- no UPDATE executed'; fi",
            "exit 0"
          ]}
          PARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09d7cabb5a42d1135" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/choonggi-provision.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135"
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardOutputContent' --output text
          exit 0
