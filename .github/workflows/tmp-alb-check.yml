# TEMPORARY - ALB inspection (read-only). Delete after investigation.
# paths-ignore 대상이라 Build/Deploy를 실행하지 않는다.
name: Tmp ALB Check (read-only, manual)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2

      - name: Describe ALB
        run: |
          set -euo pipefail
          echo "===== load balancers ====="
          aws elbv2 describe-load-balancers --query 'LoadBalancers[].[LoadBalancerName,DNSName,Type,State.Code,LoadBalancerArn]' --output text || echo "no elbv2 read permission"
          echo ""
          echo "===== LB attributes (idle timeout etc) ====="
          for arn in $(aws elbv2 describe-load-balancers --query 'LoadBalancers[].LoadBalancerArn' --output text); do
            echo "--- $arn"
            aws elbv2 describe-load-balancer-attributes --load-balancer-arn "$arn" --query 'Attributes[].[Key,Value]' --output text | head -20 || true
          done
          echo ""
          echo "===== listeners ====="
          for arn in $(aws elbv2 describe-load-balancers --query 'LoadBalancers[].LoadBalancerArn' --output text); do
            aws elbv2 describe-listeners --load-balancer-arn "$arn" --query 'Listeners[].[Port,Protocol,DefaultActions[0].Type]' --output text || true
          done
