name: EC2 resize prep - IAM dry-run (no side effects) and in-instance compatibility probe (read-only)
on:
  push:
    branches: ['ci/dc-step1-readonly']
    paths: ['.github/workflows/dc-ec2-resize-prep.yml', 'ops/diagnostics/dc_ec2_compat_probe.py']
permissions:
  contents: read
  id-token: write
concurrency:
  group: dc-ec2-prep
  cancel-in-progress: false
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2
          role-duration-seconds: 900
          retry-max-attempts: 1
      - name: IAM permission check with --dry-run only (DryRunOperation = allowed, UnauthorizedOperation = denied; nothing is executed)
        continue-on-error: true
        run: |
          INST=i-09d7cabb5a42d1135
          set +e
          aws sts get-caller-identity --query Arn --output text
          t() { printf '%-34s ' "$1"; shift; "$@" 2>&1 | grep -oE 'DryRunOperation|UnauthorizedOperation|AccessDenied[A-Za-z]*|is not authorized to perform: [a-zA-Z:]+' | head -1 || true; }
          t ec2:DescribeInstances aws ec2 describe-instances --instance-ids $INST --dry-run
          t ec2:StopInstances aws ec2 stop-instances --instance-ids $INST --dry-run
          t ec2:ModifyInstanceAttribute aws ec2 modify-instance-attribute --instance-id $INST --instance-type '{"Value":"t3.medium"}' --dry-run
          t ec2:StartInstances aws ec2 start-instances --instance-ids $INST --dry-run
          t ec2:CreateImage aws ec2 create-image --instance-id $INST --name dryrun-never-created --no-reboot --dry-run
          t ec2:DescribeVolumes aws ec2 describe-volumes --dry-run
          t ec2:DescribeAddresses aws ec2 describe-addresses --dry-run
          t ec2:CreateSnapshot aws ec2 create-snapshot --volume-id vol-0123456789abcdef0 --dry-run
          t ec2:AssociateAddress aws ec2 associate-address --instance-id $INST --allocation-id eipalloc-0123456789abcdef0 --dry-run
          echo "-- non-EC2 (read-only calls):"
          printf '%-34s ' cloudwatch:GetMetricStatistics; aws cloudwatch get-metric-statistics --namespace AWS/EC2 --metric-name CPUCreditBalance --dimensions Name=InstanceId,Value=$INST --start-time $(date -u -d '-1 hour' +%FT%TZ) --end-time $(date -u +%FT%TZ) --period 3600 --statistics Average --query 'Datapoints[0].Average' --output text 2>&1 | head -1 | cut -c1-150
          printf '%-34s ' iam:ListAttachedRolePolicies; aws iam list-attached-role-policies --role-name github-actions-f2r-deploy --query 'AttachedPolicies[].PolicyName' --output text 2>&1 | head -1 | cut -c1-150
          printf '%-34s ' iam:ListRolePolicies; aws iam list-role-policies --role-name github-actions-f2r-deploy --query PolicyNames --output text 2>&1 | head -1 | cut -c1-150
          printf '%-34s ' ssm:SendCommand-on-instance-works; echo yes-used-above
      - name: In-instance compatibility probe (Xen t2 to Nitro t3 - ENA, NVMe, fstab) via SSM, read-only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          Path('cp.json').write_text(json.dumps({'commands': ["python3 - <<'CPEOF'\n" + Path('ops/diagnostics/dc_ec2_compat_probe.py').read_text() + "\nCPEOF\n"]}))
          PY
          command_id=$(aws ssm send-command --instance-ids i-09d7cabb5a42d1135 --document-name AWS-RunShellScript --parameters file://cp.json --timeout-seconds 120 --query Command.CommandId --output text)
          for i in $(seq 1 40); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id i-09d7cabb5a42d1135 --query Status --output text 2>/dev/null || true)
            case "$status" in Success|Failed|TimedOut|Cancelled) break;; esac
            sleep 3
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id i-09d7cabb5a42d1135 --query '{status:Status,out:StandardOutputContent,err:StandardErrorContent}' --output json
