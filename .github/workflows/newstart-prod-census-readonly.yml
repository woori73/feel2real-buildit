name: NewStart production grant census (read-only, manual)

# NEWSTART 10/1 OPEN PRE-FLIGHT — 감사회원(THANKS_MEMBER) grant 상태 read-only 실측.
# - 고정 SELECT만 실행한다(임의 SQL 입력 없음, SET SESSION TRANSACTION READ ONLY).
# - INSERT/UPDATE/DELETE/DDL 없음, 쓰기 엔드포인트 호출 없음.
# - 출력은 집계 숫자·enum 값만. email·닉네임·user_id 목록 등 PII와 secret은 출력하지 않는다.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2

      - name: Build fixed read-only grant census script
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import json

          RO = "SET SESSION TRANSACTION READ ONLY;"
          C = []
          C.append("set +e")
          C.append("source /etc/f2r/env 2>/dev/null || true")
          C.append('MYSQL_CENSUS="mysql -h \\"${DB_HOST}\\" -P \\"${DB_PORT}\\" -u \\"${DB_USER}\\" -p\\"${DB_PASSWORD}\\" \\"${DB_NAME}\\" --default-character-set=utf8mb4 --batch 2>&1"')
          C.append('run_q() { echo "=== $1 ==="; eval "$MYSQL_CENSUS -e \\"$2\\"" || echo "QUERY_FAILED: $1"; }')

          def q(name, sql):
              return 'run_q %s "%s"' % (name, RO + " " + sql)

          C.append(q("GRANT_TABLE_EXISTS",
              "SELECT COUNT(*) AS grant_table FROM information_schema.tables "
              "WHERE table_schema=DATABASE() AND table_name='newstart_member_grants';"))
          C.append(q("GRANT_ROWS",
              "SELECT capability, COUNT(*) AS rows_cnt, COUNT(DISTINCT user_id) AS distinct_users "
              "FROM newstart_member_grants GROUP BY capability;"))
          C.append(q("GRANT_TOTAL", "SELECT COUNT(*) AS grants_total FROM newstart_member_grants;"))
          C.append(q("ROLE_SPLIT", "SELECT role, COUNT(*) AS cnt FROM users GROUP BY role;"))
          C.append(q("ROLE_JOIN_GRANT",
              "SELECT u.role, COUNT(DISTINCT u.user_id) AS members, "
              "COUNT(DISTINCT g.user_id) AS with_thanks_grant FROM users u "
              "LEFT JOIN newstart_member_grants g ON g.user_id=u.user_id "
              "AND g.capability='THANKS_MEMBER' GROUP BY u.role;"))
          C.append(q("MEMBER_ACTIVITY",
              "SELECT (SELECT COUNT(*) FROM users) AS users_total, "
              "(SELECT COUNT(DISTINCT user_id) FROM newstart_chat_messages) AS chat_users, "
              "(SELECT COUNT(*) FROM newstart_member_profiles) AS profiles, "
              "(SELECT COUNT(*) FROM newstart_member_debt_status) AS debt_rows, "
              "(SELECT COUNT(*) FROM newstart_requests) AS requests_rows, "
              "(SELECT COUNT(*) FROM newstart_jipijigi_answer_sessions) AS jipijigi_sessions;"))
          C.append(q("FLYWAY_V1011",
              "SELECT version, description, success, installed_on FROM flyway_schema_history "
              "WHERE version IN ('1011','1012','1005','1004') ORDER BY version;"))

          C.append('echo "=== ENV_KEY_PRESENCE (names only) ==="')
          C.append('for K in NVIDIA_API_KEY OPENROUTER_API_KEY; do '
                   'if grep -Eq "^[[:space:]]*(export[[:space:]]+)?${K}=.+" /etc/f2r/env; then echo "${K} PRESENT: YES"; '
                   'else echo "${K} PRESENT: NO"; fi; done')
          C.append('echo "=== APP_UNIT ==="')
          C.append('systemctl is-active f2r-app.service')
          C.append('date -u "+NOW_UTC=%Y-%m-%dT%H:%M:%SZ"')
          C.append("exit 0")

          with open("/tmp/census.json", "w", encoding="utf-8") as f:
              json.dump({"commands": C}, f, ensure_ascii=False)
          print("params bytes:", len(open("/tmp/census.json", "rb").read()))
          PYEOF

      - name: Run census via SSM
        shell: bash
        run: |
          set -uo pipefail
          INSTANCE_ID="i-09d7cabb5a42d1135"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/census.json \
            --comment "newstart pre-open read-only grant census" \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          echo "wait_exit=$?"
          set -e
          echo "===== invocation status ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query '{Status:Status,ResponseCode:ResponseCode}' --output text
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text
          echo "===== StandardErrorContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'StandardErrorContent' --output text
          exit 0
