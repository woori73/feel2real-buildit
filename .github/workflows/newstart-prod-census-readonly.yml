name: NewStart Institution Knowledge Audit (read-only, throwaway)

# 2026-09-30 NEWSTART 지피지기 운영 DB 전수감사 — 기관별 지식 census (READ ONLY).
# - 고정 SELECT만 실행 (임의 SQL 입력 없음, 범용 DB shell 아님).
# - DB session은 SET SESSION TRANSACTION READ ONLY.
# - 출력: 집계·article_id·관리자 큐레이션 TITLE 샘플·길이·플래그만. 카페 본문/닉네임/채팅 원문 출력 없음.
# - INSERT/UPDATE/DELETE/ALTER/CREATE/DROP 없음. 승인/repair endpoint 호출 없음.
# - throwaway carrier (선례: chore/newstart-grant-census-readonly-20260928 / 23fdee51).

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2

      - name: Build fixed read-only audit script
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import json

          RO = "SET SESSION TRANSACTION READ ONLY; SET SESSION group_concat_max_len=65535;"

          def hx(s):
              return "X'" + s.encode("utf-8").hex() + "'"

          lines = []
          def q(name, sql):
              lines.append('run_q %s "%s"' % (name, RO + " " + sql))

          C = []
          C.append("set +e")
          C.append("source /etc/f2r/env 2>/dev/null || true")
          C.append('MYSQL_CENSUS="mysql -h \\"${DB_HOST}\\" -P \\"${DB_PORT}\\" -u \\"${DB_USER}\\" -p\\"${DB_PASSWORD}\\" \\"${DB_NAME}\\" --default-character-set=utf8mb4 --batch 2>&1"')
          C.append('run_q() { echo "=== $1 ==="; eval "$MYSQL_CENSUS -e \\"$2\\"" || echo "QUERY_FAILED: $1"; }')

          # --- deploy state ---
          q("FLYWAY_TOP5", "SELECT version, description, installed_on FROM flyway_schema_history ORDER BY CAST(version AS UNSIGNED) DESC LIMIT 5;")

          # --- knowledge wiki: status / authority census ---
          q("KS_STATUS", "SELECT status, COUNT(*) AS cnt FROM newstart_knowledge_items GROUP BY status;")
          q("KS_AUTH", "SELECT COALESCE(NULLIF(authority,''),'(none)') AS auth, COUNT(*) AS total,"
                       " SUM(status='ACTIVE') AS active, SUM(status='REVIEW') AS review,"
                       " SUM(status='DRAFT') AS draft, SUM(status='ARCHIVED') AS archived,"
                       " MAX(DATE(updated_at)) AS latest, MAX(DATE(created_at)) AS latest_created,"
                       " SUM(source_url IS NOT NULL AND source_url<>'') AS with_url,"
                       " SUM(CHAR_LENGTH(COALESCE(content,''))>=50) AS filled_content"
                       " FROM newstart_knowledge_items GROUP BY auth ORDER BY total DESC;")
          q("KS_AUTH_TYPE_STATUS", "SELECT COALESCE(NULLIF(authority,''),'(none)') AS auth, source_type, status, COUNT(*) AS cnt"
                       " FROM newstart_knowledge_items GROUP BY auth, source_type, status ORDER BY auth, cnt DESC;")
          q("KS_ACTIVE_TITLE_SAMPLE", "SELECT COALESCE(NULLIF(authority,''),'(none)') AS auth,"
                       " SUBSTRING(GROUP_CONCAT(SUBSTRING(title,1,60) ORDER BY COALESCE(updated_at,created_at) DESC SEPARATOR ' || '),1,400) AS recent_titles"
                       " FROM newstart_knowledge_items WHERE status='ACTIVE' GROUP BY auth ORDER BY COUNT(*) DESC;")
          q("KS_EBOOK_OPERATOR", "SELECT source_type, status, COUNT(*) AS cnt,"
                       " SUM(source_url IS NOT NULL AND source_url<>'') AS with_url, MAX(DATE(updated_at)) AS latest"
                       " FROM newstart_knowledge_items"
                       " WHERE source_type IN ('EBOOK','OPERATOR_KNOWLEDGE','AUDIT','RULE','DERIVED_RULE','CHAT_DISCOVERY','REQUEST_DISCOVERY','CASE')"
                       " GROUP BY source_type, status;")

          # --- topic coverage probes (title/content LIKE, counts only) ---
          terms = ["임대차","보증금","해약환급","근저당","지급명령","추심","Credit4U","신용정보","전자소송",
                   "대위변제","보증부","장기연체","부실우려","전입","주소","주식","가상자산","코인","이혼","감사원"]
          unions = []
          for t in terms:
              p = hx(t)
              unions.append("SELECT %s AS term, COUNT(*) AS hits, SUM(status='ACTIVE') AS active_hits"
                            " FROM newstart_knowledge_items"
                            " WHERE content LIKE CONCAT('%%',%s,'%%') OR title LIKE CONCAT('%%',%s,'%%') OR tags LIKE CONCAT('%%',%s,'%%')" % (p, p, p, p))
          q("KS_TOPIC_PROBE", " UNION ALL ".join(unions) + ";")

          # --- handoff case presence (폐업 사업장 임대차/보증금 보완요구) ---
          q("KS_HANDOFF_PROBE", "SELECT knowledge_id, status, source_type, COALESCE(NULLIF(authority,''),'(none)') AS auth,"
                       " SUBSTRING(title,1,80) AS title80 FROM newstart_knowledge_items"
                       " WHERE content LIKE CONCAT('%%',%s,'%%') AND (content LIKE CONCAT('%%',%s,'%%') OR content LIKE CONCAT('%%',%s,'%%'))"
                       " ORDER BY knowledge_id DESC LIMIT 20;" % (hx("임대차"), hx("보증금"), hx("폐업")))
          q("CASES_HANDOFF_PROBE", "SELECT article_id FROM newstart_empirical_cases"
                       " WHERE content_raw LIKE CONCAT('%%',%s,'%%') ORDER BY article_id+0 LIMIT 30;" % hx("임대차"))

          # --- operator FAQ sources (5568 33문답 / 4451 50문답 / 상담방) ---
          q("KS_FAQ_PROBE", "SELECT knowledge_id, status, source_type, SUBSTRING(title,1,70) AS title70"
                       " FROM newstart_knowledge_items"
                       " WHERE title LIKE '%%5568%%' OR title LIKE '%%4451%%'"
                       " OR title LIKE CONCAT('%%',%s,'%%') OR title LIKE CONCAT('%%',%s,'%%') OR title LIKE CONCAT('%%',%s,'%%')"
                       " OR tags LIKE CONCAT('%%',%s,'%%') ORDER BY knowledge_id DESC LIMIT 40;"
                       % (hx("상담방"), hx("감사회원"), hx("FAQ"), hx("단톡방")))

          # --- empirical cases census ---
          q("CASES_AGG", "SELECT COUNT(*) AS rows_total, COUNT(DISTINCT article_id) AS distinct_ids,"
                       " MIN(article_id+0) AS min_id, MAX(article_id+0) AS max_id,"
                       " SUM(LOCATE(%s, COALESCE(content_raw,''))>0) AS with_comment_marker,"
                       " SUM(source_url IS NOT NULL AND source_url<>'') AS with_url"
                       " FROM newstart_empirical_cases;" % hx("[댓글]"))
          q("CASES_DUP", "SELECT COUNT(*) AS dup_groups FROM (SELECT article_id FROM newstart_empirical_cases GROUP BY article_id HAVING COUNT(*)>1) d;")
          q("CASES_IDS", "SELECT GROUP_CONCAT(article_id ORDER BY article_id+0) AS ids FROM newstart_empirical_cases;")
          q("CASE_MIRROR", "SELECT (SELECT COUNT(*) FROM newstart_knowledge_items WHERE source_type='CASE') AS case_mirrors,"
                       " (SELECT COUNT(*) FROM newstart_empirical_cases c WHERE NOT EXISTS ("
                       "SELECT 1 FROM newstart_knowledge_items k WHERE k.title LIKE CONCAT(%s, c.article_id, ' %%'))) AS cases_without_mirror;" % hx("[사례] "))
          q("STATUS_LOG", "SELECT COUNT(*) AS logs, MAX(created_at) AS latest FROM newstart_knowledge_status_log;")

          # --- official updates ---
          q("OSRC", "SELECT source_type, source_name, review_status, COUNT(*) AS cnt,"
                       " MAX(DATE(published_at)) AS latest_published, MAX(DATE(updated_at)) AS latest_updated,"
                       " SUM(original_url IS NOT NULL AND original_url<>'') AS with_url"
                       " FROM newstart_official_updates GROUP BY source_type, source_name, review_status ORDER BY cnt DESC;")
          q("OTITLES", "SELECT source_name, SUBSTRING(GROUP_CONCAT(SUBSTRING(title,1,50) ORDER BY published_at DESC SEPARATOR ' || '),1,300) AS recent_titles"
                       " FROM newstart_official_updates WHERE review_status='PUBLISHED' GROUP BY source_name;")

          # --- jipijigi agent state ---
          q("SESSIONS", "SELECT review_state, COUNT(*) AS cnt, MAX(DATE(answered_at)) AS latest FROM newstart_jipijigi_answer_sessions GROUP BY review_state;")
          q("DRAFTS", "SELECT status, COUNT(*) AS cnt, MAX(DATE(created_at)) AS latest FROM newstart_jipijigi_drafts GROUP BY status;")
          q("TRACES", "SELECT source_class, COUNT(*) AS cnt FROM newstart_jipijigi_research_traces GROUP BY source_class;")
          q("GRANTS", "SELECT COUNT(*) AS grant_rows FROM newstart_member_grants;")
          q("REQUESTS", "SELECT COUNT(*) AS req_rows, MAX(DATE(created_at)) AS latest FROM newstart_requests;")

          C.extend(lines)

          # --- app state + yesterday's timeout evidence (logs, no question text) ---
          C.append('echo "=== APP_UNIT ==="')
          C.append('systemctl show f2r-app.service -p MainPID -p ActiveEnterTimestamp -p ExecMainStartTimestamp')
          C.append('ls -l --time-style=full-iso /home/ec2-user/app.jar /home/ec2-user/app.jar.previous 2>&1 || true')
          C.append('date -u "+NOW_UTC=%Y-%m-%dT%H:%M:%SZ"')
          C.append('echo "=== CHAT_TIMING_LOGS ==="')
          C.append('journalctl -u f2r-app.service --since "2026-09-29 00:00:00" -o short-iso --no-pager 2>/dev/null | grep -a "newstart ai chat timing" | tail -40 || echo NO_TIMING_LINES')
          C.append('echo "=== CHAT_ERROR_LOGS ==="')
          C.append('journalctl -u f2r-app.service --since "2026-09-29 00:00:00" -o short-iso --no-pager 2>/dev/null | grep -aiE "newstart" | grep -aiE "timeout|timed out|SocketTimeout|fallback|FAILED|Exception|error" | tail -60 || echo NO_ERROR_LINES')

          C.append('echo "=== DB_CATEGORY ==="')
          C.append('echo "DB_NAME=${DB_NAME:-unset}"')
          C.append('case "${DB_HOST:-}" in *amazonaws.com*) echo "DB_HOST_CATEGORY=RDS";; "") echo "DB_HOST_CATEGORY=UNKNOWN";; *) echo "DB_HOST_CATEGORY=NON_RDS_OTHER";; esac')
          C.append("exit 0")

          with open("/tmp/audit.json", "w", encoding="utf-8") as f:
              json.dump({"commands": C}, f, ensure_ascii=False)
          print("params bytes:", len(open("/tmp/audit.json", "rb").read()))
          PYEOF

      - name: Run audit via SSM
        shell: bash
        run: |
          set -uo pipefail
          INSTANCE_ID="i-09d7cabb5a42d1135"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/audit.json \
            --comment "newstart 2026-09-30 institution knowledge audit (read-only)" \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          echo "wait_exit=$?"
          set -e
          echo "===== invocation status ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query '{Status:Status,ResponseCode:ResponseCode}' --output text
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text
          echo "===== StandardErrorContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'StandardErrorContent' --output text
          exit 0
