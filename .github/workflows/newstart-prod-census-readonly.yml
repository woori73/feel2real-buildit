name: NewStart Production Knowledge Census (read-only, manual)

# NEWSTART TASK #13 PRE-FLIGHT — 운영 DB read-only 실측.
# - 고정 SELECT census만 실행한다 (임의 SQL 입력 없음, 범용 DB shell 아님).
# - DB session은 SET SESSION TRANSACTION READ ONLY.
# - 출력: article_id·길이·플래그·집계만. 본문/제목/닉네임 등 원문 텍스트와 secret 출력 금지.
# - INSERT/UPDATE/DELETE/ALTER/CREATE/DROP 없음. repair/approve endpoint 호출 없음(GET probes만, 무변경 405/401/404 코드만 관찰).

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2

      - name: Build fixed read-only census script
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import json

          RO = "SET SESSION TRANSACTION READ ONLY;"
          C = []
          C.append("set +e")
          C.append("source /etc/f2r/env 2>/dev/null || true")
          C.append('MYSQL_CENSUS="mysql -h \\"${DB_HOST}\\" -P \\"${DB_PORT}\\" -u \\"${DB_USER}\\" -p\\"${DB_PASSWORD}\\" \\"${DB_NAME}\\" --default-character-set=utf8mb4 --batch 2>&1"')
          C.append('run_q() { echo "=== $1 ==="; eval "$MYSQL_CENSUS -e \\"$2\\"" || echo "QUERY_FAILED: $1"; }')

          q = lambda name, sql: run_q_line(name, RO + " " + sql)
          def run_q_line(name, sql):
              return 'run_q %s "%s"' % (name, sql)

          C.append(q("SCHEMA_VERSION", "SELECT version, description, installed_on FROM flyway_schema_history ORDER BY CAST(version AS UNSIGNED) DESC LIMIT 8;"))
          C.append(q("CASES", "SELECT COUNT(*) AS total, COUNT(DISTINCT article_id) AS distinct_ids FROM newstart_empirical_cases;"))
          C.append(q("CASE_DUP", "SELECT COUNT(*) AS dup_groups FROM (SELECT article_id FROM newstart_empirical_cases GROUP BY article_id HAVING COUNT(*)>1) d;"))
          C.append(q("KNOW_STATUS", "SELECT status, COUNT(*) AS cnt FROM newstart_knowledge_items GROUP BY status;"))
          C.append(q("KNOW_SRC", "SELECT source_type, COUNT(*) AS cnt FROM newstart_knowledge_items GROUP BY source_type;"))
          C.append(q("KNOW_DUP_TITLE", "SELECT COUNT(*) AS dup_title_groups FROM (SELECT title FROM newstart_knowledge_items GROUP BY title HAVING COUNT(*)>1) d;"))
          C.append(q("OTHER_TABLES", "SELECT (SELECT COUNT(*) FROM newstart_official_updates) AS official_total, (SELECT COUNT(*) FROM newstart_jipijigi_answer_sessions) AS sessions_total, (SELECT COUNT(*) FROM newstart_jipijigi_questions) AS questions_total, (SELECT COUNT(*) FROM newstart_jipijigi_drafts) AS drafts_total;"))
          C.append(q("CANON_STATE", "SELECT article_id, CHAR_LENGTH(COALESCE(content_raw,'')) AS len, LOCATE(X'5BEB8C93EAB880',COALESCE(content_raw,''))>0 AS has_com, LOCATE(X'5BED9B84EC868D20EAB2B0EAB3BC5D',COALESCE(content_raw,''))>0 AS has_fol FROM newstart_empirical_cases WHERE article_id BETWEEN 5737 AND 6010 ORDER BY article_id+0;"))
          C.append(q("SIX_DETAIL", "SELECT article_id, CHAR_LENGTH(COALESCE(content_raw,'')) AS len, LOCATE(X'5BEB8C93EAB880',COALESCE(content_raw,''))>0 AS has_com, LOCATE(X'5BED9B84EC868D20EAB2B0EAB3BC5D',COALESCE(content_raw,''))>0 AS has_fol, predicted_reduction_rate IS NULL AS p_null, final_reduction_rate IS NULL AS f_null, temp_reduction_rate IS NULL AS t_null, author_followup_result IS NULL AS af_null, source_url IS NULL AS url_null FROM newstart_empirical_cases WHERE article_id IN ('5870','5955','5956','5967','5971','5973');"))
          C.append(q("MIRROR", "SELECT (SELECT COUNT(*) FROM newstart_knowledge_items WHERE source_type='CASE') AS case_mirrors, (SELECT COUNT(*) FROM newstart_empirical_cases c WHERE NOT EXISTS (SELECT 1 FROM newstart_knowledge_items k WHERE k.title LIKE CONCAT(X'5BEC82ACEBA1805D20', c.article_id, ' %'))) AS cases_without_mirror;"))
          C.append(q("STATUS_LOG", "SELECT COUNT(*) AS logs, MAX(created_at) AS latest FROM newstart_knowledge_status_log;"))

          # NEWSTART PHASE 2 DISCOVERY — 채팅/회원/스테이지/역할 분포 집계(원문·PII 출력 없음).
          C.append(q("PHASE2_CHAT", "SELECT COUNT(*) AS msgs, SUM(deleted=1) AS soft_deleted, COUNT(DISTINCT user_id) AS distinct_users, MIN(created_at) AS first_at, MAX(created_at) AS last_at FROM newstart_chat_messages;"))
          C.append(q("PHASE2_MEMBER", "SELECT (SELECT COUNT(*) FROM newstart_member_profiles) AS profiles, (SELECT COUNT(*) FROM newstart_member_debt_status) AS debt_rows, (SELECT COUNT(*) FROM users) AS users_total;"))
          C.append(q("PHASE2_STAGE", "SELECT COALESCE(stage,'(null)') AS stage, COUNT(*) AS cnt FROM newstart_member_debt_status GROUP BY stage;"))
          C.append(q("PHASE2_ROLES", "SELECT role, COUNT(*) AS cnt FROM users GROUP BY role;"))
          C.append(q("PHASE2_OFFICIAL", "SELECT review_status, COUNT(*) AS cnt, MAX(published_at) AS latest_published FROM newstart_official_updates GROUP BY review_status;"))
          C.append(q("PHASE2_TABLES", "SELECT table_name, table_rows AS approx_rows FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name LIKE 'newstart%' ORDER BY table_name;"))
          # V1015 오픈 전 감사회원 사전자격명부 — 배포 전에는 테이블 부재로 QUERY_FAILED(무해).
          C.append(q("THANKS_ROSTER", "SELECT (SELECT COUNT(*) FROM newstart_thanks_roster) AS total, (SELECT COUNT(DISTINCT cafe_member_tag) FROM newstart_thanks_roster) AS distinct_tags, (SELECT COUNT(*) FROM newstart_thanks_roster WHERE match_status='UNMATCHED') AS unmatched, (SELECT COUNT(*) FROM newstart_thanks_roster WHERE linked_user_id IS NOT NULL) AS linked;"))
          # V1016 naver_id_prefix 보조 식별정보 반영 검증(읽기 전용).
          C.append(q("THANKS_ROSTER_PREFIX", "SELECT (SELECT COUNT(*) FROM newstart_thanks_roster WHERE naver_id_prefix IS NOT NULL) AS prefix_not_null, (SELECT COUNT(*) FROM newstart_thanks_roster WHERE naver_id_prefix IS NULL) AS prefix_null, (SELECT COUNT(DISTINCT naver_id_prefix) FROM newstart_thanks_roster) AS distinct_prefix;"))

          C.append('echo "=== DB_CATEGORY ==="')
          C.append('echo "DB_NAME=${DB_NAME:-unset}"')
          C.append('case "${DB_HOST:-}" in *amazonaws.com*) echo "DB_HOST_CATEGORY=RDS";; "") echo "DB_HOST_CATEGORY=UNKNOWN";; *) echo "DB_HOST_CATEGORY=NON_RDS_OTHER";; esac')
          C.append('echo "=== APP_UNIT ==="')
          C.append('systemctl show f2r-app.service -p MainPID -p ActiveEnterTimestamp -p ExecMainStartTimestamp')
          C.append('ls -l --time-style=full-iso /home/ec2-user/app.jar /home/ec2-user/app.jar.previous 2>&1 || true')
          C.append('date -u "+NOW_UTC=%Y-%m-%dT%H:%M:%SZ"')
          C.append('echo "=== JAR_REPAIR_PROBE ==="')
          C.append('unzip -p /home/ec2-user/app.jar "BOOT-INF/classes/f2r/tutor_solution/private_tutor_solution_back/domain/newstartknowledge/controller/NewstartIngestionAdminController.class" 2>/dev/null | strings | grep -c "ingest/cases/repair" | sed "s/^/REPAIR_ENDPOINT_IN_JAR=/" || echo "REPAIR_ENDPOINT_IN_JAR=0"')
          C.append('unzip -p /home/ec2-user/app.jar "BOOT-INF/classes/f2r/tutor_solution/private_tutor_solution_back/domain/newstartknowledge/controller/NewstartIngestionAdminController.class" 2>/dev/null | strings | grep -c "repairEmpiricalCases" | sed "s/^/REPAIR_SERVICE_IN_JAR=/" || echo "REPAIR_SERVICE_IN_JAR=0"')
          C.append('echo "=== HTTP_PROBE (GET only, no POST) ==="')
          C.append('curl -s -o /dev/null -w "GET_REPAIR_ENDPOINT=%{http_code}\\n" --max-time 10 http://localhost:8080/api/admin/newstart/wiki/ingest/cases/repair || echo "CURL_FAILED"')
          C.append('curl -s -o /dev/null -w "GET_ACTIVE_KNOWLEDGE=%{http_code}\\n" --max-time 10 "http://localhost:8080/api/admin/newstart/wiki/active?sourceType=CASE" || echo "CURL_FAILED"')
          C.append("exit 0")

          with open("/tmp/census.json", "w", encoding="utf-8") as f:
              json.dump({"commands": C}, f, ensure_ascii=False)
          print("params bytes:", len(open("/tmp/census.json","rb").read()))
          PYEOF

      - name: Run census via SSM
        shell: bash
        run: |
          set -uo pipefail
          INSTANCE_ID="i-09d7cabb5a42d1135"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/census.json \
            --comment "newstart task13 read-only pre-flight census" \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          echo "wait_exit=$?"
          set -e
          echo "===== invocation status ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query '{Status:Status,ResponseCode:ResponseCode}' --output text
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text
          echo "===== StandardErrorContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'StandardErrorContent' --output text
          exit 0
