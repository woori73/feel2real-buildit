name: New account IAM bootstrap (one-time, manual)
# 신규 계정의 프로젝트 역할 4개와 EC2 인스턴스 프로파일을 저장소의 JSON 그대로 만든다(멱등: 없으면 생성, 있으면 신뢰 정책은 유지하고 인라인 정책만 갱신).
# 사용자가 콘솔에서 만드는 것은 OIDC 공급자 1개와 부트스트랩 역할 1개뿐이고, 나머지는 이 워크플로가 처리한다.
# 모든 실행은 Environment(f2r-aws-bootstrap) 승인이 필요하다. 부트스트랩 역할의 신뢰 정책에는 만료 시각(2026-10-25)이 있어 자동으로 사용 불가가 된다. 사용 후 삭제도 권고(콘솔 1회).
# 활성 워크플로(workflow_dispatch 전용, 실행은 Environment 승인 필요). 출력에는 역할 이름과 결과만 있다(계정 메타데이터 없음).
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: f2r-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: f2r-aws-bootstrap
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::425805163960:role/f2r-bootstrap
          aws-region: ap-northeast-2
          role-session-name: f2r-bootstrap
      - name: Create or update project roles
        shell: bash
        run: |
          set -euo pipefail
          D=docs/operations/aws-migration
          upsert() { # $1=role $2=trust file $3=inline policy name(or -) $4=inline policy file(or -)
            if aws iam get-role --role-name "$1" >/dev/null 2>&1; then
              # 신뢰 정책은 생성 시점에만 설정한다(부트스트랩 역할에는 신뢰 정책 변경 권한이 없다). 이미 있으면 그대로 둔다.
              echo "exists (trust unchanged): $1"
            else
              aws iam create-role --role-name "$1" --assume-role-policy-document "file://$D/$2" --max-session-duration 3600 \
                --tags Key=Project,Value=f2r-migration >/dev/null; echo "created: $1"
            fi
            if [ "$3" != "-" ]; then
              aws iam put-role-policy --role-name "$1" --policy-name "$3" --policy-document "file://$D/$4"; echo "policy set: $1/$3"
            fi
          }
          upsert f2r-infra-builder trust-f2r-infra-builder.json f2r-infra-builder-inline policy-f2r-infra-builder.json
          upsert github-actions-f2r-deploy trust-github-actions-f2r-deploy.json f2r-deploy-smoke-ssm policy-f2r-deploy-smoke-ssm.json
          upsert f2r-e1-snapshot-receiver trust-e1-new-account.json f2r-e1-snapshot-receiver-inline policy-e1-new-account-snapshot-receiver.json
          upsert f2r-ec2-ssm-role trust-f2r-ec2-ssm-role.json f2r-ec2-secrets-read policy-f2r-ec2-secrets-read.json
          if [ -z "$(aws iam list-attached-role-policies --role-name f2r-ec2-ssm-role --query 'AttachedPolicies[?PolicyName==`AmazonSSMManagedInstanceCore`].PolicyName' --output text)" ]; then
            aws iam attach-role-policy --role-name f2r-ec2-ssm-role --policy-arn arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore; echo "attached SSM core"
          fi
          if ! aws iam get-instance-profile --instance-profile-name f2r-ec2-profile >/dev/null 2>&1; then
            aws iam create-instance-profile --instance-profile-name f2r-ec2-profile --tags Key=Project,Value=f2r-migration >/dev/null; echo "created profile"
          fi
          if [ -z "$(aws iam get-instance-profile --instance-profile-name f2r-ec2-profile --query 'InstanceProfile.Roles[].RoleName' --output text)" ]; then
            aws iam add-role-to-instance-profile --instance-profile-name f2r-ec2-profile --role-name f2r-ec2-ssm-role; echo "added role to profile"
          fi
          echo "bootstrap done"
      - name: Verify roles match repository JSON (read-only)
        shell: bash
        run: |
          set -euo pipefail
          D=docs/operations/aws-migration
          python3 - "$D" <<'PY'
          import json,subprocess,sys
          d=sys.argv[1]
          # (role, trust file, inline policy name, inline policy file or None)
          # (role, trust file, inline policy name, inline policy file, expected attached managed policies)
          SSM=["AmazonSSMManagedInstanceCore"]
          items=[("f2r-infra-builder","trust-f2r-infra-builder.json","f2r-infra-builder-inline","policy-f2r-infra-builder.json",[]),
                 ("github-actions-f2r-deploy","trust-github-actions-f2r-deploy.json","f2r-deploy-smoke-ssm","policy-f2r-deploy-smoke-ssm.json",[]),
                 ("f2r-e1-snapshot-receiver","trust-e1-new-account.json","f2r-e1-snapshot-receiver-inline","policy-e1-new-account-snapshot-receiver.json",[]),
                 ("f2r-ec2-ssm-role","trust-f2r-ec2-ssm-role.json","f2r-ec2-secrets-read","policy-f2r-ec2-secrets-read.json",SSM)]
          def aws(*a): return json.loads(subprocess.check_output(["aws",*a,"--output","json"]))
          canon=lambda o: json.dumps(o,sort_keys=True)
          ok=True
          for role,tf,pn,pf,want_att in items:
              trust=aws("iam","get-role","--role-name",role)["Role"]["AssumeRolePolicyDocument"]
              want_t=json.load(open(f"{d}/{tf}"))
              names=sorted(aws("iam","list-role-policies","--role-name",role)["PolicyNames"])
              att=sorted(x["PolicyName"] for x in aws("iam","list-attached-role-policies","--role-name",role)["AttachedPolicies"])
              pol=aws("iam","get-role-policy","--role-name",role,"--policy-name",pn)["PolicyDocument"]
              want_p=json.load(open(f"{d}/{pf}"))
              t_ok=canon(trust)==canon(want_t); p_ok=canon(pol)==canon(want_p)
              inl_ok=names==[pn]; att_ok=att==sorted(want_att)
              role_ok=t_ok and p_ok and inl_ok and att_ok
              ok&=role_ok
              # 예상 밖 정책은 이름만 출력한다(내용·ARN 전체는 출력하지 않음).
              extra_inl=[n for n in names if n!=pn]; extra_att=[n for n in att if n not in want_att]
              print(f"{role}: trust={'MATCH' if t_ok else 'MISMATCH'} inline_doc={'MATCH' if p_ok else 'MISMATCH'} "
                    f"unexpected_inline={extra_inl} unexpected_attached={extra_att} -> {'OK' if role_ok else 'FAIL'}")
          prof=aws("iam","get-instance-profile","--instance-profile-name","f2r-ec2-profile")["InstanceProfile"]
          roles=[r["RoleName"] for r in prof["Roles"]]
          prof_ok=roles==["f2r-ec2-ssm-role"]
          ok&=prof_ok
          print("f2r-ec2-profile roles:",roles,"->","OK" if prof_ok else "FAIL")
          sys.exit(0 if ok else 1)
          PY
