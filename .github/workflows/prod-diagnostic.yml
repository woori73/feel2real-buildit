name: New AWS production readiness (read-only)
# Manual fixed probes; no deploy, snapshot creation, IAM changes or model calls.
on:
  workflow_dispatch:
  workflow_call:
permissions:
  id-token: write
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure existing new-account role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::425805163960:role/github-actions-f2r-deploy
          allowed-account-ids: '425805163960'
          aws-region: ap-northeast-2
          retry-max-attempts: 2
      - name: Fixed read-only probes
        run: python3 scripts/operations/production-readiness.py --receipt /tmp/f2r-readiness.json
      - name: Preserve sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-account-readiness-${{ github.sha }}
          path: /tmp/f2r-readiness.json
          if-no-files-found: warn
          retention-days: 7
