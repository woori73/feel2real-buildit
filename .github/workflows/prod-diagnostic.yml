name: Production Diagnostic (read-only, manual)

# READ-ONLY 운영 진단 전용 workflow.
# - workflow_dispatch 수동 실행만 허용 (자동 실행 없음)
# - 진단 종류는 코드에 고정. 임의 명령어/SQL 입력 불가.
# - 신규 운영 계정(425805163960)의 태그 인스턴스에서 고정 SSM 문서 F2R-ReadOnlyStatus만 실행한다.
#   지원: service-status, jar-info, health-check, system-resources, flyway-history(SELECT·READ ONLY 세션), predeploy-check(플래그 이름만)
# - 구 계정 전용 진단과 쓰기 작업(deploy-wemade-jar, rollback-jar 등)은 계정 이전 후 제거했다. 배포·롤백은 Deploy to EC2.
# - DB credential은 EC2의 /etc/f2r/env에서 로드하며 GitHub 로그에 절대 출력하지 않는다.
# - 역할: github-actions-f2r-readonly(Describe + 고정 문서 SendCommand만). 생성은 별도 승인.

on:
  workflow_dispatch:
    inputs:
      diagnostic_type:
        description: '진단 종류 (코드 고정)'
        required: true
        default: 'flyway-history'
        type: choice
        options:
          - flyway-history
          - predeploy-check
          - service-status
          - system-resources
          - jar-info
          - health-check
          - assistant-ai-eval
          - assistant-live-e2e
          - lovable-flow-e2e

permissions:
  id-token: write
  contents: read

jobs:
  diagnostic:
    if: ${{ inputs.diagnostic_type != 'assistant-ai-eval' && inputs.diagnostic_type != 'assistant-live-e2e' && inputs.diagnostic_type != 'lovable-flow-e2e' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 구 계정(067573916809)·구 인스턴스는 이전 후 종료되어 진단 대상이 아니다. 고정 ID를 쓰지 않는다.
      # 신규 계정의 운영 인스턴스는 태그(Name=f2r-app, Project=f2r-migration)로 찾고,
      # 호스트에서는 고정 읽기 전용 SSM 문서 F2R-ReadOnlyStatus만 실행한다(임의 셸·쓰기 없음).
      - name: Map diagnostic type to a read-only section
        id: map
        shell: bash
        env:
          DIAG_TYPE: ${{ inputs.diagnostic_type }}
        run: |
          set -euo pipefail
          case "$DIAG_TYPE" in
            service-status|jar-info|health-check|system-resources|flyway-history|predeploy-check) SECTION="$DIAG_TYPE" ;;
            *)
              echo "::error::'$DIAG_TYPE' is not available after the account migration (old-host only or a write operation). Use 'Deploy to EC2' for deploy/rollback and 'Prod read-only status' for status."
              exit 1 ;;
          esac
          echo "section=$SECTION" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (read-only role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::425805163960:role/github-actions-f2r-readonly
          aws-region: ap-northeast-2
          role-session-name: f2r-prod-diagnostic

      - name: Run fixed read-only SSM document
        shell: bash
        env:
          SECTION: ${{ steps.map.outputs.section }}
        run: |
          set -euo pipefail
          IID=$(aws ec2 describe-instances --filters Name=tag:Name,Values=f2r-app Name=tag:Project,Values=f2r-migration Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          [ -n "$IID" ] && [ "$IID" != "None" ] || { echo "::error::running f2r-app instance not found"; exit 1; }
          CMD_ID=$(aws ssm send-command --instance-ids "$IID" --document-name F2R-ReadOnlyStatus \
            --parameters "Section=$SECTION" --query 'Command.CommandId' --output text)
          echo "SSM CommandId=$CMD_ID"
          for i in $(seq 1 18); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" --query 'Status' --output text)
            echo "status=$STATUS (attempt $i/18)"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" --query 'StandardOutputContent' --output text \
            | sed -E 's/((KEY|SECRET|TOKEN|PASSWORD|PASS)[A-Za-z_]*=)[^ ]+/\1<masked>/Ig; s/[A-Za-z0-9.-]+\.rds\.amazonaws\.com/<rds-host>/g'
          FINAL=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" --query 'Status' --output text)
          if [ "$FINAL" != "Success" ]; then
            echo "::error::SSM command finished with status $FINAL"
            exit 1
          fi

  # 대화 수정 에이전트 실제 AI 해석 성능 실측(운영 접근 없음, 배포 없음).
  # Muse Spark 키는 저장소 Secret을 환경변수로만 주입하며 로그·리포트에 출력하지 않는다.
  assistant-ai-eval:
    if: ${{ inputs.diagnostic_type == 'assistant-ai-eval' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_test_root_pw
          MYSQL_DATABASE: f2r_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/f2r_test?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ci_test_root_pw
      ASSISTANT_EVAL_LIVE: 'true'
      META_JIPJIGI_API_KEY: ${{ secrets.META_JIPJIGI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Key configured? (값은 출력하지 않는다)
        run: |
          if [ -n "$META_JIPJIGI_API_KEY" ]; then echo "META_JIPJIGI_API_KEY: set"; else echo "META_JIPJIGI_API_KEY: EMPTY"; fi
          if [ -n "$OPENROUTER_API_KEY" ]; then echo "OPENROUTER_API_KEY: set"; else echo "OPENROUTER_API_KEY: EMPTY"; fi
      - name: Run live eval
        run: ./gradlew test --no-daemon --tests "f2r.tutor_solution.private_tutor_solution_back.domain.academy.service.AssistantEditLiveEvalTest"
      - name: Report
        if: always()
        run: cat build/reports/assistant-edit-eval.txt || echo "no report"

  # 실제 AI(Muse Spark)로 최초 생성 → 연속 수정 → 되돌리기 → 승인 게시까지 브라우저 E2E (격리 DB·로컬 앱, 운영 접근 없음).
  assistant-live-e2e:
    if: ${{ inputs.diagnostic_type == 'assistant-live-e2e' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_test_root_pw
          MYSQL_DATABASE: f2r_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/f2r_test?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ci_test_root_pw
      BUILDIT_ASSISTANT_ENABLED: 'true'
      META_JIPJIGI_API_KEY: ${{ secrets.META_JIPJIGI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Start app (isolated CI DB, switch ON)
        run: |
          nohup ./gradlew bootRun --no-daemon > app.log 2>&1 &
          echo $! > app.pid
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || true)
            [ "$code" = "200" ] && echo "app up" && exit 0
            sleep 10
          done
          echo "app did not start"; tail -50 app.log | sed 's/META_[A-Z_]*=[^ ]*/META_***/'; exit 1
      - name: V1064 fresh install check (new empty DB, app boot = full Flyway)
        run: |
          M="mysql -h127.0.0.1 -uroot -pci_test_root_pw f2r_test"
          $M -e "SELECT version, success FROM flyway_schema_history WHERE version='1064';" | tee v1064.txt
          grep -q "1064	1" v1064.txt
          $M -e "SHOW COLUMNS FROM academy_working_copy LIKE 'staged_media_json';" | tee v1064-col.txt
          grep -q staged_media_json v1064-col.txt
      - name: Seed test users (CI DB only)
        run: |
          H='\$2a\$10\$b1zH0Y4x2dC7YMdGjrWCzuSF4gRpiVnnt2B1s3jA2HPBP3xrvc9Di'
          mysql -h127.0.0.1 -uroot -pci_test_root_pw f2r_test -e "INSERT INTO users (login_id, password, name, nickname, role, created_at, updated_at) VALUES ('e2e-live', '$H', '신규원장', '신규원장', 'TUTOR', NOW(), NOW()), ('e2e-other', '$H', '다른원장', '다른원장', 'TUTOR', NOW(), NOW()), ('e2e-legacy', '$H', '기존원장', '기존원장', 'TUTOR', NOW(), NOW()), ('e2e-adopt', '$H', '전환원장', '전환원장', 'TUTOR', NOW(), NOW());"
      - name: Install E2E deps
        run: cd e2e/visual-editor && npm install --no-audit --no-fund
      - name: "[1] Live flow — real AI: create, edit, preview, undo, approve"
        id: live
        continue-on-error: true
        run: node e2e/assistant-live/live-flow.js 2>&1 | tee live-flow.txt; exit ${PIPESTATUS[0]}
      - name: "[2] Photos, 5 viewports + screenshots, permissions, conflict, legacy academy"
        id: extra
        continue-on-error: true
        run: node e2e/assistant-live/integrated-extra.js 2>&1 | tee integrated-extra.txt; exit ${PIPESTATUS[0]}
      - name: "[2b] Screen mode split, explicit adoption, AI delay (progress/timeout)"
        id: mode
        continue-on-error: true
        run: node e2e/assistant-live/assistant-mode.js 2>&1 | tee assistant-mode.txt; exit ${PIPESTATUS[0]}
      - name: "[3] AI call count, latency, failures (from app log; no secrets)"
        if: always()
        run: |
          python3 - <<'PYEOF' | tee ai-metrics.txt | tee -a "$GITHUB_STEP_SUMMARY"
          import re
          lines = open('app.log', encoding='utf-8', errors='replace').read().splitlines()
          def pct(a, q):
              a = sorted(a)
              return a[min(len(a) - 1, max(0, int(round(q * len(a) + 0.5)) - 1))] if a else None
          ok_ms, ok_chars = [], []
          for l in lines:
              if 'buildit ai muse-spark ok' in l:
                  m = re.search(r'ms=(\d+)', l); c = re.search(r'promptChars=(\d+)', l)
                  if m: ok_ms.append(int(m.group(1)))
                  if c: ok_chars.append(int(c.group(1)))
          failed = [l for l in lines if 'buildit ai muse-spark failed' in l]
          fallback = [l for l in lines if 'buildit ai fallback' in l]
          timeouts = [l for l in lines if 'assistant-edit ai-timeout' in l]
          http = [l for l in lines if 'newstart meta-muse-spark call' in l]
          http_ms = [int(m.group(1)) for l in http for m in [re.search(r'httpMs=(\d+)', l)] if m]
          engines = {}
          for l in lines:
              m = re.search(r'assistant-edit engine=(\S+)', l)
              if m: engines[m.group(1)] = engines.get(m.group(1), 0) + 1
          print('## AI 호출·응답시간·실패 (앱 로그 집계, 이 run 전체)')
          print(f'- Muse Spark 성공 호출 {len(ok_ms)}회, 실패 {len(failed)}회, Qwen 폴백 {len(fallback)}회, 서버 한도(timeout) 초과 {len(timeouts)}회')
          print('- 재시도: Muse Spark 호출에는 재시도 로직이 없다(실패 시 폴백 체인으로 1회 이동). 위 폴백 횟수가 곧 재시도성 호출 수다.')
          if ok_ms:
              print(f'- 성공 호출 응답시간(ms): n={len(ok_ms)} p50={pct(ok_ms, .5)} p95={pct(ok_ms, .95)} max={max(ok_ms)}')
          if http_ms:
              print(f'- HTTP 왕복(ms, 전송→응답): n={len(http_ms)} p50={pct(http_ms, .5)} p95={pct(http_ms, .95)} max={max(http_ms)}')
          if ok_chars:
              print(f'- 요청 프롬프트 문자 수 합계 {sum(ok_chars)}자 (토큰 사용량·단가는 로그에 없어 비용은 산정하지 않음)')
          print('- 대화 수정 턴 엔진 분포: ' + (', '.join(f'{k}={v}' for k, v in sorted(engines.items())) or '없음'))
          PYEOF
      - name: Stop app and restart with switch OFF (isolated CI DB)
        if: always()
        run: |
          kill $(cat app.pid) 2>/dev/null || true
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8080/actuator/health || break; sleep 2; done
          BUILDIT_ASSISTANT_ENABLED=false nohup ./gradlew bootRun --no-daemon > app-off.log 2>&1 &
          echo $! > app.pid
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || true)
            [ "$code" = "200" ] && echo "app up (switch OFF)" && exit 0
            sleep 10
          done
          tail -30 app-off.log | sed 's/META_[A-Z_]*=[^ ]*/META_***/'; exit 1
      - name: "[4] Switch OFF check"
        id: flagoff
        continue-on-error: true
        run: node e2e/assistant-live/flag-off.js 2>&1 | tee flag-off.txt; exit ${PIPESTATUS[0]}
      - name: Stop app
        if: always()
        run: kill $(cat app.pid) 2>/dev/null || true
      - name: "[5] V1064 + ops-history reproduction tests (isolated DB)"
        id: v1064
        continue-on-error: true
        run: >-
          ./gradlew test --no-daemon --stacktrace
          --tests "f2r.tutor_solution.private_tutor_solution_back.config.FlywayProdHistoryMySqlTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.academy.controller.AcademyAssistantMediaMySqlTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.academy.controller.AcademyAssistantEditMySqlTest"
      - name: Upload screenshots and result logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant-integrated-e2e
          path: |
            e2e/assistant-live/artifacts/*.png
            live-flow.txt
            integrated-extra.txt
            assistant-mode.txt
            flag-off.txt
            ai-metrics.txt
            v1064.txt
            v1064-col.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: App log tail (assistant-edit lines only; no secrets)
        if: always()
        run: grep -a "assistant-edit\|buildit ai\|meta-muse-spark call" app.log | tail -150 | cut -c1-240 || true
      - name: Verdict
        if: always()
        run: |
          echo "live=${{ steps.live.outcome }} extra=${{ steps.extra.outcome }} mode=${{ steps.mode.outcome }} flagoff=${{ steps.flagoff.outcome }} v1064=${{ steps.v1064.outcome }}"
          {
            echo "## 통합 E2E 결과"
            echo "- [1] 실제 AI 연속 흐름: ${{ steps.live.outcome }}"
            echo "- [2] 사진·화면 폭·권한·충돌·기존 학원: ${{ steps.extra.outcome }}"
            echo "- [2b] 화면 모드 분리·명시 전환·AI 지연: ${{ steps.mode.outcome }}"
            echo "- [4] 스위치 OFF: ${{ steps.flagoff.outcome }}"
            echo "- [5] V1064·운영 이력 재현 테스트: ${{ steps.v1064.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${{ steps.live.outcome }}" = success ] && [ "${{ steps.extra.outcome }}" = success ] && [ "${{ steps.mode.outcome }}" = success ] && [ "${{ steps.flagoff.outcome }}" = success ] && [ "${{ steps.v1064.outcome }}" = success ]

  # 사용자 흐름 하나(한 문장 생성 → 미리보기 카드 → 전체 화면 → 대화 수정 → 게시 → 버전 → 다운로드)를 실제 AI로 1회 확인.
  # 격리 DB·로컬 앱, 운영 접근 없음. 다른 E2E·테스트 단계는 돌리지 않는다(비용 최소화).
  lovable-flow-e2e:
    if: ${{ inputs.diagnostic_type == 'lovable-flow-e2e' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_test_root_pw
          MYSQL_DATABASE: f2r_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/f2r_test?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ci_test_root_pw
      BUILDIT_ASSISTANT_ENABLED: 'true'
      META_JIPJIGI_API_KEY: ${{ secrets.META_JIPJIGI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CHROMIUM_PATH: /usr/bin/google-chrome
      SHOT_DIR: lovable-shots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Start app (isolated CI DB, switch ON)
        run: |
          nohup ./gradlew bootRun --no-daemon > app.log 2>&1 &
          echo $! > app.pid
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || true)
            [ "$code" = "200" ] && echo "app up" && exit 0
            sleep 10
          done
          echo "app did not start"; tail -50 app.log | sed 's/META_[A-Z_]*=[^ ]*/META_***/'; exit 1
      - name: Seed test user (CI DB only)
        run: |
          H='\$2a\$10\$b1zH0Y4x2dC7YMdGjrWCzuSF4gRpiVnnt2B1s3jA2HPBP3xrvc9Di'
          mysql -h127.0.0.1 -uroot -pci_test_root_pw f2r_test -e "INSERT INTO users (login_id, password, name, nickname, role, created_at, updated_at) VALUES ('e2e-lov', '$H', '시험원장', '시험원장', 'TUTOR', NOW(), NOW());"
      - name: Install E2E deps
        run: cd e2e/visual-editor && npm install --no-audit --no-fund
      - name: Lovable-style flow (real AI, one scenario)
        id: flow
        run: node e2e/assistant-live/lovable-flow.js 2>&1 | tee lovable-flow.txt; exit ${PIPESTATUS[0]}
      - name: AI calls (from app log; no secrets)
        if: always()
        run: |
          {
            echo "## AI 호출 (앱 로그 집계)"
            echo "- Muse Spark 성공 $(grep -ac 'buildit ai muse-spark ok' app.log)회, 실패 $(grep -ac 'buildit ai muse-spark failed' app.log)회, 폴백 $(grep -ac 'buildit ai fallback' app.log)회"
            grep -a 'buildit ai muse-spark ok' app.log | grep -o 'ms=[0-9]*' | tr '\n' ' '
          } | tee ai-calls.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Stop app
        if: always()
        run: kill $(cat app.pid) 2>/dev/null || true
      - name: Upload screenshots, downloaded file and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lovable-flow
          path: |
            lovable-shots/*
            lovable-flow.txt
            ai-calls.txt
          if-no-files-found: ignore
          retention-days: 14
