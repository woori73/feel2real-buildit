name: Production Diagnostic (read-only, manual)

# READ-ONLY 운영 진단 전용 workflow.
# - workflow_dispatch 수동 실행만 허용 (자동 실행 없음)
# - 진단 종류는 코드에 고정. 임의 명령어/SQL 입력 불가.
# - DB 진단: flyway-history, schema-columns (SELECT만)
# - 서비스 진단: service-status, journal-errors, system-resources, jar-info, health-check (DB 작업 없음)
# - DB credential은 EC2의 /etc/f2r/env에서 로드하며 GitHub 로그에 절대 출력하지 않는다.
# - DB 쓰기 명령(INSERT/UPDATE/DELETE 등)은 포함하지 않는다.
# - 기존 OIDC → AWS SSM 권한만 사용한다. 새 secret을 만들지 않는다.

on:
  workflow_dispatch:
    inputs:
      diagnostic_type:
        description: '진단 종류 (코드 고정)'
        required: true
        default: 'flyway-history'
        type: choice
        options:
          - flyway-history
          - schema-columns
          - service-status
          - journal-errors
          - system-resources
          - jar-info
          - health-check
          - jar-wemade-resources
          - local-wemade-curl
          - nginx-wemade

permissions:
  id-token: write
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2

      - name: Run read-only diagnostic via SSM
        run: |
          set -euo pipefail
          DIAG_TYPE="${{ inputs.diagnostic_type }}"
          # 각 진단의 SSM 스크립트를 케이스별로 구성한다.
          # journalctl은 타임아웃 방지를 위해 좁은 범위 + grep으로 제한한다.
          case "$DIAG_TYPE" in
            flyway-history)
              DIAG_LABEL="flyway-history (V1041/V1042)"
              SSM_BODY=$(cat <<'SSMEOF'
          source /etc/f2r/env
          echo "===== flyway-history (V1041/V1042) ====="
          mysql -h "$DB_HOST" -P "${DB_PORT:-3306}" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" -e "SELECT installed_rank, version, description, type, script, checksum, installed_by, installed_on, execution_time, success FROM flyway_schema_history WHERE version IN ('1041','1042') ORDER BY installed_rank;"
          SSMEOF
              )
              ;;
            schema-columns)
              DIAG_LABEL="schema-columns (V1041 target columns)"
              SSM_BODY=$(cat <<'SSMEOF'
          source /etc/f2r/env
          echo "===== schema-columns (V1041 target columns) ====="
          mysql -h "$DB_HOST" -P "${DB_PORT:-3306}" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" -e "SELECT table_name, column_name, data_type, is_nullable, column_default FROM information_schema.columns WHERE table_schema = DATABASE() AND ((table_name='wemade_gap_factors' AND column_name='hypothesis_no') OR (table_name='wemade_surge_analysis' AND column_name IN ('ret1d','ret3d','ret5d','ret10d'))) ORDER BY table_name, column_name;"
          SSMEOF
              )
              ;;
            service-status)
              DIAG_LABEL="service-status (f2r-app.service)"
              SSM_BODY=$(cat <<'SSMEOF'
          echo "===== systemctl status f2r-app.service ====="
          systemctl status f2r-app.service --no-pager -l | head -40 || true
          echo ""
          echo "===== systemctl show (key properties) ====="
          systemctl show f2r-app.service --property=ActiveState,SubState,Result,ExecMainCode,ExecMainStatus,NRestarts,MainPID,ExecMainStartTimestamp | tr ',' '\n' || true
          echo ""
          echo "===== is-active ====="
          systemctl is-active f2r-app.service || true
          SSMEOF
              )
              ;;
            journal-errors)
              DIAG_LABEL="journal-errors (narrow range, grep)"
              SSM_BODY=$(cat <<'SSMEOF'
          echo "===== journalctl: first error search (2026-10-06 04:40-04:50 UTC, max 100 lines) ====="
          journalctl -u f2r-app.service --since "2026-10-06 04:40:00" --until "2026-10-06 04:50:00" --no-pager | grep -i -m 100 -B 2 -A 10 -E 'Exception|Caused by|ERROR|APPLICATION FAILED|OutOfMemory|Killed|Flyway|Duplicate|exit' | head -120 || true
          echo ""
          echo "===== journalctl: tail 30 (most recent) ====="
          journalctl -u f2r-app.service --no-pager -n 30 || true
          SSMEOF
              )
              ;;
            system-resources)
              DIAG_LABEL="system-resources (memory/disk/OOM)"
              SSM_BODY=$(cat <<'SSMEOF'
          echo "===== free -m ====="
          free -m || true
          echo ""
          echo "===== df -h ====="
          df -h || true
          echo ""
          echo "===== OOM killer check (journalctl -k, last 50) ====="
          journalctl -k --no-pager -n 50 | grep -i -m 20 'oom|killed process|out of memory' || echo "No OOM killer entries found"
          SSMEOF
              )
              ;;
            jar-info)
              DIAG_LABEL="jar-info (app.jar vs app.jar.previous)"
              SSM_BODY=$(cat <<'SSMEOF'
          echo "===== current JAR files ====="
          ls -lh /home/ec2-user/app.jar /home/ec2-user/app.jar.previous 2>&1 || true
          echo ""
          echo "===== SHA256 ====="
          sha256sum /home/ec2-user/app.jar 2>&1 | cut -c1-80 || true
          sha256sum /home/ec2-user/app.jar.previous 2>&1 | cut -c1-80 || true
          echo ""
          echo "===== mtime ====="
          stat -c '%y %n' /home/ec2-user/app.jar /home/ec2-user/app.jar.previous 2>&1 || true
          SSMEOF
              )
              ;;
            health-check)
              DIAG_LABEL="health-check"
              SSM_BODY=$(cat <<'SSMEOF'
          echo "===== health endpoint (localhost:8080) ====="
          curl -fsS --max-time 10 http://127.0.0.1:8080/actuator/health 2>&1 | head -20 || echo "HEALTH_CHECK_FAILED (exit $?)"
          echo ""
          echo "===== port 8080 listening? ====="
          ss -ltnp 2>/dev/null | grep ':8080' || echo "Port 8080 NOT listening"
          SSMEOF
              )
              ;;
            jar-wemade-resources)
              DIAG_LABEL="jar-wemade-resources (wemade template in JAR)"
              SSM_BODY=$(cat <<'SSMEOF'
          echo "===== wemade templates in app.jar ====="
          unzip -l /home/ec2-user/app.jar 2>/dev/null | grep -i 'wemade' | head -30 || echo "No wemade entries found in JAR"
          echo ""
          echo "===== wemade static resources in app.jar ====="
          unzip -l /home/ec2-user/app.jar 2>/dev/null | grep -i 'static.*wemade\|wemade.*\.js\|wemade.*\.css' | head -20 || echo "No wemade static resources found"
          echo ""
          echo "===== WemadePageController in JAR ====="
          unzip -l /home/ec2-user/app.jar 2>/dev/null | grep -i 'WemadePageController' | head -5 || echo "WemadePageController NOT in JAR"
          SSMEOF
              )
              ;;
            local-wemade-curl)
              DIAG_LABEL="local-wemade-curl (localhost:8080/wemade)"
              SSM_BODY=$(cat <<'SSMEOF'
          echo "===== curl -i http://localhost:8080/wemade (first 40 lines) ====="
          curl -si --max-time 15 http://127.0.0.1:8080/wemade 2>&1 | head -40 || echo "CURL_FAILED (exit $?)"
          echo ""
          echo "===== title extraction ====="
          curl -s --max-time 15 http://127.0.0.1:8080/wemade 2>/dev/null | grep -o -m 1 '<title>[^<]*</title>' || echo "No title found"
          SSMEOF
              )
              ;;
            nginx-wemade)
              DIAG_LABEL="nginx-wemade (nginx config for /wemade)"
              SSM_BODY=$(cat <<'SSMEOF'
          echo "===== nginx config files ====="
          ls /etc/nginx/conf.d/ /etc/nginx/sites-enabled/ 2>/dev/null || echo "No conf.d or sites-enabled"
          echo ""
          echo "===== grep wemade in nginx config ====="
          grep -r -i 'wemade' /etc/nginx/ 2>/dev/null | head -20 || echo "No wemade in nginx config"
          echo ""
          echo "===== location blocks for / ====="
          grep -A 5 'location /' /etc/nginx/nginx.conf /etc/nginx/conf.d/*.conf 2>/dev/null | head -40 || echo "No location / blocks found"
          echo ""
          echo "===== proxy_pass settings ====="
          grep -r 'proxy_pass' /etc/nginx/ 2>/dev/null | head -10 || echo "No proxy_pass found"
          SSMEOF
              )
              ;;
            *)
              echo "::error::Unknown diagnostic_type: $DIAG_TYPE"
              exit 1
              ;;
          esac
          echo "Diagnostic: $DIAG_LABEL"
          SSM_SCRIPT=$(printf 'set -euo pipefail\n%s\n' "$SSM_BODY")
          PARAMS_JSON=$(python3 -c 'import json,sys; print(json.dumps({"commands": sys.stdin.read().splitlines()}))' <<< "$SSM_SCRIPT")
          CMD_ID=$(aws ssm send-command \
            --instance-ids i-09d7cabb5a42d1135 \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMS_JSON" \
            --query 'Command.CommandId' --output text)
          echo "SSM CommandId=$CMD_ID"
          for i in $(seq 1 18); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'Status' --output text)
            echo "status=$STATUS (attempt $i/18)"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'StandardOutputContent' --output text
          echo "===== StandardErrorContent ====="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'StandardErrorContent' --output text
          FINAL=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'Status' --output text)
          if [ "$FINAL" != "Success" ]; then
            echo "::error::SSM command finished with status $FINAL"
            exit 1
          fi
