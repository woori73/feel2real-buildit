name: Tmp EC2 Embed Pipeline
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2
      - name: Run embedding pipeline on EC2 via SSM
        run: |
          set -euo pipefail
          # 스크립트 전송
          SSM_SETUP=$(cat <<'SSMEOF'
          echo 'SCRIPT_B64' | base64 -d > /tmp/ec2_embed_pipeline.py
          python3 -m pip install --quiet pymysql 2>&1 | tail -1
          # 모델 확인
          ls /opt/embeddinggemma-2/config.json 2>&1 || echo "MODEL_MISSING"
          SSMEOF
          )
          SSM_SETUP="${SSM_SETUP/SCRIPT_}"
          PARAMS_JSON=$(python3 -c 'import json,sys; print(json.dumps({"commands": sys.stdin.read().splitlines()}))' <<< "$SSM_SETUP")
          CMD_ID=$(aws ssm send-command --instance-ids i-09d7cabb5a42d1135 --document-name AWS-RunShellScript --parameters "$PARAMS_JSON" --query 'Command.CommandId' --output text)
          for i in $(seq 1 10); do sleep 10
            S=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'Status' --output text)
            case "$S" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          OUTPUT=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'StandardOutputContent' --output text)
          echo "$OUTPUT" | tail -5
          if echo "$OUTPUT" | grep -q "MODEL_MISSING"; then
            echo "모델이 없습니다. 먼저 모델을 다운로드해야 합니다."
            exit 1
          fi
          # 파이프라인 실행 (백그라운드, 2시간 타임아웃)
          SSM_RUN=$(cat <<'SSMEOF2'
          cd /tmp && timeout 7000 python3 ec2_embed_pipeline.py > /tmp/embed_pipeline.log 2>&1
          echo "Exit: $?"
          tail -5 /tmp/embed_pipeline.log
          SSMEOF2
          )
          PARAMS_JSON2=$(python3 -c 'import json,sys; print(json.dumps({"commands": sys.stdin.read().splitlines()}))' <<< "$SSM_RUN")
          CMD_ID2=$(aws ssm send-command --instance-ids i-09d7cabb5a42d1135 --document-name AWS-RunShellScript --parameters "$PARAMS_JSON2" --query 'Command.CommandId' --output text)
          echo "Pipeline CMD: $CMD_ID2"
          for i in $(seq 1 140); do sleep 60
            S=$(aws ssm get-command-invocation --command-id "$CMD_ID2" --instance-id i-09d7cabb5a42d1135 --query 'Status' --output text)
            echo "[$i] $S"
            case "$S" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID2" --instance-id i-09d7cabb5a42d1135 --query 'StandardOutputContent' --output text | tail -10
