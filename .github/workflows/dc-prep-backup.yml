name: DesignCraft pre-deploy backup (jar copies + Wiki DB online backup) and RDS read-only check
on:
  push:
    branches: ['ci/dc-step1-readonly']
    paths: ['.github/workflows/dc-prep-backup.yml', 'ops/diagnostics/dc_prep_backup.py']
permissions:
  contents: read
  id-token: write
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2
          role-duration-seconds: 900
          retry-max-attempts: 1
      - name: Backup on the server (new directory only, originals read-only)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          Path('bk.json').write_text(json.dumps({'commands': ["python3 - <<'BKEOF'\n" + Path('ops/diagnostics/dc_prep_backup.py').read_text() + "\nBKEOF\n"]}))
          PY
          command_id=$(aws ssm send-command --instance-ids i-09d7cabb5a42d1135 --document-name AWS-RunShellScript --parameters file://bk.json --timeout-seconds 240 --query Command.CommandId --output text)
          for i in $(seq 1 70); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id i-09d7cabb5a42d1135 --query Status --output text 2>/dev/null || true)
            case "$status" in Success|Failed|TimedOut|Cancelled) break;; esac
            sleep 4
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id i-09d7cabb5a42d1135 --query '{status:Status,out:StandardOutputContent,err:StandardErrorContent}' --output json | tee bk-result.json
          python3 - <<'PY'
          import json, re
          o = json.load(open('bk-result.json'))['out']
          m = re.search(r'^RDS_ID=(.*)$', o, re.M)
          open('rds_id.txt', 'w').write((m.group(1) if m else '').strip())
          PY
      - name: RDS read-only check (existing role only; AccessDenied means "unverified")
        continue-on-error: true
        run: |
          RDS_ID=$(cat rds_id.txt); echo "rds identifier (from DB_HOST label): ${RDS_ID:-<none>}"
          set +e
          echo "== describe-db-instances"; aws rds describe-db-instances --db-instance-identifier "$RDS_ID" --query 'DBInstances[0].{status:DBInstanceStatus,class:DBInstanceClass,engine:Engine,version:EngineVersion,backupRetentionDays:BackupRetentionPeriod,backupWindow:PreferredBackupWindow,latestRestorableTime:LatestRestorableTime,multiAZ:MultiAZ,deletionProtection:DeletionProtection,storageEncrypted:StorageEncrypted}' --output json 2>&1 | head -20
          echo "== describe-db-snapshots (automated, newest)"; aws rds describe-db-snapshots --db-instance-identifier "$RDS_ID" --snapshot-type automated --query 'reverse(sort_by(DBSnapshots,&SnapshotCreateTime))[:3].{id:DBSnapshotIdentifier,created:SnapshotCreateTime,status:Status}' --output json 2>&1 | head -20
          echo "== describe-db-snapshots (manual, newest)"; aws rds describe-db-snapshots --db-instance-identifier "$RDS_ID" --snapshot-type manual --query 'reverse(sort_by(DBSnapshots,&SnapshotCreateTime))[:3].{id:DBSnapshotIdentifier,created:SnapshotCreateTime,status:Status}' --output json 2>&1 | head -20
          true
