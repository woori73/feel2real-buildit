name: Tmp Safety Verify
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2
      - name: Verify via SSM
        run: |
          SSM_BODY='echo "VECTORS:"; source /etc/f2r/env 2>/dev/null; mysql -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" -N -e "SELECT COUNT(*) FROM newstart_knowledge_embedding;" 2>&1 | head -1; echo "PROGRESS:"; cat /tmp/ec2_embed_progress.json 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d.get("done",[])))" 2>/dev/null || echo "0"; echo "HEALTH:"; curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/actuator/health 2>&1 | head -1; echo ""; echo "ENABLED:"; grep EMBEDDING_ENABLED /etc/f2r/env 2>/dev/null || echo "not_set(false)";'
          PARAMS_JSON=$(python3 -c 'import json,sys; print(json.dumps({"commands": [sys.stdin.read()]}))' <<< "$SSM_BODY")
          CMD_ID=$(aws ssm send-command --instance-ids i-09d7cabb5a42d1135 --document-name AWS-RunShellScript --parameters "$PARAMS_JSON" --query 'Command.CommandId' --output text)
          for i in $(seq 1 10); do sleep 10
            S=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'Status' --output text)
            case "$S" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'StandardOutputContent' --output text
