name: Diagnose Debt Vision (read-only, manual)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2

      - name: Search DEBT_VISION_DIAG via SSM (read-only)
        shell: bash
        run: |
          set +e
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09d7cabb5a42d1135" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["set +e","echo \"=== DEBT_VISION_DIAG (last 2h, max 100 lines) ===\"","journalctl -u f2r-app.service --since \"2 hours ago\" --no-pager | grep DEBT_VISION_DIAG | tail -100","echo \"=== end ===\"","exit 0"]}' \
            --query 'Command.CommandId' --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-09d7cabb5a42d1135"

          echo "wait_exit=$?"
          echo "===== DEBT_VISION_DIAG output ====="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-09d7cabb5a42d1135" \
            --query 'StandardOutputContent' \
            --output text || true

          echo "===== end ====="
