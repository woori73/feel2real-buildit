name: Prod read-only status (new account, manual)

# 신규 운영 계정(425805163960) 읽기 전용 현황 조회. 쓰기·재시작·배포·스냅샷 생성 없음.
# - AWS: Describe 계열만(EC2, RDS 인스턴스·스냅샷, ALB 대상 상태).
# - 호스트: 고정 SSM 문서 F2R-ReadOnlyStatus만 실행(임의 셸 불가, Section 값은 문서의 allowedValues로 제한).
# - 출력: 계정 번호는 가리고, 비밀값은 출력하지 않는다(DB 비밀번호는 MYSQL_PWD로만 전달, 플래그는 이름만).
# 선행 조건(별도 승인): 역할 github-actions-f2r-readonly 와 SSM 문서 F2R-ReadOnlyStatus 생성.
#   정의: docs/operations/aws-migration/{trust-github-actions-f2r-readonly,policy-f2r-readonly-status,ssm-document-F2R-ReadOnlyStatus}.json
on:
  workflow_dispatch:
    inputs:
      section:
        description: '호스트 조회 범위'
        required: true
        default: all
        type: choice
        options:
          - all
          - service-status
          - jar-info
          - health-check
          - system-resources
          - flyway-history
          - predeploy-check

permissions:
  id-token: write
  contents: read

concurrency:
  group: prod-readonly-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials (read-only role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::425805163960:role/github-actions-f2r-readonly
          aws-region: ap-northeast-2
          role-session-name: f2r-readonly-status

      - name: AWS resources (describe only)
        shell: bash
        run: |
          set +e
          # Account IDs are private metadata; the 12-digit timestamp inside f2r-db-* is an
          # operational resource identifier and must remain distinguishable for recovery.
          mask() { sed -E 's/425805163960/<acct>/g'; }
          echo "== app instance"
          aws ec2 describe-instances --filters Name=tag:Name,Values=f2r-app Name=tag:Project,Values=f2r-migration Name=instance-state-name,Values=running \
            --query 'Reservations[].Instances[].{Id:InstanceId,Type:InstanceType,Launched:LaunchTime}' --output table 2>&1 | mask
          echo "== rds instances"
          aws rds describe-db-instances --query "DBInstances[?starts_with(DBInstanceIdentifier,'f2r-')].{Id:DBInstanceIdentifier,Engine:Engine,Version:EngineVersion,Class:DBInstanceClass,Status:DBInstanceStatus,BackupDays:BackupRetentionPeriod,LatestRestorable:LatestRestorableTime,MultiAZ:MultiAZ,Encrypted:StorageEncrypted,DeletionProtection:DeletionProtection}" --output table 2>&1 | mask
          echo "== rds snapshots (latest 20)"
          aws rds describe-db-snapshots --query "reverse(sort_by(DBSnapshots,&SnapshotCreateTime))[:20].{Id:DBSnapshotIdentifier,Db:DBInstanceIdentifier,Type:SnapshotType,Created:SnapshotCreateTime,Status:Status}" --output table 2>&1 | mask
          echo "== alb target health"
          for tg in $(aws elbv2 describe-target-groups --query "TargetGroups[?starts_with(TargetGroupName,'f2r-')].TargetGroupArn" --output text 2>/dev/null); do
            aws elbv2 describe-target-health --target-group-arn "$tg" --query 'TargetHealthDescriptions[].{Target:Target.Id,Port:Target.Port,State:TargetHealth.State}' --output table 2>&1 | mask
          done
          exit 0

      - name: Host status (fixed SSM document only)
        shell: bash
        env:
          SECTION: ${{ inputs.section }}
        run: |
          set -euo pipefail
          IID=$(aws ec2 describe-instances --filters Name=tag:Name,Values=f2r-app Name=tag:Project,Values=f2r-migration Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          [ -n "$IID" ] && [ "$IID" != "None" ] || { echo "::error::running f2r-app instance not found"; exit 1; }
          CID=$(aws ssm send-command --instance-ids "$IID" --document-name F2R-ReadOnlyStatus \
            --parameters "Section=$SECTION" --query 'Command.CommandId' --output text)
          for _ in $(seq 1 24); do
            sleep 5
            ST=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)
            case "$ST" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          echo "status=$ST"
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query StandardOutputContent --output text \
            | sed -E 's/((KEY|SECRET|TOKEN|PASSWORD|PASS)[A-Za-z_]*=)[^ ]+/\1<masked>/Ig; s/\.[a-z0-9]+\.ap-northeast-2\.rds\.amazonaws\.com/.<rds-suffix>/g'
          [ "$ST" = Success ]
