name: DesignCraft pre-deploy preflight (read-mostly) plus kill-target decoy test and EC2 compat checks
on:
  push:
    branches: ['ci/dc-step1-readonly']
    paths: ['.github/workflows/dc-preflight.yml', 'ops/diagnostics/dc_preflight.py', 'ops/diagnostics/kill_deploy_tree.sh']
permissions:
  contents: read
  id-token: write
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2
          role-duration-seconds: 900
          retry-max-attempts: 1
      - name: Stage the kill script on the server (new file under /var/tmp) and run the preflight
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          kill = Path('ops/diagnostics/kill_deploy_tree.sh').read_text()
          pre = Path('ops/diagnostics/dc_preflight.py').read_text()
          script = "cat > /var/tmp/kill_deploy_tree.sh <<'KILLEOF'\n" + kill + "\nKILLEOF\nchmod 700 /var/tmp/kill_deploy_tree.sh\npython3 - <<'PREEOF'\n" + pre + "\nPREEOF\n"
          Path('pf.json').write_text(json.dumps({'commands': [script]}))
          PY
          command_id=$(aws ssm send-command --instance-ids i-09d7cabb5a42d1135 --document-name AWS-RunShellScript --parameters file://pf.json --timeout-seconds 240 --query Command.CommandId --output text)
          for i in $(seq 1 70); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id i-09d7cabb5a42d1135 --query Status --output text 2>/dev/null || true)
            case "$status" in Success|Failed|TimedOut|Cancelled) break;; esac
            sleep 4
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id i-09d7cabb5a42d1135 --query '{status:Status,out:StandardOutputContent,err:StandardErrorContent}' --output json
