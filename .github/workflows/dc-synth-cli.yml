name: DesignCraft templates group fix + CLI standalone synthetic test (approved, one-shot)
on:
  push:
    branches: ['ci/dc-step1-readonly']
    paths: ['.github/workflows/dc-synth-cli.yml', 'ops/diagnostics/dc_synth_cli_test.py']
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  swap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2
          role-duration-seconds: 1800
          retry-max-attempts: 1
      - name: Run fixed swap script on EC2 via SSM (aborts before any change on failed checks; auto-rollback after)
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          script="python3 - <<'DC_SYNTH_PY'\n"+Path('ops/diagnostics/dc_synth_cli_test.py').read_text()+"\nDC_SYNTH_PY"
          Path('synth-params.json').write_text(json.dumps({'commands':[script]}))
          PY
          command_id=$(aws ssm send-command --instance-ids i-09d7cabb5a42d1135 --document-name AWS-RunShellScript --parameters file://synth-params.json --timeout-seconds 600 --query Command.CommandId --output text)
          for i in $(seq 1 90); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id i-09d7cabb5a42d1135 --query Status --output text 2>/dev/null || true)
            case "$status" in Success|Failed|TimedOut|Cancelled) break;; esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id i-09d7cabb5a42d1135 --output json > invocation.json
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('invocation.json').read_text());out={'ssm_status':v['Status'],'stderr_present':bool(v.get('StandardErrorContent'))}
          try:out['result']=json.loads(v.get('StandardOutputContent',''))
          except ValueError:out['raw_output_head']=v.get('StandardOutputContent','')[:1500]
          if v.get('StandardErrorContent'):out['stderr_head']=v['StandardErrorContent'][:600]
          Path('dc-synth-cli-result.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          if v['Status']!='Success':raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dc-synth-cli-result
          path: dc-synth-cli-result.json
          if-no-files-found: warn
          retention-days: 14
