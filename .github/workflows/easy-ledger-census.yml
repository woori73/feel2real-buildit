name: Easy Production Ledger Census (read-only, manual)

# EASY 운영 장부 전수 집계 — READ ONLY.
# - 고정 SELECT census만 실행한다 (임의 SQL 입력 없음, 범용 DB shell 아님).
# - DB session은 SET SESSION TRANSACTION READ ONLY.
# - 집계값만 출력한다 (이름·카드·계좌·거래처·메모·원본 텍스트 출력 금지).
# - INSERT/UPDATE/DELETE/ALTER/CREATE/DROP 없음. secret 출력 없음.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2

      - name: Run read-only census via SSM (reads /etc/f2r/env on EC2)
        shell: bash
        run: |
          cat > /tmp/mysql-census.json <<'PARAMS'
          {"commands":[
            "set +e",
            "source /etc/f2r/env 2>/dev/null || true",
            "MYSQL_CENSUS=\"mysql -h \\\"${DB_HOST}\\\" -P \\\"${DB_PORT}\\\" -u \\\"${DB_USER}\\\" -p\\\"${DB_PASSWORD}\\\" \\\"${DB_NAME}\\\" --batch 2>&1\"",
            "run_q() { echo \"=== $1 ===\"; eval \"$MYSQL_CENSUS -e \\\"$2\\\"\" || echo \"QUERY_FAILED: $1\"; }",
            "RO=\"SET SESSION TRANSACTION READ ONLY;\"",
            "run_q SCHEMA_VERSION \"$RO SELECT version, description FROM flyway_schema_history ORDER BY CAST(version AS UNSIGNED) DESC LIMIT 5;\"",
            "run_q EASY_TABLES \"$RO SHOW TABLES LIKE 'easy\\\\_%';\"",
            "run_q BUSINESSES \"$RO SELECT business_id, code FROM easy_businesses ORDER BY business_id;\"",
            "run_q BATCH_LIST \"$RO SELECT batch_id, business_id, source_kind, status, total_rows, confirmed_rows FROM easy_import_batches ORDER BY batch_id;\"",
            "run_q BATCH5_STATUS \"$RO SELECT status, COUNT(*) AS cnt, COALESCE(SUM(amount),0) AS amt FROM easy_import_rows WHERE batch_id=5 GROUP BY status;\"",
            "run_q BATCH5_TOTAL \"$RO SELECT COUNT(*) AS total, COALESCE(SUM(amount),0) AS total_amt FROM easy_import_rows WHERE batch_id=5;\"",
            "run_q BATCH5_TXN_LINK \"$RO SELECT COUNT(*) AS linked_txn FROM easy_import_rows WHERE batch_id=5 AND created_txn_id IS NOT NULL;\"",
            "run_q BATCH5_JOURNAL_LINK \"$RO SELECT COUNT(DISTINCT r.created_txn_id) AS journal_txn FROM easy_import_rows r JOIN easy_journal_entries e ON e.txn_id=r.created_txn_id AND e.status='POSTED' WHERE r.batch_id=5 AND r.created_txn_id IS NOT NULL;\"",
            "run_q TXN_604_646 \"$RO SELECT COUNT(*) AS cnt, MIN(txn_id) AS min_id, MAX(txn_id) AS max_id FROM easy_transactions WHERE txn_id BETWEEN 604 AND 646;\"",
            "run_q TXN_604_646_JOURNAL \"$RO SELECT COUNT(DISTINCT t.txn_id) AS journal_txn FROM easy_transactions t JOIN easy_journal_entries e ON e.txn_id=t.txn_id AND e.status='POSTED' WHERE t.txn_id BETWEEN 604 AND 646;\"",
            "run_q ACADEMY_2026 \"$RO SELECT COUNT(*) AS total, MIN(occurred_on) AS min_d, MAX(occurred_on) AS max_d, COALESCE(SUM(CASE WHEN direction='INCOME' THEN amount ELSE 0 END),0) AS revenue, COALESCE(SUM(CASE WHEN direction='EXPENSE' THEN amount ELSE 0 END),0) AS expense FROM easy_transactions WHERE business_id=(SELECT business_id FROM easy_businesses WHERE code='ACADEMY') AND occurred_on BETWEEN '2026-01-01' AND '2026-12-31';\"",
            "run_q ACADEMY_CLASSIFIED \"$RO SELECT SUM(account_id IS NOT NULL) AS classified, SUM(account_id IS NULL) AS unclassified, SUM(source_kind IS NOT NULL AND fingerprint IS NOT NULL) AS with_provenance FROM easy_transactions WHERE business_id=(SELECT business_id FROM easy_businesses WHERE code='ACADEMY') AND occurred_on BETWEEN '2026-01-01' AND '2026-12-31';\"",
            "run_q ACADEMY_POSTED \"$RO SELECT COUNT(DISTINCT t.txn_id) AS posted, (SELECT COUNT(*) FROM easy_transactions WHERE business_id=(SELECT business_id FROM easy_businesses WHERE code='ACADEMY') AND occurred_on BETWEEN '2026-01-01' AND '2026-12-31') - COUNT(DISTINCT t.txn_id) AS not_posted FROM easy_transactions t JOIN easy_journal_entries e ON e.txn_id=t.txn_id AND e.status='POSTED' WHERE t.business_id=(SELECT business_id FROM easy_businesses WHERE code='ACADEMY') AND t.occurred_on BETWEEN '2026-01-01' AND '2026-12-31';\"",
            "run_q ACADEMY_MONTHLY \"$RO SELECT DATE_FORMAT(occurred_on,'%Y-%m') AS m, COUNT(*) AS cnt, COALESCE(SUM(CASE WHEN direction='INCOME' THEN amount ELSE 0 END),0) AS revenue, COALESCE(SUM(CASE WHEN direction='EXPENSE' THEN amount ELSE 0 END),0) AS expense, SUM(account_id IS NULL) AS unclassified FROM easy_transactions WHERE business_id=(SELECT business_id FROM easy_businesses WHERE code='ACADEMY') AND occurred_on BETWEEN '2026-01-01' AND '2026-09-30' GROUP BY m ORDER BY m;\"",
            "run_q PUBLISHING_2026 \"$RO SELECT COUNT(*) AS total, MIN(occurred_on) AS min_d, MAX(occurred_on) AS max_d, COALESCE(SUM(CASE WHEN direction='INCOME' THEN amount ELSE 0 END),0) AS revenue, COALESCE(SUM(CASE WHEN direction='EXPENSE' THEN amount ELSE 0 END),0) AS expense FROM easy_transactions WHERE business_id=(SELECT business_id FROM easy_businesses WHERE code='PUBLISHING') AND occurred_on BETWEEN '2026-01-01' AND '2026-12-31';\"",
            "run_q PUBLISHING_POSTED \"$RO SELECT COUNT(DISTINCT t.txn_id) AS posted FROM easy_transactions t JOIN easy_journal_entries e ON e.txn_id=t.txn_id AND e.status='POSTED' WHERE t.business_id=(SELECT business_id FROM easy_businesses WHERE code='PUBLISHING') AND t.occurred_on BETWEEN '2026-01-01' AND '2026-12-31';\"",
            "run_q SOURCE_CENSUS \"$RO SELECT COALESCE(source_kind,'NULL') AS src, COUNT(*) AS cnt, MIN(occurred_on) AS min_d, MAX(occurred_on) AS max_d FROM easy_transactions GROUP BY src ORDER BY cnt DESC;\"",
            "run_q CARD_EVENTS \"$RO SELECT review_status, COUNT(*) AS cnt FROM easy_card_events GROUP BY review_status;\"",
            "run_q CARD_EVENTS_POSTED \"$RO SELECT COUNT(*) AS posted FROM easy_card_events WHERE posted_txn_id IS NOT NULL;\"",
            "run_q TUITION \"$RO SELECT business_id, COUNT(*) AS cnt, COALESCE(SUM(billed_amount),0) AS billed, COALESCE(SUM(paid_amount),0) AS paid FROM easy_tuition_payments GROUP BY business_id;\"",
            "run_q JOURNAL_CENSUS \"$RO SELECT (SELECT COUNT(*) FROM easy_journal_entries WHERE status='POSTED') AS posted_entries, (SELECT COUNT(*) FROM easy_journal_entries WHERE status='VOIDED') AS voided_entries, (SELECT COUNT(*) FROM easy_journal_lines) AS line_cnt;\"",
            "run_q JOURNAL_TOTALS \"$RO SELECT COALESCE(SUM(l.debit),0) AS debit, COALESCE(SUM(l.credit),0) AS credit, COALESCE(SUM(l.debit),0)-COALESCE(SUM(l.credit),0) AS diff FROM easy_journal_lines l JOIN easy_journal_entries e ON e.entry_id=l.entry_id AND e.status='POSTED';\"",
            "run_q UNBALANCED \"$RO SELECT COUNT(*) AS unbalanced_entries FROM (SELECT l.entry_id FROM easy_journal_lines l JOIN easy_journal_entries e ON e.entry_id=l.entry_id AND e.status='POSTED' GROUP BY l.entry_id HAVING SUM(l.debit)<>SUM(l.credit)) u;\"",
            "run_q TB_BY_DIRECTION \"$RO SELECT a.direction AS dir, COALESCE(SUM(l.debit),0) AS debit, COALESCE(SUM(l.credit),0) AS credit FROM easy_journal_lines l JOIN easy_journal_entries e ON e.entry_id=l.entry_id AND e.status='POSTED' JOIN easy_accounts a ON a.account_id=l.account_id GROUP BY dir ORDER BY dir;\"",
            "run_q ACADEMY_TB \"$RO SELECT a.code AS code, a.direction AS dir, COALESCE(SUM(l.debit),0) AS debit, COALESCE(SUM(l.credit),0) AS credit FROM easy_journal_lines l JOIN easy_journal_entries e ON e.entry_id=l.entry_id AND e.status='POSTED' AND e.business_id=(SELECT business_id FROM easy_businesses WHERE code='ACADEMY') JOIN easy_accounts a ON a.account_id=l.account_id GROUP BY code, dir ORDER BY code;\"",
            "exit 0"
          ]}
          PARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09d7cabb5a42d1135" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/mysql-census.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135"
          echo "wait_exit=$?"
          echo "===== invocation status ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query '{Status:Status,ResponseCode:ResponseCode}' --output text
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardOutputContent' --output text
          echo "===== StandardErrorContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardErrorContent' --output text
          exit 0
