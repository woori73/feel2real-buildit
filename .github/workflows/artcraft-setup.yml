name: ArtCraft Setup (manual, operational)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  artcraft-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2

      - name: Upload CLI distribution to S3
        run: |
          set -euo pipefail
          ls -lh ops/artcraft/pdfcraft-cli-korean.tar.gz
          aws s3 cp ops/artcraft/pdfcraft-cli-korean.tar.gz s3://feel2real-buildit-deploy/artcraft/pdfcraft-cli-korean.tar.gz
          aws s3 ls s3://feel2real-buildit-deploy/artcraft/
          echo "Uploaded to S3"

      - name: Test SSM with simple command
        run: |
          set -euo pipefail
          PARAMS_JSON='{"commands":["echo hello-from-ec2","whoami","pwd"]}'
          CMD_ID=$(aws ssm send-command \
            --instance-ids i-09d7cabb5a42d1135 \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMS_JSON" \
            --query 'Command.CommandId' --output text)
          echo "CMD_ID=$CMD_ID"
          sleep 20
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'Status' --output text
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'StandardOutputContent' --output text
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'StandardErrorContent' --output text

      - name: Install CLI on EC2 via SSM
        run: |
          set -euo pipefail
          # Build SSM commands as a JSON array (one command per line for clarity)
          python3 << 'PYEOF' > /tmp/ssm_params.json
          import json
          commands = [
              "echo '=== Step 1: Create directories ==='",
              "sudo mkdir -p /opt/artcraft",
              "sudo mkdir -p /opt/artcraft/LICENSES",
              "sudo mkdir -p /opt/artcraft/fonts",
              "echo '=== Step 2: Download from S3 ==='",
              "aws s3 cp s3://feel2real-buildit-deploy/artcraft/pdfcraft-cli-korean.tar.gz /tmp/pdfcraft-cli-korean.tar.gz",
              "ls -lh /tmp/pdfcraft-cli-korean.tar.gz",
              "echo '=== Step 3: Extract ==='",
              "tar xzf /tmp/pdfcraft-cli-korean.tar.gz -C /tmp/",
              "ls -lh /tmp/pdfcraft-cli-korean/",
              "echo '=== Step 4: Install binary ==='",
              "sudo cp /tmp/pdfcraft-cli-korean/pdfcraft-cli /opt/artcraft/pdfcraft-cli",
              "sudo chmod +x /opt/artcraft/pdfcraft-cli",
              "echo '=== Step 5: Install license and font ==='",
              "sudo cp /tmp/pdfcraft-cli-korean/OFL-1.1.txt /opt/artcraft/LICENSES/",
              "sudo cp /tmp/pdfcraft-cli-korean/NotoSansKR-Variable.ttf /opt/artcraft/fonts/",
              "echo '=== Step 6: Test CLI ==='",
              "/opt/artcraft/pdfcraft-cli --version",
              "echo '=== Step 7: Storage directory ==='",
              "sudo mkdir -p /var/lib/feel2real/artcraft",
              "sudo chown ec2-user:ec2-user /var/lib/feel2real/artcraft",
              "sudo chmod 750 /var/lib/feel2real/artcraft",
              "sudo -u ec2-user touch /var/lib/feel2real/artcraft/.write-test && sudo -u ec2-user rm /var/lib/feel2real/artcraft/.write-test && echo 'write test OK'",
              "echo '=== Done ==='",
              "ls -lh /opt/artcraft/pdfcraft-cli",
              "ls -ld /var/lib/feel2real/artcraft",
          ]
          print(json.dumps({"commands": commands}))
          PYEOF
          PARAMS_JSON=$(cat /tmp/ssm_params.json)
          CMD_ID=$(aws ssm send-command \
            --instance-ids i-09d7cabb5a42d1135 \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMS_JSON" \
            --query 'Command.CommandId' --output text)
          echo "CMD_ID=$CMD_ID"
          for i in $(seq 1 20); do
            sleep 15
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'Status' --output text 2>&1)
            echo "status=$STATUS (attempt $i/20)"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done
          echo "===== STDOUT ====="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'StandardOutputContent' --output text 2>&1
          echo "===== STDERR ====="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'StandardErrorContent' --output text 2>&1
          FINAL=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'Status' --output text 2>&1)
          if [ "$FINAL" != "Success" ]; then
            echo "::error::SSM install failed: $FINAL"
            exit 1
          fi

      - name: Configure env and restart app
        run: |
          set -euo pipefail
          python3 << 'PYEOF' > /tmp/ssm_params2.json
          import json
          commands = [
              "echo '=== Set env var ==='",
              "grep -q '^ARTCRAFT_EDITOR_STORAGE_ROOT=' /etc/f2r/env 2>/dev/null && sudo sed -i 's|^ARTCRAFT_EDITOR_STORAGE_ROOT=.*|ARTCRAFT_EDITOR_STORAGE_ROOT=/var/lib/feel2real/artcraft|' /etc/f2r/env || echo 'ARTCRAFT_EDITOR_STORAGE_ROOT=/var/lib/feel2real/artcraft' | sudo tee -a /etc/f2r/env",
              "grep '^ARTCRAFT_EDITOR_STORAGE_ROOT=' /etc/f2r/env",
              "echo '=== Restart app ==='",
              "sudo systemctl restart f2r-app.service",
              "echo '=== Wait for health ==='",
              "for i in $(seq 1 24); do curl -sf http://localhost:8080/actuator/health && echo 'health UP' && break; echo \"waiting $i/24\"; sleep 10; done",
          ]
          print(json.dumps({"commands": commands}))
          PYEOF
          PARAMS_JSON=$(cat /tmp/ssm_params2.json)
          CMD_ID=$(aws ssm send-command \
            --instance-ids i-09d7cabb5a42d1135 \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMS_JSON" \
            --query 'Command.CommandId' --output text)
          echo "CMD_ID=$CMD_ID"
          for i in $(seq 1 25); do
            sleep 15
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'Status' --output text 2>&1)
            echo "status=$STATUS (attempt $i/25)"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done
          echo "===== STDOUT ====="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'StandardOutputContent' --output text 2>&1
          FINAL=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'Status' --output text 2>&1)
          if [ "$FINAL" != "Success" ]; then
            echo "::error::Restart failed: $FINAL"
            exit 1
          fi

      - name: Cleanup S3
        if: always()
        run: |
          aws s3 rm s3://feel2real-buildit-deploy/artcraft/pdfcraft-cli-korean.tar.gz || true
