name: Naesin registered originals read-only probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: naesin-original-read-probe
  cancel-in-progress: false
jobs:
  reread:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify registered original lengths and SHA without changing data
        env:
          LOGIN_ID: ${{ secrets.NEWSTART_SEED_ADMIN_LOGIN_ID }}
          LOGIN_PASSWORD: ${{ secrets.NEWSTART_SEED_ADMIN_PASSWORD }}
        run: python3 scripts/naesin/probe_registered_originals.py
