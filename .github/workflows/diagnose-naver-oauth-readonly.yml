name: Diagnose Naver OAuth (read-only, manual, temporary)

# 네이버 OAuth 로그인 상태 미반영 진단 전용(2026-09-20). READ ONLY다.
# 하지 않는 것: 배포, 서비스 restart, 파일 쓰기·삭제, DB 쓰기, secret 값 출력.
# - 환경변수는 "이름/존재/비어있음 여부"만 출력하고 값을 절대 출력하지 않는다.
# - MySQL 세션은 SET SESSION TRANSACTION READ ONLY로 시작하며 count/타임스탬프만 조회한다(PII 미노출).
# - journalctl은 naver|oauth 관련 행만 tail 해서 SSM 24000자 절단을 피한다.
# 진단 완료 후 제거하는 임시 워크플로우다.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2

      - name: Service/jar/env/outbound state via SSM (read-only)
        shell: bash
        run: |
          cat > /tmp/naver-diag-1.json <<'PARAMS'
          {"commands":[
            "set +e",
            "echo \"=== f2r-app active ===\"",
            "systemctl is-active f2r-app.service",
            "echo \"=== app.jar mtime/size ===\"",
            "ls -l /home/ec2-user/app.jar",
            "echo \"=== naver classes in jar (names only) ===\"",
            "unzip -l /home/ec2-user/app.jar | grep -oE 'Naver[A-Za-z]+\\.class' | sort -u",
            "echo \"=== NAVER env var presence (names/flags only, values NEVER printed) ===\"",
            "for v in NAVER_CLIENT_ID NAVER_CLIENT_SECRET NAVER_OAUTH_REDIRECT_URI; do if grep -qE \"^${v}=.+\" /etc/f2r/env; then echo \"${v}=SET_NONEMPTY\"; elif grep -qE \"^${v}=\" /etc/f2r/env; then echo \"${v}=SET_EMPTY\"; else echo \"${v}=ABSENT\"; fi; done",
            "echo \"=== env file var names only ===\"",
            "grep -oE '^[A-Z][A-Z0-9_]*=' /etc/f2r/env | sort -u",
            "echo \"=== outbound to naver token endpoint (http code only) ===\"",
            "curl -s -o /dev/null -w 'token_status_old_auth_host=%{http_code} time=%{time_total}\\n' --max-time 8 'https://auth.naver.com/oauth2.0/token'",
            "curl -s -o /dev/null -w 'token_status_nid=%{http_code} time=%{time_total}\\n' --max-time 8 'https://nid.naver.com/oauth2.0/token'",
            "curl -s -o /dev/null -w 'token_status_nid_v2=%{http_code} time=%{time_total}\\n' --max-time 8 'https://nid.naver.com/v2/oauth/token'",
            "echo \"=== DNS A/AAAA for naver hosts (addresses only) ===\"",
            "for h in auth.naver.com nid.naver.com openapi.naver.com; do echo \"$h A=$(getent ahostsv4 $h 2>/dev/null | awk '{print $1}' | sort -u | tr '\\n' ',') AAAA=$(getent ahostsv6 $h 2>/dev/null | awk '{print $1}' | sort -u | tr '\\n' ',')\"; done",
            "echo \"=== outbound to naver profile endpoint (http code only) ===\"",
            "curl -s -o /dev/null -w 'profile_status=%{http_code} time=%{time_total}\\n' --max-time 8 'https://openapi.naver.com/v1/nid/me'",
            "exit 0"
          ]}
          PARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09d7cabb5a42d1135" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/naver-diag-1.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135"
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardOutputContent' --output text
          exit 0

      - name: Naver journal lines via SSM (read-only)
        shell: bash
        run: |
          cat > /tmp/naver-diag-2.json <<'PARAMS'
          {"commands":[
            "set +e",
            "echo \"=== journal: naver/oauth lines (last 24h, tail 60) ===\"",
            "journalctl -u f2r-app.service --since '24 hours ago' --no-pager | grep -iE 'naver|oauth' | tail -60",
            "echo \"=== journal: warn/err lines (last 6h, tail 40) ===\"",
            "journalctl -u f2r-app.service --since '6 hours ago' --no-pager | grep -E ' WARN | ERROR ' | tail -40",
            "exit 0"
          ]}
          PARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09d7cabb5a42d1135" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/naver-diag-2.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135"
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardOutputContent' --output text
          exit 0

      - name: Social account DB counts via SSM (READ ONLY, counts only)
        shell: bash
        run: |
          cat > /tmp/naver-diag-3.json <<'PARAMS'
          {"commands":[
            "set +e",
            "source /etc/f2r/env 2>/dev/null || true",
            "mysql -h \"${DB_HOST}\" -P \"${DB_PORT}\" -u \"${DB_USER}\" -p\"${DB_PASSWORD}\" \"${DB_NAME}\" -e \"SET SESSION TRANSACTION READ ONLY; SELECT COUNT(*) AS social_accounts_total FROM user_social_accounts; SELECT provider, COUNT(*) AS cnt, MIN(created_at) AS first_created, MAX(created_at) AS last_created FROM user_social_accounts GROUP BY provider; SELECT COUNT(*) AS naver_prefixed_users FROM users WHERE login_id LIKE 'naver%';\" 2>&1 | grep -v 'Using a password' || echo \"mysql_exit=$?\"",
            "exit 0"
          ]}
          PARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09d7cabb5a42d1135" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/naver-diag-3.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135"
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardOutputContent' --output text
          exit 0

      # D1 (2026-09-20 academy): client_id/secret 페어 유효성 판별. 읽기 전용 — 로그인/인가코드 사용 없음,
      # 네이버 문서상 무상한 grant_type=client_credentials만 사용. 출력은 HTTP status·error 분류값·
      # access_token 존재 여부(YES/NO)뿐이며 id/secret/token/메시지 원문은 절대 출력하지 않는다.
      # 의도적으로 틀린 secret 대조군(control)으로 "엔드포인트가 실제 검증하는가"를 구분한다.
      # 진단 전용 임시 스텝 — OAuth E2E 확인 후 워크플로우 전체 제거 예정.
      - name: D1 credential validity probe via SSM (READ ONLY, categories only, NO secrets)
        shell: bash
        run: |
          cat > /tmp/naver-diag-6.json <<'PARAMS'
          {"commands":[
            "set +e",
            "source /etc/f2r/env 2>/dev/null || true",
            "echo '=== D1: naver client_credentials validity (classification only; id/secret/token/message NEVER printed) ==='",
            "REAL=$(printf 'grant_type=client_credentials&client_id=%s&client_secret=%s' \"$NAVER_CLIENT_ID\" \"$NAVER_CLIENT_SECRET\" | curl -s --max-time 10 -w '\\nHTTPSTATUS:%{http_code}' -X POST -H 'Content-Type: application/x-www-form-urlencoded;charset=utf-8' --data-binary @- 'https://nid.naver.com/oauth2.0/token')",
            "BOGUS=$(printf 'grant_type=client_credentials&client_id=%s&client_secret=not_a_real_secret_for_control' \"$NAVER_CLIENT_ID\" | curl -s --max-time 10 -w '\\nHTTPSTATUS:%{http_code}' -X POST -H 'Content-Type: application/x-www-form-urlencoded;charset=utf-8' --data-binary @- 'https://nid.naver.com/oauth2.0/token')",
            "echo '--- configured credentials: http status + error category + token presence only ---'",
            "printf '%s' \"$REAL\" | sed -nE 's/.*HTTPSTATUS:([0-9]+).*/configured_http=\\1/p'",
            "printf '%s' \"$REAL\" | grep -oE '\\\"(errorcode|error|resultcode)\\\"[[:space:]]*:[[:space:]]*\\\"?[A-Za-z0-9_.+-]+\\\"?' | head -3",
            "printf '%s' \"$REAL\" | grep -q access_token && echo configured_access_token_present=YES || echo configured_access_token_present=NO",
            "echo '--- control probe (deliberately wrong secret; rejection expected) ---'",
            "printf '%s' \"$BOGUS\" | sed -nE 's/.*HTTPSTATUS:([0-9]+).*/control_http=\\1/p'",
            "printf '%s' \"$BOGUS\" | grep -oE '\\\"(errorcode|error|resultcode)\\\"[[:space:]]*:[[:space:]]*\\\"?[A-Za-z0-9_.+-]+\\\"?' | head -3",
            "printf '%s' \"$BOGUS\" | grep -q access_token && echo control_access_token_present=YES || echo control_access_token_present=NO",
            "exit 0"
          ]}
          PARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09d7cabb5a42d1135" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/naver-diag-6.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135"
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardOutputContent' --output text
          exit 0
