name: Diagnose Naver OAuth (read-only, manual, temporary)

# 네이버 OAuth 로그인 상태 미반영 진단 전용(2026-09-20). READ ONLY다.
# 하지 않는 것: 배포, 서비스 restart, 파일 쓰기·삭제, DB 쓰기, secret 값 출력.
# - 환경변수는 "이름/존재/비어있음 여부"만 출력하고 값을 절대 출력하지 않는다.
# - MySQL 세션은 SET SESSION TRANSACTION READ ONLY로 시작하며 count/타임스탬프만 조회한다(PII 미노출).
# - journalctl은 naver|oauth 관련 행만 tail 해서 SSM 24000자 절단을 피한다.
# 진단 완료 후 제거하는 임시 워크플로우다.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2

      - name: Service/jar/env/outbound state via SSM (read-only)
        shell: bash
        run: |
          cat > /tmp/naver-diag-1.json <<'PARAMS'
          {"commands":[
            "set +e",
            "echo \"=== f2r-app active ===\"",
            "systemctl is-active f2r-app.service",
            "echo \"=== app.jar mtime/size ===\"",
            "ls -l /home/ec2-user/app.jar",
            "echo \"=== naver classes in jar (names only) ===\"",
            "unzip -l /home/ec2-user/app.jar | grep -oE 'Naver[A-Za-z]+\\.class' | sort -u",
            "echo \"=== NAVER env var presence (names/flags only, values NEVER printed) ===\"",
            "for v in NAVER_CLIENT_ID NAVER_CLIENT_SECRET NAVER_OAUTH_REDIRECT_URI; do if grep -qE \"^${v}=.+\" /etc/f2r/env; then echo \"${v}=SET_NONEMPTY\"; elif grep -qE \"^${v}=\" /etc/f2r/env; then echo \"${v}=SET_EMPTY\"; else echo \"${v}=ABSENT\"; fi; done",
            "echo \"=== env file var names only ===\"",
            "grep -oE '^[A-Z][A-Z0-9_]*=' /etc/f2r/env | sort -u",
            "echo \"=== outbound to naver token endpoint (http code only) ===\"",
            "curl -s -o /dev/null -w 'token_status_old_auth_host=%{http_code} time=%{time_total}\\n' --max-time 8 'https://auth.naver.com/oauth2.0/token'",
            "curl -s -o /dev/null -w 'token_status_nid=%{http_code} time=%{time_total}\\n' --max-time 8 'https://nid.naver.com/oauth2.0/token'",
            "curl -s -o /dev/null -w 'token_status_nid_v2=%{http_code} time=%{time_total}\\n' --max-time 8 'https://nid.naver.com/v2/oauth/token'",
            "echo \"=== DNS A/AAAA for naver hosts (addresses only) ===\"",
            "for h in auth.naver.com nid.naver.com openapi.naver.com; do echo \"$h A=$(getent ahostsv4 $h 2>/dev/null | awk '{print $1}' | sort -u | tr '\\n' ',') AAAA=$(getent ahostsv6 $h 2>/dev/null | awk '{print $1}' | sort -u | tr '\\n' ',')\"; done",
            "echo \"=== outbound to naver profile endpoint (http code only) ===\"",
            "curl -s -o /dev/null -w 'profile_status=%{http_code} time=%{time_total}\\n' --max-time 8 'https://openapi.naver.com/v1/nid/me'",
            "exit 0"
          ]}
          PARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09d7cabb5a42d1135" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/naver-diag-1.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135"
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardOutputContent' --output text
          exit 0

      - name: Naver journal lines via SSM (read-only)
        shell: bash
        run: |
          cat > /tmp/naver-diag-2.json <<'PARAMS'
          {"commands":[
            "set +e",
            "echo \"=== journal: naver/oauth lines (last 24h, tail 60) ===\"",
            "journalctl -u f2r-app.service --since '24 hours ago' --no-pager | grep -iE 'naver|oauth' | tail -60",
            "echo \"=== journal: warn/err lines (last 6h, tail 40) ===\"",
            "journalctl -u f2r-app.service --since '6 hours ago' --no-pager | grep -E ' WARN | ERROR ' | tail -40",
            "exit 0"
          ]}
          PARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09d7cabb5a42d1135" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/naver-diag-2.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135"
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardOutputContent' --output text
          exit 0

      - name: Social account DB counts via SSM (READ ONLY, counts only)
        shell: bash
        run: |
          cat > /tmp/naver-diag-3.json <<'PARAMS'
          {"commands":[
            "set +e",
            "source /etc/f2r/env 2>/dev/null || true",
            "mysql -h \"${DB_HOST}\" -P \"${DB_PORT}\" -u \"${DB_USER}\" -p\"${DB_PASSWORD}\" \"${DB_NAME}\" -e \"SET SESSION TRANSACTION READ ONLY; SELECT COUNT(*) AS social_accounts_total FROM user_social_accounts; SELECT provider, COUNT(*) AS cnt, MIN(created_at) AS first_created, MAX(created_at) AS last_created FROM user_social_accounts GROUP BY provider; SELECT COUNT(*) AS naver_prefixed_users FROM users WHERE login_id LIKE 'naver%';\" 2>&1 | grep -v 'Using a password' || echo \"mysql_exit=$?\"",
            "exit 0"
          ]}
          PARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09d7cabb5a42d1135" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/naver-diag-3.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135"
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardOutputContent' --output text
          exit 0

      - name: E2E verification (READ ONLY, aggregates only, NO PII)
        shell: bash
        run: |
          cat > /tmp/naver-diag-4.json <<'PARAMS'
          {"commands":[
            "set +e",
            "source /etc/f2r/env 2>/dev/null || true",
            "echo '=== 1. social accounts by provider with created window (counts/ts, NO ids) ==='",
            "mysql -h \"${DB_HOST}\" -P \"${DB_PORT}\" -u \"${DB_USER}\" -p\"${DB_PASSWORD}\" \"${DB_NAME}\" -e \"SET SESSION TRANSACTION READ ONLY; SELECT provider, COUNT(*) AS cnt, MIN(created_at) AS first_created, MAX(created_at) AS last_created FROM user_social_accounts GROUP BY provider;\" 2>&1 | grep -v 'Using a password' || true",
            "echo '=== 2. totals: social total + created since 2026-09-19 00:00 ==='",
            "mysql -h \"${DB_HOST}\" -P \"${DB_PORT}\" -u \"${DB_USER}\" -p\"${DB_PASSWORD}\" \"${DB_NAME}\" -e \"SET SESSION TRANSACTION READ ONLY; SELECT COUNT(*) AS social_total, SUM(created_at >= '2026-09-19 00:00:00') AS social_created_since FROM user_social_accounts;\" 2>&1 | grep -v 'Using a password' || true",
            "echo '=== 3. users created since 2026-09-19 00:00 by role (STUDENT expected, ADMIN must be 0) ==='",
            "mysql -h \"${DB_HOST}\" -P \"${DB_PORT}\" -u \"${DB_USER}\" -p\"${DB_PASSWORD}\" \"${DB_NAME}\" -e \"SET SESSION TRANSACTION READ ONLY; SELECT role, COUNT(*) AS cnt FROM users WHERE created_at >= '2026-09-19 00:00:00' GROUP BY role;\" 2>&1 | grep -v 'Using a password' || true",
            "echo '=== 4. naver_ login_id users by role ==='",
            "mysql -h \"${DB_HOST}\" -P \"${DB_PORT}\" -u \"${DB_USER}\" -p\"${DB_PASSWORD}\" \"${DB_NAME}\" -e \"SET SESSION TRANSACTION READ ONLY; SELECT u.role, COUNT(*) AS cnt FROM users u WHERE u.login_id LIKE 'naver\\\\_%' GROUP BY u.role;\" 2>&1 | grep -v 'Using a password' || true",
            "echo '=== 5. one-connection-per-user invariant (expect no rows) ==='",
            "mysql -h \"${DB_HOST}\" -P \"${DB_PORT}\" -u \"${DB_USER}\" -p\"${DB_PASSWORD}\" \"${DB_NAME}\" -e \"SET SESSION TRANSACTION READ ONLY; SELECT user_id, COUNT(*) c FROM user_social_accounts WHERE provider='NAVER' GROUP BY user_id HAVING c > 1;\" 2>&1 | grep -v 'Using a password' || true",
            "echo '=== 6. journal since 2026-09-20 00:00 UTC: naver|oauth|callback lines tail 40 ==='",
            "journalctl -u f2r-app.service --since '2026-09-20 00:00:00' --no-pager | grep -iE 'naver|oauth|callback' | tail -40 || echo 'no naver/oauth/callback journal lines in window'",
            "echo '=== 7. journal last 30 minutes: WARN|ERROR tail 40 ==='",
            "journalctl -u f2r-app.service --since '30 minutes ago' --no-pager | grep -E ' WARN | ERROR ' | tail -40 || echo 'no warn/error lines in last 30 minutes'",
            "echo '=== 8. f2r-app active + pid start ==='",
            "systemctl is-active f2r-app.service",
            "systemctl show f2r-app.service -p MainPID -p ActiveEnterTimestamp",
            "exit 0"
          ]}
          PARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09d7cabb5a42d1135" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/naver-diag-4.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135"
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardOutputContent' --output text
          exit 0

      - name: E2E forensics (READ ONLY, jar endpoints + callback arrival counts, NO PII)
        shell: bash
        run: |
          cat > /tmp/naver-diag-5.json <<'PARAMS'
          {"commands":[
            "set +e",
            "echo \"=== service start time + main pid ===\"",
            "systemctl show f2r-app.service -p ActiveEnterTimestamp -p MainPID -p ExecMainStartTimestamp",
            "echo \"=== jar mtime ===\"",
            "ls -l --time-style=full-iso /home/ec2-user/app.jar",
            "echo \"=== endpoint URLs baked into RUNNING jar class (URL strings only, no secrets) ===\"",
            "unzip -p /home/ec2-user/app.jar 'BOOT-INF/classes/f2r/tutor_solution/private_tutor_solution_back/domain/user/social/NaverOAuthClient.class' | tr -c '[:print:]' '\\n' | grep -oE 'https://[A-Za-z0-9./_-]+' | sort -u",
            "echo \"=== proxy presence ===\"",
            "systemctl is-active nginx httpd 2>/dev/null; ls /etc/nginx/nginx.conf /etc/httpd/conf/httpd.conf 2>/dev/null",
            "echo \"=== oauth/naver request arrivals (ts, path-without-query, status; last 40) ===\"",
            "for f in /var/log/nginx/access.log /var/log/nginx/access.log.* /var/log/httpd/access_log /var/log/httpd/access_log.*; do [ -f \"$f\" ] && grep -hE 'GET /oauth/naver' \"$f\" 2>/dev/null; done | awk '{split($7,a,\"?\"); print $4, a[1], $9}' | tail -40",
            "echo \"=== arrival counts by path+status (aggregates) ===\"",
            "for f in /var/log/nginx/access.log /var/log/nginx/access.log.* /var/log/httpd/access_log /var/log/httpd/access_log.*; do [ -f \"$f\" ] && grep -hE 'GET /oauth/naver' \"$f\" 2>/dev/null; done | awk '{split($7,a,\"?\"); print a[1], $9}' | sort | uniq -c",
            "exit 0"
          ]}
          PARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09d7cabb5a42d1135" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/naver-diag-5.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135"
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardOutputContent' --output text
          exit 0

      - name: Front chain + env hygiene probe (READ ONLY, lengths/flags only, NO values)
        shell: bash
        run: |
          echo "=== public DNS of feel2real.co.kr (runner-side) ==="
          getent hosts feel2real.co.kr || true
          cat > /tmp/naver-diag-6.json <<'PARAMS'
          {"commands":[
            "set +e",
            "echo \"=== listening sockets (port + process name only) ===\"",
            "ss -tlnp | awk '{print $1, $4, $6, $7}'",
            "echo \"=== running services ===\"",
            "systemctl list-units --type=service --state=running --no-pager --plain | tail -30",
            "echo \"=== nft/iptables NAT redirection ===\"",
            "nft list ruleset 2>/dev/null | grep -E 'redirect|dnat' | head -30; iptables -t nat -S 2>/dev/null | grep -E 'REDIRECT|DNAT' | head -30",
            "echo \"=== NAVER env hygiene: len/cr/ws flags ONLY (values NEVER printed) ===\"",
            "while IFS='=' read -r k v; do case \"$k\" in NAVER_*) cr=$(printf '%s' \"$v\" | tr -dc '\\r' | wc -c); ws=$(printf '%s' \"$v\" | tr -cd ' \\t' | wc -c); echo \"${k}_len=${#v} ${k}_cr=${cr} ${k}_ws=${ws}\";; esac; done < /etc/f2r/env",
            "echo \"=== redirect_uri scheme+host only (path hidden) ===\"",
            "grep -E '^NAVER_OAUTH_REDIRECT_URI=' /etc/f2r/env | sed -E 's#^(NAVER_OAUTH_REDIRECT_URI=https?://[^/]+).*#\\1#'",
            "exit 0"
          ]}
          PARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09d7cabb5a42d1135" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/naver-diag-6.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135"
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardOutputContent' --output text
          exit 0

      - name: Public front-chain probe (runner-side curl, headers/markers only, NO secret values)
        shell: bash
        run: |
          set +e
          echo "=== this instance public IP ==="
          aws ec2 describe-instances --filters "Name=private-ip-address,Values=172.31.11.91" "Name=instance-state-name,Values=running" --query "Reservations[].Instances[].[InstanceId,PublicIpAddress]" --output text
          echo "=== ELBs in region ==="
          aws elbv2 describe-load-balancers --query "LoadBalancers[].[LoadBalancerName,Type,DNSName]" --output text 2>&1 | head -5
          echo "=== CloudFront distributions ==="
          aws cloudfront list-distributions --query "DistributionList.Items[].[Id,DomainName,Aliases.Items]" --output text 2>&1 | head -5
          echo "=== GET /oauth/naver/start via public URL (status + Location with ids redacted + cookie attr names) ==="
          HDRS=$(curl -s -o /dev/null -D - --max-time 10 "https://feel2real.co.kr/oauth/naver/start?returnUrl=%2Fnewstart%2Fchat")
          echo "$HDRS" | grep -iE "^HTTP/"
          echo "$HDRS" | grep -i "^location:" | sed -E "s/state=[^&]+/state=REDACTED/; s/client_id=[^&]+/client_id=REDACTED/" | cut -c1-160
          echo "$HDRS" | grep -i "^set-cookie:" | sed -E "s/=[^;]*/=<present>/g" | cut -c1-220
          echo "=== GET /oauth/naver/callback junk params via public URL (302 target proves route reachable through front chain) ==="
          curl -s -o /dev/null -D - --max-time 10 "https://feel2real.co.kr/oauth/naver/callback?code=probe&state=probe" | grep -iE "^HTTP/|^location:|^server:|^via:|^x-cache" | cut -c1-160
          exit 0

      - name: Public callback chain repro (runner curl + cookie jar, markers only, NO state values)
        shell: bash
        run: |
          set +e
          JAR=/tmp/naver-repro.jar
          BASE=https://feel2real.co.kr
          HDRS=$(curl -s -c "$JAR" -o /dev/null -D - --max-time 10 "$BASE/oauth/naver/start?returnUrl=%2Fnewstart%2Fchat")
          echo "--- start Set-Cookie attrs for NAVER_OAUTH_STATE (value hidden) ---"
          echo "$HDRS" | grep -i "^set-cookie: NAVER_OAUTH_STATE" | sed -E "s/NAVER_OAUTH_STATE=[^;]+/NAVER_OAUTH_STATE=<hidden>/I"
          STATE=$(echo "$HDRS" | grep -i "^location:" | grep -oE "state=[^&]+" | cut -c7- | head -1)
          echo "state_len=${#STATE}"
          echo "--- WITH cookie jar + invalid code (state expected VALID, exchange expected to fail at Naver => login=naver_failed marker on signed returnUrl) ---"
          curl -s -b "$JAR" -o /dev/null -D - --max-time 15 "$BASE/oauth/naver/callback?code=repro_invalid_code&state=$STATE" | grep -iE "^HTTP/|^location:"
          echo "--- WITHOUT cookie (control: expect login=naver_invalid_state) ---"
          curl -s -o /dev/null -D - --max-time 15 "$BASE/oauth/naver/callback?code=repro_invalid_code&state=$STATE" | grep -iE "^HTTP/|^location:"
          exit 0
