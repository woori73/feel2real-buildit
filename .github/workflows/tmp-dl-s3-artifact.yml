name: Tmp Download S3 Artifact
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  dl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2
      - name: Download from S3
        run: |
          aws s3 cp s3://f2r-tutor-uploads-prd-067573916809-ap-northeast-2-an/tmp/embedding/docs.jsonl ./docs.jsonl
          ls -lh ./docs.jsonl
          wc -l ./docs.jsonl
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-jsonl
          path: ./docs.jsonl
          retention-days: 1
