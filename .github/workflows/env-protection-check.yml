name: Environment protection check (one-time, no AWS)
# Environment f2r-infra-build 보호 설정 검증 전용(AWS 접근·시크릿 없음).
# - 비-main 브랜치 실행: 배포 브랜치 제한으로 Environment 단계에서 막혀야 한다(이 job 의 step 은 실행되지 않음).
# - main 실행: Required reviewers 승인 대기 후, 승인하면 아래 step 이 실행된다.
on:
  push:
    branches: ['main', 'ci/env-protection-check']
    paths: ['.github/workflows/env-protection-check.yml']
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  # 대조군: Environment 없이 같은 ref 에서 같은 실행(run) 안에 돈다. 이 job 이 실행되면 브랜치·러너·워크플로 자체는 정상이다.
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Control ran (no environment)
        run: echo "CONTROL-RAN ref=${GITHUB_REF}"
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: f2r-infra-build
    steps:
      - name: Reached (only after environment protection rules pass)
        shell: bash
        run: |
          echo "ENV-PROTECTION-CHECK-REACHED ref=${GITHUB_REF}"
          python3 -I - <<'PY'
          import base64, json, os, sys, urllib.request
          try:
              url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=sts.amazonaws.com'
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
              jwt = json.load(urllib.request.urlopen(req, timeout=20))['value']
              print('::add-mask::' + jwt)
              p = jwt.split('.')[1]
              c = json.loads(base64.urlsafe_b64decode(p + '=' * (-len(p) % 4)))
              for k in ['sub', 'environment', 'ref', 'job_workflow_ref', 'event_name']:
                  print(k, '=', c.get(k, '<absent>'))
          except Exception as e:
              print('claims check failed:', type(e).__name__); sys.exit(1)
          PY
