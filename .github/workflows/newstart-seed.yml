name: CSAT DAY-1 production seed (writes legacy app.db via API, manual)

# PR #430에 머지된 fixture/scripts를 그대로 운영에 시드한다(재생성 없음).
# 실행 경로: S3 bundle 업로드 → SSM(서버)에서 127.0.0.1:8000 API + 서명 identity(ADMIN)로
# register_csat_day1 → seed_csat_dna_day1 → seed_csat_expert_lee 실행 → read-only counts 출력.
# 원본 PDF가 서버에 없어 resource 7건은 skip되고(PDF SOURCE 미완료 유지), 나머지만 등록된다.
# 스크립트들은 멱등(존재 시 skip)이라 재실행 안전.

concurrency:
  group: csat-day1-production-seed
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: SEED를 실행하려면 정확히 SEED 입력
        required: true
        default: DRY

permissions:
  id-token: write
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event.inputs.confirm == 'SEED'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2

      - name: Bundle merged fixtures + scripts + runner
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage/wiki-backend-src
          cp -R problem-generator/wiki-backend-src/scripts /tmp/stage/wiki-backend-src/scripts
          mkdir -p /tmp/stage/wiki-backend-src/fixtures
          cp -R problem-generator/wiki-backend-src/fixtures/csat_day1 /tmp/stage/wiki-backend-src/fixtures/csat_day1
          cp .github/csat-seed/prod_seed_runner.py /tmp/stage/prod_seed_runner.py
          tar -czf "/tmp/csat-day1-seed-${GITHUB_RUN_ID}.tgz" -C /tmp/stage .
          ls -l "/tmp/csat-day1-seed-${GITHUB_RUN_ID}.tgz"

      - name: Upload bundle to S3
        run: |
          set -euo pipefail
          aws s3 cp "/tmp/csat-day1-seed-${GITHUB_RUN_ID}.tgz" "s3://feel2real-buildit-deploy/csat-day1-seed-${GITHUB_RUN_ID}.tgz"

      - name: Run seed on server via SSM
        id: seed
        run: |
          set -euo pipefail
          INSTANCE_ID="i-09d7cabb5a42d1135"
          OBJECT="s3://feel2real-buildit-deploy/csat-day1-seed-${GITHUB_RUN_ID}.tgz"
          REMOTE=$(sed "s|__OBJECT__|${OBJECT}|" .github/csat-seed/remote_seed.sh)
          params=$(jq -cn --arg command "$REMOTE" '{commands:[$command]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name "AWS-RunShellScript" --parameters "$params" --query 'Command.CommandId' --output text)
          echo "command_id=$COMMAND_ID"
          STATUS=Pending
          for i in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text 2>/dev/null || echo Pending)
            echo "poll $i status=$STATUS"
            case "$STATUS" in Pending|InProgress|Delivered|Downloading|Running) sleep 10;; *) break;; esac
          done
          echo "$STATUS" > /tmp/seed_status.txt
          echo '--- stdout ---'
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text
          echo '--- stderr ---'
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'StandardErrorContent' --output text || true
          grep -q '^Success' /tmp/seed_status.txt

      - name: Remove bundle from S3
        if: always()
        run: |
          set -euo pipefail
          aws s3 rm "s3://feel2real-buildit-deploy/csat-day1-seed-${GITHUB_RUN_ID}.tgz" || true
