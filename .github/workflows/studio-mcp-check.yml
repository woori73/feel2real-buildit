name: Studio and MCP isolated checks
on:
  pull_request:
    paths:
      - 'src/main/java/**/studio/**'
      - 'src/main/java/**/mcp/**'
      - 'src/main/java/**/config/security/McpReadOnlyTransactionFilter.java'
      - 'src/main/resources/mcp/**'
      - 'src/main/resources/studio/**'
      - 'scripts/ai-agent-studio/import-production.py'
      - 'src/main/resources/db/migration/*studio*'
      - 'src/test/java/**/studio/**'
      - 'src/test/java/**/mcp/**'
      - 'problem-generator/wiki-backend-src/backend/workspace.py'
      - 'problem-generator/wiki-backend-src/tests/test_mcp_readonly.py'
      - '.github/workflows/studio-mcp-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: f2r_studio_test
          MYSQL_USER: f2r_test
          MYSQL_PASSWORD: isolated_test_password
          MYSQL_ROOT_PASSWORD: isolated_test_root
        ports:
          - 3318:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      F2R_STUDIO_MYSQL_TEST: 'true'
      F2R_PRODUCTION_SOURCE: /tmp/f2r-production-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare pinned production originals for isolated importer regression
        run: |
          git fetch origin 09d62dee982e2e89e3653c90b1ee42f05bff4f9d
          python scripts/ai-agent-studio/import-production.py --extract-to /tmp/f2r-production-source --receipt /tmp/f2r-source-dry-run.json
      - run: bash gradlew test --no-daemon --tests '*StudioServiceTest' --tests '*StudioPreviewTest' --tests '*StudioCollaborationMySqlTest' --tests '*StudioProductionImportMySqlTest' --tests '*StudioUploadRollbackMySqlTest' --tests '*FlywayStackUpgradeMySqlTest' --tests '*Mcp*Test' --tests '*JwtTokenProviderTest' --tests '*SiteVisitFilterTest' --tests '*WikiMemberOnlySecurityIntegrationTest' bootJar
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r problem-generator/wiki-backend-src/requirements.txt pytest httpx
      - run: python -m pytest problem-generator/wiki-backend-src/tests/test_workspace_isolation.py problem-generator/wiki-backend-src/tests/test_mcp_readonly.py -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-mcp-test-reports
          path: build/reports/tests/test
          retention-days: 7
