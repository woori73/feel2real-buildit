# TEMPORARY - EmbeddingGemma vector indexing (one-time). Delete after completion.
# paths-ignore 대상이라 Build/Deploy를 실행하지 않는다.
# DB 쓰기: newstart_knowledge_embedding 테이블에만 INSERT (원문 테이블 변경 없음).
name: Tmp Embedding Index (one-time)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  S3_BUCKET: f2r-tutor-uploads-prd-067573916809-ap-northeast-2-an
  S3_DOCS: s3://f2r-tutor-uploads-prd-067573916809-ap-northeast-2-an/tmp/embedding/docs.jsonl
  S3_VECTORS: s3://f2r-tutor-uploads-prd-067573916809-ap-northeast-2-an/tmp/embedding/vectors.bin

jobs:
  export-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2
      - name: Export ACTIVE docs via SSM
        run: |
          set -euo pipefail
          SSM_BODY=$(cat <<'SSMEOF'
          source /etc/f2r/env
          mysql -h "$DB_HOST" -P "${DB_PORT:-3306}" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" \
            --batch --skip-column-names --raw \
            -e "SELECT JSON_OBJECT('knowledgeId', knowledge_id, 'title', title, 'summary', summary, 'content', LEFT(content, 6000)) FROM newstart_knowledge_items WHERE status='ACTIVE' ORDER BY knowledge_id" \
            > /tmp/docs.jsonl
          wc -l /tmp/docs.jsonl
          aws s3 cp /tmp/docs.jsonl s3://f2r-tutor-uploads-prd-067573916809-ap-northeast-2-an/tmp/embedding/docs.jsonl
          SSMEOF
          )
          SSM_SCRIPT=$(printf 'set -euo pipefail\n%s\n' "$SSM_BODY")
          PARAMS_JSON=$(python3 -c 'import json,sys; print(json.dumps({"commands": sys.stdin.read().splitlines()}))' <<< "$SSM_SCRIPT")
          CMD_ID=$(aws ssm send-command --instance-ids i-09d7cabb5a42d1135 --document-name AWS-RunShellScript --parameters "$PARAMS_JSON" --query 'Command.CommandId' --output text)
          for i in $(seq 1 20); do sleep 15
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'Status' --output text)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'StandardOutputContent' --output text
          FINAL=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'Status' --output text)
          [ "$FINAL" = "Success" ] || exit 1

  compute-embeddings:
    needs: export-docs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2
      - name: Download docs
        run: aws s3 cp "$S3_DOCS" /tmp/docs.jsonl && wc -l /tmp/docs.jsonl
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install torch transformers numpy --index-url https://download.pytorch.org/whl/cpu
      - name: Compute embeddings
        run: |
          cat > /tmp/embed.py << 'PYEOF'
          import json, struct, numpy as np, torch
          from transformers import AutoTokenizer, AutoModel
          MODEL = "google/embeddinggemma-2"
          print("loading model...", flush=True)
          tok = AutoTokenizer.from_pretrained(MODEL, trust_remote_code=True)
          model = AutoModel.from_pretrained(MODEL, trust_remote_code=True)
          model.eval()
          print("model loaded", flush=True)
          docs = [json.loads(l) for l in open("/tmp/docs.jsonl") if l.strip()]
          print(f"docs: {len(docs)}", flush=True)
          out = open("/tmp/vectors.bin", "wb")
          # header: count (4 bytes) + dim (4 bytes)
          out.write(struct.pack("<II", len(docs), 768))
          for i in range(0, len(docs), 16):
              batch = docs[i:i+16]
              texts = []
              for d in batch:
                  parts = [d.get("title") or ""]
                  if d.get("summary"): parts.append(d["summary"])
                  if d.get("content"): parts.append(d["content"])
                  texts.append("\n".join(parts))
              inputs = tok(texts, padding=True, truncation=True, max_length=2048, return_tensors="pt")
              with torch.no_grad():
                  outputs = model(**inputs)
                  # mean pooling with attention mask, then L2 normalize
                  mask = inputs["attention_mask"].unsqueeze(-1).float()
                  emb = (outputs.last_hidden_state * mask).sum(1) / mask.sum(1).clamp(min=1e-9)
                  emb = torch.nn.functional.normalize(emb, p=2, dim=1)
              arr = emb.numpy().astype("<f4")
              for j, d in enumerate(batch):
                  out.write(struct.pack("<q", d["knowledgeId"]))
                  out.write(arr[j].tobytes())
              if (i // 16) % 10 == 0:
                  print(f"  {i}/{len(docs)}", flush=True)
          out.close()
          print("done", flush=True)
          PYEOF
          python3 /tmp/embed.py
      - name: Upload vectors
        run: aws s3 cp /tmp/vectors.bin "$S3_VECTORS" && aws s3 ls "$S3_VECTORS"

  load-vectors:
    needs: compute-embeddings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2
      - name: Load vectors to DB via SSM
        run: |
          set -euo pipefail
          SSM_BODY=$(cat <<'SSMEOF'
          source /etc/f2r/env
          aws s3 cp s3://f2r-tutor-uploads-prd-067573916809-ap-northeast-2-an/tmp/embedding/vectors.bin /tmp/vectors.bin
          ls -lh /tmp/vectors.bin
          cat > /tmp/load_vectors.py << 'PYEOF'
          import struct, subprocess, os
          # read vectors
          with open("/tmp/vectors.bin", "rb") as f:
              count, dim = struct.unpack("<II", f.read(8))
              print(f"vectors: {count}, dim: {dim}", flush=True)
              assert dim == 768
              rows = []
              for _ in range(count):
                  kid = struct.unpack("<q", f.read(8))[0]
                  vec = f.read(dim * 4)
                  rows.append((kid, vec))
          # insert via mysql using hex
          env = {}
          for ln in open("/etc/f2r/env"):
              ln = ln.strip()
              if ln and not ln.startswith("#") and "=" in ln:
                  k, v = ln.split("=", 1)
                  env[k.strip()] = v.strip().strip("'\"")
          # write to temp SQL file in chunks to avoid command length limits
          with open("/tmp/vectors.sql", "w") as out:
              out.write("INSERT INTO newstart_knowledge_embedding (knowledge_id, embedding, model_version) VALUES\n")
              for i, (kid, vec) in enumerate(rows):
                  hexvec = vec.hex()
                  out.write(f"({kid}, UNHEX('{hexvec}'), 'embeddinggemma-2')")
                  out.write(",\n" if i < len(rows) - 1 else "\n")
              out.write("ON DUPLICATE KEY UPDATE embedding=VALUES(embedding), model_version=VALUES(model_version);\n")
          print("sql written", flush=True)
          PYEOF
          python3 /tmp/load_vectors.py
          mysql -h "$DB_HOST" -P "${DB_PORT:-3306}" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" < /tmp/vectors.sql
          mysql -h "$DB_HOST" -P "${DB_PORT:-3306}" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" -e "SELECT COUNT(*) FROM newstart_knowledge_embedding;"
          rm -f /tmp/vectors.bin /tmp/vectors.sql /tmp/docs.jsonl
          SSMEOF
          )
          SSM_SCRIPT=$(printf 'set -euo pipefail\n%s\n' "$SSM_BODY")
          PARAMS_JSON=$(python3 -c 'import json,sys; print(json.dumps({"commands": sys.stdin.read().splitlines()}))' <<< "$SSM_SCRIPT")
          CMD_ID=$(aws ssm send-command --instance-ids i-09d7cabb5a42d1135 --document-name AWS-RunShellScript --parameters "$PARAMS_JSON" --query 'Command.CommandId' --output text)
          for i in $(seq 1 20); do sleep 15
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'Status' --output text)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'StandardOutputContent' --output text
          FINAL=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'Status' --output text)
          [ "$FINAL" = "Success" ] || exit 1
