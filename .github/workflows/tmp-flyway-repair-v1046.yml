name: Flyway repair V1046 (one-off, manual)

# 일회성: 운영 DB flyway_schema_history의 V1046 FAILED 기록 제거용.
# - workflow_dispatch 수동 실행만. main에 머지하지 않는다. (tmp- prefix: 자동배포 제외)
# - mode=precheck: 읽기 전용 상태 확인. 결과는 ::notice:: 로 보고 (Checks API annotations).
# - mode=repair: FAILED가 V1046 단건일 때만 flyway repair 실행.
# - DB credential은 EC2의 /etc/f2r/env에서 로드하며 로그에 절대 출력하지 않는다.
# - 수동 INSERT/UPDATE/DELETE 없음. repair만 수행.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'precheck (읽기전용) 또는 repair (V1046 FAILED 제거)'
        required: true
        default: 'precheck'
        type: choice
        options:
          - precheck
          - repair

permissions:
  id-token: write
  contents: read

jobs:
  flyway-repair-v1046:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2

      - name: Run via SSM
        id: ssm
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          INSTANCE_ID="i-09d7cabb5a42d1135"

          if [ "$MODE" = "precheck" ]; then
            SSM_BODY=$(cat <<'SSMEOF'
          set -euo pipefail
          source /etc/f2r/env
          echo "===== flyway V1045/V1046 status ====="
          mysql -h "$DB_HOST" -P "${DB_PORT:-3306}" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" -e "SELECT installed_rank, version, description, success, installed_on FROM flyway_schema_history WHERE version IN ('1045','1046') ORDER BY version;"
          echo "===== all FAILED rows (success=0) ====="
          mysql -h "$DB_HOST" -P "${DB_PORT:-3306}" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" -e "SELECT installed_rank, version, description, success, installed_on FROM flyway_schema_history WHERE success = 0 ORDER BY version;"
          echo "===== newstart_official_updates row count ====="
          mysql -h "$DB_HOST" -P "${DB_PORT:-3306}" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" -e "SELECT COUNT(*) AS cnt FROM newstart_official_updates;"
          echo "===== V1046 5 keys presence ====="
          mysql -h "$DB_HOST" -P "${DB_PORT:-3306}" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" -e "SELECT dedup_key, review_status, published_at, title FROM newstart_official_updates WHERE dedup_key IN ('DOC:FSC:fsc-86357','DOC:FSC:fsc-87188','DOC:PUBLIC_AGENCY:credit-info-enf-decree-appx2-4-20260811','TITLE_DATE:NEWSTART_FUND:새출발기금 채무조정 신청 현황(26.8월말 기준):2026-09-18','URL:https://www.kamco.or.kr/portal/contents.do?mId=0203030000');"
          echo "===== summary ====="
          V1046_S=$(mysql -h "$DB_HOST" -P "${DB_PORT:-3306}" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" -N -e "SELECT success FROM flyway_schema_history WHERE version='1046' ORDER BY installed_rank DESC LIMIT 1;")
          V1045_S=$(mysql -h "$DB_HOST" -P "${DB_PORT:-3306}" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" -N -e "SELECT success FROM flyway_schema_history WHERE version='1045' ORDER BY installed_rank DESC LIMIT 1;")
          FAILED_LIST=$(mysql -h "$DB_HOST" -P "${DB_PORT:-3306}" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" -N -e "SELECT GROUP_CONCAT(version ORDER BY version SEPARATOR '-') FROM flyway_schema_history WHERE success = 0;")
          ROWS=$(mysql -h "$DB_HOST" -P "${DB_PORT:-3306}" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" -N -e "SELECT COUNT(*) FROM newstart_official_updates;")
          KEYS=$(mysql -h "$DB_HOST" -P "${DB_PORT:-3306}" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" -N -e "SELECT COUNT(*) FROM newstart_official_updates WHERE dedup_key IN ('DOC:FSC:fsc-86357','DOC:FSC:fsc-87188','DOC:PUBLIC_AGENCY:credit-info-enf-decree-appx2-4-20260811','TITLE_DATE:NEWSTART_FUND:새출발기금 채무조정 신청 현황(26.8월말 기준):2026-09-18','URL:https://www.kamco.or.kr/portal/contents.do?mId=0203030000');")
          PUBKEYS=$(mysql -h "$DB_HOST" -P "${DB_PORT:-3306}" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" -N -e "SELECT COUNT(*) FROM newstart_official_updates WHERE dedup_key IN ('DOC:FSC:fsc-86357','DOC:FSC:fsc-87188','DOC:PUBLIC_AGENCY:credit-info-enf-decree-appx2-4-20260811','TITLE_DATE:NEWSTART_FUND:새출발기금 채무조정 신청 현황(26.8월말 기준):2026-09-18','URL:https://www.kamco.or.kr/portal/contents.do?mId=0203030000') AND review_status='PUBLISHED';")
          echo "RESULT_V1046s${V1046_S:-X}_V1045s${V1045_S:-X}_FAILED${FAILED_LIST:-none}_ROWS${ROWS:-X}_KEYS${KEYS:-X}_PUB${PUBKEYS:-X}"
          SSMEOF
            )
          else
            SSM_BODY=$(cat <<'SSMEOF'
          set -euo pipefail
          source /etc/f2r/env
          echo "===== safety check: FAILED versions ====="
          FAILED=$(mysql -h "$DB_HOST" -P "${DB_PORT:-3306}" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" -N -e "SELECT GROUP_CONCAT(version ORDER BY version) FROM flyway_schema_history WHERE success = 0;")
          echo "failed versions: [${FAILED:-<none>}]"
          if [ "${FAILED:-}" != "1046" ]; then
            echo "RESULT_SUMMARY: REPAIR=[aborted-safety] FAILED=[${FAILED:-none}]"
            echo "SAFETY STOP: expected only version 1046 to be failed."
            exit 1
          fi
          echo "===== installing flyway CLI 11.20.3 (if missing) ====="
          if [ ! -x /opt/flyway-11.20.3/flyway ]; then
            cd /tmp
            curl -sL -o flyway-v1046.tar.gz "https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/11.20.3/flyway-commandline-11.20.3-linux-x64.tar.gz"
            mkdir -p /opt
            tar -xzf flyway-v1046.tar.gz -C /opt
            rm -f flyway-v1046.tar.gz
          fi
          /opt/flyway-11.20.3/flyway --version
          echo "===== flyway repair ====="
          /opt/flyway-11.20.3/flyway repair "-url=jdbc:mysql://$DB_HOST:${DB_PORT:-3306}/$DB_NAME" "-user=$DB_USER" "-password=$DB_PASSWORD"
          echo "===== post-repair verification ====="
          FAILED_AFTER=$(mysql -h "$DB_HOST" -P "${DB_PORT:-3306}" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" -N -e "SELECT GROUP_CONCAT(version ORDER BY version) FROM flyway_schema_history WHERE success = 0;")
          V1046_AFTER=$(mysql -h "$DB_HOST" -P "${DB_PORT:-3306}" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" -N -e "SELECT COUNT(*) FROM flyway_schema_history WHERE version='1046';")
          V1045_AFTER=$(mysql -h "$DB_HOST" -P "${DB_PORT:-3306}" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" -N -e "SELECT success FROM flyway_schema_history WHERE version='1045' ORDER BY installed_rank DESC LIMIT 1;")
          echo "RESULT_REPAIR_${FAILED_AFTER:-none}_V1046rows${V1046_AFTER:-X}_V1045s${V1045_AFTER:-X}"
          SSMEOF
            )
          fi

          PARAMS_JSON=$(python3 -c 'import json,sys; print(json.dumps({"commands": sys.stdin.read().splitlines()}))' <<< "$SSM_BODY")
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMS_JSON" \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID (mode=$MODE)"

          ELAPSED=0
          STATUS=""
          while [ "$ELAPSED" -lt 600 ]; do
            sleep 15
            ELAPSED=$((ELAPSED + 15))
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text 2>/dev/null || echo "Unknown")
            echo "status: $STATUS (${ELAPSED}s)"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text > /tmp/ssm-raw-output.txt || true
          SUMMARY=$(grep -o "^RESULT_[A-Za-z0-9_-]*" /tmp/ssm-raw-output.txt | tail -1 || true)
          if [ -n "$SUMMARY" ]; then
            echo "::notice::$SUMMARY"
            echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::RESULT marker not found in SSM output"
            echo "summary=RESULT_UNKNOWN" >> "$GITHUB_OUTPUT"
          fi

          if [ "$STATUS" != "Success" ]; then
            echo "::error::SSM command did not succeed (Status=$STATUS)"
            exit 1
          fi

      - name: Upload result marker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ssm.outputs.summary }}-mode-${{ inputs.mode }}
          path: /tmp/ssm-raw-output.txt
          retention-days: 1
