name: Admissions ops (embedding server)

# 입시상담 임베딩 서버(EmbeddingGemma ONNX, CPU)를 신규 운영 EC2(f2r-app)에 설치·활성화·중지한다.
# - 기존 배포와 같은 OIDC 역할(github-actions-f2r-deploy)·SSM 경로만 사용한다. 입시 데이터(DB)는 건드리지 않는다.
# - 비밀값은 읽거나 출력하지 않는다(앱 env는 APP_ADMISSIONS_* 키만 출력).
# - 안전장치: 설치 전 여유 메모리·앱 health 확인, 서비스 MemoryMax 900M·동시 1건, guard 타이머(여유<300MB면 임베딩 중지).
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'status=상태/메모리 보고, verify=증설 후 점검(상태검사·내부 엔드포인트·RDS·부팅/502 단서), resize-check=EC2 증설 사전 점검(읽기 전용: 권한 dry-run·EIP·볼륨·부팅 자동기동), install=서버 설치·보정, enable=앱 벡터검색 켜기(앱 재시작), disable=끄기(앱 재시작)'
        required: true
        default: status
        type: choice
        options: [status, verify, resize-check, install, enable, disable]
      min_similarity:
        description: 'enable 시 유사도 하한. 비우면 설치 때 보정한 제안값(없으면 기본 0.5)'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (embedding core)
        run: python3 -m unittest discover -s ops/admissions-embedding -q
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::425805163960:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2
      - name: EC2 status checks (read-only)
        if: inputs.action == 'verify'
        shell: bash
        run: |
          set +e
          IID=$(aws ec2 describe-instances --filters Name=tag:Name,Values=f2r-app Name=tag:Project,Values=f2r-migration \
            Name=instance-state-name,Values=running --query 'Reservations[0].Instances[0].InstanceId' --output text)
          aws ec2 describe-instances --instance-ids "$IID" --query 'Reservations[0].Instances[0].{Id:InstanceId,Type:InstanceType,State:State.Name,LaunchTime:LaunchTime,PrivateIp:PrivateIpAddress,PublicIp:PublicIpAddress}' --output json
          aws ec2 describe-instance-status --instance-ids "$IID" --query 'InstanceStatuses[0].{System:SystemStatus.Status,Instance:InstanceStatus.Status}' --output json 2>&1 | head -8
          exit 0
      - name: Resize preflight (read-only, dry-run only)
        if: inputs.action == 'resize-check'
        shell: bash
        run: |
          set +e
          IID=$(aws ec2 describe-instances --filters Name=tag:Name,Values=f2r-app Name=tag:Project,Values=f2r-migration \
            Name=instance-state-name,Values=running --query 'Reservations[0].Instances[0].InstanceId' --output text)
          echo "== instance =="; aws ec2 describe-instances --instance-ids "$IID" --query 'Reservations[0].Instances[0].{Id:InstanceId,Type:InstanceType,State:State.Name,PrivateIp:PrivateIpAddress,PublicIp:PublicIpAddress,EbsOptimized:EbsOptimized,Volumes:BlockDeviceMappings[].Ebs.VolumeId}' --output json
          echo "== elastic ip =="; aws ec2 describe-addresses --filters Name=instance-id,Values="$IID" --query 'Addresses[].{Ip:PublicIp,Alloc:AllocationId}' --output json 2>&1 | head -5
          echo "== root volume =="; aws ec2 describe-volumes --filters Name=attachment.instance-id,Values="$IID" --query 'Volumes[].{Id:VolumeId,GiB:Size,Type:VolumeType}' --output json 2>&1 | head -10
          echo "== target health =="; aws elbv2 describe-target-groups --query 'TargetGroups[].TargetGroupArn' --output text 2>&1 | tr '\t' '\n' | head -3 | while read -r tg; do [ -n "$tg" ] && aws elbv2 describe-target-health --target-group-arn "$tg" --query 'TargetHealthDescriptions[].{Target:Target.Id,State:TargetHealth.State}' --output json 2>&1 | head -8; done
          VOL=$(aws ec2 describe-volumes --filters Name=attachment.instance-id,Values="$IID" --query 'Volumes[0].VolumeId' --output text)
          echo "== permission dry-runs (DryRunOperation=허용, UnauthorizedOperation=권한 없음) =="
          for c in "stop-instances --instance-ids $IID" "start-instances --instance-ids $IID" \
                   "modify-instance-attribute --instance-id $IID --instance-type {\"Value\":\"t3.large\"}" \
                   "create-snapshot --volume-id $VOL --description f2r-pre-resize"; do
            OUT=$(aws ec2 $c --dry-run 2>&1); R=$(echo "$OUT" | grep -oE 'DryRunOperation|UnauthorizedOperation' | head -1)
            echo "${c%% *}: ${R:-unknown: $(echo "$OUT" | tail -1 | cut -c1-120)}"
          done
          exit 0
      - name: Run on f2r-app via SSM
        shell: bash
        env:
          ACTION: ${{ inputs.action == 'resize-check' && 'status' || inputs.action }}
          MIN_SIMILARITY: ${{ inputs.min_similarity }}
        run: |
          set -euo pipefail
          [[ "$MIN_SIMILARITY" =~ ^([0-9]\.[0-9]{1,3})?$ ]] || { echo "::error::min_similarity 형식 오류"; exit 1; }
          B=f2r-deploy-425805163960
          IID=$(aws ec2 describe-instances --filters Name=tag:Name,Values=f2r-app Name=tag:Project,Values=f2r-migration \
            Name=instance-state-name,Values=running --query 'Reservations[0].Instances[0].InstanceId' --output text)
          [ -n "$IID" ] && [ "$IID" != "None" ] || { echo "신규 f2r-app 인스턴스 없음" >&2; exit 1; }
          for f in server.py embed_core.py calibrate.py ops.sh; do
            aws s3 cp "ops/admissions-embedding/$f" "s3://$B/admissions-embedding/$f" --sse AES256 >/dev/null
          done
          CMDS='["set -e","rm -rf /tmp/f2r-embed-src && mkdir -p /tmp/f2r-embed-src","aws s3 cp s3://'"$B"'/admissions-embedding/ /tmp/f2r-embed-src/ --recursive --only-show-errors","ACTION='"$ACTION"' MIN_SIMILARITY='"$MIN_SIMILARITY"' bash /tmp/f2r-embed-src/ops.sh"]'
          CID=$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript \
            --parameters "commands=$CMDS" --timeout-seconds 1500 --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $CID"
          STATUS=""; ELAPSED=0
          while :; do
            J=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --output json 2>/dev/null || true)
            STATUS=$(printf '%s' "$J" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("Status",""))' 2>/dev/null || true)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            [ "$ELAPSED" -lt 1500 ] || break
            sleep 15; ELAPSED=$((ELAPSED+15))
          done
          echo "SSM final status: ${STATUS:-timeout}"
          printf '%s' "$J" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("StandardOutputContent",""));print("--- stderr ---");print(d.get("StandardErrorContent","")[-3000:])'
          [ "$STATUS" = Success ]
