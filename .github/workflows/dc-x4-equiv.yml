name: DesignCraft PDF/X-4 structural equivalence v2 for 722 (runner only, CLI 0.8, no AWS)
on:
  push:
    branches: ['ci/dc-step1-readonly']
    paths: ['.github/workflows/dc-x4-equiv.yml', 'ops/diagnostics/dc_x4_equiv.py', 'ops/diagnostics/x4_lab/**']
permissions:
  contents: read
  actions: read
jobs:
  equiv:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bbbd922214533cb75d1e3d923fe19a80ac11e0b6
          path: main
      - uses: actions/checkout@v4
        with:
          path: ci
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/download-artifact@v4
        with:
          name: designcraft-080-glibc234-final
          run-id: 38850191210
          github-token: ${{ github.token }}
          path: art
      - name: Guard - archive hash
        run: |
          T=art/designcraft-0.8.0-al2023-x86_64.tar.gz
          test "$(sha256sum $T | cut -d' ' -f1)" = "5d4a3e7b9a0569ed904ae41d777c1a02854e579fd8aaa2769a34a4c3228aee6d"
          mkdir eng && tar xzf $T -C eng
      - name: Restored PDFs from the merged main code (real CLI test) + engine originals
        run: |
          CLI=$(find "$PWD/eng" -name designcraft-cli -type f | head -1); chmod +x "$CLI"
          git -C main log -1 --format='main HEAD = %H'
          (cd main && DESIGNCRAFT_CLI="$CLI" DC_PDF_OUT="$GITHUB_WORKSPACE/restored" bash ./gradlew test --no-daemon -q --tests '*PdfMarkTitle*' 2>&1 | grep -E "FAILED|BUILD" || true)
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('main/build/test-results/test/*PdfMarkTitle*.xml'):
              r = ET.parse(f).getroot(); print(r.get('name').split('.')[-1], *(f"{k}={r.get(k)}" for k in ('tests','failures','errors','skipped')))
          PY
          declare -A ASCII=( [ko-textbook-a4]="Korean Textbook Template (A4)" [ko-workbook-b5]="Korean Workbook Template (B5)" [ko-book-46]="Korean Book Template (46)" )
          mkdir -p orig pre
          for t in ko-textbook-a4 ko-workbook-b5 ko-book-46; do
            for v in orig pre; do
              W=$(mktemp -d); T=main/ops/designcraft/templates/$t
              cp "$T/template.designcraft" $W/job.designcraft; cp "$T/sample-manuscript.md" $W/m.md; cp -r "$T/Document Fonts" $W/
              if [ $v = pre ]; then O="{\"standard\":\"x4\",\"tagged\":true,\"title\":\"${ASCII[$t]}\",\"marks\":{\"crop\":true,\"bleed\":true,\"pageInfo\":true}}"; else O='{"standard":"x4","tagged":true,"marks":{"crop":true,"bleed":true,"pageInfo":true}}'; fi
              (cd $W && "$CLI" run --in job.designcraft --cmd 'file.place={"path":"m.md","autoflow":true}' --cmd 'edit.selectAll' --cmd 'style.paragraph.apply={"name":"ko-body"}' --pdf-options "$O" --export out.pdf >/dev/null)
              cp $W/out.pdf $v/$t.pdf
            done
          done
          ls -la orig pre restored
      - name: Apply the merged PdfMarkTitle.restoreTitle to the SAME engine PDF, then compare before/after
        run: |
          sudo apt-get -qq update >/dev/null 2>&1; sudo apt-get -qq install -y qpdf >/dev/null 2>&1 || true
          pip install -q pymupdf >/dev/null 2>&1
          CP="main/build/classes/java/main:$(find ~/.gradle/caches/modules-2 -name 'pdfbox-3*.jar' -o -name 'pdfbox-io-3*.jar' -o -name 'fontbox-3*.jar' -o -name 'commons-logging-1*.jar' -o -name 'jackson-databind-*.jar' -o -name 'jackson-core-*.jar' -o -name 'jackson-annotations-*.jar' | grep -v sources | tr '\n' ':')"
          mkdir -p rcls && javac -cp "$CP" -d rcls ci/ops/diagnostics/x4_lab/RestoreMain.java
          declare -A KO=( [ko-textbook-a4]="한글 교재 템플릿 (A4)" [ko-workbook-b5]="한글 문제집 템플릿 (B5)" [ko-book-46]="한글 단행본 템플릿 (46판)" )
          mkdir -p same
          for t in ko-textbook-a4 ko-workbook-b5 ko-book-46; do
            cp pre/$t.pdf same/$t.pdf
            java -cp "rcls:$CP" f2r.tutor_solution.private_tutor_solution_back.domain.publishing.service.RestoreMain "same/$t.pdf" "${KO[$t]}"
            python3 ci/ops/diagnostics/dc_x4_equiv.py $t orig/$t.pdf pre/$t.pdf same/$t.pdf 2>&1 | grep -v Deprecat
          done
