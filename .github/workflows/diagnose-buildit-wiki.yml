name: Diagnose buildit-wiki (read-only)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: diagnose-buildit-wiki
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2

      - name: Run diagnostic commands via SSM
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_ID="i-09d7cabb5a42d1135"

          # Read-only diagnostic commands
          COMMANDS=(
            "systemctl status buildit-wiki.service --no-pager -l || true"
            "journalctl -u buildit-wiki.service --no-pager -n 300 || true"
            "ss -ltnp | grep -E ':8000|:8080' || true"
            "systemctl show buildit-wiki.service -p ActiveState -p SubState -p ExecMainStatus -p ExecMainCode || true"
            "systemctl cat buildit-wiki.service 2>/dev/null | grep -E '^(ExecStart|WorkingDirectory)=' || true"
          )

          # Build the command string for SSM
          CMD_JSON=$(printf '%s\n' "${COMMANDS[@]}" | jq -R . | jq -s .)
          echo "Commands to run: $CMD_JSON"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=$CMD_JSON" \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"

          # Wait for command to complete (polling like PR #294)
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          WAIT_STATUS=$?
          set -e

          # Get and output the full invocation result
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text
          echo "--- STDERR ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' --output text

          exit "$WAIT_STATUS"