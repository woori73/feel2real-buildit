name: GitHub Issue → Trello

on:
  issues:
    types: [opened]

jobs:
  create-trello-card:
    runs-on: ubuntu-latest

    steps:
      - name: Create Trello card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRELLO_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_TODO_LIST_ID: ${{ secrets.TRELLO_TODO_LIST_ID }}
        run: |
          TITLE="${{ github.event.issue.title }}"
          ISSUE_NUM="${{ github.event.issue.number }}"
          ISSUE_URL="${{ github.event.issue.html_url }}"

          LABEL_ID=""
          PRIORITY_ID="6a1ac1b7ff951bcdc9d17448"  # Medium (default)

          # 제목 prefix → Trello 라벨/우선순위 (라벨 ID는 보드 GET /labels 기준)
          if [[ "$TITLE" == \[BUG\]* ]]; then
            LABEL_ID="6a1ab61bc4e943806e7e2581"     # fix (red)
            PRIORITY_ID="6a1ac1b7ff951bcdc9d17447"  # High
          elif [[ "$TITLE" == \[FEAT\]* ]]; then
            LABEL_ID="6a1ab61bc4e943806e7e2582"     # feature (purple)
            PRIORITY_ID="6a1ac1b7ff951bcdc9d17448"  # Medium
          elif [[ "$TITLE" == \[CHORE\]* ]]; then
            LABEL_ID="6a1ab61bc4e943806e7e257e"     # chore (green)
            PRIORITY_ID="6a1ac1b7ff951bcdc9d17448"  # Medium
          elif [[ "$TITLE" == \[REFACTOR\]* ]]; then
            LABEL_ID="6a1ab61bc4e943806e7e2583"     # refactor (blue)
            PRIORITY_ID="6a1ac1b7ff951bcdc9d17448"  # Medium
          elif [[ "$TITLE" == \[PROCESS\]* ]]; then
            LABEL_ID="6a1ab61bc4e943806e7e2580"     # process (orange)
            PRIORITY_ID="6a1ac1b7ff951bcdc9d17448"  # Medium
          elif [[ "$TITLE" == \[CI\]* ]]; then
            LABEL_ID="6a1ab61bc4e943806e7e257f"     # CI/CD (yellow)
            PRIORITY_ID="6a1ac1b7ff951bcdc9d17448"  # Medium
          fi

          EXTRA_LABEL=${LABEL_ID:+--data-urlencode "idLabels=${LABEL_ID}"}
          CARD_RESPONSE=$(curl -s -X POST "https://api.trello.com/1/cards" \
            -d "key=${TRELLO_KEY}" \
            -d "token=${TRELLO_TOKEN}" \
            -d "idList=${TRELLO_TODO_LIST_ID}" \
            --data-urlencode "name=#${ISSUE_NUM} ${TITLE}" \
            --data-urlencode "desc=GitHub Issue: ${ISSUE_URL}" \
            $EXTRA_LABEL)

          CARD_ID=$(echo "$CARD_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")

          curl -s -X PUT "https://api.trello.com/1/cards/${CARD_ID}/customField/6a1ac1b7ff951bcdc9d17445/item" \
            -H "Content-Type: application/json" \
            -d "{\"idValue\":\"${PRIORITY_ID}\",\"key\":\"${TRELLO_KEY}\",\"token\":\"${TRELLO_TOKEN}\"}"
