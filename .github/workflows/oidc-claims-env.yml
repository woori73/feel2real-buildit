name: OIDC claims check - environment sub (one-time, no AWS)
# GitHub Environment f2r-infra-build 가 생성·보호된 "뒤에" 실행해 environment 형식의 sub 문자열을 확정한다.
# AWS 접근·시크릿 없음. JWT 원문은 마스킹, 공개 클레임만 출력. docs 아래 파일(활성 아님): 브랜치 ci/oidc-claims-env 로 복사해 push 하면 실행(소유자 승인 대기).
on:
  push:
    branches: ['ci/oidc-claims-env']
    paths: ['.github/workflows/oidc-claims-env.yml']
permissions:
  id-token: write
  contents: read
jobs:
  claims:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: f2r-infra-build
    steps:
      - name: Print public OIDC claims only
        shell: bash
        run: |
          python3 -I - <<'PY'
          import base64, json, os, sys, urllib.request
          try:
              url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=sts.amazonaws.com'
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
              jwt = json.load(urllib.request.urlopen(req, timeout=20))['value']
              print('::add-mask::' + jwt)
              p = jwt.split('.')[1]
              c = json.loads(base64.urlsafe_b64decode(p + '=' * (-len(p) % 4)))
              for k in ['aud','sub','environment','ref','job_workflow_ref','event_name']:
                  print(k, '=', c.get(k, '<absent>'))
              want = 'repo:woori73@299170593/feel2real-buildit@1340651018:environment:f2r-infra-build'
              print('sub == 신뢰 정책 예상값 ->', c.get('sub') == want)
          except Exception as e:
              print('claims check failed:', type(e).__name__); sys.exit(1)
          PY
