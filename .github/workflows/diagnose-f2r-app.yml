name: Diagnose f2r-app (read-only, manual)

# 운영 Spring(f2r-app.service) 지피지기 LLM 경로 전용 READ ONLY 진단.
# 하지 않는 것: 배포, restart, 파일 쓰기·삭제, DB 접근, secret/키 값 출력(길이만 출력).
# 워크플로우는 결과와 무관하게 항상 성공으로 끝난다(상태 수집이 목적).

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2

      - name: Run read-only jipijigi llm diagnosis through SSM
        shell: bash
        run: |
          cat > /tmp/jipijigi-diagnose-params.json <<'PARAMS'
          {"commands":[
            "set +e",
            "echo '=== f2r-app active / wiki active ==='",
            "systemctl is-active f2r-app.service; systemctl is-active buildit-wiki.service",
            "echo '=== host resources ==='",
            "uptime; free -m | sed -n 2p; df -h / | tail -1",
            "echo '=== process env KEY names (names only, never values) ==='",
            "MPID=$(systemctl show -p MainPID --value f2r-app.service); tr '\\0' '\\n' < /proc/$MPID/environ | grep -oE '^[A-Z_]+(KEY|SECRET|TOKEN)[A-Z_]*=' || echo NONE",
            "awk -F= '/^NVIDIA_API_KEY=/{print \"file NVIDIA_API_KEY_len=\" length($2)} /^OPENROUTER_API_KEY=/{print \"file OPENROUTER_API_KEY_len=\" length($2)}' /etc/f2r/env; grep -E '^(NVIDIA_NIM_BASE_URL|NVIDIA_NEMOTRON_MODEL|NEWSTART_OPENROUTER_MODEL|OPENROUTER_BASE_URL)=' /etc/f2r/env || echo NO_PROVIDER_OVERRIDES_IN_ENVFILE",
            "echo '=== unit EnvironmentFiles ==='",
            "systemctl show f2r-app.service -p EnvironmentFiles",
            "echo '=== nvidia 48h outcome census ==='",
            "journalctl -u f2r-app.service --since '48 hours ago' --no-pager | grep -oE 'newstart nvidia call (status=[0-9]+|ioFailure)' | sort | uniq -c",
            "journalctl -u f2r-app.service --since '48 hours ago' --no-pager | grep -E 'newstart (llm|nvidia call status)' | tail -n 12",
            "echo '=== egress probe to nvidia host (unauthenticated, no model call) ==='",
            "getent hosts integrate.api.nvidia.com | head -2; curl -s -o /dev/null -w 'GET_/v1/models http=%{http_code} time=%{time_total}s\\n' --max-time 10 https://integrate.api.nvidia.com/v1/models",
            "echo '=== who terminates client connections (local listeners) ==='",
            "ss -ltnp | grep -E ':(80|443|8080)\\b' | head -6; systemctl is-active nginx haproxy 2>/dev/null; echo",
            "exit 0"
          ]}
          PARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09d7cabb5a42d1135" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/jipijigi-diagnose-params.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135"
          echo "===== invocation status ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query '{Status:Status,ResponseCode:ResponseCode}' --output text
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardOutputContent' --output text
          echo "===== StandardErrorContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardErrorContent' --output text
          exit 0
