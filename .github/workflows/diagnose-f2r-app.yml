name: Diagnose f2r-app (read-only, manual)

# 운영 Spring(f2r-app.service) 지피지기 LLM 경로 전용 READ ONLY 진단.
# 하지 않는 것: 배포, restart, 파일 쓰기·삭제, DB 접근, secret/키 값 출력(길이만 출력).
# 워크플로우는 결과와 무관하게 항상 성공으로 끝난다(상태 수집이 목적).

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2

      - name: Read-only ALB attributes and target health (describe only)
        shell: bash
        run: |
          set +e
          echo '=== load balancers ==='
          aws elbv2 describe-load-balancers --region ap-northeast-2 \
            --query 'LoadBalancers[].{Name:LoadBalancerName,Type:Type,DNS:DNSName,VPC:VpcId}' --output json
          echo '=== idle timeout attributes ==='
          for ARN in $(aws elbv2 describe-load-balancers --region ap-northeast-2 --query 'LoadBalancers[].LoadBalancerArn' --output text); do
            aws elbv2 describe-load-balancer-attributes --load-balancer-arn "$ARN" \
              --query 'Attributes[?Key==`idle_timeout.timeout_seconds`]' --output json
          done
          echo '=== listeners / target groups / target health ==='
          for ARN in $(aws elbv2 describe-load-balancers --region ap-northeast-2 --query 'LoadBalancers[].LoadBalancerArn' --output text); do
            aws elbv2 describe-listeners --load-balancer-arn "$ARN" \
              --query 'Listeners[].{Port:Port,Proto:Protocol,TG:(DefaultActions[0].TargetGroupArn)}' --output json
            for TGN in $(aws elbv2 describe-listeners --load-balancer-arn "$ARN" --query 'Listeners[].DefaultActions[].TargetGroupArn' --output text); do
              aws elbv2 describe-target-groups --target-group-arns "$TGN" --query 'TargetGroups[].{Name:Name,Health:(HealthCheckPath)}' --output json
              aws elbv2 describe-target-health --target-group-arn "$TGN" \
                --query 'TargetHealthDescriptions[].{T:Target.Id,Port:Target.Port,H:TargetHealth.State,R:TargetHealth.Reason}' --output json
            done
          done
          exit 0

      - name: Run read-only jipijigi llm diagnosis through SSM
        shell: bash
        run: |
          cat > /tmp/jipijigi-diagnose-params.json <<'PARAMS'
          {"commands":[
            "set +e",
            "echo '=== f2r-app active / wiki active ==='",
            "systemctl is-active f2r-app.service; systemctl is-active buildit-wiki.service",
            "echo '=== nvidia full history since Sep 27 (outcome census) ==='",
            "journalctl -u f2r-app.service --since '2026-09-27' --no-pager | grep -oE 'newstart nvidia call (status=[0-9]+|ioFailure)' | sort | uniq -c",
            "echo '=== journal context 12:02-12:11 around ioFailures ==='",
            "journalctl -u f2r-app.service --since '2026-09-29 12:02:00' --until '2026-09-29 12:11:00' --no-pager | grep -viE 'hikari|heartbeat' | tail -n 30",
            "exit 0"
          ]}
          PARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09d7cabb5a42d1135" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/jipijigi-diagnose-params.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135"
          echo "===== invocation status ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query '{Status:Status,ResponseCode:ResponseCode}' --output text
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardOutputContent' --output text
          echo "===== StandardErrorContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardErrorContent' --output text
          exit 0
