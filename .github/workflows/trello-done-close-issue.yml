name: Trello Done → Close GitHub Issue

on:
  repository_dispatch:
    types: [trello-done]

jobs:
  close-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Extract issue number and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CARD_TITLE="${{ github.event.client_payload.card_title }}"
          # 카드 제목에서 #N 추출 (예: "#11 [BUG] ...")
          ISSUE_NUM=$(echo "$CARD_TITLE" | grep -oE '#[0-9]+' | head -1 | tr -d '#')
          if [ -n "$ISSUE_NUM" ]; then
            echo "Closing issue #$ISSUE_NUM"
            gh issue close "$ISSUE_NUM" \
              --reason completed \
              --repo ${{ github.repository }}
          else
            echo "No issue number found in: $CARD_TITLE"
          fi
