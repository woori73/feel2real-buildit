name: Easy Batch5 Precheck Row 506 (read-only)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2

      - name: Row 506 current state
        shell: bash
        run: |
          cat > /tmp/mysql-506.json <<'PARAMS'
          {"commands":[
            "set +e",
            "echo \"=== ROW 506 STATE ===\"",
            "source /etc/f2r/env 2>/dev/null || true",
            "mysql -h \"${DB_HOST}\" -P \"${DB_PORT}\" -u \"${DB_USER}\" -p\"${DB_PASSWORD}\" \"${DB_NAME}\" -e \"SET SESSION TRANSACTION READ ONLY; SELECT r.row_id, r.row_no, r.batch_id, r.status, r.amount, r.matched_account_id, (SELECT a.code FROM easy_accounts a WHERE a.account_id = r.matched_account_id) AS acct, r.confidence, r.created_txn_id FROM easy_import_rows r WHERE r.batch_id = 5 AND r.row_id = 506;\" 2>&1 || echo \"mysql_exit=$?\"",
            "exit 0"
          ]}
          PARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09d7cabb5a42d1135" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/mysql-506.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135"
          echo "wait_exit=$?"
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardOutputContent' --output text
          exit 0

      - name: Batch aggregates
        shell: bash
        run: |
          cat > /tmp/mysql-agg.json <<'PARAMS'
          {"commands":[
            "set +e",
            "echo \"=== BATCH AGGREGATES ===\"",
            "source /etc/f2r/env 2>/dev/null || true",
            "mysql -h \"${DB_HOST}\" -P \"${DB_PORT}\" -u \"${DB_USER}\" -p\"${DB_PASSWORD}\" \"${DB_NAME}\" -e \"SET SESSION TRANSACTION READ ONLY; SELECT batch_id, status, total_rows, confirmed_rows FROM easy_import_batches WHERE batch_id = 5; SELECT status, COUNT(*), COALESCE(SUM(amount),0) FROM easy_import_rows WHERE batch_id = 5 GROUP BY status;\" 2>&1 || echo \"mysql_exit=$?\"",
            "exit 0"
          ]}
          PARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09d7cabb5a42d1135" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/mysql-agg.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135"
          echo "wait_exit=$?"
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardOutputContent' --output text
          exit 0

      - name: Check duplicate transaction for row 506 fingerprint
        shell: bash
        run: |
          cat > /tmp/mysql-dup.json <<'PARAMS'
          {"commands":[
            "set +e",
            "echo \"=== DUPLICATE CHECK ===\"",
            "source /etc/f2r/env 2>/dev/null || true",
            "mysql -h \"${DB_HOST}\" -P \"${DB_PORT}\" -u \"${DB_USER}\" -p\"${DB_PASSWORD}\" \"${DB_NAME}\" -e \"SET SESSION TRANSACTION READ ONLY; SELECT r.row_id, r.fingerprint, t.txn_id, t.fingerprint as txn_fp FROM easy_import_rows r LEFT JOIN easy_transactions t ON t.fingerprint = r.fingerprint WHERE r.batch_id = 5 AND r.row_id = 506;\" 2>&1 || echo \"mysql_exit=$?\"",
            "exit 0"
          ]}
          PARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09d7cabb5a42d1135" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/mysql-dup.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135"
          echo "wait_exit=$?"
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardOutputContent' --output text
          exit 0