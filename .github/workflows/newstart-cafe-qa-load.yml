name: NewStart cafe QA load (insert-only)

# Manual production loader for the preserved cafe-qa batch.
# DRY_RUN is the default. WRITE_REVIEW creates only missing rows, then moves
# each newly-created row to REVIEW. It never updates, deletes, or approves.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "DRY_RUN only reads production; WRITE_REVIEW inserts missing items into REVIEW"
        required: true
        type: choice
        options:
          - DRY_RUN
          - WRITE_REVIEW
        default: DRY_RUN

permissions:
  contents: read

concurrency:
  group: newstart-cafe-qa-load
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require configured ADMIN credentials
        env:
          ADMIN_LOGIN: ${{ secrets.NEWSTART_SEED_ADMIN_LOGIN_ID }}
          ADMIN_PASSWORD: ${{ secrets.NEWSTART_SEED_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_LOGIN" && test -n "$ADMIN_PASSWORD" || {
            echo "::error::Existing NewStart ADMIN secrets are required"; exit 1;
          }
          echo "Mode=${{ inputs.mode }}; credential values are not printed."

      - name: Checkout approved batch and insert-only loader
        uses: actions/checkout@v4

      - name: Verify fixed batch package
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path("docs/newstart/research/cafe-qa-phase1-b6")
          manifest = json.loads((root / "load_batches/manifest.json").read_text(encoding="utf-8"))
          assert manifest["totalToLoad"] == 992 and manifest["batchCount"] == 10
          rows = []
          for batch in manifest["batches"]:
              payload = json.loads((root / "load_batches" / batch["file"]).read_text(encoding="utf-8"))
              assert len(payload) == batch["count"], batch["file"]
              rows.extend(payload)
          assert len(rows) == 992
          print("Fixed batch verified: 992 candidate rows / 10 files")
          PY

      - name: Read-only production exact-match dry run
        if: ${{ inputs.mode == 'DRY_RUN' }}
        env:
          NEWSTART_SEED_ADMIN_LOGIN_ID: ${{ secrets.NEWSTART_SEED_ADMIN_LOGIN_ID }}
          NEWSTART_SEED_ADMIN_PASSWORD: ${{ secrets.NEWSTART_SEED_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          python3 docs/newstart/research/tools/load_cafe_qa_prod.py \
            --root docs/newstart/research/cafe-qa-phase1-b6

      - name: Insert missing rows as REVIEW only
        if: ${{ inputs.mode == 'WRITE_REVIEW' }}
        env:
          NEWSTART_SEED_ADMIN_LOGIN_ID: ${{ secrets.NEWSTART_SEED_ADMIN_LOGIN_ID }}
          NEWSTART_SEED_ADMIN_PASSWORD: ${{ secrets.NEWSTART_SEED_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          python3 docs/newstart/research/tools/load_cafe_qa_prod.py \
            --root docs/newstart/research/cafe-qa-phase1-b6 --write
