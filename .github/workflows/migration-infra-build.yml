name: Migration infra build (manual)

# 신규 AWS 계정(425805163960) 인프라 구축 전용 (수정본: Muse 초안 기반).
# - 읽기 전용 validate 를 제외한 각 단계는 "리소스별로" 존재 여부를 확인하고 없는 부분만 만든다
#   (중간 실패 후 재실행해도 라우트·IGW 연결·서브넷 속성·IAM 연결이 빠지지 않도록 매번 보정한다).
# - RDS 는 서브넷 그룹 + 파라미터 그룹(껍데기)만. 스냅샷 복원·DNS 변경은 이 워크플로에서 하지 않는다(별도 승인).
# - 삭제·종료 권한은 이 역할에 없다. 정리는 소유자(MFA 관리자)가 콘솔에서 한다.
# - 역할 ARN·환경 보호는 입력값이 아니라 워크플로에 고정한다(입력으로 다른 역할을 지정할 수 없다).

on:
  workflow_dispatch:
    inputs:
      step:
        description: '실행 단계'
        required: true
        default: 'validate'
        type: choice
        options:
          - all-infra
          - secrets-transfer
          - db-migrate
          - fix-deploy-role
          - ssm-last-output
          - app-diag
          - alb-diag
          - academycraft-preflight
          - readonly-setup
          - admissions-diag
          - a1-precheck
          - rds-protect
          - snapshot-role-setup
          - predeploy-snapshot
          - acm-dns
          - p2-inventory
          - p2-s3-copy
          - p2-designcraft
          - p2-dc-verify
          - p2-disable-designcraft
          - muse-check
          - p2-cutover-inventory
          - p2-cutover
          - validate
          - s3
          - provision
          - restore-rds
          - vpc
          - ec2
          - rds-shell
          - alb
          - acm
          - alb-https
          - smoke
      confirm:
        description: '확인 문자열: p2-cutover=CUTOVER-20261018, rds-protect=PROTECT-f2r-db-202610181331, predeploy-snapshot=SNAPSHOT-<실행 커밋 앞 8자리>'
        required: false
        default: ''
      db_snapshot:
        description: 'restore-rds 전용: 신규 계정 내 복사 스냅샷 식별자(f2r-shared-*)'
        required: false
        default: ''
      db_param_family:
        description: 'RDS 파라미터 그룹 패밀리 (구 RDS 엔진 버전과 같아야 함 — 구 RDS 확인 후 선택)'
        required: false
        default: 'mysql8.4'
        type: choice
        options:
          - mysql8.4
          - mysql8.0
      health_check_path:
        description: 'ALB 헬스체크 경로 (정본: /actuator/health)'
        required: false
        default: '/actuator/health'
      diag_start:
        description: 'alb-diag 전용(읽기 전용): 진단 시작 UTC(예: 2026-10-19T20:30:00Z). 비우면 20:30Z'
        required: false
        default: ''
      diag_end:
        description: 'alb-diag 전용(읽기 전용): 진단 종료 UTC(시작과 24시간 이내). 비우면 2026-10-19T21:30:00Z'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

# 동시 실행 금지: Name 태그 확인-생성 사이 경합으로 VPC·ALB 등이 중복 생성·과금되는 것을 막는다.
concurrency:
  group: f2r-infra-build
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  AWS_DEFAULT_REGION: ap-northeast-2
  BUILDER_ROLE_ARN: arn:aws:iam::425805163960:role/f2r-infra-builder
  DEPLOY_ROLE_ARN: arn:aws:iam::425805163960:role/github-actions-f2r-deploy

jobs:
  build:
    if: inputs.step != 'secrets-transfer' && inputs.step != 'db-migrate' && inputs.step != 'acm-dns' && inputs.step != 'predeploy-snapshot' && !startsWith(inputs.step, 'p2-')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 소유자 승인(required reviewers) + main 브랜치 한정으로 보호된 GitHub Environment.
    # 신뢰 정책의 sub 가 이 environment 로 고정되어, 승인 없이는 역할을 가정할 수 없다.
    environment: f2r-infra-build
    outputs:
      instance_id: ${{ steps.run.outputs.instance_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (infra-builder)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.BUILDER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: f2r-infra-build

      - name: Run build step
        id: run
        shell: bash
        env:
          STEP: ${{ inputs.step }}
          DB_PARAM_FAMILY: ${{ inputs.db_param_family }}
          HEALTH_PATH: ${{ inputs.health_check_path }}
          DB_SNAPSHOT: ${{ inputs.db_snapshot }}
          DIAG_START: ${{ inputs.diag_start }}
          DIAG_END: ${{ inputs.diag_end }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          P=f2r-migration

          none() { [ -z "${1:-}" ] || [ "$1" = "None" ]; }
          need() { if none "${2:-}"; then echo "필요한 리소스 없음: $1 (앞 단계를 먼저 실행)" >&2; exit 1; fi; }
          tags() { printf 'ResourceType=%s,Tags=[{Key=Name,Value=%s},{Key=Project,Value=%s}]' "$1" "$2" "$P"; }

          get_vpc() {
            aws ec2 describe-vpcs --filters Name=tag:Name,Values=f2r-vpc Name=tag:Project,Values=$P \
              --query 'Vpcs[0].VpcId' --output text
          }
          get_subnet() {
            aws ec2 describe-subnets --filters Name=tag:Name,Values="$1" Name=tag:Project,Values=$P \
              --query 'Subnets[0].SubnetId' --output text
          }
          get_sg() {
            aws ec2 describe-security-groups --filters Name=group-name,Values="$1" Name=tag:Project,Values=$P \
              --query 'SecurityGroups[0].GroupId' --output text
          }
          get_instance() {
            aws ec2 describe-instances --filters Name=tag:Name,Values=f2r-app Name=tag:Project,Values=$P \
              'Name=instance-state-name,Values=pending,running,stopping,stopped' \
              --query 'Reservations[].Instances[].InstanceId' --output text
          }
          # 같은 규칙이 이미 있을 때만 성공으로 보고, 그 밖의 오류(권한·잘못된 값)는 그대로 실패시킨다.
          add_rule() {
            local out
            if out=$(aws ec2 authorize-security-group-ingress "$@" 2>&1); then echo "  rule added"
            elif grep -q 'InvalidPermission.Duplicate' <<<"$out"; then echo "  rule exists"
            else echo "$out" >&2; return 1; fi
          }

          step_validate() {
            echo "### caller"; aws sts get-caller-identity --query '{Account:Account,Arn:Arn}' --output table
            echo "### f2r VPC"; aws ec2 describe-vpcs --filters Name=tag:Project,Values=$P --query 'Vpcs[*].VpcId' --output text
            echo "### f2r subnets"; aws ec2 describe-subnets --filters Name=tag:Project,Values=$P --query 'Subnets[*].{Id:SubnetId,Az:AvailabilityZone,Cidr:CidrBlock,Public:MapPublicIpOnLaunch}' --output table
            echo "### f2r instances"; aws ec2 describe-instances --filters Name=tag:Project,Values=$P --query 'Reservations[*].Instances[*].{Id:InstanceId,Type:InstanceType,State:State.Name}' --output table
            echo "### f2r RDS"; aws rds describe-db-instances --query "DBInstances[?starts_with(DBInstanceIdentifier,'f2r-')].{Id:DBInstanceIdentifier,Class:DBInstanceClass,Engine:Engine}" --output table
            echo "### f2r ALB"; aws elbv2 describe-load-balancers --query "LoadBalancers[?starts_with(LoadBalancerName,'f2r-')].{Name:LoadBalancerName,DNS:DNSName}" --output table
            echo "### ACM certs"; aws acm list-certificates --certificate-statuses PENDING_VALIDATION ISSUED --query "CertificateSummaryList[?starts_with(DomainName,'feel2real')].{Domain:DomainName,Status:Status}" --output table
          }

          step_vpc() {
            local VPC PUB1 PUB2 PRI1 PRI2 IGW RT ALBSG EC2SG RDSSG
            VPC=$(get_vpc)
            if none "$VPC"; then
              VPC=$(aws ec2 create-vpc --cidr-block 10.0.0.0/16 --tag-specifications "$(tags vpc f2r-vpc)" \
                --query 'Vpc.VpcId' --output text)
              echo "created VPC $VPC"
            else echo "exists VPC $VPC"; fi
            # 중간 실패 후 재실행해도 속성이 빠지지 않도록 항상 적용(멱등).
            aws ec2 modify-vpc-attribute --vpc-id "$VPC" --enable-dns-support '{"Value":true}'
            aws ec2 modify-vpc-attribute --vpc-id "$VPC" --enable-dns-hostnames '{"Value":true}'

            ensure_subnet() { # name cidr az public(yes|no)
              local id
              id=$(get_subnet "$1")
              if none "$id"; then
                id=$(aws ec2 create-subnet --vpc-id "$VPC" --cidr-block "$2" --availability-zone "$3" \
                  --tag-specifications "$(tags subnet "$1")" --query 'Subnet.SubnetId' --output text)
                echo "created subnet $1=$id" >&2
              fi
              if [ "$4" = "yes" ]; then
                aws ec2 modify-subnet-attribute --subnet-id "$id" --map-public-ip-on-launch
              fi
              printf '%s' "$id"
            }
            PUB1=$(ensure_subnet f2r-public-2a 10.0.1.0/24 ap-northeast-2a yes)
            PUB2=$(ensure_subnet f2r-public-2c 10.0.2.0/24 ap-northeast-2c yes)
            PRI1=$(ensure_subnet f2r-private-2a 10.0.11.0/24 ap-northeast-2a no)
            PRI2=$(ensure_subnet f2r-private-2c 10.0.12.0/24 ap-northeast-2c no)

            IGW=$(aws ec2 describe-internet-gateways --filters Name=tag:Name,Values=f2r-igw Name=tag:Project,Values=$P \
              --query 'InternetGateways[0].InternetGatewayId' --output text)
            if none "$IGW"; then
              IGW=$(aws ec2 create-internet-gateway --tag-specifications "$(tags internet-gateway f2r-igw)" \
                --query 'InternetGateway.InternetGatewayId' --output text)
              echo "created IGW $IGW"
            else echo "exists IGW $IGW"; fi
            ATT=$(aws ec2 describe-internet-gateways --internet-gateway-ids "$IGW" \
              --query "InternetGateways[0].Attachments[?VpcId=='$VPC'].VpcId" --output text)
            if none "$ATT"; then aws ec2 attach-internet-gateway --vpc-id "$VPC" --internet-gateway-id "$IGW"; echo "attached IGW"; fi

            RT=$(aws ec2 describe-route-tables --filters Name=tag:Name,Values=f2r-public-rt Name=tag:Project,Values=$P \
              --query 'RouteTables[0].RouteTableId' --output text)
            if none "$RT"; then
              RT=$(aws ec2 create-route-table --vpc-id "$VPC" --tag-specifications "$(tags route-table f2r-public-rt)" \
                --query 'RouteTable.RouteTableId' --output text)
              echo "created public RT $RT"
            else echo "exists public RT $RT"; fi
            DEF=$(aws ec2 describe-route-tables --route-table-ids "$RT" \
              --query "RouteTables[0].Routes[?DestinationCidrBlock=='0.0.0.0/0'].GatewayId" --output text)
            if none "$DEF"; then aws ec2 create-route --route-table-id "$RT" --destination-cidr-block 0.0.0.0/0 --gateway-id "$IGW" >/dev/null; echo "created default route"; fi
            for S in "$PUB1" "$PUB2"; do
              ASSOC=$(aws ec2 describe-route-tables --route-table-ids "$RT" \
                --query "RouteTables[0].Associations[?SubnetId=='$S'].SubnetId" --output text)
              if none "$ASSOC"; then aws ec2 associate-route-table --route-table-id "$RT" --subnet-id "$S" >/dev/null; echo "associated $S"; fi
            done

            ensure_sg() { # name desc
              local id
              id=$(aws ec2 describe-security-groups --filters Name=group-name,Values="$1" Name=vpc-id,Values="$VPC" \
                --query 'SecurityGroups[0].GroupId' --output text)
              if none "$id"; then
                id=$(aws ec2 create-security-group --group-name "$1" --description "$2" --vpc-id "$VPC" \
                  --tag-specifications "$(tags security-group "$1")" --query 'GroupId' --output text)
                echo "created SG $1=$id" >&2
              fi
              printf '%s' "$id"
            }
            ALBSG=$(ensure_sg f2r-alb-sg "ALB public")
            EC2SG=$(ensure_sg f2r-ec2-sg "App EC2")
            RDSSG=$(ensure_sg f2r-rds-sg "RDS MySQL")
            add_rule --group-id "$ALBSG" --protocol tcp --port 80 --cidr 0.0.0.0/0
            add_rule --group-id "$ALBSG" --protocol tcp --port 443 --cidr 0.0.0.0/0
            add_rule --group-id "$EC2SG" --protocol tcp --port 8080 --source-group "$ALBSG"
            add_rule --group-id "$RDSSG" --protocol tcp --port 3306 --source-group "$EC2SG"
            echo "VPC=$VPC PUB1=$PUB1 PUB2=$PUB2 PRI1=$PRI1 PRI2=$PRI2 ALBSG=$ALBSG EC2SG=$EC2SG RDSSG=$RDSSG"
          }

          step_ec2() {
            local VPC PUB1 EC2SG AMI IID COUNT ROLE=f2r-ec2-ssm-role PROFILE=f2r-ec2-profile
            local SSM_POLICY=arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
            VPC=$(get_vpc); need VPC "$VPC"
            PUB1=$(get_subnet f2r-public-2a); need public-subnet "$PUB1"
            EC2SG=$(get_sg f2r-ec2-sg); need ec2-sg "$EC2SG"

            # IAM: 역할·정책 연결·인스턴스 프로파일·프로파일 내 역할을 각각 확인한다(부분 실패 후 재실행 안전).
            if ! aws iam get-role --role-name "$ROLE" >/dev/null 2>&1; then
              aws iam create-role --role-name "$ROLE" \
                --assume-role-policy-document '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"ec2.amazonaws.com"},"Action":"sts:AssumeRole"}]}' \
                --tags Key=Project,Value=$P >/dev/null
              echo "created role"
            else echo "exists role"; fi
            ATTACHED=$(aws iam list-attached-role-policies --role-name "$ROLE" \
              --query "AttachedPolicies[?PolicyArn=='$SSM_POLICY'].PolicyArn" --output text)
            if none "$ATTACHED"; then aws iam attach-role-policy --role-name "$ROLE" --policy-arn "$SSM_POLICY"; echo "attached SSM core"; fi
            if ! aws iam get-instance-profile --instance-profile-name "$PROFILE" >/dev/null 2>&1; then
              aws iam create-instance-profile --instance-profile-name "$PROFILE" --tags Key=Project,Value=$P >/dev/null
              echo "created instance profile"
            else echo "exists instance profile"; fi
            INPROF=$(aws iam get-instance-profile --instance-profile-name "$PROFILE" \
              --query "InstanceProfile.Roles[?RoleName=='$ROLE'].RoleName" --output text)
            if none "$INPROF"; then aws iam add-role-to-instance-profile --instance-profile-name "$PROFILE" --role-name "$ROLE"; echo "added role to profile"; fi

            COUNT=$(get_instance | wc -w)
            if [ "$COUNT" -gt 1 ]; then echo "f2r-app 인스턴스가 $COUNT 개 — 중복 생성 의심, 중단(콘솔에서 정리 후 재실행)" >&2; exit 1; fi
            IID=$(get_instance)
            if none "$IID"; then
              AMI=$(aws ssm get-parameter --name /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64 \
                --query 'Parameter.Value' --output text)
              # 인스턴스 프로파일 전파 지연에 대비해 재시도. client-token 으로 같은 요청의 중복 생성도 막는다.
              TOKEN="f2r-app-$(date -u +%Y%m%d)"
              for TRY in 1 2 3 4 5 6; do
                if OUT=$(aws ec2 run-instances --image-id "$AMI" --instance-type t3.medium \
                    --subnet-id "$PUB1" --security-group-ids "$EC2SG" --associate-public-ip-address \
                    --iam-instance-profile Name="$PROFILE" \
                    --metadata-options HttpTokens=required,HttpEndpoint=enabled,HttpPutResponseHopLimit=1 \
                    --block-device-mappings '[{"DeviceName":"/dev/xvda","Ebs":{"VolumeSize":30,"VolumeType":"gp3","Encrypted":true,"DeleteOnTermination":true}}]' \
                    --tag-specifications "$(tags instance f2r-app)" "$(tags volume f2r-app-root)" \
                    --client-token "$TOKEN" --query 'Instances[0].InstanceId' --output text 2>&1); then
                  IID="$OUT"; echo "created EC2 $IID"; break
                elif grep -q -i 'Invalid IAM Instance Profile' <<<"$OUT" && [ "$TRY" -lt 6 ]; then
                  echo "instance profile 전파 대기($TRY/6)"; sleep 10
                else echo "$OUT" >&2; exit 1; fi
              done
            else echo "exists EC2 $IID"; fi
            aws ec2 wait instance-running --instance-ids "$IID"
            aws ec2 wait instance-status-ok --instance-ids "$IID"
            # SSM 에이전트 등록(아웃바운드 443 + 프로파일 + 공인 IP 경로)까지 실제로 확인한다.
            for TRY in $(seq 1 40); do
              PING=$(aws ssm describe-instance-information --filters Key=InstanceIds,Values="$IID" \
                --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || echo None)
              [ "$PING" = "Online" ] && break
              echo "SSM 등록 대기($TRY/40): $PING"; sleep 15
            done
            if [ "$PING" != "Online" ]; then
              echo "SSM Online 아님 — 점검: IGW 기본 라우트, 공인 IP, SG egress 443, 프로파일의 AmazonSSMManagedInstanceCore" >&2; exit 1
            fi
            echo "instance_id=$IID" >> "$GITHUB_OUTPUT"
            echo "EC2 $IID SSM Online"
          }

          step_rds_shell() {
            # 데이터 없는 껍데기만 (서브넷 그룹 + 파라미터 그룹). 복원은 별도 승인.
            local PRI1 PRI2 PGNAME VER
            PRI1=$(get_subnet f2r-private-2a); need private-2a "$PRI1"
            PRI2=$(get_subnet f2r-private-2c); need private-2c "$PRI2"
            PGNAME="f2r-${DB_PARAM_FAMILY//./}-params"
            if ! aws rds describe-db-subnet-groups --db-subnet-group-name f2r-db-subnets >/dev/null 2>&1; then
              aws rds create-db-subnet-group --db-subnet-group-name f2r-db-subnets \
                --db-subnet-group-description "f2r migration private subnets" --subnet-ids "$PRI1" "$PRI2" \
                --tags Key=Project,Value=$P >/dev/null
              echo "created subnet group"
            else echo "exists subnet group"; fi
            if ! aws rds describe-db-parameter-groups --db-parameter-group-name "$PGNAME" >/dev/null 2>&1; then
              aws rds create-db-parameter-group --db-parameter-group-name "$PGNAME" \
                --db-parameter-group-family "$DB_PARAM_FAMILY" --description "f2r migration $DB_PARAM_FAMILY params" \
                --tags Key=Project,Value=$P >/dev/null
              echo "created parameter group $PGNAME ($DB_PARAM_FAMILY)"
            else echo "exists parameter group $PGNAME"; fi
            VER=$(aws rds describe-db-engine-versions --engine mysql \
              --query "DBEngineVersions[?starts_with(EngineVersion,'${DB_PARAM_FAMILY#mysql}')].EngineVersion" --output text | tr '\t' '\n' | sort -V | tail -1)
            echo "latest MySQL ${DB_PARAM_FAMILY#mysql} engine version: ${VER:-none} (복원은 스냅샷 버전과 같은 패밀리여야 함)"
          }

          step_alb() {
            local VPC PUB1 PUB2 ALBSG ALB TG IID
            VPC=$(get_vpc); need VPC "$VPC"
            PUB1=$(get_subnet f2r-public-2a); need public-2a "$PUB1"
            PUB2=$(get_subnet f2r-public-2c); need public-2c "$PUB2"
            ALBSG=$(get_sg f2r-alb-sg); need alb-sg "$ALBSG"
            ALB=$(aws elbv2 describe-load-balancers --names f2r-alb --query 'LoadBalancers[0].LoadBalancerArn' --output text 2>/dev/null || echo None)
            if none "$ALB"; then
              ALB=$(aws elbv2 create-load-balancer --name f2r-alb --scheme internet-facing --type application \
                --subnets "$PUB1" "$PUB2" --security-groups "$ALBSG" \
                --tags Key=Project,Value=$P Key=Name,Value=f2r-alb \
                --query 'LoadBalancers[0].LoadBalancerArn' --output text)
              echo "created ALB $ALB"
            else echo "exists ALB $ALB"; fi
            # 속성은 매번 보정: 유휴 180초(정본 요구 ≥180), 잘못된 헤더 폐기, 삭제 방지.
            aws elbv2 modify-load-balancer-attributes --load-balancer-arn "$ALB" --attributes \
              Key=idle_timeout.timeout_seconds,Value=180 \
              Key=routing.http.drop_invalid_header_fields.enabled,Value=true \
              Key=deletion_protection.enabled,Value=true >/dev/null
            TG=$(aws elbv2 describe-target-groups --names f2r-app-tg --query 'TargetGroups[0].TargetGroupArn' --output text 2>/dev/null || echo None)
            if none "$TG"; then
              TG=$(aws elbv2 create-target-group --name f2r-app-tg --protocol HTTP --port 8080 --vpc-id "$VPC" \
                --target-type instance --health-check-path "$HEALTH_PATH" --health-check-interval-seconds 30 \
                --healthy-threshold-count 2 --unhealthy-threshold-count 3 \
                --tags Key=Project,Value=$P \
                --query 'TargetGroups[0].TargetGroupArn' --output text)
              echo "created TG $TG"
            else echo "exists TG $TG"; fi
            aws elbv2 modify-target-group-attributes --target-group-arn "$TG" \
              --attributes Key=deregistration_delay.timeout_seconds,Value=60 >/dev/null
            IID=$(get_instance)
            if none "$IID"; then echo "f2r-app 없음 — ec2 단계 먼저(대상 등록 건너뜀)" >&2; exit 1; fi
            aws elbv2 register-targets --target-group-arn "$TG" --targets Id="$IID",Port=8080   # 멱등
            echo "registered $IID -> TG (헬스: $HEALTH_PATH)"
            L80=$(aws elbv2 describe-listeners --load-balancer-arn "$ALB" --query "Listeners[?Port==\`80\`].ListenerArn" --output text)
            if none "$L80"; then
              aws elbv2 create-listener --load-balancer-arn "$ALB" --protocol HTTP --port 80 \
                --default-actions '[{"Type":"redirect","RedirectConfig":{"Protocol":"HTTPS","Port":"443","StatusCode":"HTTP_301"}}]' >/dev/null
              echo "created HTTP->HTTPS redirect listener"
            else echo "exists HTTP listener"; fi
            echo "ALB DNS: $(aws elbv2 describe-load-balancers --names f2r-alb --query 'LoadBalancers[0].DNSName' --output text)"
            echo "※ 443 리스너는 ACM 인증서가 ISSUED 가 된 뒤 alb-https 단계에서 추가"
          }

          step_acm() {
            local CERT TRY
            CERT=$(aws acm list-certificates --certificate-statuses PENDING_VALIDATION ISSUED \
              --query "CertificateSummaryList[?DomainName=='feel2real.co.kr'].CertificateArn | [0]" --output text)
            if none "$CERT"; then
              CERT=$(aws acm request-certificate --domain-name feel2real.co.kr \
                --subject-alternative-names '*.feel2real.co.kr' --validation-method DNS \
                --idempotency-token f2rmigration --tags Key=Project,Value=$P \
                --query 'CertificateArn' --output text)
              echo "requested $CERT"
            else echo "exists $CERT"; fi
            for TRY in $(seq 1 12); do
              N=$(aws acm describe-certificate --certificate-arn "$CERT" \
                --query 'length(Certificate.DomainValidationOptions[?ResourceRecord!=null])' --output text)
              [ "${N:-0}" -ge 1 ] && break
              sleep 5
            done
            echo "### DNS 검증용 CNAME — 권한 DNS(구 Route53 또는 가비아)에 추가하는 레코드(추가만, 기존 레코드 변경 없음). 등록은 사용자 승인 후 클로드가 수행"
            aws acm describe-certificate --certificate-arn "$CERT" \
              --query 'Certificate.DomainValidationOptions[*].{Domain:DomainName,Name:ResourceRecord.Name,Value:ResourceRecord.Value}' --output table
          }

          step_alb_https() {
            local ALB TG CERT L443
            ALB=$(aws elbv2 describe-load-balancers --names f2r-alb --query 'LoadBalancers[0].LoadBalancerArn' --output text); need ALB "$ALB"
            TG=$(aws elbv2 describe-target-groups --names f2r-app-tg --query 'TargetGroups[0].TargetGroupArn' --output text); need TG "$TG"
            CERT=$(aws acm list-certificates --certificate-statuses ISSUED \
              --query "CertificateSummaryList[?DomainName=='feel2real.co.kr'].CertificateArn | [0]" --output text)
            if none "$CERT"; then echo "ISSUED 인증서 없음 — DNS 검증 CNAME 등록 후 재실행" >&2; exit 1; fi
            L443=$(aws elbv2 describe-listeners --load-balancer-arn "$ALB" --query "Listeners[?Port==\`443\`].ListenerArn" --output text)
            if none "$L443"; then
              aws elbv2 create-listener --load-balancer-arn "$ALB" --protocol HTTPS --port 443 \
                --ssl-policy ELBSecurityPolicy-TLS13-1-2-2021-06 --certificates CertificateArn="$CERT" \
                --default-actions Type=forward,TargetGroupArn="$TG" >/dev/null
              echo "created HTTPS 443 listener (forward -> f2r-app-tg)"
            else echo "exists HTTPS listener"; fi
            aws elbv2 describe-target-health --target-group-arn "$TG" \
              --query 'TargetHealthDescriptions[*].{Id:Target.Id,State:TargetHealth.State,Reason:TargetHealth.Reason}' --output table
          }

          step_smoke() {
            local IID CID
            IID=$(get_instance); need f2r-app "$IID"
            CID=$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript \
              --parameters '{"commands":["echo smoke-ok-builder","uptime","free -m | head -2"]}' \
              --query 'Command.CommandId' --output text)
            aws ssm wait command-executed --command-id "$CID" --instance-id "$IID"
            aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" \
              --query 'StandardOutputContent' --output text
            echo "instance_id=$IID" >> "$GITHUB_OUTPUT"
          }

          step_s3() {
            local B=f2r-deploy-425805163960
            if ! aws s3api head-bucket --bucket "$B" 2>/dev/null; then
              aws s3api create-bucket --bucket "$B" --region ap-northeast-2 \
                --create-bucket-configuration LocationConstraint=ap-northeast-2
              echo "created bucket"
            else echo "exists bucket"; fi
            aws s3api put-public-access-block --bucket "$B" --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
            aws s3api put-bucket-encryption --bucket "$B" --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-bucket-tagging --bucket "$B" --tagging "TagSet=[{Key=Project,Value=$P}]"
          }

          step_provision() {
            local IID CID ST
            IID=$(get_instance); need f2r-app "$IID"
            B64=$(base64 -w0 scripts/deploy/provision-new-host.sh)
            CID=$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript \
              --timeout-seconds 1500 \
              --parameters "{\"commands\":[\"echo $B64 | base64 -d > /tmp/provision.sh\",\"bash /tmp/provision.sh\"]}" \
              --query 'Command.CommandId' --output text)
            for _ in $(seq 1 100); do
              ST=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)
              case "$ST" in Success|Failed|Cancelled|TimedOut) break;; esac; sleep 15
            done
            aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" \
              --query '{out:StandardOutputContent,err:StandardErrorContent}' --output text | tail -c 6000
            [ "$ST" = Success ] || { echo "provision status=$ST" >&2; exit 1; }
          }

          step_restore_rds() {
            local RDSSG DBID=f2r-db PGN
            [ -n "$DB_SNAPSHOT" ] || { echo "db_snapshot 필요" >&2; exit 1; }
            RDSSG=$(get_sg f2r-rds-sg); need rds-sg "$RDSSG"
            PGN="f2r-${DB_PARAM_FAMILY//./}-params"
            if aws rds describe-db-instances --db-instance-identifier $DBID >/dev/null 2>&1; then echo "exists $DBID"; return 0; fi
            aws rds restore-db-instance-from-db-snapshot --db-instance-identifier $DBID \
              --db-snapshot-identifier "$DB_SNAPSHOT" --db-instance-class db.t4g.micro \
              --db-subnet-group-name f2r-db-subnets --vpc-security-group-ids "$RDSSG" \
              --no-publicly-accessible --no-multi-az --db-parameter-group-name "$PGN" \
              --tags Key=Project,Value=$P >/dev/null
            aws rds wait db-instance-available --db-instance-identifier $DBID
            aws rds modify-db-instance --db-instance-identifier $DBID --storage-type gp3 \
              --backup-retention-period 7 --apply-immediately >/dev/null
            echo "restored $DBID (endpoint는 공개 로그에 출력하지 않음)"
          }

          # 신규 계정 배포 역할(github-actions-f2r-deploy)의 신뢰·권한을 저장소 JSON(승인된 설계)과 일치시킨다.
          # 기존 추가 인라인 정책은 삭제하지 않는다(조사 전 보존).
          step_fix_deploy_role() {
            local D=docs/operations/aws-migration
            aws iam update-assume-role-policy --role-name github-actions-f2r-deploy --policy-document "file://$D/trust-github-actions-f2r-deploy.json"
            aws iam put-role-policy --role-name github-actions-f2r-deploy --policy-name f2r-deploy-smoke-ssm --policy-document "file://$D/policy-f2r-deploy-smoke-ssm.json"
            echo "deploy role trust/policy synced from repo JSON"
            # EC2 인스턴스 역할: SSM 파라미터 읽기 + 배포 버킷 읽기(저장소 JSON). 신뢰 정책은 변경하지 않는다.
            aws iam put-role-policy --role-name f2r-ec2-ssm-role --policy-name f2r-ec2-secrets-read --policy-document "file://$D/policy-f2r-ec2-secrets-read.json"
            echo "ec2 role policy synced from repo JSON"
          }

          # 진단: 신규 호스트의 가장 최근 SSM 명령(배포 스크립트) 출력 끝부분을 마스킹해서 보여준다(읽기 전용).
          step_ssm_last_output() {
            local IID
            IID=$(get_instance); need f2r-app "$IID"
            aws ssm list-command-invocations --instance-id "$IID" --details --max-items 1 \
              --query 'CommandInvocations[0].CommandPlugins[0].[Status,Output]' --output text \
              | sed -E 's/((KEY|SECRET|TOKEN|PASSWORD|PASS)[A-Za-z_]*=)[^ ]+/\1<masked>/Ig' | tail -c 5000
          }

          # 진단: 신규 호스트 f2r-app 상태·최근 로그(마스킹, 읽기 전용).
          step_app_diag() {
            local IID CID
            IID=$(get_instance); need f2r-app "$IID"
            CID=$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript \
              --parameters '{"commands":["systemctl is-active f2r-app; ls -la /home/ec2-user/app.jar; java -version 2>&1 | head -1; free -m | sed -n 2p; ss -ltn | grep -E \":(8080|8000)\" || echo no-listener; echo ---; journalctl -u f2r-app --no-pager -n 3000 | grep -E \"APPLICATION FAILED|Description:|Action:|Caused by|ERROR|Exception|Failed to|Could not|exited|OutOfMemory|Killed\" | sed -E \"s/^.*compute.internal //\" | tail -22 | cut -c1-420"]}' \
              --query 'Command.CommandId' --output text)
            aws ssm wait command-executed --command-id "$CID" --instance-id "$IID" || true
            aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query 'StandardOutputContent' --output text \
              | sed -E 's/((KEY|SECRET|TOKEN|PASSWORD|PASS)[A-Za-z_]*=)[^ ]+/\1<masked>/Ig; s/jdbc:mysql:\/\/[^ \/]+/jdbc:mysql:\/\/<host>/g' | tail -c 7000
          }

          # AcademyCraft 신규 계정 운영 준비 상태만 조회한다. 생성·수정·재시작 없음.
          step_academycraft_preflight() {
            local ACCOUNT IID B64 CID ALB LISTENER
            ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
            [ "$ACCOUNT" = "425805163960" ] || { echo wrong-account; exit 1; }
            IID=$(get_instance); need f2r-app "$IID"
            [[ "$IID" != *$'\t'* && "$IID" != *' '* ]] || { echo ambiguous-instance; exit 1; }
            aws ec2 describe-instances --instance-ids "$IID" --query 'Reservations[].Instances[].{Id:InstanceId,Type:InstanceType,State:State.Name}' --output table
            aws rds describe-db-instances --query 'DBInstances[].{Id:DBInstanceIdentifier,Engine:Engine,Version:EngineVersion,BackupDays:BackupRetentionPeriod,LatestRestore:LatestRestorableTime,Storage:AllocatedStorage}' --output table
            aws rds describe-db-snapshots --query 'DBSnapshots[].{Id:DBSnapshotIdentifier,Created:SnapshotCreateTime,Status:Status}' --output table
            if aws iam get-role --role-name github-actions-academycraft-deploy --query 'Role.{Arn:Arn,Trust:AssumeRolePolicyDocument}' --output json; then :; else echo academycraft-deploy-role-unavailable; fi
            ALB=$(aws elbv2 describe-load-balancers --names f2r-alb --query 'LoadBalancers[0].LoadBalancerArn' --output text)
            LISTENER=$(aws elbv2 describe-listeners --load-balancer-arn "$ALB" --query 'Listeners[?Port==`443`].ListenerArn' --output text)
            aws elbv2 describe-rules --listener-arn "$LISTENER" --query 'Rules[].{Priority:Priority,Conditions:Conditions,Actions:Actions}' --output json
            B64=$(base64 -w0 scripts/operations/academycraft-preflight.sh)
            CID=$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript --parameters "$(jq -cn --arg c "echo $B64 | base64 -d | bash" '{commands:[$c]}')" --query Command.CommandId --output text)
            aws ssm wait command-executed --command-id "$CID" --instance-id "$IID" || true
            aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' --output json
            [ "$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query Status --output text)" = Success ]
          }

          # 입시상담 읽기 전용 진단: 2027·2028 자료 상태별 건수, 대학별 일정, 출처·승인 상태, 검색 인덱스, 앱 상태.
          # 쓰기 SQL 없음(READ ONLY 트랜잭션). 신규 계정(425805163960) 확인 후에만 실행한다.
          step_admissions_diag() {
            local ACCOUNT IID B64 CID
            ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
            [ "$ACCOUNT" = "425805163960" ] || { echo wrong-account; exit 1; }
            IID=$(get_instance); need f2r-app "$IID"
            [[ "$IID" != *$'\t'* && "$IID" != *' '* ]] || { echo ambiguous-instance; exit 1; }
            B64=$(base64 -w0 scripts/operations/admissions-diag.sh)
            CID=$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript --parameters "$(jq -cn --arg c "echo $B64 | base64 -d | bash" '{commands:[$c]}')" --query Command.CommandId --output text)
            aws ssm wait command-executed --command-id "$CID" --instance-id "$IID" || true
            aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' --output json \
              | sed -E 's/((KEY|SECRET|TOKEN|PASSWORD|PASS)[A-Za-z_]*=)[^ ]+/\1<masked>/Ig'
            [ "$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query Status --output text)" = Success ]
          }

          # 신규 계정 ALB·CloudWatch·호스트 읽기 전용 진단(생성·수정·재시작 없음). 일시 503 원인 조사용.
          # 구간은 입력(diag_start/diag_end, UTC, 24시간 이내)이며 비우면 2026-10-19 20:30~21:30Z.
          step_alb_diag() {
            local ACCOUNT S E SJ EJ LB_ARN LB_DIM TG_ARNS TG TGD IID ID CMD CID m
            ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
            [ "$ACCOUNT" = "425805163960" ] || { echo wrong-account; exit 1; }
            # shellcheck source=/dev/null
            source scripts/operations/alb-diag-lib.sh
            S="${DIAG_START:-2026-10-19T20:30:00Z}"; E="${DIAG_END:-2026-10-19T21:30:00Z}"
            diag_validate_window "$S" "$E"
            SJ=$(diag_to_journal_time "$S"); EJ=$(diag_to_journal_time "$E")
            echo "### 진단 구간(UTC): $S ~ $E (읽기 전용)"
            cw() { # namespace metric dimensions statistic period
              local out
              if out=$(aws cloudwatch get-metric-statistics --namespace "$1" --metric-name "$2" --dimensions $3 \
                  --start-time "$S" --end-time "$E" --period "$5" --statistics "$4" \
                  --query "sort_by(Datapoints,&Timestamp)[].[Timestamp,$4]" --output text 2>&1); then
                echo "[$2 / $4]"
                if [ "$4" = Sum ]; then diag_summ_sum <<<"$out"; else diag_summ_avg <<<"$out"; fi
              else
                echo "[$2 / $4] 조회 실패: $(head -c 160 <<<"$out" | tr '\n' ' ')"
              fi
            }
            echo "### caller"; aws sts get-caller-identity --query '{Account:Account,Arn:Arn}' --output table
            LB_ARN=$(aws elbv2 describe-load-balancers --names f2r-alb --query 'LoadBalancers[0].LoadBalancerArn' --output text)
            need f2r-alb "$LB_ARN"
            LB_DIM="Name=LoadBalancer,Value=${LB_ARN#*:loadbalancer/}"
            echo "### ALB"
            aws elbv2 describe-load-balancers --names f2r-alb \
              --query 'LoadBalancers[0].{State:State.Code,Scheme:Scheme,Type:Type,AZs:AvailabilityZones[].ZoneName,Created:CreatedTime}' --output json
            aws elbv2 describe-load-balancer-attributes --load-balancer-arn "$LB_ARN" \
              --query "Attributes[?Key=='idle_timeout.timeout_seconds'||Key=='access_logs.s3.enabled'||Key=='deletion_protection.enabled'].{K:Key,V:Value}" --output table
            TG_ARNS=$(aws elbv2 describe-target-groups --load-balancer-arn "$LB_ARN" --query 'TargetGroups[].TargetGroupArn' --output text)
            need target-group "$TG_ARNS"
            for TG in $TG_ARNS; do
              echo "### Target group: ${TG##*:}"
              aws elbv2 describe-target-groups --target-group-arns "$TG" \
                --query 'TargetGroups[0].{Port:Port,Protocol:Protocol,HC_Path:HealthCheckPath,HC_Interval:HealthCheckIntervalSeconds,HC_Timeout:HealthCheckTimeoutSeconds,Healthy:HealthyThresholdCount,Unhealthy:UnhealthyThresholdCount,Matcher:Matcher.HttpCode}' --output json
              aws elbv2 describe-target-group-attributes --target-group-arn "$TG" \
                --query "Attributes[?Key=='deregistration_delay.timeout_seconds'||Key=='slow_start.duration_seconds'].{K:Key,V:Value}" --output table
              echo "--- 현재 Target Health"
              aws elbv2 describe-target-health --target-group-arn "$TG" \
                --query 'TargetHealthDescriptions[].{Target:Target.Id,Port:Target.Port,State:TargetHealth.State,Reason:TargetHealth.Reason,Desc:TargetHealth.Description}' --output table
              echo "--- CloudWatch (대상 그룹, 60초)"
              TGD="$LB_DIM Name=TargetGroup,Value=${TG##*:}"
              cw AWS/ApplicationELB HealthyHostCount "$TGD" Minimum 60
              cw AWS/ApplicationELB UnHealthyHostCount "$TGD" Maximum 60
              cw AWS/ApplicationELB HTTPCode_Target_5XX_Count "$TGD" Sum 60
              cw AWS/ApplicationELB TargetConnectionErrorCount "$TGD" Sum 60
              cw AWS/ApplicationELB TargetResponseTime "$TGD" Maximum 60
            done
            echo "### CloudWatch (ALB 전체, 60초)"
            for m in RequestCount HTTPCode_ELB_503_Count HTTPCode_ELB_5XX_Count HTTPCode_Target_5XX_Count RejectedConnectionCount TargetConnectionErrorCount; do
              cw AWS/ApplicationELB "$m" "$LB_DIM" Sum 60
            done
            IID=$(get_instance); need f2r-app "$IID"
            [[ "$IID" != *$'\t'* && "$IID" != *' '* ]] || { echo ambiguous-instance; exit 1; }
            echo "### EC2 $IID"
            aws ec2 describe-instances --instance-ids "$IID" \
              --query 'Reservations[0].Instances[0].{Type:InstanceType,State:State.Name,Launch:LaunchTime,Monitoring:Monitoring.State,AZ:Placement.AvailabilityZone}' --output json
            aws ec2 describe-instance-credit-specifications --instance-ids "$IID" \
              --query 'InstanceCreditSpecifications[].{Id:InstanceId,CpuCredits:CpuCredits}' --output json || echo "credit-spec 조회 실패(T 계열이 아니거나 권한 없음)"
            echo "### CloudWatch (EC2, 300초 — 기본 모니터링)"
            ID="Name=InstanceId,Value=$IID"
            cw AWS/EC2 CPUUtilization "$ID" Average 300
            cw AWS/EC2 CPUUtilization "$ID" Maximum 300
            cw AWS/EC2 CPUCreditBalance "$ID" Minimum 300
            cw AWS/EC2 CPUCreditUsage "$ID" Sum 300
            cw AWS/EC2 CPUSurplusCreditBalance "$ID" Maximum 300
            cw AWS/EC2 CPUSurplusCreditsCharged "$ID" Maximum 300
            cw AWS/EC2 StatusCheckFailed "$ID" Maximum 300
            echo "### 호스트(SSM, 읽기 전용 고정 명령). 메모리는 과거 지표가 없어 '현재' 값만 확인한다"
            CMD="echo '== uptime/load'; uptime; echo '== memory(현재)'; free -m; echo '== 상위 프로세스(메모리)'; ps -eo pid,comm,%cpu,%mem,rss --sort=-%mem | head -6; echo '== disk /'; df -h / | tail -1; echo '== f2r-app'; systemctl show f2r-app -p ActiveState -p SubState -p NRestarts -p ActiveEnterTimestamp -p MemoryCurrent; echo '== 커널 OOM(구간)'; journalctl -k --since '$SJ' --until '$EJ' --no-pager 2>/dev/null | grep -Ei 'out of memory|oom-kill|killed process' | tail -5 || true; echo '== 앱 기동·중지 이벤트(구간)'; journalctl -u f2r-app --since '$SJ' --until '$EJ' --no-pager 2>/dev/null | grep -E 'Started |Stopping |Stopped |Tomcat started|OutOfMemory|APPLICATION FAILED|Connection is not available|HikariPool.*(Failed|timeout)' | cut -c1-200 | tail -30 || true; echo '== 앱 WARN/ERROR 건수(구간)'; journalctl -u f2r-app --since '$SJ' --until '$EJ' --no-pager 2>/dev/null | grep -c -E ' (WARN|ERROR) ' || true; echo '== TCP listen overflow(누적)'; nstat -az TcpExtListenOverflows TcpExtListenDrops 2>/dev/null || true"
            CID=$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript \
              --parameters "$(jq -cn --arg c "$CMD" '{commands:[$c]}')" --query Command.CommandId --output text)
            aws ssm wait command-executed --command-id "$CID" --instance-id "$IID" || true
            echo "--- SSM status: $(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query Status --output text)"
            aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query StandardOutputContent --output text \
              | sed -E 's/((KEY|SECRET|TOKEN|PASSWORD|PASS)[A-Za-z_]*=)[^ ]+/\1<masked>/Ig' | tail -c 7000
            echo "--- stderr"
            aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query StandardErrorContent --output text | tail -c 1000
          }

          # A1(블루·그린) 사전 점검 — 읽기 전용(describe/get/list·SELECT·free/ps/ss). 생성·수정·재시작·포트 점유 없음.
          # AWS: SG 인바운드(8083 외부 노출 여부), ALB 리스너·타깃 그룹 설정, RDS 3종 인벤토리·14일 연결/CPU, 배포 역할 권한 시뮬레이션.
          # 호스트: 메모리·JVM·cgroup·포트·DB 연결·Flyway 상태(scripts/operations/a1-precheck.sh).
          # 운영 DB 보호(사용자 승인 2026-10-23): 자동 백업 보존 2→7일 + 삭제 보호 켜기. 대상은 운영 DB 하나로 고정.
          # 확인 문자열(confirm=PROTECT-f2r-db-202610181331) 필수. 대기 중 변경(PendingModifiedValues)이 있으면
          # --apply-immediately가 그것까지 적용하므로 중단한다. 보존 기간 0이 아닌 값 간 변경·삭제 보호는 재시작이 없다.
          step_rds_protect() {
            local ACCOUNT DB=f2r-db-202610181331 STATUS PENDING i
            ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
            [ "$ACCOUNT" = "425805163960" ] || { echo wrong-account; exit 1; }
            [ "${CONFIRM:-}" = "PROTECT-$DB" ] || { echo "confirm 값이 PROTECT-$DB 와 다릅니다 — 변경하지 않음"; exit 1; }
            rds_state() {
              aws rds describe-db-instances --db-instance-identifier "$DB" \
                --query 'DBInstances[0].{Status:DBInstanceStatus,BackupDays:BackupRetentionPeriod,DeletionProtection:DeletionProtection,Pending:PendingModifiedValues,LatestRestorable:LatestRestorableTime}' --output json
            }
            echo "### 변경 전"; rds_state
            STATUS=$(aws rds describe-db-instances --db-instance-identifier "$DB" --query 'DBInstances[0].DBInstanceStatus' --output text)
            [ "$STATUS" = available ] || { echo "DB 상태가 available이 아님($STATUS) — 중단"; exit 1; }
            PENDING=$(aws rds describe-db-instances --db-instance-identifier "$DB" --query 'length(keys(DBInstances[0].PendingModifiedValues))' --output text)
            [ "$PENDING" = 0 ] || { echo "대기 중 변경이 있어 중단합니다: $PENDING"; exit 1; }
            aws rds modify-db-instance --db-instance-identifier "$DB" --backup-retention-period 7 --deletion-protection --apply-immediately \
              --query 'DBInstance.{Status:DBInstanceStatus,Pending:PendingModifiedValues}' --output json
            for i in $(seq 1 60); do
              sleep 15
              STATUS=$(aws rds describe-db-instances --db-instance-identifier "$DB" --query 'DBInstances[0].DBInstanceStatus' --output text)
              PENDING=$(aws rds describe-db-instances --db-instance-identifier "$DB" --query 'length(keys(DBInstances[0].PendingModifiedValues))' --output text)
              [ "$STATUS" = available ] && [ "$PENDING" = 0 ] && break
              echo "대기 $i: status=$STATUS"
            done
            echo "### 변경 후"; rds_state
            [ "$(aws rds describe-db-instances --db-instance-identifier "$DB" --query 'DBInstances[0].BackupRetentionPeriod' --output text)" = 7 ] || { echo "보존 기간 7 미반영"; exit 1; }
            [ "$(aws rds describe-db-instances --db-instance-identifier "$DB" --query 'DBInstances[0].DeletionProtection' --output text)" = True ] || { echo "삭제 보호 미반영"; exit 1; }
          }

          # 배포 직전 스냅샷 전용 역할(github-actions-f2r-snapshot)을 저장소 JSON 그대로 만든다/맞춘다. 비밀값 없음.
          # 권한은 운영 DB 하나에서 f2r-predeploy-* 스냅샷 생성·태그와 조회뿐. 만든 뒤 IAM 시뮬레이션으로 허용·거부를 확인한다.
          # 배포 역할·빌더 역할은 바꾸지 않고, 두 역할의 스냅샷 생성 권한은 참고로만 출력한다.
          step_snapshot_role_setup() {
            local ACCOUNT D=docs/operations/aws-migration ROLE=github-actions-f2r-snapshot A R DB SN bad=0
            ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
            [ "$ACCOUNT" = "425805163960" ] || { echo wrong-account; exit 1; }
            if aws iam get-role --role-name "$ROLE" >/dev/null 2>&1; then
              aws iam update-assume-role-policy --role-name "$ROLE" --policy-document "file://$D/trust-github-actions-f2r-snapshot.json"
              echo "role $ROLE trust synced"
            else
              aws iam create-role --role-name "$ROLE" --assume-role-policy-document "file://$D/trust-github-actions-f2r-snapshot.json" \
                --description "Feel2Real pre-deploy RDS snapshot only" --max-session-duration 3600 --tags Key=Project,Value=$P >/dev/null
              echo "role $ROLE created"
            fi
            aws iam put-role-policy --role-name "$ROLE" --policy-name f2r-predeploy-snapshot --policy-document "file://$D/policy-f2r-predeploy-snapshot.json"
            echo "inline policies: $(aws iam list-role-policies --role-name "$ROLE" --query 'PolicyNames' --output text); managed: $(aws iam list-attached-role-policies --role-name "$ROLE" --query 'length(AttachedPolicies)' --output text)"
            R="arn:aws:iam::$ACCOUNT:role"; DB="arn:aws:rds:ap-northeast-2:$ACCOUNT:db"; SN="arn:aws:rds:ap-northeast-2:$ACCOUNT:snapshot"
            sim() { aws iam simulate-principal-policy --policy-source-arn "$1" --action-names "$2" --resource-arns "$3" --query 'EvaluationResults[0].EvalDecision' --output text; }
            expect() { A=$(sim "$R/$ROLE" "$1" "$2"); echo "snapshot-role $1 $2 => $A (expect $3)"; [ "$A" = "$3" ] || bad=1; }
            expect rds:CreateDBSnapshot "$DB:f2r-db-202610181331" allowed
            expect rds:CreateDBSnapshot "$SN:f2r-predeploy-202601010000-00000000" allowed
            expect rds:AddTagsToResource "$SN:f2r-predeploy-202601010000-00000000" allowed
            expect rds:CreateDBSnapshot "$DB:f2r-db" implicitDeny
            expect rds:CreateDBSnapshot "$DB:f2r-db-202610181240" implicitDeny
            expect rds:CreateDBSnapshot "$SN:manual-other" implicitDeny
            expect rds:DeleteDBSnapshot "$SN:f2r-predeploy-202601010000-00000000" implicitDeny
            expect rds:RestoreDBInstanceFromDBSnapshot "$DB:f2r-db-202610181331" implicitDeny
            expect rds:ModifyDBInstance "$DB:f2r-db-202610181331" implicitDeny
            expect rds:DeleteDBInstance "$DB:f2r-db-202610181331" implicitDeny
            echo "참고(변경 없음) deploy-role CreateDBSnapshot => $(sim "$R/github-actions-f2r-deploy" rds:CreateDBSnapshot "$DB:f2r-db-202610181331" 2>&1 | tail -1)"
            echo "참고(변경 없음) infra-builder CreateDBSnapshot => $(sim "$R/f2r-infra-builder" rds:CreateDBSnapshot "$DB:f2r-db-202610181331" 2>&1 | tail -1)"
            [ "$bad" = 0 ] || { echo "스냅샷 역할 권한이 기대와 다릅니다"; exit 1; }
          }

          step_a1_precheck() {
            # Capture raw AWS/SSM responses in memory; only typed allowlisted fields reach logs.
            set +x
            python3 scripts/operations/a1-aws-precheck.py
          }

          # 읽기 전용 진단 기반(#875)을 저장소 JSON 그대로 만든다: 고정 SSM 문서 F2R-ReadOnlyStatus와
          # 별도 역할 github-actions-f2r-readonly. 배포 역할(github-actions-f2r-deploy)은 건드리지 않는다. 비밀값 없음.
          step_readonly_setup() {
            local ACCOUNT D=docs/operations/aws-migration DOC=F2R-ReadOnlyStatus ROLE=github-actions-f2r-readonly V
            ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
            [ "$ACCOUNT" = "425805163960" ] || { echo wrong-account; exit 1; }
            if aws ssm describe-document --name "$DOC" >/dev/null 2>&1; then
              # shellcheck disable=SC2016 # '$LATEST'는 SSM 문서 버전 리터럴
              if V=$(aws ssm update-document --name "$DOC" --document-version '$LATEST' --document-format JSON \
                  --content "file://$D/ssm-document-F2R-ReadOnlyStatus.json" --query DocumentDescription.DocumentVersion --output text 2>/tmp/upd.err); then
                aws ssm update-document-default-version --name "$DOC" --document-version "$V" >/dev/null
                echo "ssm document $DOC updated to version $V (default)"
              elif grep -q DuplicateDocumentContent /tmp/upd.err; then echo "ssm document $DOC unchanged"
              else cat /tmp/upd.err >&2; exit 1; fi
            else
              aws ssm create-document --name "$DOC" --document-type Command --document-format JSON \
                --content "file://$D/ssm-document-F2R-ReadOnlyStatus.json" --tags Key=Project,Value=$P >/dev/null
              echo "ssm document $DOC created"
            fi
            if aws iam get-role --role-name "$ROLE" >/dev/null 2>&1; then
              aws iam update-assume-role-policy --role-name "$ROLE" --policy-document "file://$D/trust-github-actions-f2r-readonly.json"
              echo "role $ROLE trust synced"
            else
              aws iam create-role --role-name "$ROLE" --assume-role-policy-document "file://$D/trust-github-actions-f2r-readonly.json" \
                --description "Feel2Real read-only diagnostics (fixed SSM document only)" --max-session-duration 3600 --tags Key=Project,Value=$P >/dev/null
              echo "role $ROLE created"
            fi
            aws iam put-role-policy --role-name "$ROLE" --policy-name f2r-readonly-status --policy-document "file://$D/policy-f2r-readonly-status.json"
            echo "inline policy f2r-readonly-status synced"
            echo "attached managed policies: $(aws iam list-attached-role-policies --role-name "$ROLE" --query 'length(AttachedPolicies)' --output text)"
            echo "inline policies: $(aws iam list-role-policies --role-name "$ROLE" --query 'PolicyNames' --output text)"
            aws ssm describe-document --name "$DOC" --query 'Document.{Name:Name,DefaultVersion:DefaultVersion,Status:Status,Hash:Hash}' --output table
          }

          step_all_infra() {
            # s3 는 마지막: IAM 정책 반영(부트스트랩 apply) 순서와 무관하게 나머지 구축이 막히지 않게 한다.
            step_validate; step_vpc; step_rds_shell; step_ec2; step_alb; step_acm
            step_provision; step_s3
          }

          case "$STEP" in
            all-infra) step_all_infra ;;
            fix-deploy-role) step_fix_deploy_role ;;
            ssm-last-output) step_ssm_last_output ;;
            app-diag) step_app_diag ;;
            alb-diag) step_alb_diag ;;
            academycraft-preflight) step_academycraft_preflight ;;
            readonly-setup) step_readonly_setup ;;
            admissions-diag) step_admissions_diag ;;
            a1-precheck) step_a1_precheck ;;
            rds-protect) step_rds_protect ;;
            snapshot-role-setup) step_snapshot_role_setup ;;
            s3) step_s3 ;;
            provision) step_provision ;;
            restore-rds) step_restore_rds ;;
            validate) step_validate ;;
            vpc) step_vpc ;;
            ec2) step_ec2 ;;
            rds-shell) step_rds_shell ;;
            alb) step_alb ;;
            acm) step_acm ;;
            alb-https) step_alb_https ;;
            smoke) step_smoke ;;
            *) echo "unknown step"; exit 1 ;;
          esac

  # 배포 직전 수동 스냅샷(사용자 승인 후 실행). 빌더 역할이 아니라 스냅샷 전용 최소 권한 역할만 쓴다.
  # 대상은 운영 DB 하나로 고정, 생성 1건과 available 대기만 한다(삭제·복원·수정 없음).
  # 이름: f2r-predeploy-<UTC YYYYMMDDHHMM>-<이 실행의 커밋 앞 8자리> — 같은 커밋을 Deploy to EC2로 배포한다.
  # 확인 문자열(confirm=SNAPSHOT-<커밋 앞 8자리>) 필수. 자동 백업 창(18:38-19:08 UTC) 근처와 대기 중 변경이 있으면 중단한다.
  predeploy-snapshot:
    if: inputs.step == 'predeploy-snapshot'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: f2r-infra-build
    steps:
      - name: Configure AWS credentials (snapshot-only role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::425805163960:role/github-actions-f2r-snapshot
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: f2r-predeploy-snapshot
      - name: Create one pre-deploy snapshot of the production DB and wait until available
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          DB=f2r-db-202610181331; SHA8="${GITHUB_SHA:0:8}"
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          [ "$ACCOUNT" = "425805163960" ] || { echo wrong-account; exit 1; }
          [[ "$SHA8" =~ ^[0-9a-f]{8}$ ]] || { echo "커밋 SHA를 알 수 없음 — 중단"; exit 1; }
          [ "${CONFIRM:-}" = "SNAPSHOT-$SHA8" ] || { echo "confirm 값이 SNAPSHOT-$SHA8 와 다릅니다 — 생성하지 않음"; exit 1; }
          NOW=$((10#$(date -u +%H%M)))
          if [ "$NOW" -ge 1825 ] && [ "$NOW" -le 1915 ]; then echo "자동 백업 창(18:38-19:08 UTC) 근처라 중단 — 다른 시간에 실행"; exit 1; fi
          aws rds describe-db-instances --db-instance-identifier "$DB" \
            --query 'DBInstances[0].{Status:DBInstanceStatus,BackupDays:BackupRetentionPeriod,DeletionProtection:DeletionProtection,Pending:PendingModifiedValues}' --output json
          STATUS=$(aws rds describe-db-instances --db-instance-identifier "$DB" --query 'DBInstances[0].DBInstanceStatus' --output text)
          [ "$STATUS" = available ] || { echo "DB 상태가 available이 아님($STATUS) — 중단"; exit 1; }
          PENDING=$(aws rds describe-db-instances --db-instance-identifier "$DB" --query 'length(keys(DBInstances[0].PendingModifiedValues))' --output text)
          [ "$PENDING" = 0 ] || { echo "대기 중 변경이 있어 중단합니다: $PENDING"; exit 1; }
          SNAP="f2r-predeploy-$(date -u +%Y%m%d%H%M)-$SHA8"
          aws rds create-db-snapshot --db-instance-identifier "$DB" --db-snapshot-identifier "$SNAP" \
            --tags Key=Project,Value=f2r-migration Key=DeploySha,Value="$GITHUB_SHA" --query 'DBSnapshot.{Id:DBSnapshotIdentifier,Status:Status}' --output json
          aws rds wait db-snapshot-available --db-snapshot-identifier "$SNAP"
          aws rds describe-db-snapshots --db-snapshot-identifier "$SNAP" \
            --query 'DBSnapshots[0].{Id:DBSnapshotIdentifier,Db:DBInstanceIdentifier,Status:Status,Created:SnapshotCreateTime,Encrypted:Encrypted,GB:AllocatedStorage}' --output table
          [ "$(aws rds describe-db-snapshots --db-snapshot-identifier "$SNAP" --query 'DBSnapshots[0].Status' --output text)" = available ] || { echo "스냅샷이 available이 아님"; exit 1; }
          echo "PREDEPLOY_SNAPSHOT=$SNAP"

  # 배포 역할(github-actions-f2r-deploy)로도 같은 SSM 경로가 열리는지 확인한다.
  # environment 없이 main 의 이 워크플로(job_workflow_ref)로만 가정 가능(배포 역할 신뢰 정책 참고).
  smoke-deploy-role:
    if: inputs.step == 'smoke'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials (deploy role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: deploy-smoke

      - name: Deploy-role SSM check
        shell: bash
        env:
          IID: ${{ needs.build.outputs.instance_id }}
        run: |
          set -euo pipefail
          [ -n "$IID" ] || { echo "INSTANCE_ID 없음"; exit 1; }
          CID=$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript \
            --parameters '{"commands":["echo smoke-ok-deploy-role"]}' --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$CID" --instance-id "$IID"
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" \
            --query 'StandardOutputContent' --output text
          echo "배포 역할 SSM 경로 정상"

  # ---- 비밀값 이관: 구 호스트 /etc/f2r/env -> (공개키 하이브리드 암호화) -> 신규 SSM SecureString /f2r/app/* ----
  # 사용자 승인(2026-10-18, 채팅 명시)된 범위. 값은 로그·아티팩트에 평문으로 나오지 않는다(아티팩트는 암호문만).
  # 개인키는 이관 직후 삭제한다. 구 호스트의 파일·설정은 읽기만 하고 바꾸지 않는다.
  transfer-keygen:
    if: inputs.step == 'secrets-transfer'
    runs-on: ubuntu-latest
    environment: f2r-infra-build
    outputs:
      pub_b64: ${{ steps.k.outputs.pub_b64 }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.BUILDER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: f2r-transfer-keygen
      - id: k
        shell: bash
        run: |
          set -euo pipefail
          openssl genrsa -out /tmp/priv.pem 3072 2>/dev/null
          openssl rsa -in /tmp/priv.pem -pubout -out /tmp/pub.pem 2>/dev/null
          aws ssm put-parameter --name /f2r/transfer/priv --type SecureString --overwrite --value "$(cat /tmp/priv.pem)" >/dev/null
          echo "pub_b64=$(base64 -w0 /tmp/pub.pem)" >> "$GITHUB_OUTPUT"
          shred -u /tmp/priv.pem || rm -f /tmp/priv.pem

  transfer-old-read:
    if: inputs.step == 'secrets-transfer'
    needs: transfer-keygen
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2
          role-session-name: f2r-transfer-old-read
      - name: Encrypt old env on the old host (read-only)
        shell: bash
        env:
          PUB_B64: ${{ needs.transfer-keygen.outputs.pub_b64 }}
        run: |
          set -euo pipefail
          IID=i-09d7cabb5a42d1135
          SCRIPT='set -e; export K=$(openssl rand -hex 32); echo '"$PUB_B64"' | base64 -d > /tmp/t.pub; echo "ENC=$(openssl enc -aes-256-cbc -pbkdf2 -pass env:K < /etc/f2r/env | base64 -w0)"; echo "KEY=$(printf %s "$K" | openssl pkeyutl -encrypt -pubin -inkey /tmp/t.pub -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 | base64 -w0)"; rm -f /tmp/t.pub'
          PARAMS=$(jq -cn --arg c "$SCRIPT" '{commands:[$c]}')
          CID=$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript --parameters "$PARAMS" --query Command.CommandId --output text)
          for _ in $(seq 1 40); do
            ST=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)
            case "$ST" in Success|Failed|Cancelled|TimedOut) break;; esac; sleep 5
          done
          [ "$ST" = Success ] || { echo "old read status=$ST" >&2; exit 1; }
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query StandardOutputContent --output text > /tmp/transfer.enc
          grep -q '^ENC=' /tmp/transfer.enc && grep -q '^KEY=' /tmp/transfer.enc
          echo "ciphertext bytes: $(wc -c < /tmp/transfer.enc)"
      - uses: actions/upload-artifact@v4
        with:
          name: f2r-transfer-cipher
          path: /tmp/transfer.enc
          retention-days: 1

  transfer-new-write:
    if: inputs.step == 'secrets-transfer'
    needs: transfer-old-read
    runs-on: ubuntu-latest
    environment: f2r-infra-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: f2r-transfer-cipher
          path: /tmp/in
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.BUILDER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: f2r-transfer-new-write
      - name: Decrypt and store as SSM SecureString
        shell: bash
        run: |
          set -euo pipefail
          aws ssm get-parameter --name /f2r/transfer/priv --with-decryption --query Parameter.Value --output text > /tmp/priv.pem
          sed -n 's/^ENC=//p' /tmp/in/transfer.enc | base64 -d > /tmp/env.enc
          sed -n 's/^KEY=//p' /tmp/in/transfer.enc | base64 -d > /tmp/key.enc
          K=$(openssl pkeyutl -decrypt -inkey /tmp/priv.pem -in /tmp/key.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256)
          export K
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:K -in /tmp/env.enc > /tmp/env.plain
          N=0
          while IFS= read -r line; do
            [[ "$line" =~ ^([A-Za-z_][A-Za-z0-9_]*)=(.*)$ ]] || continue
            name="${BASH_REMATCH[1]}"; val="${BASH_REMATCH[2]}"
            val="${val%\"}"; val="${val#\"}"
            echo "::add-mask::$val"
            [ -n "$val" ] || continue
            aws ssm put-parameter --name "/f2r/app/$name" --type SecureString --overwrite --value "$val" >/dev/null
            N=$((N+1))
          done < /tmp/env.plain
          echo "stored $N parameters (names only)"
          grep -oE '^[A-Za-z_][A-Za-z0-9_]*' /tmp/env.plain | sort | tr '\n' ' '; echo
          aws ssm delete-parameter --name /f2r/transfer/priv
          shred -u /tmp/priv.pem /tmp/env.plain /tmp/key.enc /tmp/env.enc || true
      - name: Rebuild /etc/f2r/env on the new host
        shell: bash
        run: |
          set -euo pipefail
          IID=$(aws ec2 describe-instances --filters Name=tag:Name,Values=f2r-app Name=tag:Project,Values=f2r-migration Name=instance-state-name,Values=running --query 'Reservations[0].Instances[0].InstanceId' --output text)
          B64=$(base64 -w0 scripts/deploy/provision-new-host.sh)
          CID=$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript \
            --parameters "{\"commands\":[\"echo $B64 | base64 -d > /tmp/provision.sh\",\"bash -c 'source /tmp/provision.sh; fetch_env_from_ssm; wc -l < /etc/f2r/env'\"]}" --query Command.CommandId --output text)
          for _ in $(seq 1 40); do
            ST=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)
            case "$ST" in Success|Failed|Cancelled|TimedOut) break;; esac; sleep 5
          done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query '{s:Status,o:StandardOutputContent}' --output text
          [ "$ST" = Success ]

  # ---- DB 이전 일괄: ACM 검증 CNAME(구 Route53) + RDS 스냅샷 KMS 재암호화·공유(구) -> 신규 복사·복원·엔드포인트 치환·HTTPS ----
  # 구 계정은 읽기·복사·공유만 한다(운영 DB·원본 스냅샷 불변, 삭제 없음). 운영 DB 최종 전환·DNS 전환은 별도 승인.
  mig-acm-info:
    if: inputs.step == 'db-migrate' || inputs.step == 'acm-dns'
    runs-on: ubuntu-latest
    environment: f2r-infra-build
    outputs:
      rec_name: ${{ steps.a.outputs.rec_name }}
      rec_value: ${{ steps.a.outputs.rec_value }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.BUILDER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: f2r-mig-acm
      - id: a
        shell: bash
        run: |
          set -euo pipefail
          CERT=$(aws acm list-certificates --certificate-statuses PENDING_VALIDATION ISSUED --query "CertificateSummaryList[?DomainName=='feel2real.co.kr'].CertificateArn | [0]" --output text)
          echo "rec_name=$(aws acm describe-certificate --certificate-arn "$CERT" --query 'Certificate.DomainValidationOptions[0].ResourceRecord.Name' --output text)" >> "$GITHUB_OUTPUT"
          echo "rec_value=$(aws acm describe-certificate --certificate-arn "$CERT" --query 'Certificate.DomainValidationOptions[0].ResourceRecord.Value' --output text)" >> "$GITHUB_OUTPUT"

  mig-old:
    if: inputs.step == 'db-migrate'
    needs: mig-acm-info
    runs-on: ubuntu-latest
    outputs:
      snap_arn: ${{ steps.s.outputs.snap_arn }}
      dns_in_route53: ${{ steps.d.outputs.dns_in_route53 }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/f2r-migration-admin-temp
          aws-region: ap-northeast-2
          role-session-name: f2r-mig-old
      - id: d
        name: Check whether the domain is hosted in old Route 53 (read-only)
        shell: bash
        run: |
          set -euo pipefail
          ZID=$(aws route53 list-hosted-zones-by-name --dns-name feel2real.co.kr --query "HostedZones[?Name=='feel2real.co.kr.' && Config.PrivateZone==\`false\`].Id | [0]" --output text)
          if [ -z "$ZID" ] || [ "$ZID" = None ]; then
            echo "dns_in_route53=no" >> "$GITHUB_OUTPUT"; echo "feel2real.co.kr 호스티드 존 없음(DNS는 다른 곳에서 운영)"; exit 0
          fi
          echo "dns_in_route53=yes" >> "$GITHUB_OUTPUT"
          echo "zone NS:"; aws route53 get-hosted-zone --id "$ZID" --query 'DelegationSet.NameServers' --output text
      - id: s
        name: KMS CMK + re-encrypted snapshot copy + share to new account
        shell: bash
        run: |
          set -euo pipefail
          NEW=425805163960
          STAMP=$(date -u +%Y%m%d)
          KID=$(aws kms describe-key --key-id alias/f2r-migration --query KeyMetadata.KeyId --output text 2>/dev/null || true)
          if [ -z "$KID" ] || [ "$KID" = None ]; then
            KID=$(aws kms create-key --description "f2r RDS snapshot migration" --query KeyMetadata.KeyId --output text)
            aws kms create-alias --alias-name alias/f2r-migration --target-key-id "$KID"
          fi
          aws kms get-key-policy --key-id "$KID" --policy-name default --query Policy --output text > /tmp/kp.json
          python3 - "$NEW" <<'PY'
          import json,sys
          new=sys.argv[1]
          p=json.load(open('/tmp/kp.json'))
          if not any(s.get('Sid')=='AllowNewAccountRdsCopy' for s in p['Statement']):
              p['Statement'].append({"Sid":"AllowNewAccountRdsCopy","Effect":"Allow","Principal":{"AWS":f"arn:aws:iam::{new}:root"},
                "Action":["kms:DescribeKey","kms:Decrypt","kms:CreateGrant","kms:ReEncryptFrom","kms:ReEncryptTo","kms:GenerateDataKey*"],"Resource":"*"})
              json.dump(p,open('/tmp/kp2.json','w'))
              print("policy updated")
          else:
              json.dump(p,open('/tmp/kp2.json','w')); print("policy already has statement")
          PY
          aws kms put-key-policy --key-id "$KID" --policy-name default --policy file:///tmp/kp2.json
          # 소스: 가장 최근 수동 스냅샷(없으면 자동 스냅샷). 원본은 변경하지 않는다.
          SRC=$(aws rds describe-db-snapshots --snapshot-type manual --query 'sort_by(DBSnapshots,&SnapshotCreateTime)[-1].DBSnapshotIdentifier' --output text)
          if [ -z "$SRC" ] || [ "$SRC" = None ]; then
            SRC=$(aws rds describe-db-snapshots --snapshot-type automated --query 'sort_by(DBSnapshots,&SnapshotCreateTime)[-1].DBSnapshotIdentifier' --output text)
          fi
          echo "source snapshot: $SRC"
          T=f2r-mig-$STAMP
          if ! aws rds describe-db-snapshots --db-snapshot-identifier "$T" >/dev/null 2>&1; then
            aws rds copy-db-snapshot --source-db-snapshot-identifier "$SRC" --target-db-snapshot-identifier "$T" --kms-key-id "alias/f2r-migration" >/dev/null
          fi
          for _ in $(seq 1 120); do
            S=$(aws rds describe-db-snapshots --db-snapshot-identifier "$T" --query 'DBSnapshots[0].Status' --output text)
            echo "status=$S"; [ "$S" = available ] && break; [ "$S" = failed ] && exit 1; sleep 30
          done
          [ "$S" = available ]
          aws rds modify-db-snapshot-attribute --db-snapshot-identifier "$T" --attribute-name restore --values-to-add "$NEW" >/dev/null
          echo "snap_arn=$(aws rds describe-db-snapshots --db-snapshot-identifier "$T" --query 'DBSnapshots[0].DBSnapshotArn' --output text)" >> "$GITHUB_OUTPUT"

  mig-new:
    if: inputs.step == 'db-migrate'
    needs: mig-old
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: f2r-infra-build
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.BUILDER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: f2r-mig-new
      - name: Copy shared snapshot, restore RDS (db.t4g.micro, gp3)
        shell: bash
        env:
          SNAP_ARN: ${{ needs.mig-old.outputs.snap_arn }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%d); C=f2r-shared-$STAMP
          if ! aws rds describe-db-snapshots --db-snapshot-identifier "$C" >/dev/null 2>&1; then
            aws rds copy-db-snapshot --source-db-snapshot-identifier "$SNAP_ARN" --target-db-snapshot-identifier "$C" --kms-key-id alias/aws/rds >/dev/null
          fi
          aws rds wait db-snapshot-available --db-snapshot-identifier "$C"
          RDSSG=$(aws ec2 describe-security-groups --filters Name=group-name,Values=f2r-rds-sg Name=tag:Project,Values=f2r-migration --query 'SecurityGroups[0].GroupId' --output text)
          PGN=f2r-mysql84-params
          if ! aws rds describe-db-instances --db-instance-identifier f2r-db >/dev/null 2>&1; then
            aws rds restore-db-instance-from-db-snapshot --db-instance-identifier f2r-db --db-snapshot-identifier "$C" \
              --db-instance-class db.t4g.micro --db-subnet-group-name f2r-db-subnets --vpc-security-group-ids "$RDSSG" \
              --no-publicly-accessible --no-multi-az --db-parameter-group-name "$PGN" --tags Key=Project,Value=f2r-migration >/dev/null
          fi
          aws rds wait db-instance-available --db-instance-identifier f2r-db
          aws rds modify-db-instance --db-instance-identifier f2r-db --storage-type gp3 --backup-retention-period 7 --apply-immediately >/dev/null || true
          aws rds wait db-instance-available --db-instance-identifier f2r-db
          echo "RDS f2r-db available: $(aws rds describe-db-instances --db-instance-identifier f2r-db --query 'DBInstances[0].[DBInstanceClass,EngineVersion,StorageType]' --output text)"
      - name: Replace old RDS endpoint in SSM parameters (values never printed)
        shell: bash
        run: |
          set -euo pipefail
          NEWEP=$(aws rds describe-db-instances --db-instance-identifier f2r-db --query 'DBInstances[0].Endpoint.Address' --output text)
          echo "::add-mask::$NEWEP"
          export NEWEP
          python3 - <<'PY'
          import json,os,re,subprocess
          new=os.environ["NEWEP"]
          names=subprocess.check_output(["aws","ssm","get-parameters-by-path","--path","/f2r/app/","--query","Parameters[].Name","--output","json"]).decode()
          changed=[]
          for n in json.loads(names):
              v=subprocess.check_output(["aws","ssm","get-parameter","--name",n,"--with-decryption","--query","Parameter.Value","--output","text"]).decode().rstrip("\n")
              nv=re.sub(r"[A-Za-z0-9.-]+\.rds\.amazonaws\.com",new,v)
              if nv!=v:
                  subprocess.check_call(["aws","ssm","put-parameter","--name",n,"--type","SecureString","--overwrite","--value",nv],stdout=subprocess.DEVNULL)
                  changed.append(n)
          print("endpoint replaced in:",changed)
          PY
      - name: Rebuild /etc/f2r/env on new host
        shell: bash
        run: |
          set -euo pipefail
          IID=$(aws ec2 describe-instances --filters Name=tag:Name,Values=f2r-app Name=tag:Project,Values=f2r-migration Name=instance-state-name,Values=running --query 'Reservations[0].Instances[0].InstanceId' --output text)
          B64=$(base64 -w0 scripts/deploy/provision-new-host.sh)
          CID=$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript \
            --parameters "{\"commands\":[\"echo $B64 | base64 -d > /tmp/provision.sh\",\"bash -c 'source /tmp/provision.sh; fetch_env_from_ssm; wc -l < /etc/f2r/env'\"]}" --query Command.CommandId --output text)
          for _ in $(seq 1 40); do
            ST=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)
            case "$ST" in Success|Failed|Cancelled|TimedOut) break;; esac; sleep 5
          done
          [ "$ST" = Success ]
      - name: HTTPS listener when ACM is ISSUED (wait up to 20 min)
        shell: bash
        run: |
          set -euo pipefail
          CERT=""
          for _ in $(seq 1 40); do
            CERT=$(aws acm list-certificates --certificate-statuses ISSUED --query "CertificateSummaryList[?DomainName=='feel2real.co.kr'].CertificateArn | [0]" --output text)
            [ -n "$CERT" ] && [ "$CERT" != None ] && break; sleep 30
          done
          if [ -z "$CERT" ] || [ "$CERT" = None ]; then echo "ACM 미발급 — DNS 검증 대기(가비아 등 다른 DNS면 CNAME 필요)"; exit 0; fi
          ALB=$(aws elbv2 describe-load-balancers --names f2r-alb --query 'LoadBalancers[0].LoadBalancerArn' --output text)
          TG=$(aws elbv2 describe-target-groups --names f2r-app-tg --query 'TargetGroups[0].TargetGroupArn' --output text)
          L=$(aws elbv2 describe-listeners --load-balancer-arn "$ALB" --query "Listeners[?Port==\`443\`].ListenerArn" --output text)
          if [ -z "$L" ]; then
            aws elbv2 create-listener --load-balancer-arn "$ALB" --protocol HTTPS --port 443 --ssl-policy ELBSecurityPolicy-TLS13-1-2-2021-06 \
              --certificates CertificateArn="$CERT" --default-actions Type=forward,TargetGroupArn="$TG" >/dev/null
            echo "created 443 listener"
          fi

  # ---- ACM DNS 검증: 구 계정 Route 53에 검증 CNAME 1건 UPSERT(사용자 명시 승인) 후 신규 ALB 443 리스너 ----
  # 기존 레코드는 건드리지 않고, 해당 검증 레코드 이름만 UPSERT 한다.
  acm-dns-write:
    if: inputs.step == 'acm-dns'
    needs: mig-acm-info
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/f2r-migration-admin-temp
          aws-region: ap-northeast-2
          role-session-name: f2r-acm-dns
      - name: UPSERT ACM validation CNAME into old Route 53
        shell: bash
        env:
          REC_NAME: ${{ needs.mig-acm-info.outputs.rec_name }}
          REC_VALUE: ${{ needs.mig-acm-info.outputs.rec_value }}
        run: |
          set -euo pipefail
          ZID=$(aws route53 list-hosted-zones-by-name --dns-name feel2real.co.kr --query "HostedZones[?Name=='feel2real.co.kr.' && Config.PrivateZone==\`false\`].Id | [0]" --output text)
          [ -n "$ZID" ] && [ "$ZID" != None ] || { echo "호스티드 존 없음" >&2; exit 1; }
          case "$REC_NAME" in _*.feel2real.co.kr.) ;; *) echo "예상하지 못한 레코드 이름" >&2; exit 1;; esac
          jq -n --arg n "$REC_NAME" --arg v "$REC_VALUE" '{Changes:[{Action:"UPSERT",ResourceRecordSet:{Name:$n,Type:"CNAME",TTL:300,ResourceRecords:[{Value:$v}]}}]}' > /tmp/chg.json
          aws route53 change-resource-record-sets --hosted-zone-id "$ZID" --change-batch file:///tmp/chg.json --query ChangeInfo.Status --output text

  acm-dns-https:
    if: inputs.step == 'acm-dns'
    needs: acm-dns-write
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: f2r-infra-build
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.BUILDER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: f2r-acm-https
      - name: Wait for ACM ISSUED, create 443 listener, show target health
        shell: bash
        run: |
          set -euo pipefail
          CERT=""
          for _ in $(seq 1 70); do
            CERT=$(aws acm list-certificates --certificate-statuses ISSUED --query "CertificateSummaryList[?DomainName=='feel2real.co.kr'].CertificateArn | [0]" --output text)
            [ -n "$CERT" ] && [ "$CERT" != None ] && break; sleep 30
          done
          [ -n "$CERT" ] && [ "$CERT" != None ] || { echo "ACM 미발급" >&2; exit 1; }
          ALB=$(aws elbv2 describe-load-balancers --names f2r-alb --query 'LoadBalancers[0].LoadBalancerArn' --output text)
          TG=$(aws elbv2 describe-target-groups --names f2r-app-tg --query 'TargetGroups[0].TargetGroupArn' --output text)
          L=$(aws elbv2 describe-listeners --load-balancer-arn "$ALB" --query "Listeners[?Port==\`443\`].ListenerArn" --output text)
          if [ -z "$L" ]; then
            aws elbv2 create-listener --load-balancer-arn "$ALB" --protocol HTTPS --port 443 --ssl-policy ELBSecurityPolicy-TLS13-1-2-2021-06 \
              --certificates CertificateArn="$CERT" --default-actions Type=forward,TargetGroupArn="$TG" >/dev/null
            echo "created 443 listener"
          fi
          aws elbv2 describe-target-health --target-group-arn "$TG" --query 'TargetHealthDescriptions[*].{State:TargetHealth.State,Reason:TargetHealth.Reason}' --output text

  # ---- P2 S3 이전: 신규 버킷 생성·권한 -> 구 버킷 읽기 전용 복사(검증) -> 신규 앱 S3_BUCKET 교체 ----
  # 구 버킷은 읽기만 한다(삭제·변경 없음). 사용자 파일명은 로그에 출력하지 않는다.
  p2-s3-bucket:
    if: inputs.step == 'p2-s3-copy'
    runs-on: ubuntu-latest
    environment: f2r-infra-build
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.BUILDER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: f2r-p2-s3-bucket
      - name: Create uploads bucket and sync role policies from repo JSON
        shell: bash
        run: |
          set -euo pipefail
          UP=f2r-uploads-425805163960
          if ! aws s3api head-bucket --bucket "$UP" 2>/dev/null; then
            aws s3api create-bucket --bucket "$UP" --region ap-northeast-2 --create-bucket-configuration LocationConstraint=ap-northeast-2
            echo "created bucket"
          else echo "exists bucket"; fi
          aws s3api put-public-access-block --bucket "$UP" --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          aws s3api put-bucket-encryption --bucket "$UP" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"},"BucketKeyEnabled":true}]}'
          aws s3api put-bucket-tagging --bucket "$UP" --tagging 'TagSet=[{Key=Project,Value=f2r-migration}]'
          D=docs/operations/aws-migration
          aws iam put-role-policy --role-name f2r-ec2-ssm-role --policy-name f2r-ec2-secrets-read --policy-document "file://$D/policy-f2r-ec2-secrets-read.json"
          aws iam put-role-policy --role-name github-actions-f2r-deploy --policy-name f2r-deploy-smoke-ssm --policy-document "file://$D/policy-f2r-deploy-smoke-ssm.json"
          echo "policies synced"

  p2-s3-copy-data:
    if: inputs.step == 'p2-s3-copy'
    needs: p2-s3-bucket
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/f2r-migration-admin-temp
          aws-region: ap-northeast-2
          role-session-name: f2r-p2-s3-read
      - name: Read old bucket into runner (read-only) and record listing
        shell: bash
        run: |
          set -euo pipefail
          OLD=f2r-tutor-uploads-prd-067573916809-ap-northeast-2-an
          aws s3api list-objects-v2 --bucket "$OLD" --query 'Contents[].[Key,Size]' --output text | grep -v '^None$' | sort > /tmp/old.list || true
          N=$(wc -l < /tmp/old.list); B=$(awk -F'\t' '{s+=$NF} END{print s+0}' /tmp/old.list)
          echo "old objects=$N bytes=$B"
          [ "$B" -lt 10000000000 ] || { echo "10GB 초과 — 러너 경유 복사 중단(다른 방식 필요)" >&2; exit 1; }
          mkdir -p /tmp/s3data
          aws s3 sync "s3://$OLD" /tmp/s3data --only-show-errors
          echo "downloaded files=$(find /tmp/s3data -type f | wc -l)"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: f2r-p2-s3-write
          unset-current-credentials: true
      - name: Upload to new bucket and verify (count, bytes, key+size diff, sha256 sample)
        shell: bash
        run: |
          set -euo pipefail
          UP=f2r-uploads-425805163960
          aws s3 sync /tmp/s3data "s3://$UP" --only-show-errors --sse AES256
          aws s3api list-objects-v2 --bucket "$UP" --query 'Contents[].[Key,Size]' --output text | grep -v '^None$' | sort > /tmp/new.list || true
          ON=$(wc -l < /tmp/old.list); NN=$(wc -l < /tmp/new.list)
          OB=$(awk -F'\t' '{s+=$NF} END{print s+0}' /tmp/old.list); NB=$(awk -F'\t' '{s+=$NF} END{print s+0}' /tmp/new.list)
          MISSING=$(comm -23 /tmp/old.list /tmp/new.list | wc -l); EXTRA=$(comm -13 /tmp/old.list /tmp/new.list | wc -l)
          echo "old: objects=$ON bytes=$OB | new: objects=$NN bytes=$NB | key+size missing=$MISSING extra=$EXTRA"
          BAD=0; CHECKED=0
          while IFS=$'\t' read -r K _; do
            [ -n "$K" ] || continue
            A=$(sha256sum "/tmp/s3data/$K" | cut -d' ' -f1); B=$(aws s3 cp "s3://$UP/$K" - 2>/dev/null | sha256sum | cut -d' ' -f1)
            CHECKED=$((CHECKED+1)); [ "$A" = "$B" ] || BAD=$((BAD+1))
          done < <(shuf -n 25 /tmp/old.list)
          echo "sha256 sample checked=$CHECKED mismatches=$BAD"
          [ "$ON" = "$NN" ] && [ "$OB" = "$NB" ] && [ "$MISSING" = 0 ] && [ "$BAD" = 0 ]

  p2-s3-switch:
    if: inputs.step == 'p2-s3-copy'
    needs: p2-s3-copy-data
    runs-on: ubuntu-latest
    environment: f2r-infra-build
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.BUILDER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: f2r-p2-s3-switch
      - name: Point new app at the new bucket (SSM param + in-place env edit) and restart
        shell: bash
        run: |
          set -euo pipefail
          UP=f2r-uploads-425805163960
          aws ssm put-parameter --name /f2r/app/S3_BUCKET --type SecureString --overwrite --value "$UP" >/dev/null
          IID=$(aws ec2 describe-instances --filters Name=tag:Name,Values=f2r-app Name=tag:Project,Values=f2r-migration Name=instance-state-name,Values=running --query 'Reservations[0].Instances[0].InstanceId' --output text)
          CMD="set -e; sed -i 's/^S3_BUCKET=.*/S3_BUCKET=$UP/' /etc/f2r/env; systemctl restart f2r-app; for i in \$(seq 1 40); do curl -sf localhost:8080/actuator/health >/dev/null && echo healthy && break; sleep 5; done; sleep 20; echo s3-list-failed-since-restart=\$(journalctl -u f2r-app --since '-2min' --no-pager | grep -c S3_LIST_FAILED || true)"
          CID=$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript --parameters "$(jq -cn --arg c "$CMD" '{commands:[$c]}')" --query Command.CommandId --output text)
          for _ in $(seq 1 60); do
            ST=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)
            case "$ST" in Success|Failed|Cancelled|TimedOut) break;; esac; sleep 5
          done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query StandardOutputContent --output text
          [ "$ST" = Success ]

  # ---- P2 DesignCraft 이전: 구 호스트 /opt/designcraft + 폰트 읽기 전용 패키징 -> 신규 호스트 설치·PNG/PDF 검증 ----
  # 구 호스트는 tar 생성(/tmp 임시 파일)과 사전서명 URL 업로드만 한다. 구 엔진·설정은 수정/삭제하지 않는다.
  p2-designcraft:
    if: inputs.step == 'p2-designcraft'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/f2r-migration-admin-temp
          aws-region: ap-northeast-2
          role-session-name: f2r-p2-dc-read
      - name: Pack on old host (read-only), transfer through a short-lived presigned URL
        shell: bash
        run: |
          set -euo pipefail
          pip install -q boto3
          IID=i-09d7cabb5a42d1135
          KEY=migration-tmp/designcraft-$(date +%Y%m%d%H%M%S).tgz
          URL=$(python3 -c "import boto3;print(boto3.client('s3',region_name='ap-northeast-2').generate_presigned_url('put_object',Params={'Bucket':'feel2real-buildit-deploy','Key':'$KEY'},ExpiresIn=900))")
          echo "::add-mask::$URL"
          CMD="set -e; tar -czf /tmp/dc-mig.tgz -C /opt designcraft artcraft/fonts/NotoSansKR-Variable.ttf; curl -sf -T /tmp/dc-mig.tgz '$URL'; sha256sum /tmp/dc-mig.tgz | cut -d' ' -f1; ls -l /tmp/dc-mig.tgz | awk '{print \$5}'; rm -f /tmp/dc-mig.tgz"
          CID=$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript --parameters "$(jq -cn --arg c "$CMD" '{commands:[$c]}')" --query Command.CommandId --output text)
          for _ in $(seq 1 120); do
            ST=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)
            case "$ST" in Success|Failed|Cancelled|TimedOut) break;; esac; sleep 5
          done
          OUT=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query StandardOutputContent --output text | grep -v "$URL" || true)
          [ "$ST" = Success ] || { echo "old pack status=$ST" >&2; exit 1; }
          HSHA=$(echo "$OUT" | sed -n 1p); echo "old host sha256=$HSHA size=$(echo "$OUT" | sed -n 2p)"
          aws s3 cp "s3://feel2real-buildit-deploy/$KEY" /tmp/dc.tgz --no-progress
          RSHA=$(sha256sum /tmp/dc.tgz | cut -d' ' -f1)
          echo "runner sha256=$RSHA"; [ "$HSHA" = "$RSHA" ]
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: f2r-p2-dc-write
          unset-current-credentials: true
      - name: Install on new host and verify (version, PNG render, fonts)
        shell: bash
        run: |
          set -euo pipefail
          DEP=f2r-deploy-425805163960
          aws s3 cp /tmp/dc.tgz "s3://$DEP/migration/designcraft.tgz" --no-progress --sse AES256
          IID=$(aws ec2 describe-instances --filters Name=tag:Name,Values=f2r-app Name=tag:Project,Values=f2r-migration Name=instance-state-name,Values=running --query 'Reservations[0].Instances[0].InstanceId' --output text)
          CMD="set -e; aws s3 cp s3://$DEP/migration/designcraft.tgz /tmp/dc.tgz --no-progress; echo new-host-sha256=\$(sha256sum /tmp/dc.tgz | cut -d' ' -f1); tar -xzf /tmp/dc.tgz -C /opt; rm -f /tmp/dc.tgz; fc-cache -f; ls -ld /opt/designcraft /opt/designcraft/templates; echo --- version; sudo -u ec2-user /opt/designcraft/designcraft-cli --version; echo --- ldd-missing; ldd /opt/designcraft/releases/*/bin/designcraft-cli 2>&1 | grep -ci 'not found' || true; echo --- png; rm -f /var/tmp/f2r/dc-test.png; sudo -u ec2-user bash -c 'cd /var/tmp/f2r && /opt/designcraft/designcraft-cli run --page 0 --scale 1 --export /var/tmp/f2r/dc-test.png' 2>&1 | tail -3; file /var/tmp/f2r/dc-test.png | cut -c1-120; ls -l /var/tmp/f2r/dc-test.png | awk '{print \$5}'; echo --- fonts; fc-list :lang=ko family | sort -u | head -5; fc-list | grep -ci NotoSansKR || true; echo --- help; sudo -u ec2-user /opt/designcraft/designcraft-cli --help 2>&1 | head -30"
          CID=$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript --parameters "$(jq -cn --arg c "$CMD" '{commands:[$c]}')" --query Command.CommandId --output text)
          for _ in $(seq 1 60); do
            ST=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)
            case "$ST" in Success|Failed|Cancelled|TimedOut) break;; esac; sleep 5
          done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query '{s:Status,o:StandardOutputContent,e:StandardErrorContent}' --output text | tail -c 5000
          [ "$ST" = Success ]

  # ======== 최종 전환(p2-cutover) — 사용자 조건부 승인(2026-10-18) ========
  # 순서: 사전 점검 -> 구 쓰기 중지(앱·위키 서비스 stop) -> 위키 데이터 팩 -> 최종 스냅샷(KMS 재암호화·공유) -> S3 전체 동기화·검증
  #       -> 위키 데이터 신규 설치 -> 신규 RDS 복원·엔드포인트 교체 -> 테이블별 행 수 비교(구 vs 신규) -> DNS 별칭 3건 신규 ALB로 전환
  # 실패 시 cut-rollback: DNS를 구 ALB로 되돌리고 구 앱·위키를 다시 기동한다. 구 서버·DB·S3는 삭제·수정하지 않는다.
  cut-precheck:
    if: inputs.step == 'p2-cutover' && inputs.confirm == 'CUTOVER-20261018'
    runs-on: ubuntu-latest
    environment: f2r-infra-build
    outputs:
      stamp: ${{ steps.s.outputs.stamp }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.BUILDER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: f2r-cut-precheck
      - id: s
        name: Pre-checks on the new environment (abort before any change on failure)
        shell: bash
        run: |
          set -euo pipefail
          echo "stamp=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
          IID=$(aws ec2 describe-instances --filters Name=tag:Name,Values=f2r-app Name=tag:Project,Values=f2r-migration Name=instance-state-name,Values=running --query 'Reservations[0].Instances[0].InstanceId' --output text)
          [ -n "$IID" ] && [ "$IID" != None ] || { echo "신규 EC2 없음" >&2; exit 1; }
          PING=$(aws ssm describe-instance-information --filters Key=InstanceIds,Values="$IID" --query 'InstanceInformationList[0].PingStatus' --output text)
          echo "ssm=$PING"; [ "$PING" = Online ]
          DBS=$(aws rds describe-db-instances --db-instance-identifier f2r-db --query 'DBInstances[0].DBInstanceStatus' --output text); echo "rehearsal rds=$DBS"; [ "$DBS" = available ]
          TG=$(aws elbv2 describe-target-groups --names f2r-app-tg --query 'TargetGroups[0].TargetGroupArn' --output text)
          TH=$(aws elbv2 describe-target-health --target-group-arn "$TG" --query 'TargetHealthDescriptions[0].TargetHealth.State' --output text); echo "target=$TH"; [ "$TH" = healthy ]
          ALB=$(aws elbv2 describe-load-balancers --names f2r-alb --query 'LoadBalancers[0].LoadBalancerArn' --output text)
          L=$(aws elbv2 describe-listeners --load-balancer-arn "$ALB" --query "Listeners[?Port==\`443\`].ListenerArn" --output text); [ -n "$L" ] && echo "https listener ok"
          CODE=$(curl -sk -m 20 -o /dev/null -w '%{http_code}' -H 'Host: feel2real.co.kr' https://f2r-alb-2551937.ap-northeast-2.elb.amazonaws.com/actuator/health); echo "new alb health=$CODE"; [ "$CODE" = 200 ]
          B=$(aws s3api head-bucket --bucket f2r-uploads-425805163960 2>&1 && echo ok); echo "uploads bucket $B"

  cut-old:
    if: inputs.step == 'p2-cutover' && inputs.confirm == 'CUTOVER-20261018'
    needs: cut-precheck
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      old_counts_b64: ${{ steps.frz.outputs.old_counts_b64 }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/f2r-migration-admin-temp
          aws-region: ap-northeast-2
          role-session-name: f2r-cut-old
      - id: frz
        name: FREEZE old writes, record row counts, pack wiki data, final snapshot (KMS copy + share), full S3 read
        shell: bash
        env:
          STAMP: ${{ needs.cut-precheck.outputs.stamp }}
        run: |
          set -euo pipefail
          OLDI=i-09d7cabb5a42d1135
          runhost() {
            local b64 params cid st
            b64=$(printf '%s' "$2" | base64 -w0)
            params=$(jq -cn --arg c "echo $b64 | base64 -d | bash" '{commands:[$c]}')
            cid=$(aws ssm send-command --instance-ids "$1" --document-name AWS-RunShellScript --timeout-seconds 1800 --parameters "$params" --query Command.CommandId --output text)
            for _ in $(seq 1 360); do st=$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$1" --query Status --output text 2>/dev/null || echo Pending); case "$st" in Success|Failed|Cancelled|TimedOut) break;; esac; sleep 5; done
            aws ssm get-command-invocation --command-id "$cid" --instance-id "$1" --query StandardOutputContent --output text | tail -c 3000
            [ "$st" = Success ]
          }
          echo "### freeze old app + wiki (writes stopped)"
          runhost "$OLDI" 'systemctl stop f2r-app; systemctl stop buildit-wiki; sleep 3; echo f2r-app=$(systemctl is-active f2r-app); echo wiki=$(systemctl is-active buildit-wiki)'
          echo "### row counts per table on the frozen OLD database (compared later against the restored copy)"
          CNT='set -a; . /etc/f2r/env; set +a; export MYSQL_PWD="$DB_PASSWORD"; M="mysql -N -B -h $DB_HOST -P ${DB_PORT:-3306} -u $DB_USER $DB_NAME"; $M -e "select table_name from information_schema.tables where table_schema=database() and table_type=\"BASE TABLE\" order by 1" | while read t; do echo "$t $($M -e "select count(*) from \`$t\`")"; done'
          B64=$(printf '%s' "$CNT" | base64 -w0)
          CID=$(aws ssm send-command --instance-ids "$OLDI" --document-name AWS-RunShellScript --timeout-seconds 900 --parameters "$(jq -cn --arg c "echo $B64 | base64 -d | bash" '{commands:[$c]}')" --query Command.CommandId --output text)
          for _ in $(seq 1 180); do ST=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$OLDI" --query Status --output text 2>/dev/null || echo Pending); case "$ST" in Success|Failed|Cancelled|TimedOut) break;; esac; sleep 5; done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$OLDI" --query StandardOutputContent --output text > /tmp/old.counts
          echo "old tables=$(wc -l < /tmp/old.counts)"; [ "$ST" = Success ] && [ "$(wc -l < /tmp/old.counts)" -ge 20 ]
          echo "old_counts_b64=$(base64 -w0 /tmp/old.counts)" >> "$GITHUB_OUTPUT"
          echo "### pack wiki data through presigned URL"
          pip install -q boto3
          KEY=migration-tmp/wiki-$STAMP.tgz
          URL=$(python3 -c "import boto3;print(boto3.client('s3',region_name='ap-northeast-2').generate_presigned_url('put_object',Params={'Bucket':'feel2real-buildit-deploy','Key':'$KEY'},ExpiresIn=1200))")
          echo "::add-mask::$URL"
          OUT=$(runhost "$OLDI" "set -e; tar -czf /tmp/wiki-mig.tgz -C /opt/buildit-wiki/data .; curl -sf -T /tmp/wiki-mig.tgz '$URL'; sha256sum /tmp/wiki-mig.tgz | cut -d' ' -f1; rm -f /tmp/wiki-mig.tgz" | grep -E '^[0-9a-f]{64}$' | tail -1)
          aws s3 cp "s3://feel2real-buildit-deploy/$KEY" /tmp/wiki.tgz --no-progress
          RSHA=$(sha256sum /tmp/wiki.tgz | cut -d' ' -f1); echo "wiki sha host=$OUT runner=$RSHA"; [ "$OUT" = "$RSHA" ]
          echo "### final RDS snapshot"
          aws rds create-db-snapshot --db-instance-identifier f2r-db-prd --db-snapshot-identifier "f2r-final-$STAMP" >/dev/null
          aws rds wait db-snapshot-available --db-snapshot-identifier "f2r-final-$STAMP"
          aws rds copy-db-snapshot --source-db-snapshot-identifier "f2r-final-$STAMP" --target-db-snapshot-identifier "f2r-mig-final-$STAMP" --kms-key-id alias/f2r-migration >/dev/null
          aws rds wait db-snapshot-available --db-snapshot-identifier "f2r-mig-final-$STAMP"
          aws rds modify-db-snapshot-attribute --db-snapshot-identifier "f2r-mig-final-$STAMP" --attribute-name restore --values-to-add 425805163960 >/dev/null
          echo "final snapshot shared"
          echo "### S3 full read (old bucket is only read)"
          OLD=f2r-tutor-uploads-prd-067573916809-ap-northeast-2-an
          aws s3api list-objects-v2 --bucket "$OLD" --query 'Contents[].[Key,Size]' --output text | grep -v '^None$' | sort > /tmp/old.list || true
          mkdir -p /tmp/s3data; aws s3 sync "s3://$OLD" /tmp/s3data --only-show-errors
          echo "old objects=$(wc -l < /tmp/old.list)"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: f2r-cut-new-write
          unset-current-credentials: true
      - name: Upload S3 delta + verify, install wiki data on the new host
        shell: bash
        env:
          STAMP: ${{ needs.cut-precheck.outputs.stamp }}
        run: |
          set -euo pipefail
          UP=f2r-uploads-425805163960; DEP=f2r-deploy-425805163960
          aws s3 sync /tmp/s3data "s3://$UP" --only-show-errors --sse AES256
          aws s3api list-objects-v2 --bucket "$UP" --query 'Contents[].[Key,Size]' --output text | grep -v '^None$' | sort > /tmp/new.list || true
          MISSING=$(comm -23 /tmp/old.list /tmp/new.list | wc -l)
          echo "S3 old=$(wc -l < /tmp/old.list) new=$(wc -l < /tmp/new.list) missing(key+size)=$MISSING"; [ "$MISSING" = 0 ]
          aws s3 cp /tmp/wiki.tgz "s3://$DEP/migration/wiki-data.tgz" --no-progress --sse AES256
          IID=$(aws ec2 describe-instances --filters Name=tag:Name,Values=f2r-app Name=tag:Project,Values=f2r-migration Name=instance-state-name,Values=running --query 'Reservations[0].Instances[0].InstanceId' --output text)
          SCRIPT="set -e; systemctl stop buildit-wiki; mv /opt/buildit-wiki/data /opt/buildit-wiki/data.pre-cutover.$STAMP; mkdir -p /opt/buildit-wiki/data; aws s3 cp s3://$DEP/migration/wiki-data.tgz /tmp/w.tgz --no-progress; tar -xzf /tmp/w.tgz -C /opt/buildit-wiki/data; rm -f /tmp/w.tgz; systemctl start buildit-wiki; for i in \$(seq 1 20); do c=\$(curl -s -o /dev/null -w '%{http_code}' 127.0.0.1:8000/api/health || true); [ \"\$c\" = 200 ] && break; sleep 3; done; echo wiki-health=\$c; ls /opt/buildit-wiki/data | wc -l"
          B64=$(printf '%s' "$SCRIPT" | base64 -w0)
          CID=$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript --parameters "$(jq -cn --arg c "echo $B64 | base64 -d | bash" '{commands:[$c]}')" --query Command.CommandId --output text)
          for _ in $(seq 1 60); do ST=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending); case "$ST" in Success|Failed|Cancelled|TimedOut) break;; esac; sleep 5; done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query StandardOutputContent --output text
          [ "$ST" = Success ]

  cut-new-db:
    if: inputs.step == 'p2-cutover' && inputs.confirm == 'CUTOVER-20261018'
    needs: [cut-precheck, cut-old]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: f2r-infra-build
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.BUILDER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: f2r-cut-newdb
      - name: Copy shared final snapshot, restore new RDS, switch the new app to it
        shell: bash
        env:
          STAMP: ${{ needs.cut-precheck.outputs.stamp }}
          OLD_COUNTS_B64: ${{ needs.cut-old.outputs.old_counts_b64 }}
        run: |
          set -euo pipefail
          SRC="arn:aws:rds:ap-northeast-2:067573916809:snapshot:f2r-mig-final-$STAMP"; C="f2r-shared-final-$STAMP"; DB="f2r-db-$STAMP"
          IID0=$(aws ec2 describe-instances --filters Name=tag:Name,Values=f2r-app Name=tag:Project,Values=f2r-migration Name=instance-state-name,Values=running --query 'Reservations[0].Instances[0].InstanceId' --output text)
          CID0=$(aws ssm send-command --instance-ids "$IID0" --document-name AWS-RunShellScript --parameters '{"commands":["systemctl stop f2r-app; echo new-app-stopped"]}' --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$CID0" --instance-id "$IID0" || true
          aws rds copy-db-snapshot --source-db-snapshot-identifier "$SRC" --target-db-snapshot-identifier "$C" --kms-key-id alias/aws/rds >/dev/null
          aws rds wait db-snapshot-available --db-snapshot-identifier "$C"
          RDSSG=$(aws ec2 describe-security-groups --filters Name=group-name,Values=f2r-rds-sg Name=tag:Project,Values=f2r-migration --query 'SecurityGroups[0].GroupId' --output text)
          aws rds restore-db-instance-from-db-snapshot --db-instance-identifier "$DB" --db-snapshot-identifier "$C" --db-instance-class db.t4g.micro --db-subnet-group-name f2r-db-subnets --vpc-security-group-ids "$RDSSG" --no-publicly-accessible --no-multi-az --db-parameter-group-name f2r-mysql84-params --tags Key=Project,Value=f2r-migration >/dev/null
          aws rds wait db-instance-available --db-instance-identifier "$DB"
          # gp3 전환·백업 보존 설정은 전환 중 지연(storage-optimization)을 만들 수 있어 전환 후 무중단으로 별도 적용한다.
          NEWEP=$(aws rds describe-db-instances --db-instance-identifier "$DB" --query 'DBInstances[0].Endpoint.Address' --output text)
          echo "::add-mask::$NEWEP"; export NEWEP
          python3 - <<'PY'
          import json,os,re,subprocess
          new=os.environ["NEWEP"]
          names=json.loads(subprocess.check_output(["aws","ssm","get-parameters-by-path","--path","/f2r/app/","--query","Parameters[].Name","--output","json"]))
          for n in names:
              v=subprocess.check_output(["aws","ssm","get-parameter","--name",n,"--with-decryption","--query","Parameter.Value","--output","text"]).decode().rstrip("\n")
              nv=re.sub(r"[A-Za-z0-9.-]+\.rds\.amazonaws\.com",new,v)
              if nv!=v: subprocess.check_call(["aws","ssm","put-parameter","--name",n,"--type","SecureString","--overwrite","--value",nv],stdout=subprocess.DEVNULL)
          PY
          IID=$(aws ec2 describe-instances --filters Name=tag:Name,Values=f2r-app Name=tag:Project,Values=f2r-migration Name=instance-state-name,Values=running --query 'Reservations[0].Instances[0].InstanceId' --output text)
          # 신규 앱은 정지한 채로(스케줄러 쓰기 방지) 행 수를 비교하고, 일치할 때만 기동한다.
          CNT='set -a; . /etc/f2r/env; set +a; export MYSQL_PWD="$DB_PASSWORD"; M="mysql -N -B -h $DB_HOST -P ${DB_PORT:-3306} -u $DB_USER $DB_NAME"; $M -e "select table_name from information_schema.tables where table_schema=database() and table_type=\"BASE TABLE\" order by 1" | while read t; do echo "$t $($M -e "select count(*) from \`$t\`")"; done'
          SCRIPT="set -e; sed -i -E 's/[A-Za-z0-9.-]+\.rds\.amazonaws\.com/$NEWEP/g' /etc/f2r/env; dnf install -y mariadb105 >/dev/null 2>&1 || true; ( set +e; $CNT ) | grep -v '^\$' > /tmp/new.counts; echo '$OLD_COUNTS_B64' | base64 -d | grep -v '^\$' > /tmp/old.counts; DIFF=\$(diff /tmp/old.counts /tmp/new.counts | grep -c '^[<>]' || true); echo tables=\$(wc -l < /tmp/new.counts) table-diff=\$DIFF; if [ \"\$DIFF\" != 0 ] || [ \$(wc -l < /tmp/new.counts) -lt 20 ]; then echo COUNT-MISMATCH; exit 3; fi; systemctl restart f2r-app; for i in \$(seq 1 50); do curl -sf localhost:8080/actuator/health >/dev/null && echo app-healthy && break; sleep 5; done"
          B64=$(printf '%s' "$SCRIPT" | base64 -w0)
          CID=$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript --parameters "$(jq -cn --arg c "echo $B64 | base64 -d | bash" '{commands:[$c]}')" --query Command.CommandId --output text)
          for _ in $(seq 1 80); do ST=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending); case "$ST" in Success|Failed|Cancelled|TimedOut) break;; esac; sleep 5; done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query StandardOutputContent --output text | sed -E 's/[A-Za-z0-9.-]+\.rds\.amazonaws\.com/<rds>/g'
          [ "$ST" = Success ]

  cut-verify:
    if: inputs.step == 'p2-cutover' && inputs.confirm == 'CUTOVER-20261018'
    needs: [cut-precheck, cut-old, cut-new-db]
    runs-on: ubuntu-latest
    steps:
      - name: Final gate before DNS (new ALB serves the restored data; counts were already matched in cut-new-db)
        shell: bash
        run: |
          set -euo pipefail
          A=https://f2r-alb-2551937.ap-northeast-2.elb.amazonaws.com
          for p in /actuator/health / /login /ledger /easy /testprep; do
            CODE=$(curl -sk -m 20 -o /dev/null -w '%{http_code}' -H 'Host: feel2real.co.kr' "$A$p"); echo "$p $CODE"; [ "$CODE" = 200 ]
          done
          for p in /api/me /api/builder/pages; do
            CODE=$(curl -sk -m 20 -o /dev/null -w '%{http_code}' -H 'Host: feel2real.co.kr' "$A$p"); echo "$p $CODE (expect 401)"; [ "$CODE" = 401 ]
          done

  cut-dns:
    if: inputs.step == 'p2-cutover' && inputs.confirm == 'CUTOVER-20261018'
    needs: [cut-precheck, cut-old, cut-new-db, cut-verify]
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/f2r-migration-admin-temp
          aws-region: ap-northeast-2
          role-session-name: f2r-cut-dns
      - name: Switch DNS alias records (root, wildcard, app) to the new ALB
        shell: bash
        run: |
          set -euo pipefail
          ZID=$(aws route53 list-hosted-zones-by-name --dns-name feel2real.co.kr --query "HostedZones[?Name=='feel2real.co.kr.' && Config.PrivateZone==\`false\`].Id | [0]" --output text)
          NEW=dualstack.f2r-alb-2551937.ap-northeast-2.elb.amazonaws.com.
          jq -n --arg t "$NEW" '{Changes:[ "feel2real.co.kr.","*.feel2real.co.kr.","app.feel2real.co.kr." | {Action:"UPSERT",ResourceRecordSet:{Name:.,Type:"A",AliasTarget:{HostedZoneId:"ZWKZPGTI48KDX",DNSName:$t,EvaluateTargetHealth:false}}} ]}' > /tmp/chg.json
          aws route53 change-resource-record-sets --hosted-zone-id "$ZID" --change-batch file:///tmp/chg.json --query ChangeInfo.Status --output text
          sleep 90
          for i in $(seq 1 10); do
            CODE=$(curl -s -m 20 -o /dev/null -w '%{http_code}' https://feel2real.co.kr/actuator/health || echo 000); echo "public health=$CODE"
            [ "$CODE" = 200 ] && break; sleep 15
          done
          [ "$CODE" = 200 ]
          R1=$(getent ahostsv4 feel2real.co.kr | awk '{print $1}' | sort -u | tr '\n' ' '); R2=$(getent ahostsv4 f2r-alb-2551937.ap-northeast-2.elb.amazonaws.com | awk '{print $1}' | sort -u | tr '\n' ' ')
          echo "domain ips=$R1"; echo "new alb ips=$R2"
          for ip in $R1; do case " $R2 " in *" $ip "*) echo "domain resolves to NEW ALB"; exit 0;; esac; done
          echo "도메인이 신규 ALB로 해석되지 않음" >&2; exit 1

  cut-rollback:
    if: always() && inputs.step == 'p2-cutover' && inputs.confirm == 'CUTOVER-20261018' && (contains(fromJSON('["failure","cancelled"]'), needs.cut-old.result) || contains(fromJSON('["failure","cancelled"]'), needs.cut-new-db.result) || contains(fromJSON('["failure","cancelled"]'), needs.cut-verify.result) || contains(fromJSON('["failure","cancelled"]'), needs.cut-dns.result))
    needs: [cut-old, cut-new-db, cut-verify, cut-dns]
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/f2r-migration-admin-temp
          aws-region: ap-northeast-2
          role-session-name: f2r-cut-rollback
      - name: ROLLBACK — DNS back to the old ALB, restart old app and wiki
        shell: bash
        run: |
          set -uo pipefail
          ZID=$(aws route53 list-hosted-zones-by-name --dns-name feel2real.co.kr --query "HostedZones[?Name=='feel2real.co.kr.' && Config.PrivateZone==\`false\`].Id | [0]" --output text)
          OLD=dualstack.f2r-alb-1102199627.ap-northeast-2.elb.amazonaws.com.
          jq -n --arg t "$OLD" '{Changes:[ "feel2real.co.kr.","*.feel2real.co.kr.","app.feel2real.co.kr." | {Action:"UPSERT",ResourceRecordSet:{Name:.,Type:"A",AliasTarget:{HostedZoneId:"ZWKZPGTI48KDX",DNSName:$t,EvaluateTargetHealth:false}}} ]}' > /tmp/chg.json
          aws route53 change-resource-record-sets --hosted-zone-id "$ZID" --change-batch file:///tmp/chg.json --query ChangeInfo.Status --output text
          IID=i-09d7cabb5a42d1135
          CMD='systemctl start buildit-wiki; systemctl start f2r-app; for i in $(seq 1 50); do curl -sf localhost:8080/actuator/health >/dev/null && echo old-app-healthy && break; sleep 5; done'
          CID=$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript --parameters "$(jq -cn --arg c "$CMD" '{commands:[$c]}')" --query Command.CommandId --output text)
          for _ in $(seq 1 60); do ST=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending); case "$ST" in Success|Failed|Cancelled|TimedOut) break;; esac; sleep 5; done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query StandardOutputContent --output text
          echo "ROLLBACK DONE — 구 환경 복구됨. 전환 실패 원인은 위 잡 로그 확인"

  # ---- 전환 전 조사(읽기 전용): 구 호스트 위키 데이터·서비스, Route 53 레코드, 구 ALB, 구 RDS ----
  p2-cutover-inventory:
    if: inputs.step == 'p2-cutover-inventory'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/f2r-migration-admin-temp
          aws-region: ap-northeast-2
          role-session-name: f2r-cutover-inv
      - name: Read-only inventory
        shell: bash
        run: |
          set +e
          IID=i-09d7cabb5a42d1135
          mask() { sed -E 's/[0-9]{12}/<acct>/g'; }
          seg() {
            local title="$1" cmd="$2" params cid st
            echo; echo "===== $title ====="
            params=$(jq -cn --arg c "$cmd" '{commands:[$c]}')
            cid=$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript --parameters "$params" --query Command.CommandId --output text)
            for _ in $(seq 1 40); do
              st=$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)
              case "$st" in Success|Failed|Cancelled|TimedOut) break;; esac; sleep 3
            done
            aws ssm get-command-invocation --command-id "$cid" --instance-id "$IID" --query StandardOutputContent --output text | mask | head -60
          }
          seg "WIKI data + services" 'set +e; ls -la /opt/buildit-wiki /opt/buildit-wiki/data 2>&1 | head -20; du -sh /opt/buildit-wiki/data; /opt/buildit-wiki/venv/bin/python -c "import sqlite3;c=sqlite3.connect(\"file:/opt/buildit-wiki/data/app.db?mode=ro\",uri=True);print(\"integrity\",c.execute(\"pragma integrity_check\").fetchone()[0]);print(\"tables\",len(c.execute(\"select name from sqlite_master where type=\x27table\x27\").fetchall()))" 2>&1 | tail -3; systemctl is-active f2r-app buildit-wiki buildit-staging 2>&1; ss -ltn | awk "NR>1{print \$4}" | sort -u | tr "\n" " "'
          seg "EMBEDDING / other data dirs / timers" 'set +e; grep -l -i embeddinggemma /etc/systemd/system/*.service /etc/f2r/env /etc/buildit-wiki.env 2>/dev/null; grep -rl -i embeddinggemma /opt/buildit-wiki/app 2>/dev/null | head -3; grep -oE "^[A-Z0-9_]*(EMBED|WIKI|RAG)[A-Z0-9_]*" /etc/f2r/env /etc/buildit-wiki.env 2>/dev/null | sort -u; echo "--- big dirs"; du -sh /home/ec2-user /var/lib/f2r* /var/tmp/f2r /opt/staging 2>/dev/null; systemctl list-timers --no-pager 2>/dev/null | head -6; crontab -l 2>/dev/null | head -3; ls /etc/cron.d 2>/dev/null'
          echo; echo "===== Route 53 records (A/AAAA/CNAME only) ====="
          ZID=$(aws route53 list-hosted-zones-by-name --dns-name feel2real.co.kr --query "HostedZones[?Name=='feel2real.co.kr.'].Id | [0]" --output text)
          aws route53 list-resource-record-sets --hosted-zone-id "$ZID" --query "ResourceRecordSets[?Type=='A' || Type=='AAAA' || Type=='CNAME'].[Name,Type,TTL,AliasTarget.DNSName,AliasTarget.HostedZoneId,ResourceRecords[0].Value]" --output text | mask
          echo; echo "===== Old ALBs ====="
          aws elbv2 describe-load-balancers --query "LoadBalancers[].[LoadBalancerName,Scheme,DNSName,State.Code]" --output text | mask
          for TG in $(aws elbv2 describe-target-groups --query "TargetGroups[].TargetGroupArn" --output text); do aws elbv2 describe-target-health --target-group-arn "$TG" --query "TargetHealthDescriptions[].[Target.Id,TargetHealth.State]" --output text; done
          echo; echo "===== Old RDS ====="
          aws rds describe-db-instances --query "DBInstances[].[DBInstanceIdentifier,DBInstanceClass,EngineVersion,DBInstanceStatus,BackupRetentionPeriod,AllocatedStorage]" --output text | mask
          aws rds describe-db-snapshots --snapshot-type automated --query "reverse(sort_by(DBSnapshots,&SnapshotCreateTime))[0].[DBSnapshotIdentifier,SnapshotCreateTime]" --output text | mask

  # ---- DesignCraft 폐기 결정(2026-10-18): 신규 환경에서 전용 Worker만 비활성화한다 ----
  # 엔진·템플릿 파일, DB, 백업, 공개 URL은 그대로 둔다(영구 삭제·URL 차단은 별도 승인).
  p2-disable-designcraft:
    if: inputs.step == 'p2-disable-designcraft'
    runs-on: ubuntu-latest
    environment: f2r-infra-build
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.BUILDER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: f2r-disable-dc
      - name: Set PUBLISHING_WORKER_ENABLED=false (SSM param + host env) and restart app
        shell: bash
        run: |
          set -euo pipefail
          aws ssm put-parameter --name /f2r/app/PUBLISHING_WORKER_ENABLED --type SecureString --overwrite --value false >/dev/null
          aws ssm put-parameter --name /f2r/app/APP_EXAM_INSIGHT_ENABLED --type SecureString --overwrite --value false >/dev/null
          IID=$(aws ec2 describe-instances --filters Name=tag:Name,Values=f2r-app Name=tag:Project,Values=f2r-migration Name=instance-state-name,Values=running --query 'Reservations[0].Instances[0].InstanceId' --output text)
          CMD="set -e; grep -vE '^(PUBLISHING_WORKER_ENABLED|APP_EXAM_INSIGHT_ENABLED)=' /etc/f2r/env > /etc/f2r/env.tmp || true; echo PUBLISHING_WORKER_ENABLED=false >> /etc/f2r/env.tmp; echo APP_EXAM_INSIGHT_ENABLED=false >> /etc/f2r/env.tmp; chmod 600 /etc/f2r/env.tmp; mv /etc/f2r/env.tmp /etc/f2r/env; systemctl restart f2r-app; for i in \$(seq 1 40); do curl -sf localhost:8080/actuator/health >/dev/null && echo healthy && break; sleep 5; done; grep -c '^PUBLISHING_WORKER_ENABLED=false' /etc/f2r/env"
          CID=$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript --parameters "$(jq -cn --arg c "$CMD" '{commands:[$c]}')" --query Command.CommandId --output text)
          for _ in $(seq 1 60); do
            ST=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)
            case "$ST" in Success|Failed|Cancelled|TimedOut) break;; esac; sleep 5
          done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query StandardOutputContent --output text
          [ "$ST" = Success ]

  # ---- 대시보드 AI(Muse Spark 1.3 Contributor) 실제 호출 확인: 신규 호스트의 서버 키로 짧은 질문 1회(키·내부 사고 미출력) ----
  muse-check:
    if: inputs.step == 'muse-check'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: f2r-muse-check
      - name: Call Muse Spark from the new host with the server-side key
        shell: bash
        run: |
          set -euo pipefail
          IID=$(aws ec2 describe-instances --filters Name=tag:Name,Values=f2r-app Name=tag:Project,Values=f2r-migration Name=instance-state-name,Values=running --query 'Reservations[0].Instances[0].InstanceId' --output text)
          CMD='set +e; set -a; . /etc/f2r/env 2>/dev/null; set +a; echo "key_present=$([ -n "$META_JIPJIGI_API_KEY" ] && echo yes || echo no) model=${META_JIPJIGI_MODEL:-muse-spark-1.3-contributor} base=${META_JIPJIGI_BASE_URL:-https://api.meta.ai/v1}"; [ -n "$META_JIPJIGI_API_KEY" ] || exit 0; B=${META_JIPJIGI_BASE_URL:-https://api.meta.ai/v1}; M=${META_JIPJIGI_MODEL:-muse-spark-1.3-contributor}; curl -sS -m 110 -o /tmp/muse.json -w "http=%{http_code} time=%{time_total}s\n" "$B/chat/completions" -H "Authorization: Bearer $META_JIPJIGI_API_KEY" -H "Content-Type: application/json" -d "{\"model\":\"$M\",\"messages\":[{\"role\":\"user\",\"content\":\"한 문장으로 인사해 주세요.\"}],\"max_tokens\":8000}"; python3 -c "import json;d=json.load(open(\"/tmp/muse.json\"));c=d.get(\"choices\",[{}])[0];m=(c.get(\"message\") or {}).get(\"content\") or \"\";print(\"model=\"+str(d.get(\"model\")),\"finish=\"+str(c.get(\"finish_reason\")),\"content_len=\"+str(len(m)));print(m[:200])" 2>&1 | head -5; rm -f /tmp/muse.json'
          CID=$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript --parameters "$(jq -cn --arg c "$CMD" '{commands:[$c]}')" --query Command.CommandId --output text)
          for _ in $(seq 1 60); do
            ST=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)
            case "$ST" in Success|Failed|Cancelled|TimedOut) break;; esac; sleep 5
          done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query '{s:Status,o:StandardOutputContent,e:StandardErrorContent}' --output text | tail -c 2500
          [ "$ST" = Success ]

  # ---- P2 DesignCraft 검증: 신규 호스트에서 샘플 문서로 PNG·PDF 출력(앱 사용자 ec2-user, 임시 파일은 /var/tmp/f2r) ----
  p2-dc-verify:
    if: inputs.step == 'p2-dc-verify'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: f2r-p2-dc-verify
      - name: Render sample PNG and PDF on the new host
        shell: bash
        run: |
          set -euo pipefail
          IID=$(aws ec2 describe-instances --filters Name=tag:Name,Values=f2r-app Name=tag:Project,Values=f2r-migration Name=instance-state-name,Values=running --query 'Reservations[0].Instances[0].InstanceId' --output text)
          CMD="cd /var/tmp/f2r; rm -f dc-test.png dc-test.pdf; echo --- png; sudo -u ec2-user bash -c '/opt/designcraft/designcraft-cli run --sample --page 0 --scale 1 --export /var/tmp/f2r/dc-test.png' 2>&1 | tail -3; file dc-test.png | cut -c1-110; ls -l dc-test.png | awk '{print \$5}'; echo --- pdf; sudo -u ec2-user bash -c '/opt/designcraft/designcraft-cli run --sample --export /var/tmp/f2r/dc-test.pdf' 2>&1 | tail -3; file dc-test.pdf | cut -c1-110; ls -l dc-test.pdf | awk '{print \$5}'; pdffonts dc-test.pdf 2>/dev/null | head -6 || true; echo --- all-pages; mkdir -p /var/tmp/f2r/dc-pages; sudo -u ec2-user bash -c '/opt/designcraft/designcraft-cli run --sample --all-pages /var/tmp/f2r/dc-pages --scale 0.5' 2>&1 | tail -2; ls /var/tmp/f2r/dc-pages | wc -l; rm -rf /var/tmp/f2r/dc-pages dc-test.png dc-test.pdf"
          CID=$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript --parameters "$(jq -cn --arg c "$CMD" '{commands:[$c]}')" --query Command.CommandId --output text)
          for _ in $(seq 1 60); do
            ST=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)
            case "$ST" in Success|Failed|Cancelled|TimedOut) break;; esac; sleep 5
          done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query '{s:Status,o:StandardOutputContent,e:StandardErrorContent}' --output text | tail -c 3500
          [ "$ST" = Success ]

  # ---- P2 조사(읽기 전용): 구 호스트 DesignCraft/폰트/S3 환경값 이름 + 구 S3 버킷 속성·규모 ----
  p2-inventory:
    if: inputs.step == 'p2-inventory'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/f2r-migration-admin-temp
          aws-region: ap-northeast-2
          role-session-name: f2r-p2-inventory
      - name: Old host + old S3 inventory (read-only, no secrets, no user file names)
        shell: bash
        run: |
          set +e
          IID=i-09d7cabb5a42d1135
          mask() { sed -E 's/[0-9]{12}/<acct>/g'; }
          seg() {
            local title="$1" cmd="$2" params cid st
            echo; echo "===== $title ====="
            params=$(jq -cn --arg c "$cmd" '{commands:[$c]}')
            cid=$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript --parameters "$params" --query Command.CommandId --output text)
            for _ in $(seq 1 40); do
              st=$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)
              case "$st" in Success|Failed|Cancelled|TimedOut) break;; esac; sleep 3
            done
            aws ssm get-command-invocation --command-id "$cid" --instance-id "$IID" --query StandardOutputContent --output text | mask | head -80
          }
          seg "S3 env (selected non-secret values)" 'grep -E "^(S3_BUCKET|S3_REGION|S3_KEY_PREFIX|ALB_ACCESS_LOG_BUCKET|ALB_ACCESS_STATISTICS_ENABLED|PUBLISHING_[A-Z_]*|APP_VIDEO_[A-Z_]*|ACADEMY_VIDEO_[A-Z_]*|SPRING_PROFILES_ACTIVE)=" /etc/f2r/env | sed -E "s/^((.*(KEY|SECRET|TOKEN|PASSWORD).*)=).*/\1<masked>/"'
          seg "DESIGNCRAFT /opt/designcraft" 'set +e; du -sh /opt/designcraft; ls -la /opt/designcraft | head -30; echo "--- depth2 dirs+sizes"; du -h --max-depth=2 /opt/designcraft | sort -h | tail -15; echo "--- cli"; file /opt/designcraft/designcraft-cli 2>&1 | cut -c1-160; /opt/designcraft/designcraft-cli --version 2>&1 | head -3; echo "--- ldd missing"; ldd /opt/designcraft/designcraft-cli 2>&1 | grep -i "not found" | head; echo "--- owner"; stat -c "%U:%G %a" /opt/designcraft /opt/designcraft/designcraft-cli'
          seg "DESIGNCRAFT deps (python/node/libs/fonts)" 'set +e; ls /opt/designcraft/templates | head -20; ls /opt/designcraft/releases 2>/dev/null | head; find /opt/designcraft -maxdepth 2 -name "*.py" -o -maxdepth 2 -name "requirements*.txt" -o -maxdepth 2 -name "package.json" | head; echo "--- fonts"; du -sh /opt/artcraft/fonts; ls /opt/artcraft/fonts | head -30; ls /opt/artcraft/fonts | wc -l; fc-list | wc -l; echo "--- rpm libs"; rpm -qa | grep -Ei "cairo|pango|harfbuzz|freetype|fontconfig|poppler|ghostscript|libreoffice|chrom|webp|libjpeg|libpng|tiff|lcms|glib2|skia" | sort | head -30'
          seg "DESIGNCRAFT systemd/env refs" 'set +e; grep -rl -i designcraft /etc/systemd/system /etc/f2r 2>/dev/null | head; systemctl list-units --type=service --all --no-pager 2>/dev/null | grep -i -E "design|publish|worker" | head'
          echo; echo "===== S3 old bucket ====="
          BKT=$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript --parameters '{"commands":["grep -E \"^S3_BUCKET=\" /etc/f2r/env | cut -d= -f2- | tr -d \"\\\"\""]}' --query Command.CommandId --output text)
          sleep 6
          BKT=$(aws ssm get-command-invocation --command-id "$BKT" --instance-id "$IID" --query StandardOutputContent --output text | tr -d '[:space:]')
          echo "bucket=$BKT"
          [ -n "$BKT" ] || { echo "no bucket"; exit 0; }
          for q in get-bucket-versioning get-bucket-encryption get-bucket-cors get-bucket-lifecycle-configuration get-public-access-block get-bucket-location; do echo "--- $q"; aws s3api $q --bucket "$BKT" 2>&1 | mask | head -25; done
          echo "--- top-level prefixes"; aws s3api list-objects-v2 --bucket "$BKT" --delimiter / --query 'CommonPrefixes[].Prefix' --output text 2>&1 | head -5
          echo "--- size/count (all)"; aws s3 ls "s3://$BKT" --recursive --summarize 2>/dev/null | tail -2
          echo "--- size/count per prefix"; for P in $(aws s3api list-objects-v2 --bucket "$BKT" --delimiter / --query 'CommonPrefixes[].Prefix' --output text 2>/dev/null); do echo "$P: $(aws s3 ls "s3://$BKT/$P" --recursive --summarize 2>/dev/null | tail -2 | tr '\n' ' ')"; done
