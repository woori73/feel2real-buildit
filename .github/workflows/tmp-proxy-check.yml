# TEMPORARY - proxy/timeout inspection (read-only). Delete after investigation.
# paths-ignore 대상이라 Build/Deploy를 실행하지 않는다.
name: Tmp Proxy Check (read-only, manual)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2

      - name: Inspect proxy via SSM
        run: |
          set -euo pipefail
          SSM_BODY=$(cat <<'SSMEOF'
          echo "===== listening ports ====="
          ss -ltnp 2>/dev/null | head -20 || true
          echo ""
          echo "===== nginx process ====="
          ps aux | grep -v grep | grep nginx | head -5 || echo "no nginx process"
          echo ""
          echo "===== nginx full config (timeouts, proxy_pass) ====="
          nginx -T 2>&1 | grep -vE '^\s*#' | grep -E 'proxy_connect_timeout|proxy_send_timeout|proxy_read_timeout|proxy_pass|listen |server_name|location' | head -60 || echo "nginx -T unavailable"
          echo ""
          echo "===== direct app 401 check (bypass proxy) ====="
          curl -sk -o /dev/null -w "app:8080 -> %{http_code}\n" --max-time 10 http://127.0.0.1:8080/api/admin/newstart/wiki/export/manifest || true
          echo ""
          echo "===== via nginx 80/443 (if listening) ====="
          curl -sk -o /dev/null -w "nginx:80 -> %{http_code}\n" --max-time 10 http://127.0.0.1:80/api/admin/newstart/wiki/export/manifest || echo "port 80 not reachable"
          curl -sk -o /dev/null -w "nginx:443 -> %{http_code}\n" --max-time 10 https://127.0.0.1:443/api/admin/newstart/wiki/export/manifest || echo "port 443 not reachable"
          SSMEOF
          )
          SSM_SCRIPT=$(printf 'set -euo pipefail\n%s\n' "$SSM_BODY")
          PARAMS_JSON=$(python3 -c 'import json,sys; print(json.dumps({"commands": sys.stdin.read().splitlines()}))' <<< "$SSM_SCRIPT")
          CMD_ID=$(aws ssm send-command \
            --instance-ids i-09d7cabb5a42d1135 \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMS_JSON" \
            --query 'Command.CommandId' --output text)
          for i in $(seq 1 20); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'Status' --output text)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'StandardOutputContent' --output text
