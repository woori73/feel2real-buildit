name: Financial collector isolated check
on:
  pull_request:
    paths:
      - 'src/**/easy/**'
      - 'local-collector/**'
      - 'build.gradle'
      - 'scripts/test-financial-collector.sh'
      - '.github/workflows/financial-collector-check.yml'
permissions:
  contents: read
jobs:
  sample-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix local-collector --ignore-scripts
      - run: bash scripts/test-financial-collector.sh
      - run: npx playwright install --with-deps chromium
        working-directory: local-collector
      - run: xvfb-run -a npm --prefix local-collector run test:e2e-mock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: financial-collector-test-results
          path: build/test-results/test
