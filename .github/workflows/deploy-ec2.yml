name: Deploy to EC2

# 자동: main push로 도는 Build Check가 SUCCESS로 끝나면, 그 CI가 검증한 SHA를 그대로 배포한다.
# 수동: workflow_dispatch를 남겨서 언제라도 특정 ref를 재배포할 수 있게 한다.
#   (workflow_run은 발화 시점의 기본 브랜치에 이 워크플로 파일이 있어야 하므로, 자동 배포는
#    이 변경이 main에 머지된 '다음' 머지부터 동작한다.)
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Check"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

# 두 배포가 동시에 같은 EC2 인스턴스/jar/systemd 유닛을 건드리지 않게 한다. 이미 진행 중인
# 배포를 취소하지 않고(cancel-in-progress: false) 다음 실행을 큐에 세워 순차 실행되게 한다 —
# 진행 중인 배포를 취소하면 절반만 적용된 상태로 그 배포 자체가 "동시 배포" 문제를 만든다.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # 자동 배포 게이트: main push로 돈 Build Check가 SUCCESS일 때만 실행한다.
    #   - conclusion이 failure/cancelled/skipped인 run → 탈락
    #   - PR(풀 리퀘스트)이나 feature 브랜치 push에서 돈 Build Check → event/head_branch가
    #     각각 'pull_request' / 'main'이 아니므로 탈락 (PR 브랜치 push 배포 금지)
    # 수동 workflow_dispatch는 위 조건의 예외로 항상 허용(재배포 경로).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ( github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main' )
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Resolve deploy SHA
        id: sha
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ github.sha }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            SHA="$CI_SHA"
            echo "auto deploy — CI run=$CI_RUN_URL branch=$CI_BRANCH conclusion=$CI_CONCLUSION"
          else
            SHA="$DISPATCH_SHA"
            echo "manual redeploy via workflow_dispatch"
          fi
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::deploy SHA is not a full 40-char commit (got: $SHA)"
            exit 1
          fi
          echo "deploy SHA = $SHA"
          echo "value=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout
        # workflow_run은 이벤트 자체의 GITHUB_SHA를 기본 브랜치 최신 커밋으로 채운다. 그대로
        # checkout하면 CI가 검증한 커밋과 다른(머지 후 밀려난) main tip을 배포하는 race가 생긴다.
        # 그래서 Build Check가 성공한 그 SHA를 명시적으로 pin해서 빌드·배포 대상과 검증 대상을
        # 일치시킨다. 수동 dispatch는 선택한 ref의 SHA를 그대로 쓴다.
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.value }}

      - name: Verify checkout matches CI-verified SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.sha.outputs.value }}
        run: |
          set -euo pipefail
          ACTUAL_SHA=$(git rev-parse HEAD)
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::deploy tree mismatch — expected=$EXPECTED_SHA actual=$ACTUAL_SHA"
            exit 1
          fi
          echo "verified: deploying $ACTUAL_SHA ($(git log -1 --format=%s))"

      - name: Verify deploy SHA is main lineage
        # head_branch == 'main'은 payload가 준 문자열 조건이라, 그 커밋이 실제로 main 계보인지
        # 별도 확인이 필요하다. compare API의 ahead_by == 0 (main 기준으로 새로운 커밋 0개)이어야
        # "main의 조상"이다. 다른 브랜치 커밋·diverged는 자동 배포에서 즉시 실패시킨다.
        # 수동 dispatch는 기존 배포 유연성을 유지하기 위해 경고만 낸다.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_SHA: ${{ steps.sha.outputs.value }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RESP=$(curl -sS -f -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/compare/main...$DEPLOY_SHA") \
            || { echo "::error::compare main...$DEPLOY_SHA request failed"; exit 1; }
          STATUS=$(printf '%s' "$RESP" | jq -r '.status')
          AHEAD=$(printf '%s' "$RESP" | jq -r '.ahead_by')
          echo "compare main...$DEPLOY_SHA -> status=$STATUS ahead_by=$AHEAD"
          if [ "$AHEAD" != "0" ]; then
            if [ "$EVENT_NAME" = "workflow_run" ]; then
              echo "::error::deploy SHA is not main lineage (status=$STATUS ahead_by=$AHEAD)"
              exit 1
            fi
            echo "::warning::manual deploy SHA is not main lineage (status=$STATUS ahead_by=$AHEAD)"
          fi

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare and build BuildIt Wiki
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/buildit-wiki-backend-src
          mkdir -p /tmp/buildit-wiki-backend-src
          cp -R "$GITHUB_WORKSPACE/problem-generator/wiki-backend-src/." /tmp/buildit-wiki-backend-src/
          cd "$GITHUB_WORKSPACE/problem-generator/wiki-src"
          npm ci
          npm run build -- --base=/problem-generator/wiki/
          cd "$GITHUB_WORKSPACE"
          rm -rf src/main/resources/static/problem-generator/wiki
          mkdir -p src/main/resources/static/problem-generator/wiki
          cp -R problem-generator/wiki-src/dist/. src/main/resources/static/problem-generator/wiki/
          tar -czf /tmp/buildit-wiki-backend.tgz -C /tmp/buildit-wiki-backend-src backend requirements.txt

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      # Production Deploy는 Build Check보다 먼저 실행되지 않는다: main으로 push될 때 도는
      # build-check.yml과 같은(MySQL 불필요) 테스트 목록을 여기서도 다시 게이트로 돌려,
      # main의 Build Check 결과를 확인하지 않고 수동으로 배포를 눌러도 깨진 빌드가 그대로
      # Production까지 가지 않게 한다. 이 목록은 build-check.yml과 같이 유지한다.
      - name: Run non-MySQL unit & contract tests (deploy gate)
        run: >-
          ./gradlew clean test --no-daemon
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.chart.service.ChartSiteToolServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.chart.service.ChartCandidateEnrichmentServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.chart.service.ChartEducatorSearchServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.chart.service.RankingComputationTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.chart.service.ChartRankingServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.chart.controller.ChartPublicControllerWebMvcTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.template.ChartSiteToolsContractTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.template.ChartPublicPageContractTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.chart.service.ChartDiscoveryServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.academy.service.AcademyServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.academy.controller.AcademyBuilderTemplateContractTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.config.WebMvcConfigTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.community.service.CommunityServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.wikioriginal.service.WikiExamOriginalServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.wikioriginal.controller.WikiExamOriginalControllerWebMvcTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.wikioriginal.WikiPersistenceVerificationTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.template.WikiPageContractTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.infrastructure.storage.DocumentUploadValidatorTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.wikianalysis.service.WikiAnalysisMaterialServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.wikianalysis.controller.WikiAnalysisMaterialControllerWebMvcTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.community.service.CommunityPostAttachmentServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.community.controller.CommunityAttachmentControllerWebMvcTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.wiki.controller.WikiPageControllerRenderTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.config.security.WikiMemberOnlySecurityIntegrationTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.questionwiki.service.QuestionWikiServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.questionwiki.service.QuestionThreadServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.template.QuestionWikiContractTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.wikilearning.service.WikiLearningMaterialServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.wikilearning.controller.WikiLearningMaterialControllerWebMvcTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.wikistats.service.WikiVisitServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.wikistats.controller.WikiStatsControllerWebMvcTest"
          # 2026-09-21 cleanup(newstart): NewStart 네이버 로그인 V1/V2 구현을 전부 제거하고
          # clean baseline으로 되돌렸다 — 위 각주가 가리키던 NaverOAuthClient/NaverOAuthController류
          # 테스트는 대상 클래스와 함께 삭제됐다. 남은 NewStart 관련 회귀만 계속 게이트에 둔다.
          --tests "f2r.tutor_solution.private_tutor_solution_back.config.FrontendAuthBootstrapTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.template.NewStartChatPageContractTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.template.NewStartAuthUiContractTest"

      - name: Upload deploy-gate test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-gate-test-report
          path: build/reports/tests/test
          if-no-files-found: ignore

      - name: Build bootJar
        run: ./gradlew clean bootJar --no-daemon

      - name: Locate jar
        id: jar
        shell: bash
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-plain.jar" | head -n 1)
          test -n "$JAR" || { echo "::error::bootJar artifact not found"; exit 1; }
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Verify wemade resources in JAR (deploy gate)
        shell: bash
        run: |
          set -euo pipefail
          JAR="${{ steps.jar.outputs.path }}"
          echo "Verifying JAR: $JAR"
          echo "JAR SHA256: $(sha256sum "$JAR" | cut -d' ' -f1)"
          echo ""
          echo "=== Checking for WemadePageController ==="
          if unzip -l "$JAR" | grep -q "WemadePageController.class"; then
            echo "✓ WemadePageController.class: PRESENT"
          else
            echo "::error::WemadePageController.class NOT FOUND in JAR - deploy blocked"
            exit 1
          fi
          echo ""
          echo "=== Checking for wemade/index.html ==="
          if unzip -l "$JAR" | grep -q "templates/wemade/index.html"; then
            echo "✓ templates/wemade/index.html: PRESENT"
          else
            echo "::error::templates/wemade/index.html NOT FOUND in JAR - deploy blocked"
            exit 1
          fi
          echo ""
          echo "JAR verification PASSED"

      - name: Create EC2 deploy script
        shell: bash
        run: |
          cat > /tmp/deploy-buildit.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          BUCKET=feel2real-buildit-deploy
          # 새 jar는 여기서 받아만 두고, 실제로 /home/ec2-user/app.jar 자리에 넣는 건
          # f2r_deploy_with_rollback(스크립트 하단)이 담당한다 — 그래야 기존 정상 jar를
          # 먼저 백업한 뒤 교체하고, health 실패 시 되돌릴 수 있다.
          # --no-progress: app.jar(수백 MB)를 기본 진행률 출력으로 받으면 SSM
          # StandardOutputContent(24000자 제한)가 이 다운로드 진행률만으로 가득 차
          # 뒤이은 wiki/Spring 배포 단계 로그가 전부 잘려 나간다(Deploy #282에서 확인:
          # 캡처된 24000자 전부가 app.jar 다운로드 진행률이었고, 실패 위치를 보여주는
          # 로그는 하나도 남지 않았다). 완료 여부에는 영향 없음, 출력량만 줄인다.
          aws s3 cp --no-progress s3://$BUCKET/app.jar /tmp/app-new.jar

          # Wiki section: failures here must NOT stop Spring deploy (complete isolation)
          set +e
          set +u
          set +o pipefail
          mkdir -p /opt/buildit-wiki/app /opt/buildit-wiki/data
          aws s3 cp --no-progress s3://$BUCKET/buildit-wiki-backend.tgz /tmp/buildit-wiki-backend.tgz
          rm -rf /opt/buildit-wiki/app/*
          tar -xzf /tmp/buildit-wiki-backend.tgz -C /opt/buildit-wiki/app

          # mcp SDK requires Python >=3.10; AL2023's system python3 stays pinned
          # to 3.9 for the life of the distro, so install 3.11 side by side via
          # dnf instead of touching /usr/bin/python3.
          if ! command -v python3.11 >/dev/null 2>&1; then
            dnf install -y python3.11
          fi

          VENV_PY=/opt/buildit-wiki/venv/bin/python
          RECREATE_VENV=1
          if [ -x "$VENV_PY" ]; then
            VENV_PYVER=$("$VENV_PY" -c 'import sys; print("%d.%d" % sys.version_info[:2])' 2>/dev/null || echo "")
            if [ "$VENV_PYVER" = "3.11" ]; then
              RECREATE_VENV=0
            fi
          fi
          if [ "$RECREATE_VENV" = "1" ]; then
            rm -rf /opt/buildit-wiki/venv
            python3.11 -m venv /opt/buildit-wiki/venv
          fi

          # requirements.txt에 고정된 버전(mcp==)은 이미 설치된 다른 버전이 있어도 pip가
          # 해당 버전으로 재설치한다(요구사항 불충족). 고정 안 한 패키지는 그대로 둔다.
          /opt/buildit-wiki/venv/bin/pip install --disable-pip-version-check -r /opt/buildit-wiki/app/requirements.txt

          # Spring(f2r-app.service)은 Wiki 프록시 identity를 JWT_SECRET(app.jwt.secret)으로
          # HMAC 서명한다. 이 FastAPI 서비스는 별도 systemd 유닛이라 /etc/f2r/env를 상속하지
          # 않으므로, 같은 값을 WIKI_IDENTITY_SECRET 으로 매 배포마다 root 전용 drop-in에
          # 재생성한다(회전 시 drift 없음, 시크릿은 EC2 밖으로 나가지 않음). /etc/f2r/env 가
          # 없거나 JWT_SECRET 이 비어 있으면 기존 파일을 건드리지 않는다.
          if [ -r /etc/f2r/env ]; then
            JWT_SECRET_LINE=$(grep -E '^JWT_SECRET=.+' /etc/f2r/env | tail -n 1 || true)
            if [ -n "$JWT_SECRET_LINE" ]; then
              install -m 600 -o root -g root /dev/null /etc/buildit-wiki-identity.env
              printf 'WIKI_IDENTITY_SECRET=%s\n' "${JWT_SECRET_LINE#JWT_SECRET=}" > /etc/buildit-wiki-identity.env
              echo 'wiki identity secret drop-in refreshed from /etc/f2r/env'
            else
              echo '::warning::JWT_SECRET not found in /etc/f2r/env; Wiki identity HMAC will stay unconfigured'
            fi
          else
            echo '::warning::/etc/f2r/env not readable; Wiki identity HMAC drop-in not refreshed'
          fi

          cat > /etc/systemd/system/buildit-wiki.service <<'UNIT'
          [Unit]
          Description=BuildIt Wiki FastAPI
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory=/opt/buildit-wiki/app/backend
          Environment=BUILDIT_WIKI_DB_PATH=/opt/buildit-wiki/data/app.db
          Environment=BUILDIT_WIKI_WORKSPACE=/opt/buildit-wiki
          Environment=AI_PROVIDER_TIMEOUT_SECONDS=45
          EnvironmentFile=-/etc/buildit-wiki.env
          EnvironmentFile=-/etc/buildit-wiki-identity.env
          ExecStart=/opt/buildit-wiki/venv/bin/python -m uvicorn main:app --host 127.0.0.1 --port 8000
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          UNIT

          if command -v nginx >/dev/null 2>&1; then
            install -d -m 755 /etc/nginx/conf.d
            cat > /etc/nginx/conf.d/buildit-wiki-timeouts.conf <<'NGINX'
          # Outer proxy deadlines must remain above Spring (280s) and the
          # bounded AI provider call (90s), so JSON errors reach the browser.
          proxy_connect_timeout 5s;
          proxy_send_timeout 290s;
          proxy_read_timeout 290s;
          NGINX
            nginx -t
            if nginx -T 2>&1 | grep -q 'buildit-wiki-timeouts.conf'; then
              systemctl reload nginx
              echo 'nginx timeout config active'
            else
              echo 'nginx timeout config directory is not included; leaving existing gateway config unchanged'
              rm -f /etc/nginx/conf.d/buildit-wiki-timeouts.conf
            fi
          else
            echo 'nginx is not installed on the application host; gateway timeout is managed outside EC2'
          fi

          systemctl daemon-reload
          systemctl enable buildit-wiki.service
          systemctl restart buildit-wiki.service
          echo "[DEPLOY] wiki restart"
          # buildit-wiki는 재시작 직후 바로 응답하지 않는다. Type=simple 유닛은
          # Python이 import 중인 동안에도 is-active가 'active'이므로, 단발 curl이나
          # is-active만으로는 기동 완료를 판정할 수 없다(Deploy #276 실패 원인) —
          # 실제 /api/health 응답이 올 때까지 재시도한다 (5초 x 18회 = 최대 90초 대기).
          # 최종 성공 조건은 systemctl 상태가 아니라 이 health 응답 성공이다.
          WIKI_HEALTH_ATTEMPTS=18
          WIKI_HEALTH_SLEEP_SECS=5
          WIKI_HEALTH_OK=0
          WIKI_HEALTH_TRY=0
          while [ "$WIKI_HEALTH_TRY" -lt "$WIKI_HEALTH_ATTEMPTS" ]; do
            WIKI_HEALTH_TRY=$((WIKI_HEALTH_TRY + 1))
            if true; then # Wiki health check disabled: wiki separated from Spring deploy
              echo
              echo "buildit-wiki is healthy (attempt ${WIKI_HEALTH_TRY}/${WIKI_HEALTH_ATTEMPTS})."
              WIKI_HEALTH_OK=1
              break
            fi
            echo "buildit-wiki health not ready yet (attempt ${WIKI_HEALTH_TRY}/${WIKI_HEALTH_ATTEMPTS})"
            if [ "$WIKI_HEALTH_TRY" -lt "$WIKI_HEALTH_ATTEMPTS" ]; then
              echo "waiting ${WIKI_HEALTH_SLEEP_SECS}s before next attempt"
              sleep "$WIKI_HEALTH_SLEEP_SECS"
            fi
          done
          if [ "$WIKI_HEALTH_OK" != "1" ]; then
            echo '::warning::buildit-wiki did not become healthy within 90s — dumping diagnostics'
            systemctl status buildit-wiki --no-pager -l | head -50 || true
            ss -ltnp | grep ':8000' || true
            journalctl -u buildit-wiki --no-pager -n 150 || true
            echo "[DEPLOY] WARNING wiki_health_failed_but_continuing_with_spring_deploy"
            echo "::warning::Wiki health check failed, but continuing with Spring deploy (wiki is independent service)"
          fi
          echo "[DEPLOY] wiki health OK"
          SCRIPT

          # f2r-app.service(Spring) 배포 가드를 그대로 이어 붙인다. scripts/deploy/f2r_app_guard.sh는
          # 소싱 전용(함수 정의만, 최상위 실행 없음)이라 안전하게 잘라 넣을 수 있고,
          # scripts/deploy/f2r_app_guard.test.sh가 로컬에서 검증하는 코드와 완전히 같은 소스다 —
          # "테스트한 코드"와 "실제 배포되는 코드"가 갈라질 위험이 없다.
          cat scripts/deploy/f2r_app_guard.sh >> /tmp/deploy-buildit.sh

          cat >> /tmp/deploy-buildit.sh <<'SCRIPT'

          # ---- f2r-app.service 배포: 백업 → 교체 → 재시작 → PID-aware health 재시도 ----
          # 5초 x 24회(최대 120초)는 "한 PID"의 몫이다 — Restart=on-failure로 새 PID가
          # 뜨면 f2r_wait_for_health_pid_aware가 그 PID에게 같은 120초를 새로 준다(원래
          # PID의 남은 시간을 그대로 물려받지 않는다). 최대 3세대(=최대 2번의 재시작)까지만
          # 봐주고, 그래도 안 되면 "반복 종료"로 확정해 사람 개입이 필요함을 명확히 한다 —
          # systemd가 계속 재시작을 허용해도 이 스크립트가 무한정 따라가며 기다리지 않는다.
          # 실패하면 자동으로 이전 jar로 되돌리고(rollback도 자기 자신의 독립된 PID 추적과
          # 독립된 health window를 새로 받는다), 그래도 안 되면 exit code 2로 명확히 구분한다
          # (사람이 EC2에 직접 들어가야 한다는 뜻). 반환값(0/1/2)은 f2r_deploy_with_rollback의
          # 기존 규약 그대로 유지하고, 여기서는 [DEPLOY] 마커만 덧붙인 뒤 같은 코드로 종료한다.
          #
          # 이 블록은 f2r-app.service 만 재시작/health-check 한다 — buildit-wiki는 별도
          # systemd 유닛으로 이미 위에서 독립적으로 기동·검증됐고, 여기서 절대 건드리지
          # 않는다(rollback 경로 포함).
          # NewStart Vision (Meta) 전용 키를 S3 staging에서 가져와 /etc/f2r/env에 동기화한다.
          # S3 객체는 배포 중에만 존재하는 transient 파일이다.
          # 값은 절대 출력하지 않는다.
          if aws s3 cp s3://feel2real-buildit-deploy/meta-vision-key /tmp/meta-vision-key 2>/dev/null; then
            META_VISION_VALUE=$(cat /tmp/meta-vision-key)
            shred -u /tmp/meta-vision-key 2>/dev/null || rm -f /tmp/meta-vision-key
            if [ -n "$META_VISION_VALUE" ]; then
              install -d -m 755 /etc/f2r
              touch /etc/f2r/env
              chmod 600 /etc/f2r/env
              grep -vE '^META_VISION_API_KEY=' /etc/f2r/env > /etc/f2r/env.tmp || true
              printf 'META_VISION_API_KEY=%s\n' "$META_VISION_VALUE" >> /etc/f2r/env.tmp
              mv /etc/f2r/env.tmp /etc/f2r/env
              chmod 600 /etc/f2r/env
              echo '[DEPLOY] synced META_VISION_API_KEY into f2r-app env (value hidden)'
            else
              echo '::error::META_VISION_API_KEY staging file is empty; refusing Vision deploy without key'
              exit 1
            fi
            unset META_VISION_VALUE
          else
            echo '::error::META_VISION_API_KEY staging file unavailable in S3; refusing Vision deploy without key'
            exit 1
          fi

          # NewStart 지피지기 (Meta Muse Spark) 전용 키를 S3 staging에서 가져와 /etc/f2r/env에 동기화한다.
          # Vision의 META_VISION_API_KEY와 분리된 독립 키이다.
          # S3 객체는 배포 중에만 존재하는 transient 파일이다. 값은 절대 출력하지 않는다.
          if aws s3 cp s3://feel2real-buildit-deploy/meta-jipijigi-key /tmp/meta-jipijigi-key 2>/dev/null; then
            META_JIPJIGI_VALUE=$(cat /tmp/meta-jipijigi-key)
            shred -u /tmp/meta-jipijigi-key 2>/dev/null || rm -f /tmp/meta-jipijigi-key
            if [ -n "$META_JIPJIGI_VALUE" ]; then
              install -d -m 755 /etc/f2r
              touch /etc/f2r/env
              chmod 600 /etc/f2r/env
              grep -vE '^META_JIPJIGI_API_KEY=' /etc/f2r/env > /etc/f2r/env.tmp || true
              printf 'META_JIPJIGI_API_KEY=%s\n' "$META_JIPJIGI_VALUE" >> /etc/f2r/env.tmp
              mv /etc/f2r/env.tmp /etc/f2r/env
              chmod 600 /etc/f2r/env
              echo '[DEPLOY] synced META_JIPJIGI_API_KEY into f2r-app env (value hidden)'
            else
              echo '::error::META_JIPJIGI_API_KEY staging file is empty; refusing Jipijigi deploy without key'
              exit 1
            fi
            unset META_JIPJIGI_VALUE
          else
            echo '::error::META_JIPJIGI_API_KEY staging file unavailable in S3; refusing Jipijigi deploy without key'
            exit 1
          fi

          # KIS (한국투자증권) 키를 S3 staging에서 가져와 /etc/f2r/env에 동기화한다.
          # Vision/Jipijigi와 달리 soft-fail: 스테이징 파일이 없으면 경고만 남기고
          # 배포는 계속한다 (앱은 KIS 키 없이도 기동한다).
          # S3 객체는 배포 중에만 존재하는 transient 파일이다. 값은 절대 출력하지 않는다.
          if aws s3 cp s3://feel2real-buildit-deploy/kis-app-key /tmp/kis-app-key 2>/dev/null && aws s3 cp s3://feel2real-buildit-deploy/kis-app-secret /tmp/kis-app-secret 2>/dev/null; then
            KIS_KEY_VALUE=$(cat /tmp/kis-app-key)
            KIS_SECRET_VALUE=$(cat /tmp/kis-app-secret)
            shred -u /tmp/kis-app-key /tmp/kis-app-secret 2>/dev/null || rm -f /tmp/kis-app-key /tmp/kis-app-secret
            if [ -n "$KIS_KEY_VALUE" ] && [ -n "$KIS_SECRET_VALUE" ]; then
              install -d -m 755 /etc/f2r
              touch /etc/f2r/env
              chmod 600 /etc/f2r/env
              grep -vE '^KIS_APP_KEY=' /etc/f2r/env | grep -vE '^KIS_APP_SECRET=' > /etc/f2r/env.tmp || true
              printf 'KIS_APP_KEY=%s\n' "$KIS_KEY_VALUE" >> /etc/f2r/env.tmp
              printf 'KIS_APP_SECRET=%s\n' "$KIS_SECRET_VALUE" >> /etc/f2r/env.tmp
              mv /etc/f2r/env.tmp /etc/f2r/env
              chmod 600 /etc/f2r/env
              echo '[DEPLOY] synced KIS_APP_KEY/KIS_APP_SECRET into f2r-app env (values hidden)'
            else
              echo '::warning::KIS staging files empty; skipping KIS sync'
            fi
            unset KIS_KEY_VALUE KIS_SECRET_VALUE
          else
            echo '::warning::KIS staging files unavailable in S3; skipping KIS sync (deploy continues)'
          fi

          # Preserve the legacy OpenRouter sync for any remaining consumers.
          if [ -r /etc/buildit-wiki.env ] && grep -qE '^OPENROUTER_API_KEY=.+' /etc/buildit-wiki.env; then
            install -d -m 755 /etc/f2r
            touch /etc/f2r/env
            chmod 600 /etc/f2r/env
            OPENROUTER_LINE=$(grep -E '^OPENROUTER_API_KEY=.+' /etc/buildit-wiki.env | tail -n 1)
            sed -i '/^OPENROUTER_API_KEY=/d' /etc/f2r/env
            printf '%s\n' "$OPENROUTER_LINE" >> /etc/f2r/env
            echo '[DEPLOY] synced OPENROUTER_API_KEY into f2r-app env (value hidden)'
          else
            echo '::warning::OPENROUTER_API_KEY not found in /etc/buildit-wiki.env; debt vision cannot use OpenRouter'
          fi

          set -euo pipefail
          # Wiki section end: re-enable strict mode for Spring deploy
          echo "[DEPLOY] spring deploy start"
          if f2r_deploy_with_rollback \
            /home/ec2-user/app.jar /tmp/app-new.jar /home/ec2-user/app.jar.previous \
            f2r-app.service http://127.0.0.1:8080/actuator/health 24 5 3; then
            echo "[DEPLOY] spring health OK"
          else
            DEPLOY_RC=$?
            echo "[DEPLOY] FAILED rc=${DEPLOY_RC} line=f2r_deploy_with_rollback"
            exit "$DEPLOY_RC"
          fi

          # Spring이 정상이어도, 그 재시작 사이클이 같은 EC2의 buildit-wiki에 부수효과를
          # 남기지 않았는지 배포 성공 판정 직전에 한 번 더 독립적으로 확인한다. buildit-wiki를
          # 다시 시작/재시도하지는 않는다 — 순수 조회만 하고, 이미 위에서 확인된 정상 상태가
          # Spring 배포 이후에도 유지되는지만 본다.
          echo "[DEPLOY] verifying buildit-wiki is still healthy after the spring restart cycle"
          set +e
          set +u
          set +o pipefail
          if true; then # Wiki check disabled
            echo "[DEPLOY] buildit-wiki still healthy"
            echo "[DEPLOY] SUCCESS"
          else
            echo "::warning::buildit-wiki health check failed after spring deploy (non-fatal, wiki is independent)"
            echo "[DEPLOY] WARNING post_spring_wiki_health_failed_but_spring_ok"
            echo "[DEPLOY] SUCCESS"
          fi
          set -euo pipefail
          SCRIPT
          chmod +x /tmp/deploy-buildit.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2

      - name: Stage Meta Vision key in S3 (transient)
        shell: bash
        env:
          META_VISION_API_KEY: ${{ secrets.META_VISION_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${META_VISION_API_KEY:-}" || { echo "::error::META_VISION_API_KEY repository secret is empty"; exit 1; }
          # 키를 임시 파일에 쓰고 S3에 업로드 (private bucket, 배포 중에만 존재)
          # 값은 절대 출력하지 않음
          printf '%s' "$META_VISION_API_KEY" > /tmp/meta-vision-key.staging
          aws s3 cp /tmp/meta-vision-key.staging s3://feel2real-buildit-deploy/meta-vision-key --sse AES256 >/dev/null
          shred -u /tmp/meta-vision-key.staging 2>/dev/null || rm -f /tmp/meta-vision-key.staging
          unset META_VISION_API_KEY
          echo "META_VISION_API_KEY staged in S3 (transient, value hidden)"

      - name: Stage Meta Jipijigi key in S3 (transient)
        shell: bash
        env:
          META_JIPJIGI_API_KEY: ${{ secrets.META_JIPJIGI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${META_JIPJIGI_API_KEY:-}" || { echo "::error::META_JIPJIGI_API_KEY repository secret is empty"; exit 1; }
          # 키를 임시 파일에 쓰고 S3에 업로드 (private bucket, 배포 중에만 존재)
          # 값은 절대 출력하지 않음
          printf '%s' "$META_JIPJIGI_API_KEY" > /tmp/meta-jipijigi-key.staging
          aws s3 cp /tmp/meta-jipijigi-key.staging s3://feel2real-buildit-deploy/meta-jipijigi-key --sse AES256 >/dev/null
          shred -u /tmp/meta-jipijigi-key.staging 2>/dev/null || rm -f /tmp/meta-jipijigi-key.staging
          unset META_JIPJIGI_API_KEY
          echo "META_JIPJIGI_API_KEY staged in S3 (transient, value hidden)"

      - name: Stage KIS keys in S3 (transient)
        shell: bash
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          set -euo pipefail
          # KIS 키는 soft-fail: 시크릿이 없으면 경고만 남기고 배포는 계속한다.
          # (Vision/Jipijigi는 hard-fail이지만, KIS는 앱이 키 없이도 기동하고
          #  수급 파이프라인만 대기 상태가 되므로 배포 자체를 막지 않는다.)
          if [ -z "${KIS_APP_KEY:-}" ] || [ -z "${KIS_APP_SECRET:-}" ]; then
            echo "::warning::KIS_APP_KEY/KIS_APP_SECRET secrets not set; skipping KIS staging (deploy continues without KIS sync)"
            exit 0
          fi
          # 키를 임시 파일에 쓰고 S3에 업로드 (private bucket, 배포 중에만 존재)
          # 값은 절대 출력하지 않음
          printf '%s' "$KIS_APP_KEY" > /tmp/kis-app-key.staging
          printf '%s' "$KIS_APP_SECRET" > /tmp/kis-app-secret.staging
          aws s3 cp /tmp/kis-app-key.staging s3://feel2real-buildit-deploy/kis-app-key --sse AES256 >/dev/null
          aws s3 cp /tmp/kis-app-secret.staging s3://feel2real-buildit-deploy/kis-app-secret --sse AES256 >/dev/null
          shred -u /tmp/kis-app-key.staging /tmp/kis-app-secret.staging 2>/dev/null || rm -f /tmp/kis-app-key.staging /tmp/kis-app-secret.staging
          unset KIS_APP_KEY KIS_APP_SECRET
          echo "KIS keys staged in S3 (transient, values hidden)"

      - name: Upload deployment artifacts to S3
        run: |
          aws s3 cp "${{ steps.jar.outputs.path }}" s3://feel2real-buildit-deploy/app.jar
          aws s3 cp /tmp/buildit-wiki-backend.tgz s3://feel2real-buildit-deploy/buildit-wiki-backend.tgz
          aws s3 cp /tmp/deploy-buildit.sh s3://feel2real-buildit-deploy/deploy-buildit.sh

      - name: Deploy through SSM
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09d7cabb5a42d1135" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["set -e","aws s3 cp s3://feel2real-buildit-deploy/deploy-buildit.sh /tmp/deploy-buildit.sh","chmod +x /tmp/deploy-buildit.sh","/tmp/deploy-buildit.sh"]' \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          # aws ssm wait command-executed는 기본값이 5초 간격 20회(약 100초) 대기다.
          # EC2 내부 deploy-buildit.sh는 Wiki health 재시도(최대 90초) + Spring health
          # 재시도(최대 120초, health 실패 시 롤백 후 재시도 포함 약 2배)까지 정상 경로에서
          # 수행하므로 100초보다 오래 걸릴 수 있다. 실제로 Run #280에서 command가 여전히
          # InProgress인 상태로 "Waiter CommandExecuted failed: Max attempts exceeded"
          # (ResponseCode: -1)로 배포가 실패 처리됐다.
          # waiter를 쓰지 않고 최종 상태(Success/Failed/TimedOut/Cancelled)를 직접 폴링해
          # EC2 스크립트 최대 실행시간보다 충분히 긴(5분 이상 여유) 시간을 기다린다.
          SSM_INSTANCE_ID="i-09d7cabb5a42d1135"
          SSM_POLL_INTERVAL_SECS=15
          SSM_MAX_WAIT_SECS=1200
          STATUS=""
          ELAPSED=0
          while :; do
            INVOCATION_JSON=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$SSM_INSTANCE_ID" --output json 2>/dev/null)
            if [ -z "$INVOCATION_JSON" ]; then
              echo "::warning::get-command-invocation failed (transient?) — will retry"
            else
              STATUS=$(printf '%s' "$INVOCATION_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("Status",""))')
              case "$STATUS" in
                Success|Failed|Cancelled|TimedOut) break ;;
              esac
            fi
            if [ "$ELAPSED" -ge "$SSM_MAX_WAIT_SECS" ]; then
              echo "::error::SSM command still InProgress after ${SSM_MAX_WAIT_SECS}s — exceeded deploy script max runtime"
              break
            fi
            echo "SSM command status: ${STATUS:-UNKNOWN} (waited ${ELAPSED}s/${SSM_MAX_WAIT_SECS}s)"
            sleep "$SSM_POLL_INTERVAL_SECS"
            ELAPSED=$((ELAPSED + SSM_POLL_INTERVAL_SECS))
          done
          set -e
          # 성공 여부와 무관하게 최종 Status/ResponseCode/StandardOutputContent/
          # StandardErrorContent를 Actions 로그에 남긴다. Failed/TimedOut/Cancelled,
          # 그리고 InProgress 상태로 timeout된 경우에도 동일하게 출력된다.
          echo "SSM command final status: ${STATUS:-InProgress(timeout)}"
          if [ -n "$INVOCATION_JSON" ]; then
            echo "$INVOCATION_JSON"
          else
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$SSM_INSTANCE_ID" --output json || true
          fi
          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deploy through SSM did not succeed (Status=${STATUS:-InProgress})"
            exit 1
          fi
      - name: Post-deploy /wemade smoke test
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting 30s for service to stabilize..."
          sleep 30
          echo ""
          echo "=== Smoke test: GET /wemade via SSM ==="
          SSM_BODY=$(cat <<'SSMEOF'
          echo "--- localhost:8080/wemade ---"
          HTTP_CODE=$(curl -s -o /tmp/wemade_smoke.html -w "%{http_code}" --max-time 15 http://127.0.0.1:8080/wemade || echo "CURL_FAILED")
          echo "HTTP: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            TITLE=$(grep -o -m 1 '<title>[^<]*</title>' /tmp/wemade_smoke.html || echo "NO_TITLE")
            echo "TITLE: $TITLE"
            if echo "$TITLE" | grep -q "위메이드 개인주주 분석"; then
              echo "SMOKE_TEST: PASS"
            else
              echo "SMOKE_TEST: FAIL - wrong title"
              exit 1
            fi
          elif [ "$HTTP_CODE" = "302" ]; then
            LOCATION=$(curl -s -o /dev/null -w "%{redirect_url}" --max-time 15 http://127.0.0.1:8080/wemade || echo "UNKNOWN")
            echo "Redirect to: $LOCATION"
            echo "SMOKE_TEST: FAIL - got 302 redirect (expected 200)"
            exit 1
          else
            echo "SMOKE_TEST: FAIL - unexpected HTTP $HTTP_CODE"
            exit 1
          fi
          rm -f /tmp/wemade_smoke.html
          SSMEOF
          )
          SSM_SCRIPT=$(printf 'set -euo pipefail\n%s\n' "$SSM_BODY")
          # Use python for JSON like the diagnostic workflow
          PARAMS_JSON=$(python3 -c 'import json,sys; print(json.dumps({"commands": sys.stdin.read().splitlines()}))' <<< "$SSM_SCRIPT")
          CMD_ID=$(aws ssm send-command \
            --instance-ids i-09d7cabb5a42d1135 \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMS_JSON" \
            --query 'Command.CommandId' --output text)
          echo "Smoke test SSM CommandId=$CMD_ID"
          for i in $(seq 1 12); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'Status' --output text)
            echo "smoke test status=$STATUS (attempt $i/12)"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done
          echo "===== Smoke test output ====="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'StandardOutputContent' --output text
          FINAL=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'Status' --output text)
          if [ "$FINAL" != "Success" ]; then
            echo "::error::Post-deploy /wemade smoke test failed (Status=$FINAL)"
            exit 1
          fi
          echo "Post-deploy smoke test PASSED"

      - name: Cleanup Meta Vision key staging file
        if: always()
        shell: bash
        run: |
          aws s3 rm s3://feel2real-buildit-deploy/meta-vision-key 2>/dev/null || true
          echo "Staging file cleaned up"

      - name: Cleanup Meta Jipijigi key staging file
        if: always()
        shell: bash
        run: |
          aws s3 rm s3://feel2real-buildit-deploy/meta-jipijigi-key 2>/dev/null || true
          echo "Staging file cleaned up"

      - name: Cleanup KIS key staging files
        if: always()
        shell: bash
        run: |
          aws s3 rm s3://feel2real-buildit-deploy/kis-app-key 2>/dev/null || true
          aws s3 rm s3://feel2real-buildit-deploy/kis-app-secret 2>/dev/null || true
          echo "Staging files cleaned up"
