name: Deploy to EC2 (manual)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build bootJar
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar --no-daemon

      - name: Locate jar
        id: jar
        shell: bash
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-plain.jar" | head -n 1)
          if [ -z "$JAR" ]; then
            echo "::error::bootJar artifact not found"
            exit 1
          fi
          echo "Found JAR: $JAR"
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2

      - name: Upload jar to S3
        run: |
          aws s3 cp "${{ steps.jar.outputs.path }}" "s3://feel2real-buildit-deploy/app.jar"

      - name: Deploy through SSM
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09d7cabb5a42d1135" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "aws s3 cp s3://feel2real-buildit-deploy/app.jar /tmp/app-new.jar",
              "sudo mv /tmp/app-new.jar /home/ec2-user/app.jar",
              "sudo systemctl restart f2r-app.service",
              "sleep 5",
              "sudo systemctl is-active f2r-app.service"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-09d7cabb5a42d1135"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-09d7cabb5a42d1135"
