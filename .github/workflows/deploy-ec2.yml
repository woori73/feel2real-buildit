name: Deploy to EC2 (manual)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# 두 배포가 동시에 같은 EC2 인스턴스/jar/systemd 유닛을 건드리지 않게 한다. 이미 진행 중인
# 배포를 취소하지 않고(cancel-in-progress: false) 다음 실행을 큐에 세워 순차 실행되게 한다 —
# 진행 중인 배포를 취소하면 절반만 적용된 상태로 그 배포 자체가 "동시 배포" 문제를 만든다.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare and build BuildIt Wiki
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/buildit-wiki-backend-src
          mkdir -p /tmp/buildit-wiki-backend-src
          cp -R "$GITHUB_WORKSPACE/problem-generator/wiki-backend-src/." /tmp/buildit-wiki-backend-src/
          cd "$GITHUB_WORKSPACE/problem-generator/wiki-src"
          npm ci
          npm run build -- --base=/problem-generator/wiki/
          cd "$GITHUB_WORKSPACE"
          rm -rf src/main/resources/static/problem-generator/wiki
          mkdir -p src/main/resources/static/problem-generator/wiki
          cp -R problem-generator/wiki-src/dist/. src/main/resources/static/problem-generator/wiki/
          tar -czf /tmp/buildit-wiki-backend.tgz -C /tmp/buildit-wiki-backend-src backend requirements.txt

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      # Production Deploy는 Build Check보다 먼저 실행되지 않는다: main으로 push될 때 도는
      # build-check.yml과 같은(MySQL 불필요) 테스트 목록을 여기서도 다시 게이트로 돌려,
      # main의 Build Check 결과를 확인하지 않고 수동으로 배포를 눌러도 깨진 빌드가 그대로
      # Production까지 가지 않게 한다. 이 목록은 build-check.yml과 같이 유지한다.
      - name: Run non-MySQL unit & contract tests (deploy gate)
        run: >-
          ./gradlew clean test --no-daemon
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.chart.service.ChartSiteToolServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.chart.service.ChartCandidateEnrichmentServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.chart.service.ChartEducatorSearchServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.chart.service.RankingComputationTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.chart.service.ChartRankingServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.chart.controller.ChartPublicControllerWebMvcTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.template.ChartSiteToolsContractTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.template.ChartPublicPageContractTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.chart.service.ChartDiscoveryServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.academy.service.AcademyServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.academy.controller.AcademyBuilderTemplateContractTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.config.WebMvcConfigTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.community.service.CommunityServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.wikioriginal.service.WikiExamOriginalServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.wikioriginal.controller.WikiExamOriginalControllerWebMvcTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.wikioriginal.WikiPersistenceVerificationTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.template.WikiPageContractTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.infrastructure.storage.DocumentUploadValidatorTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.wikianalysis.service.WikiAnalysisMaterialServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.wikianalysis.controller.WikiAnalysisMaterialControllerWebMvcTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.community.service.CommunityPostAttachmentServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.community.controller.CommunityAttachmentControllerWebMvcTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.wiki.controller.WikiPageControllerRenderTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.config.security.WikiMemberOnlySecurityIntegrationTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.questionwiki.service.QuestionWikiServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.questionwiki.service.QuestionThreadServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.template.QuestionWikiContractTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.wikilearning.service.WikiLearningMaterialServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.wikilearning.controller.WikiLearningMaterialControllerWebMvcTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.wikistats.service.WikiVisitServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.wikistats.controller.WikiStatsControllerWebMvcTest"

      - name: Upload deploy-gate test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-gate-test-report
          path: build/reports/tests/test
          if-no-files-found: ignore

      - name: Build bootJar
        run: ./gradlew bootJar --no-daemon

      - name: Locate jar
        id: jar
        shell: bash
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-plain.jar" | head -n 1)
          test -n "$JAR" || { echo "::error::bootJar artifact not found"; exit 1; }
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Create EC2 deploy script
        shell: bash
        run: |
          cat > /tmp/deploy-buildit.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          BUCKET=feel2real-buildit-deploy
          # 새 jar는 여기서 받아만 두고, 실제로 /home/ec2-user/app.jar 자리에 넣는 건
          # f2r_deploy_with_rollback(스크립트 하단)이 담당한다 — 그래야 기존 정상 jar를
          # 먼저 백업한 뒤 교체하고, health 실패 시 되돌릴 수 있다.
          aws s3 cp s3://$BUCKET/app.jar /tmp/app-new.jar

          mkdir -p /opt/buildit-wiki/app /opt/buildit-wiki/data
          aws s3 cp s3://$BUCKET/buildit-wiki-backend.tgz /tmp/buildit-wiki-backend.tgz
          rm -rf /opt/buildit-wiki/app/*
          tar -xzf /tmp/buildit-wiki-backend.tgz -C /opt/buildit-wiki/app

          # mcp SDK requires Python >=3.10; AL2023's system python3 stays pinned
          # to 3.9 for the life of the distro, so install 3.11 side by side via
          # dnf instead of touching /usr/bin/python3.
          if ! command -v python3.11 >/dev/null 2>&1; then
            dnf install -y python3.11
          fi

          VENV_PY=/opt/buildit-wiki/venv/bin/python
          RECREATE_VENV=1
          if [ -x "$VENV_PY" ]; then
            VENV_PYVER=$("$VENV_PY" -c 'import sys; print("%d.%d" % sys.version_info[:2])' 2>/dev/null || echo "")
            if [ "$VENV_PYVER" = "3.11" ]; then
              RECREATE_VENV=0
            fi
          fi
          if [ "$RECREATE_VENV" = "1" ]; then
            rm -rf /opt/buildit-wiki/venv
            python3.11 -m venv /opt/buildit-wiki/venv
          fi

          # requirements.txt에 고정된 버전(mcp==)은 이미 설치된 다른 버전이 있어도 pip가
          # 해당 버전으로 재설치한다(요구사항 불충족). 고정 안 한 패키지는 그대로 둔다.
          /opt/buildit-wiki/venv/bin/pip install --disable-pip-version-check -r /opt/buildit-wiki/app/requirements.txt

          # Spring(f2r-app.service)은 Wiki 프록시 identity를 JWT_SECRET(app.jwt.secret)으로
          # HMAC 서명한다. 이 FastAPI 서비스는 별도 systemd 유닛이라 /etc/f2r/env를 상속하지
          # 않으므로, 같은 값을 WIKI_IDENTITY_SECRET 으로 매 배포마다 root 전용 drop-in에
          # 재생성한다(회전 시 drift 없음, 시크릿은 EC2 밖으로 나가지 않음). /etc/f2r/env 가
          # 없거나 JWT_SECRET 이 비어 있으면 기존 파일을 건드리지 않는다.
          if [ -r /etc/f2r/env ]; then
            JWT_SECRET_LINE=$(grep -E '^JWT_SECRET=.+' /etc/f2r/env | tail -n 1 || true)
            if [ -n "$JWT_SECRET_LINE" ]; then
              install -m 600 -o root -g root /dev/null /etc/buildit-wiki-identity.env
              printf 'WIKI_IDENTITY_SECRET=%s\n' "${JWT_SECRET_LINE#JWT_SECRET=}" > /etc/buildit-wiki-identity.env
              echo 'wiki identity secret drop-in refreshed from /etc/f2r/env'
            else
              echo '::warning::JWT_SECRET not found in /etc/f2r/env; Wiki identity HMAC will stay unconfigured'
            fi
          else
            echo '::warning::/etc/f2r/env not readable; Wiki identity HMAC drop-in not refreshed'
          fi

          cat > /etc/systemd/system/buildit-wiki.service <<'UNIT'
          [Unit]
          Description=BuildIt Wiki FastAPI
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory=/opt/buildit-wiki/app/backend
          Environment=BUILDIT_WIKI_DB_PATH=/opt/buildit-wiki/data/app.db
          Environment=BUILDIT_WIKI_WORKSPACE=/opt/buildit-wiki
          Environment=AI_PROVIDER_TIMEOUT_SECONDS=45
          EnvironmentFile=-/etc/buildit-wiki.env
          EnvironmentFile=-/etc/buildit-wiki-identity.env
          ExecStart=/opt/buildit-wiki/venv/bin/python -m uvicorn main:app --host 127.0.0.1 --port 8000
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          UNIT

          if command -v nginx >/dev/null 2>&1; then
            install -d -m 755 /etc/nginx/conf.d
            cat > /etc/nginx/conf.d/buildit-wiki-timeouts.conf <<'NGINX'
          # Outer proxy deadlines must remain above Spring (280s) and the
          # bounded AI provider call (90s), so JSON errors reach the browser.
          proxy_connect_timeout 5s;
          proxy_send_timeout 290s;
          proxy_read_timeout 290s;
          NGINX
            nginx -t
            if nginx -T 2>&1 | grep -q 'buildit-wiki-timeouts.conf'; then
              systemctl reload nginx
              echo 'nginx timeout config active'
            else
              echo 'nginx timeout config directory is not included; leaving existing gateway config unchanged'
              rm -f /etc/nginx/conf.d/buildit-wiki-timeouts.conf
            fi
          else
            echo 'nginx is not installed on the application host; gateway timeout is managed outside EC2'
          fi

          systemctl daemon-reload
          systemctl enable buildit-wiki.service
          systemctl restart buildit-wiki.service
          # buildit-wiki는 재시작 직후 바로 응답하지 않는다. Type=simple 유닛은
          # Python이 import 중인 동안에도 is-active가 'active'이므로, 단발 curl이나
          # is-active만으로는 기동 완료를 판정할 수 없다(Deploy #276 실패 원인) —
          # 실제 /api/health 응답이 올 때까지 재시도한다 (5초 x 18회 = 최대 90초 대기).
          # 최종 성공 조건은 systemctl 상태가 아니라 이 health 응답 성공이다.
          WIKI_HEALTH_ATTEMPTS=18
          WIKI_HEALTH_SLEEP_SECS=5
          WIKI_HEALTH_OK=0
          WIKI_HEALTH_TRY=0
          while [ "$WIKI_HEALTH_TRY" -lt "$WIKI_HEALTH_ATTEMPTS" ]; do
            WIKI_HEALTH_TRY=$((WIKI_HEALTH_TRY + 1))
            if curl -fsS --max-time 5 http://127.0.0.1:8000/api/health; then
              echo
              echo "buildit-wiki is healthy (attempt ${WIKI_HEALTH_TRY}/${WIKI_HEALTH_ATTEMPTS})."
              WIKI_HEALTH_OK=1
              break
            fi
            echo "buildit-wiki health not ready yet (attempt ${WIKI_HEALTH_TRY}/${WIKI_HEALTH_ATTEMPTS})"
            if [ "$WIKI_HEALTH_TRY" -lt "$WIKI_HEALTH_ATTEMPTS" ]; then
              echo "waiting ${WIKI_HEALTH_SLEEP_SECS}s before next attempt"
              sleep "$WIKI_HEALTH_SLEEP_SECS"
            fi
          done
          if [ "$WIKI_HEALTH_OK" != "1" ]; then
            echo '::error::buildit-wiki did not become healthy within 90s — dumping diagnostics'
            systemctl status buildit-wiki --no-pager -l | head -50 || true
            ss -ltnp | grep ':8000' || true
            journalctl -u buildit-wiki --no-pager -n 150 || true
            exit 1
          fi
          SCRIPT

          # f2r-app.service(Spring) 배포 가드를 그대로 이어 붙인다. scripts/deploy/f2r_app_guard.sh는
          # 소싱 전용(함수 정의만, 최상위 실행 없음)이라 안전하게 잘라 넣을 수 있고,
          # scripts/deploy/f2r_app_guard.test.sh가 로컬에서 검증하는 코드와 완전히 같은 소스다 —
          # "테스트한 코드"와 "실제 배포되는 코드"가 갈라질 위험이 없다.
          cat scripts/deploy/f2r_app_guard.sh >> /tmp/deploy-buildit.sh

          cat >> /tmp/deploy-buildit.sh <<'SCRIPT'

          # ---- f2r-app.service 배포: 백업 → 교체 → 재시작 → health 재시도(최대 120초) ----
          # 실패하면 자동으로 이전 jar로 되돌리고, 그래도 안 되면 exit code 2로 명확히 구분한다
          # (사람이 EC2에 직접 들어가야 한다는 뜻). 이 명령이 스크립트의 마지막 문장이라
          # set -e 아래에서 이 함수의 반환값이 곧 deploy-buildit.sh 전체의 종료 코드가 된다.
          f2r_deploy_with_rollback \
            /home/ec2-user/app.jar /tmp/app-new.jar /home/ec2-user/app.jar.previous \
            f2r-app.service http://127.0.0.1:8080/actuator/health 24 5
          SCRIPT
          chmod +x /tmp/deploy-buildit.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2

      - name: Upload deployment artifacts to S3
        run: |
          aws s3 cp "${{ steps.jar.outputs.path }}" s3://feel2real-buildit-deploy/app.jar
          aws s3 cp /tmp/buildit-wiki-backend.tgz s3://feel2real-buildit-deploy/buildit-wiki-backend.tgz
          aws s3 cp /tmp/deploy-buildit.sh s3://feel2real-buildit-deploy/deploy-buildit.sh

      - name: Deploy through SSM
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09d7cabb5a42d1135" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["set -e","aws s3 cp s3://feel2real-buildit-deploy/deploy-buildit.sh /tmp/deploy-buildit.sh","chmod +x /tmp/deploy-buildit.sh","/tmp/deploy-buildit.sh"]' \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135"
          WAIT_STATUS=$?
          set -e
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135"
          exit "$WAIT_STATUS"

