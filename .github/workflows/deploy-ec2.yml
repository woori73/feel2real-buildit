name: Deploy to EC2 (manual)

on:
  workflow_dispatch:
  push:
    branches: [feat/qwen-default-ai]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare and build BuildIt Wiki
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/buildit-wiki-backend-src
          mkdir -p /tmp/buildit-wiki-backend-src
          cp -R "$GITHUB_WORKSPACE/problem-generator/wiki-backend-src/." /tmp/buildit-wiki-backend-src/
          cd "$GITHUB_WORKSPACE/problem-generator/wiki-src"
          npm ci
          npm run build -- --base=/problem-generator/wiki/
          cd "$GITHUB_WORKSPACE"
          rm -rf src/main/resources/static/problem-generator/wiki
          mkdir -p src/main/resources/static/problem-generator/wiki
          cp -R problem-generator/wiki-src/dist/. src/main/resources/static/problem-generator/wiki/
          tar -czf /tmp/buildit-wiki-backend.tgz -C /tmp/buildit-wiki-backend-src backend requirements.txt

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build bootJar
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar --no-daemon

      - name: Locate jar
        id: jar
        shell: bash
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-plain.jar" | head -n 1)
          test -n "$JAR" || { echo "::error::bootJar artifact not found"; exit 1; }
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Create EC2 deploy script
        shell: bash
        run: |
          cat > /tmp/deploy-buildit.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          BUCKET=feel2real-buildit-deploy
          aws s3 cp s3://$BUCKET/app.jar /tmp/app-new.jar
          mv /tmp/app-new.jar /home/ec2-user/app.jar

          mkdir -p /opt/buildit-wiki/app /opt/buildit-wiki/data
          aws s3 cp s3://$BUCKET/buildit-wiki-backend.tgz /tmp/buildit-wiki-backend.tgz
          rm -rf /opt/buildit-wiki/app/*
          tar -xzf /tmp/buildit-wiki-backend.tgz -C /opt/buildit-wiki/app
          python3 -m venv /opt/buildit-wiki/venv
          /opt/buildit-wiki/venv/bin/pip install --disable-pip-version-check -r /opt/buildit-wiki/app/requirements.txt

          cat > /etc/systemd/system/buildit-wiki.service <<'UNIT'
          [Unit]
          Description=BuildIt Wiki FastAPI
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory=/opt/buildit-wiki/app/backend
          Environment=BUILDIT_WIKI_DB_PATH=/opt/buildit-wiki/data/app.db
          Environment=BUILDIT_WIKI_WORKSPACE=/opt/buildit-wiki
          Environment=AI_PROVIDER_TIMEOUT_SECONDS=90
          EnvironmentFile=-/etc/buildit-wiki.env
          ExecStart=/opt/buildit-wiki/venv/bin/python -m uvicorn main:app --host 127.0.0.1 --port 8000
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          UNIT

          if command -v nginx >/dev/null 2>&1; then
            install -d -m 755 /etc/nginx/conf.d
            cat > /etc/nginx/conf.d/buildit-wiki-timeouts.conf <<'NGINX'
          # Outer proxy deadlines must remain above Spring (280s) and the
          # bounded AI provider call (90s), so JSON errors reach the browser.
          proxy_connect_timeout 5s;
          proxy_send_timeout 290s;
          proxy_read_timeout 290s;
          NGINX
            nginx -t
            if nginx -T 2>&1 | grep -q 'buildit-wiki-timeouts.conf'; then
              systemctl reload nginx
              echo 'nginx timeout config active'
            else
              echo 'nginx timeout config directory is not included; leaving existing gateway config unchanged'
              rm -f /etc/nginx/conf.d/buildit-wiki-timeouts.conf
            fi
          else
            echo 'nginx is not installed on the application host; gateway timeout is managed outside EC2'
          fi

          systemctl daemon-reload
          systemctl enable buildit-wiki.service
          systemctl restart buildit-wiki.service
          systemctl restart f2r-app.service
          sleep 6
          systemctl is-active buildit-wiki.service
          systemctl is-active f2r-app.service
          curl -fsS http://127.0.0.1:8000/api/health

          cat > /tmp/qwen-smoke.py <<'PY'
          import json, os, sqlite3, sys, urllib.error, urllib.request

          db = '/opt/buildit-wiki/data/app.db'
          pid = int(os.popen('systemctl show -p MainPID --value buildit-wiki.service').read().strip())
          env = open(f'/proc/{pid}/environ', 'rb').read().split(b'\0')
          print('process_openrouter_key_available=' + str(any(item.startswith(b'OPENROUTER_API_KEY=') and item != b'OPENROUTER_API_KEY=' for item in env)).lower())

          def count():
              with sqlite3.connect(db) as conn:
                  return conn.execute('select count(*) from generated_questions').fetchone()[0]

          def twin_id():
              with sqlite3.connect(db) as conn:
                  row = conn.execute('select id from digital_twin_profiles where is_active=1 order by id limit 1').fetchone()
                  if not row: raise RuntimeError('active Digital Twin not found')
                  return row[0]

          def post(path, payload):
              req = urllib.request.Request('http://127.0.0.1:8000' + path, data=json.dumps(payload).encode(), method='POST', headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=280) as response:
                      status, body = response.status, json.loads(response.read())
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  try: body = json.loads(exc.read())
                  except Exception: body = {}
              if status != 200:
                  detail = body.get('detail', {})
                  if isinstance(detail, dict): detail = {key: detail.get(key) for key in ('message','provider','status') if key in detail}
                  print(f'{path} status={status} error={detail}')
                  raise SystemExit(1)
              print(f"{path} status={status} provider={body.get('provider')} model={body.get('model')} questions={len(body.get('questions', []))}")
              return body

          common = {'provider':'auto','twin_id':twin_id(),'passage':'Many students improve when they review mistakes carefully. Regular practice helps them notice patterns and explain their choices clearly.','grammar':'관계대명사와 접속사의 정확한 사용','difficulty':'actual','composition':'objective'}
          before = count()
          one = post('/api/questions/generate', {**common, 'count':1})
          after_one = count()
          print(f'db_one_delta={after_one-before}')
          if len(one.get('questions', [])) != 1 or after_one-before != 1: raise SystemExit(1)

          three = post('/api/questions/generate', {**common, 'count':3})
          after_three = count()
          print(f'db_three_delta={after_three-after_one}')
          if len(three.get('questions', [])) != 3 or after_three-after_one != 3: raise SystemExit(1)

          transformed = post('/api/questions/transform', {'provider':'auto','twin_id':common['twin_id'],'original':'Choose the correct sentence. ① I know the student which won the prize. ② I know the student who won the prize. ③ I know the student what won the prize. ④ I know the student whom won the prize. ⑤ I know the student whose won the prize.','passage':common['passage'],'count':1,'strength':'normal','target':'same','options':True,'answerPos':True,'harder':False,'schoolStyle':True})
          after_transform = count()
          print(f'db_transform_delta={after_transform-after_three}')
          if len(transformed.get('questions', [])) != 1 or after_transform-after_three != 1: raise SystemExit(1)
          PY
          /opt/buildit-wiki/venv/bin/python /tmp/qwen-smoke.py
          SCRIPT
          chmod +x /tmp/deploy-buildit.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2

      - name: Upload deployment artifacts to S3
        run: |
          aws s3 cp "${{ steps.jar.outputs.path }}" s3://feel2real-buildit-deploy/app.jar
          aws s3 cp /tmp/buildit-wiki-backend.tgz s3://feel2real-buildit-deploy/buildit-wiki-backend.tgz
          aws s3 cp /tmp/deploy-buildit.sh s3://feel2real-buildit-deploy/deploy-buildit.sh

      - name: Deploy through SSM
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09d7cabb5a42d1135" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["set -e","aws s3 cp s3://feel2real-buildit-deploy/deploy-buildit.sh /tmp/deploy-buildit.sh","chmod +x /tmp/deploy-buildit.sh","/tmp/deploy-buildit.sh"]' \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135"
          WAIT_STATUS=$?
          set -e
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135"
          exit "$WAIT_STATUS"

