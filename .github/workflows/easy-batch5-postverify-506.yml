name: Easy Batch5 Post-Verify Row 506 (read-only)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  postverify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2

      - name: Row 506 post state
        shell: bash
        run: |
          cat > /tmp/mysql-506-post.json <<'PARAMS'
          {"commands":[
            "set +e",
            "echo \"=== ROW 506 POST STATE ===\"",
            "source /etc/f2r/env 2>/dev/null || true",
            "mysql -h \"${DB_HOST}\" -P \"${DB_PORT}\" -u \"${DB_USER}\" -p\"${DB_PASSWORD}\" \"${DB_NAME}\" -e \"SET SESSION TRANSACTION READ ONLY; SELECT r.row_id, r.row_no, r.batch_id, r.status, r.amount, r.matched_account_id, (SELECT a.code FROM easy_accounts a WHERE a.account_id = r.matched_account_id) AS acct, r.confidence, r.created_txn_id FROM easy_import_rows r WHERE r.batch_id = 5 AND r.row_id = 506;\" 2>&1 || echo \"mysql_exit=$?\"",
            "exit 0"
          ]}
          PARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09d7cabb5a42d1135" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/mysql-506-post.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135"
          echo "wait_exit=$?"
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardOutputContent' --output text
          exit 0

      - name: Row 500 unchanged
        shell: bash
        run: |
          cat > /tmp/mysql-500.json <<'PARAMS'
          {"commands":[
            "set +e",
            "echo \"=== ROW 500 UNCHANGED ===\"",
            "source /etc/f2r/env 2>/dev/null || true",
            "mysql -h \"${DB_HOST}\" -P \"${DB_PORT}\" -u \"${DB_USER}\" -p\"${DB_PASSWORD}\" \"${DB_NAME}\" -e \"SET SESSION TRANSACTION READ ONLY; SELECT r.row_id, r.row_no, r.batch_id, r.status, r.amount, r.matched_account_id, (SELECT a.code FROM easy_accounts a WHERE a.account_id = r.matched_account_id) AS acct, r.confidence, r.created_txn_id FROM easy_import_rows r WHERE r.batch_id = 5 AND r.row_id = 500;\" 2>&1 || echo \"mysql_exit=$?\"",
            "exit 0"
          ]}
          PARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09d7cabb5a42d1135" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/mysql-500.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135"
          echo "wait_exit=$?"
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardOutputContent' --output text
          exit 0

      - name: Batch aggregates post
        shell: bash
        run: |
          cat > /tmp/mysql-agg-post.json <<'PARAMS'
          {"commands":[
            "set +e",
            "echo \"=== BATCH AGGREGATES POST ===\"",
            "source /etc/f2r/env 2>/dev/null || true",
            "mysql -h \"${DB_HOST}\" -P \"${DB_PORT}\" -u \"${DB_USER}\" -p\"${DB_PASSWORD}\" \"${DB_NAME}\" -e \"SET SESSION TRANSACTION READ ONLY; SELECT batch_id, status, total_rows, confirmed_rows FROM easy_import_batches WHERE batch_id = 5; SELECT status, COUNT(*), COALESCE(SUM(amount),0) FROM easy_import_rows WHERE batch_id = 5 GROUP BY status; SELECT COUNT(*) AS matched_ready_cnt, COALESCE(SUM(amount),0) AS matched_ready_sum FROM easy_import_rows WHERE batch_id = 5 AND status = 'READY' AND matched_account_id IS NOT NULL; SELECT COUNT(*) AS unmatched_ready_cnt, COALESCE(SUM(amount),0) AS unmatched_ready_sum FROM easy_import_rows WHERE batch_id = 5 AND status = 'READY' AND matched_account_id IS NULL; SELECT COUNT(*) AS ready_with_txn FROM easy_import_rows WHERE batch_id = 5 AND status = 'READY' AND created_txn_id IS NOT NULL;\" 2>&1 || echo \"mysql_exit=$?\"",
            "exit 0"
          ]}
          PARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09d7cabb5a42d1135" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/mysql-agg-post.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135"
          echo "wait_exit=$?"
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardOutputContent' --output text
          exit 0

      - name: New transaction for row 506
        shell: bash
        run: |
          cat > /tmp/mysql-txn-506.json <<'PARAMS'
          {"commands":[
            "set +e",
            "echo \"=== NEW TXN FOR ROW 506 ===\"",
            "source /etc/f2r/env 2>/dev/null || true",
            "mysql -h \"${DB_HOST}\" -P \"${DB_PORT}\" -u \"${DB_USER}\" -p\"${DB_PASSWORD}\" \"${DB_NAME}\" -e \"SET SESSION TRANSACTION READ ONLY; SELECT t.txn_id, t.business_id, t.occurred_on, t.direction, t.amount, t.category, t.counterparty, t.source_kind, t.source_ref, t.fingerprint, t.account_id FROM easy_transactions t JOIN easy_import_rows r ON t.fingerprint = r.fingerprint WHERE r.batch_id = 5 AND r.row_id = 506;\" 2>&1 || echo \"mysql_exit=$?\"",
            "exit 0"
          ]}
          PARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09d7cabb5a42d1135" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/mysql-txn-506.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135"
          echo "wait_exit=$?"
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardOutputContent' --output text
          exit 0

      - name: 43 target amount sum (correct set)
        shell: bash
        run: |
          cat > /tmp/mysql-target-sum.json <<'PARAMS'
          {"commands":[
            "set +e",
            "echo \"=== TARGET 43 AMOUNT ===\"",
            "source /etc/f2r/env 2>/dev/null || true",
            "mysql -h \"${DB_HOST}\" -P \"${DB_PORT}\" -u \"${DB_USER}\" -p\"${DB_PASSWORD}\" \"${DB_NAME}\" -e \"SET SESSION TRANSACTION READ ONLY; SELECT COALESCE(SUM(amount),0) FROM easy_import_rows WHERE batch_id = 5 AND row_id IN (130,136,137,191,237,271,272,273,274,275,276,279,353,354,360,378,440,441,442,446,448,449,512,542,550,569,572,573,576,577,579,595,608,609,610,626,629,632,637,657,663,676,506);\" 2>&1 || echo \"mysql_exit=$?\"",
            "exit 0"
          ]}
          PARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09d7cabb5a42d1135" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/mysql-target-sum.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135"
          echo "wait_exit=$?"
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardOutputContent' --output text
          exit 0

      - name: Duplicate check for new txn
        shell: bash
        run: |
          cat > /tmp/mysql-dup-new.json <<'PARAMS'
          {"commands":[
            "set +e",
            "echo \"=== DUPLICATE CHECK NEW TXN ===\"",
            "source /etc/f2r/env 2>/dev/null || true",
            "mysql -h \"${DB_HOST}\" -P \"${DB_PORT}\" -u \"${DB_USER}\" -p\"${DB_PASSWORD}\" \"${DB_NAME}\" -e \"SET SESSION TRANSACTION READ ONLY; SELECT COUNT(*) as dup_cnt FROM easy_transactions t1 JOIN easy_transactions t2 ON t1.fingerprint = t2.fingerprint AND t1.txn_id < t2.txn_id WHERE t1.txn_id >= 604;\" 2>&1 || echo \"mysql_exit=$?\"",
            "exit 0"
          ]}
          PARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09d7cabb5a42d1135" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/mysql-dup-new.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135"
          echo "wait_exit=$?"
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardOutputContent' --output text
          exit 0

      - name: Journal entries for new transaction
        shell: bash
        run: |
          cat > /tmp/mysql-journal-new2.json <<'PARAMS'
          {"commands":[
            "set +e",
            "echo \"=== JOURNAL FOR NEW TXN ===\"",
            "source /etc/f2r/env 2>/dev/null || true",
            "mysql -h \"${DB_HOST}\" -P \"${DB_PORT}\" -u \"${DB_USER}\" -p\"${DB_PASSWORD}\" \"${DB_NAME}\" -e \"SET SESSION TRANSACTION READ ONLY; SELECT je.*, t.txn_id, t.amount FROM easy_journal_entries je JOIN easy_transactions t ON je.txn_id = t.txn_id WHERE t.txn_id = (SELECT t2.txn_id FROM easy_transactions t2 JOIN easy_import_rows r ON t2.fingerprint = r.fingerprint WHERE r.batch_id = 5 AND r.row_id = 506);\" 2>&1 || echo \"mysql_exit=$?\"",
            "exit 0"
          ]}
          PARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09d7cabb5a42d1135" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/mysql-journal-new2.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135"
          echo "wait_exit=$?"
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardOutputContent' --output text
          exit 0