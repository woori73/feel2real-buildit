name: Tmp Pcap Analyze (read-only, manual)
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2
      - name: Analyze pcap via SSM
        run: |
          set -euo pipefail
          SSM_BODY=$(cat <<'SSMEOF'
          echo "===== export requests in pcap ====="
          tcpdump -r /tmp/dl.pcap -n -A 2>/dev/null | grep -a -c 'export/type/EBOOK' || echo 0
          tcpdump -r /tmp/dl.pcap -n -A 2>/dev/null | grep -a -c 'export/all' || echo 0
          echo ""
          echo "===== EBOOK request/response ====="
          tcpdump -r /tmp/dl.pcap -n -A 2>/dev/null | grep -a -m 4 -B 2 -A 8 'export/type/EBOOK' | head -60 || echo "none"
          echo ""
          echo "===== export/all request/response headers ====="
          tcpdump -r /tmp/dl.pcap -n -A 2>/dev/null | grep -a -m 6 -A 10 'GET /api/admin/newstart/wiki/export/all' | head -40 || echo "none"
          echo ""
          echo "===== RST packets during window ====="
          tcpdump -r /tmp/dl.pcap -n 2>/dev/null | grep -c 'Flags \[R' || echo 0
          SSMEOF
          )
          SSM_SCRIPT=$(printf 'set -euo pipefail\n%s\n' "$SSM_BODY")
          PARAMS_JSON=$(python3 -c 'import json,sys; print(json.dumps({"commands": sys.stdin.read().splitlines()}))' <<< "$SSM_SCRIPT")
          CMD_ID=$(aws ssm send-command --instance-ids i-09d7cabb5a42d1135 --document-name AWS-RunShellScript --parameters "$PARAMS_JSON" --query 'Command.CommandId' --output text)
          for i in $(seq 1 15); do sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'Status' --output text)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'StandardOutputContent' --output text
