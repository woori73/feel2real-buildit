name: DesignCraft residual probe v1 (read-only)
on:
  push:
    branches: ['ci/dc-step1-readonly']
    paths: ['.github/workflows/dc-r-probe.yml', 'ops/diagnostics/dc_r_probe.py', 'ops/diagnostics/dc_r_analyze.py']
permissions:
  contents: read
  id-token: write
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2
          role-duration-seconds: 900
          retry-max-attempts: 1
      - name: Server read-only probe; stage PDFs/PNGs in S3 transiently
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          probe = Path('ops/diagnostics/dc_r_probe.py').read_text()
          script = ("python3 - <<'REOF'\n" + probe + "\nREOF\n"
                    "while read name path; do [ -n \"$name\" ] && [ -f \"$path\" ] && aws s3 cp \"$path\" s3://feel2real-buildit-deploy/designcraft-r-probe/$name --sse AES256 --region ap-northeast-2 2>&1 | tail -1; done < /var/tmp/dc_r_files.txt\n"
                    "rm -f /var/tmp/dc_r_files.txt\n")
          Path('r-params.json').write_text(json.dumps({'commands': [script]}))
          PY
          command_id=$(aws ssm send-command --instance-ids i-09d7cabb5a42d1135 --document-name AWS-RunShellScript --parameters file://r-params.json --timeout-seconds 240 --query Command.CommandId --output text)
          for i in $(seq 1 70); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id i-09d7cabb5a42d1135 --query Status --output text 2>/dev/null || true)
            case "$status" in Success|Failed|TimedOut|Cancelled) break;; esac
            sleep 4
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id i-09d7cabb5a42d1135 --query '{status:Status,out:StandardOutputContent,err:StandardErrorContent}' --output json
      - name: High-res header analysis on the runner, then remove transient S3 objects
        run: |
          mkdir -p v && cd v
          aws s3 cp s3://feel2real-buildit-deploy/designcraft-r-probe/ . --recursive --region ap-northeast-2 >/dev/null 2>&1 || true
          ls -la
          sudo apt-get -qq update >/dev/null 2>&1; sudo apt-get -qq install -y poppler-utils tesseract-ocr tesseract-ocr-kor >/dev/null 2>&1 || true
          pip install -q pillow >/dev/null 2>&1 || true
          PDFS=$(ls *.pdf 2>/dev/null || true)
          [ -n "$PDFS" ] && python3 ../ops/diagnostics/dc_r_analyze.py $PDFS
          for p in cli*.png; do [ -f "$p" ] && python3 - "$p" <<'PY'
          import sys
          from PIL import Image
          im = Image.open(sys.argv[1]).convert('L'); w, h = im.size
          print(sys.argv[1], (w, h), 'non-white ratio = %.4f' % (sum(1 for p in im.getdata() if p < 200) / (w * h)))
          PY
          done
          aws s3 rm s3://feel2real-buildit-deploy/designcraft-r-probe/ --recursive --region ap-northeast-2 >/dev/null 2>&1 || true
          echo "transient S3 objects removed"
