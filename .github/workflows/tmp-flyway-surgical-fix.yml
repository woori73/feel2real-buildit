name: TMP Flyway Surgical Fix (DELETE 2 rows)

# TEMPORARY - surgical DELETE of 2 specific flyway_schema_history rows.
# On main only for execution. Delete after use.
# This file matches paths-ignore pattern (tmp-*.yml) so it does NOT trigger Build Check.
# Triggered manually via workflow_dispatch only.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  surgical-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2

      - name: SSM surgical DELETE (2 rows only)
        run: |
          set -euo pipefail
          SSM_SCRIPT=$(cat <<'SSMEOF'
          set -euo pipefail
          source /etc/f2r/env
          myq() {
            mysql -h "$DB_HOST" -P "${DB_PORT:-3306}" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" "$@"
          }
          MYSQL="myq"

          echo "===== STEP 1: BACKUP rows 137,138,139 ====="
          $MYSQL -e "SELECT installed_rank, version, description, type, script, checksum, installed_by, installed_on, execution_time, success FROM flyway_schema_history WHERE installed_rank IN (137,138,139) ORDER BY installed_rank;" > /tmp/flyway_backup_137_138_139.txt
          echo "Backup saved to /tmp/flyway_backup_137_138_139.txt:"
          cat /tmp/flyway_backup_137_138_139.txt
          echo ""

          echo "===== STEP 2: VERIFY conditions before DELETE ====="
          echo "Check 137: V1041 SQL success=1 checksum=-1648019573"
          C137=$($MYSQL -N -e "SELECT COUNT(*) FROM flyway_schema_history WHERE installed_rank=137 AND version='1041' AND type='SQL' AND checksum=-1648019573 AND success=1;")
          echo "  Count: $C137 (expected 1)"
          echo "Check 138: V1041 DELETE success=1"
          C138=$($MYSQL -N -e "SELECT COUNT(*) FROM flyway_schema_history WHERE installed_rank=138 AND version='1041' AND type='DELETE' AND success=1;")
          echo "  Count: $C138 (expected 1)"
          echo "Check 139: V1041 SQL success=0"
          C139=$($MYSQL -N -e "SELECT COUNT(*) FROM flyway_schema_history WHERE installed_rank=139 AND version='1041' AND type='SQL' AND success=0;")
          echo "  Count: $C139 (expected 1)"

          if [ "$C137" != "1" ] || [ "$C138" != "1" ] || [ "$C139" != "1" ]; then
            echo "ERROR: Conditions do not match expected. ABORTING - no DELETE performed."
            echo "Expected: 137=1, 138=1, 139=1"
            echo "Actual: 137=$C137, 138=$C138, 139=$C139"
            exit 1
          fi
          echo "All conditions match. Proceeding..."
          echo ""

          echo "===== STEP 3: DELETE 2 rows (138 and 139) ====="
          echo "Deleting row 138: installed_rank=138 AND version='1041' AND type='DELETE' AND success=1"
          $MYSQL -e "DELETE FROM flyway_schema_history WHERE installed_rank=138 AND version='1041' AND type='DELETE' AND success=1;"
          AFFECTED1=$($MYSQL -N -e "SELECT ROW_COUNT();")
          echo "  Affected rows: $AFFECTED1"

          echo "Deleting row 139: installed_rank=139 AND version='1041' AND type='SQL' AND success=0"
          $MYSQL -e "DELETE FROM flyway_schema_history WHERE installed_rank=139 AND version='1041' AND type='SQL' AND success=0;"
          AFFECTED2=$($MYSQL -N -e "SELECT ROW_COUNT();")
          echo "  Affected rows: $AFFECTED2"

          TOTAL=$((AFFECTED1 + AFFECTED2))
          echo ""
          echo "Total affected rows: $TOTAL (expected 2)"
          if [ "$TOTAL" != "2" ]; then
            echo "ERROR: Expected 2 affected rows, got $TOTAL. ABORTING further work."
            exit 1
          fi
          echo ""

          echo "===== STEP 4: AFTER verification ====="
          echo "V1041/V1042 full history:"
          $MYSQL -e "SELECT installed_rank, version, description, type, script, checksum, installed_by, installed_on, execution_time, success FROM flyway_schema_history WHERE version IN ('1041','1042') ORDER BY installed_rank;"
          echo ""
          echo "Verify 137 intact:"
          $MYSQL -N -e "SELECT COUNT(*) FROM flyway_schema_history WHERE installed_rank=137 AND version='1041' AND type='SQL' AND checksum=-1648019573 AND success=1;"
          echo "Verify no DELETE marker:"
          $MYSQL -N -e "SELECT COUNT(*) FROM flyway_schema_history WHERE version='1041' AND type='DELETE';"
          echo "Verify no failed rows:"
          $MYSQL -N -e "SELECT COUNT(*) FROM flyway_schema_history WHERE version IN ('1041','1042') AND success=0;"
          echo "Verify no V1042:"
          $MYSQL -N -e "SELECT COUNT(*) FROM flyway_schema_history WHERE version='1042';"
          SSMEOF
          )
          PARAMS_JSON=$(python3 -c 'import json,sys; print(json.dumps({"commands": sys.stdin.read().splitlines()}))' <<< "$SSM_SCRIPT")
          CMD_ID=$(aws ssm send-command \
            --instance-ids i-09d7cabb5a42d1135 \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMS_JSON" \
            --query 'Command.CommandId' --output text)
          echo "SSM CommandId=$CMD_ID"
          for i in $(seq 1 30); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'Status' --output text)
            echo "status=$STATUS (attempt $i/30)"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'StandardOutputContent' --output text
          echo "===== StandardErrorContent ====="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'StandardErrorContent' --output text
          FINAL=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'Status' --output text)
          if [ "$FINAL" != "Success" ]; then
            echo "::error::SSM command finished with status $FINAL"
            exit 1
          fi
