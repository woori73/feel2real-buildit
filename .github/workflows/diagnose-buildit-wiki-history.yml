name: Diagnose buildit-wiki history (read-only)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: diagnose-buildit-wiki-history
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2

      - name: Run historical diagnostic commands via SSM
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_ID="i-09d7cabb5a42d1135"

          # Read-only diagnostic commands for #282 timeframe (2026-09-16 16:45-16:55 UTC)
          COMMANDS=(
            # Systemd restart history and PID tracking
            "systemctl show buildit-wiki.service -p NRestarts -p Restart -p RestartUSec -p ExecMainCode -p ExecMainStatus -p ExecMainPID -p ExecStartPre -p ExecStart -p ExecStartPost -p ExecStop -p ExecStopPost -p ExecReload || true"

            # Full journal for #282 window (UTC)
            "journalctl -u buildit-wiki.service --since '2026-09-16 16:45:00 UTC' --until '2026-09-16 16:55:00 UTC' --no-pager -o short-precise || true"

            # Warning+ level only for same window
            "journalctl -u buildit-wiki.service --since '2026-09-16 16:45:00 UTC' --until '2026-09-16 16:55:00 UTC' --no-pager -p warning || true"

            # Current state for reference
            "systemctl status buildit-wiki.service --no-pager -l || true"

            # Port state
            "ss -ltnp | grep -E ':8000|:8080' || true"

            # Unit file (ExecStart/WorkingDirectory only)
            "systemctl cat buildit-wiki.service 2>/dev/null | grep -E '^(ExecStart|WorkingDirectory)=' || true"
          )

          # Build the command string for SSM
          CMD_JSON=$(printf '%s\n' "${COMMANDS[@]}" | jq -R . | jq -s .)
          echo "Commands to run: $CMD_JSON"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=$CMD_JSON" \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"

          # Wait for command to complete (polling like PR #294)
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          WAIT_STATUS=$?
          set -e

          # Get and output the full invocation result
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text
          echo "--- STDERR ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' --output text

          exit "$WAIT_STATUS"