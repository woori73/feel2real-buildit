name: OIDC claims check - job_workflow_ref (one-time, no AWS)
# 일회성 진단: GitHub OIDC 토큰의 공개 클레임(job_workflow_ref 포함)만 출력한다.
# AWS 접근·시크릿·checkout 없음. JWT 원문은 마스킹하고 출력하지 않는다.
on:
  push:
    branches: ['ci/oidc-claims-jwr']
    paths: ['.github/workflows/oidc-claims-jwr.yml']
permissions:
  id-token: write
  contents: read
jobs:
  claims:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Print public OIDC claims only
        shell: bash
        run: |
          python3 -I - <<'PY'
          import base64, json, os, sys, urllib.request
          try:
              url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=sts.amazonaws.com'
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
              jwt = json.load(urllib.request.urlopen(req, timeout=20))['value']
              print('::add-mask::' + jwt)
              payload = jwt.split('.')[1]
              c = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
              for k in ['iss','aud','sub','repository','repository_owner','ref','ref_type','event_name','job_workflow_ref','workflow_ref','workflow','environment','runner_environment','ref_protected']:
                  print(k, '=', c.get(k, '<absent>'))
              print('claim names present:', ','.join(sorted(c.keys())))
          except Exception as e:
              print('claims check failed:', type(e).__name__)
              sys.exit(1)
          PY
