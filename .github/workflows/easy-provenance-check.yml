name: Easy Provenance Check (read-only, manual)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2

      - name: Run MySQL read-only query via SSM (reads /etc/f2r/env on EC2)
        shell: bash
        run: |
          cat > /tmp/mysql-query.json <<'PARAMS'
          {"commands":[
            "set +e",
            "echo \"=== MySQL provenance check for easy_import_rows 272/275 ===\"",
            "source /etc/f2r/env 2>/dev/null || true",
            "mysql -h \"${DB_HOST}\" -P \"${DB_PORT}\" -u \"${DB_USER}\" -p\"${DB_PASSWORD}\" \"${DB_NAME}\" -e \"SET SESSION TRANSACTION READ ONLY; SELECT row_id, batch_id, row_no, raw_data, occurred_on, counterparty, amount, description, pay_method FROM easy_import_rows WHERE row_id IN (272, 275);\" 2>&1 || echo \"mysql_exit=$?\"",
            "exit 0"
          ]}
          PARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09d7cabb5a42d1135" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/mysql-query.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135"
          echo "wait_exit=$?"
          echo "===== invocation status ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query '{Status:Status,ResponseCode:ResponseCode}' --output text
          echo "===== StandardOutputContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardOutputContent' --output text
          echo "===== StandardErrorContent ====="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-09d7cabb5a42d1135" --query 'StandardErrorContent' --output text
          exit 0