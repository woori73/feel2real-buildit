name: Build Check

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Build bootJar only (no deploy)
        run: ./gradlew clean bootJar --no-daemon

      # MySQL 이 없는 CI 에서 실행 가능한 순수 단위/계약 테스트만 실행한다.
      # @SpringBootTest(MySQL) 통합 테스트는 여기에 포함하지 않는다(로컬/전용 환경에서만).
      # 이 스텝 덕분에 Build Check 는 "컴파일 성공"이 아니라 "핵심 단위 로직 통과"까지 의미한다.
      - name: Run non-MySQL unit & contract tests
        run: >-
          ./gradlew test --no-daemon
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.chart.service.ChartSiteToolServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.config.security.ChartAgentTokenFilterTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.chart.controller.ChartSiteToolAgentAuthWebMvcTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.chart.service.ChartCandidateEnrichmentServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.chart.service.ChartEducatorSearchServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.chart.service.RankingComputationTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.chart.service.ChartRankingServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.chart.controller.ChartPublicControllerWebMvcTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.template.ChartSiteToolsContractTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.template.ChartPublicPageContractTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.chart.service.ChartDiscoveryServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.academy.service.AcademyServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.academy.controller.AcademyBuilderTemplateContractTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.academy.service.AcademyVideoDeliveryServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.academy.service.AcademyVideoServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.academy.AcademyVideoAsyncSchemaContractTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.academy.service.ExternalVideoUrlValidatorTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.infrastructure.storage.S3AcademyVideoDeliveryStorageTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.infrastructure.video.VideoTranscoderTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.academy.service.AcademyAiContextServiceTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.academy.service.AcademyAiSuggestionServiceTest"
