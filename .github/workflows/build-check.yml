      - name: Verify editor tests executed
        # 셸 주석(#)으로 --tests 필터가 잘리는 사고 방지: XML 리포트 존재를 강제한다.
        run: |
          test -f build/test-results/test/TEST-f2r.tutor_solution.private_tutor_solution_back.domain.academy.service.VisualEditorSanitizerTest.xml
          test -f build/test-results/test/TEST-f2r.tutor_solution.private_tutor_solution_back.domain.academy.service.VisualEditorRealOutputTest.xml
          test -f build/test-results/test/TEST-f2r.tutor_solution.private_tutor_solution_back.domain.academy.controller.VisualEditorApiTest.xml
          echo "editor tests executed: OK"

      - name: Upload build-job test report
        # 편집기 테스트가 실제로 실행됐는지 검증용 (테스트 삭제·비활성화 금지 정책).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

      - name: Stage build artifacts (SHA-bound)
        # main push에서만 실행: Deploy(auto)가 재사용할 artifact를 만든다.
        # PR 빌드에서는 업로드하지 않아 스토리지 낭비를 막는다.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/build-artifacts
          JAR=$(find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-plain.jar" | head -n 1)
          test -n "$JAR" || { echo "::error::bootJar not found in build/libs"; exit 1; }
          cp "$JAR" /tmp/build-artifacts/app.jar
          test -f /tmp/buildit-wiki-backend.tgz || { echo "::error::wiki backend tgz not found"; exit 1; }
          cp /tmp/buildit-wiki-backend.tgz /tmp/build-artifacts/buildit-wiki-backend.tgz
          ls -lh /tmp/build-artifacts/
          echo "app.jar SHA256: $(sha256sum /tmp/build-artifacts/app.jar | cut -d' ' -f1)"

      - name: Upload bootJar artifact (SHA-bound)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-jar-${{ github.sha }}
          path: /tmp/build-artifacts/app.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload wiki backend artifact (SHA-bound)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: wiki-backend-${{ github.sha }}
          path: /tmp/build-artifacts/buildit-wiki-backend.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-check-test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

  mysql-integration-test:
    # BuildIt P1 MySQL 통합 테스트 (격리 DB).
    # 운영 DB와 완전히 분리된 ephemeral MySQL에서 실제 DB 동작을 검증한다.
    # 테스트 전용 접속정보만 사용하며, 운영 접속정보는 사용하지 않는다.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_test_root_pw
          MYSQL_DATABASE: f2r_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/f2r_test?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ci_test_root_pw
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Install Korean font for Chromium QA
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk

      - name: Raise MySQL max_connections for cached Spring test contexts
        # 테스트 JVM이 Spring 컨텍스트를 캐시하고 컨텍스트마다 Hikari 풀(기본 10)을 유지한다.
        # 컨텍스트 15개 이상이 되면 MySQL 기본 max_connections(151)에 닿아, 마지막에 뜨는 컨텍스트가
        # "Too many connections"로 실패한다(관측: 컨텍스트가 1개 늘자 ADMIN 교체 테스트 9건 실패).
        run: |
          command -v mysql >/dev/null || sudo apt-get install -y -qq mysql-client
          mysql -h 127.0.0.1 -P 3306 -uroot -pci_test_root_pw -e "SET GLOBAL max_connections=500"
          mysql -h 127.0.0.1 -P 3306 -uroot -pci_test_root_pw -e "SHOW VARIABLES LIKE 'max_connections'"
      - name: Run MySQL integration tests
        run: >-
          ./gradlew test --no-daemon --stacktrace
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.academy.service.AcademyAiMySqlIntegrationTest"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.academy.controller.VisualEditorMySqlIntegrationTest"
