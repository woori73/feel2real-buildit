name: Build Check

on:
  workflow_dispatch:
  pull_request:
  # main push에서도 돌아야 "배포 대상 SHA 자체가 CI를 통과했다"는 근거가 생긴다.
  # deploy-ec2.yml의 workflow_run 게이트가 이 run의 head_sha를 그대로 배포한다.
  push:
    branches:
      - main
    # READ-ONLY 진단 workflow 변경 시에는 Build Check를 실행하지 않는다.
    # 진단 workflow는 배포와 무관하므로 CI를 통과할 필요가 없다.
    # paths-ignore는 모든 변경 파일이 패턴에 매칭될 때만 skip되므로,
    # 진단 workflow와 build-check.yml 자체 변경이 함께 있을 때는 실행된다.
    paths-ignore:
      - '.github/workflows/prod-diagnostic.yml'
      - '.github/workflows/diagnostic-*.yml'
      - '.github/workflows/tmp-*.yml'
      # 순수 문서 변경 시 CI 면제 (2026-10-13 Phase 0).
      # Java·DB 마이그레이션·실행 스크립트·운영 설정·인증/권한 변경은 제외하지 않음.
      - '**.md'
      - 'docs/**'
      # 정적 시드 데이터 (런타임 로드 JSON, 빌드 영향 없음)
      - 'src/main/resources/wemade/seed/**'

permissions:
  contents: read

# PR/브랜치별로 그룹화하여 동일 PR의 중복 빌드는 취소하되,
# 서로 다른 PR의 빌드는 서로 취소하지 않음
concurrency:
  group: build-check-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Deploy guard shell tests (jar rollback + env backup/restore)
        # deploy-ec2.yml이 EC2 배포 스크립트에 그대로 이어 붙이는 가드를 같은 소스로 검증한다.
        run: bash scripts/deploy/f2r_app_guard.test.sh

      - name: Admissions diagnostic safety test (read-only guard)
        run: bash scripts/operations/admissions-diag.test.sh

      - name: Admissions embedding server core tests
        run: python3 -m unittest discover -s ops/admissions-embedding -q
        # guard 판단 로직(셸) 테스트

      - name: Admissions embedding guard test
        run: bash ops/admissions-embedding/guard.test.sh

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS unit tests (AI builder allowlist)
        # src/test/js 전체가 아니라 현재 통과하는 AI 제작 관련 파일만 실행한다.
        # 나머지 35건 실패(하네스 결함 13 + 낡은 계약 22)는 docs/BUILDIT_JS_TEST_BASELINE_20261013.md에 기록했다.
        run: >-
          node --test
          src/test/js/assistant_wait.test.js
          src/test/js/admissions_admin_load.test.js
          src/test/js/assistant_export.test.js
          src/test/js/academy_adopt.test.js
          src/test/js/assistant_home_contract.test.js
          src/test/js/academy_preview_link.test.js
          src/test/js/academy_public_consult.test.js
          src/test/js/site_events.test.js
          src/test/js/admin_account.test.js
          src/test/js/tutor_academy_inquiries.test.js
          src/test/js/exam_insight.test.js
          src/test/js/home_agent_exam_contract.test.js
          src/test/js/landing_buildit_start.test.js
          src/test/js/academy_public_hero_cycle.test.js
          src/test/js/landing_v3.test.js
          src/test/js/builder_entry.test.js
          src/test/js/unified_assistant_tour.test.js
          src/test/js/easy_tutor_agent_contract.test.js
          src/test/js/testprep_gate.test.js
          src/test/js/testprep_flush.test.js
          src/test/js/designcraft_editor_ai_panel_contract.test.js

      - name: Build BuildIt Wiki frontend (baked into bootJar)
        # deploy-ec2.yml이 하던 wiki 빌드를 여기로 이동한다. artifact JAR에 wiki 정적
        # 리소스가 포함되어야 /problem-generator/wiki/index.html이 정상 서빙된다
        # (ProblemGeneratorPageController가 /problem-generator/wiki/index.html로 리다이렉트).
        # 백엔드 tgz도 여기서 만들어 artifact로 올린다 — Deploy는 빌드 없이 다운로드만 한다.
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/buildit-wiki-backend-src
          mkdir -p /tmp/buildit-wiki-backend-src
          cp -R "$GITHUB_WORKSPACE/problem-generator/wiki-backend-src/." /tmp/buildit-wiki-backend-src/
          cd "$GITHUB_WORKSPACE/problem-generator/wiki-src"
          npm ci
          npm run build -- --base=/problem-generator/wiki/
          cd "$GITHUB_WORKSPACE"
          rm -rf src/main/resources/static/problem-generator/wiki
          mkdir -p src/main/resources/static/problem-generator/wiki
          cp -R problem-generator/wiki-src/dist/. src/main/resources/static/problem-generator/wiki/
          # 문법 문제은행 독립 페이지(/grammar-items) 전용 번들 — base를 /grammar-items/로 분리해 별도 서빙.
          cd "$GITHUB_WORKSPACE/problem-generator/wiki-src"
          npm run build:grammar-items
          cd "$GITHUB_WORKSPACE"
          rm -rf src/main/resources/static/grammar-items
          mkdir -p src/main/resources/static/grammar-items
          cp -R problem-generator/wiki-src/dist-grammar-items/. src/main/resources/static/grammar-items/
          mv src/main/resources/static/grammar-items/grammar-items.html src/main/resources/static/grammar-items/index.html
          tar -czf /tmp/buildit-wiki-backend.tgz -C /tmp/buildit-wiki-backend-src backend requirements.txt
          echo "wiki frontend baked into static resources; backend tgz ready"

      - name: Build bootJar only (no deploy)
        run: ./gradlew clean bootJar --no-daemon

      # MySQL 이 없는 CI 에서 실행 가능한 순수 단위/계약 테스트만 실행한다.
      # @SpringBootTest(MySQL) 통합 테스트는 여기에 포함하지 않는다(로컬/전용 환경에서만).
      # 이 스텝 덕분에 Build Check 는 "컴파일 성공"이 아니라 "핵심 단위 로직 통과"까지 의미한다.
      - name: Run non-MySQL unit & contract tests
        # 테스트 그룹: 지피지기 Agent V1 (NewStart 운영 보조) 무DB 단위/계약 테스트,
        # V1005 답변 세션 자동 축적 + RAG 재사용 (H2 MySQL 모드 DB 테스트) 포함.
        # 주의: run 블록 내부에 # 셸 주석을 넣으면 그 뒤의 --tests 필터가 모두
        # 주석 처리되어 실행되지 않는다. 그룹 설명은 이 YAML 주석에만 작성할 것.
        run: >-
          ./gradlew test --no-daemon
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.unifiedassistant.*"
          --tests "f2r.tutor_solution.private_tutor_solution_back.domain.academycraft.AcademyCraftGatewayTest"
