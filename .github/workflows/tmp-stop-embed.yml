name: Tmp Stop Embed Safety Check
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2
      - name: Stop embedding and safety check via SSM
        run: |
          set -euo pipefail
          SSM_BODY=$(cat <<'SSMEOF'
          echo "=== 1. 임베딩 프로세스 종료 ==="
          # 정상 종료 시도 (SIGTERM)
          pkill -TERM -f "ec2_embed_pipeline.py" 2>/dev/null && echo "SIGTERM 전송" || echo "실행 중인 임베딩 프로세스 없음"
          sleep 5
          # 아직 살아있는지 확인
          if pgrep -f "ec2_embed_pipeline.py" > /dev/null; then
            echo "WARNING: 프로세스가 아직 살아있음. 강제 종료합니다."
            pkill -KILL -f "ec2_embed_pipeline.py" 2>/dev/null || true
            sleep 2
          fi
          if pgrep -f "ec2_embed_pipeline.py" > /dev/null; then
            echo "EMBED_RUNNING:YES"
          else
            echo "EMBED_RUNNING:NO"
          fi
          echo ""
          echo "=== 2. Java 앱 상태 ==="
          if pgrep -f "java.*\.jar" > /dev/null; then
            echo "JAVA_RUNNING:YES"
            ps aux | grep -E "java.*\.jar" | grep -v grep | awk '{print "JAVA_RSS_MB:" $6/1024 ", JAVA_CPU:" $3}'
          else
            echo "JAVA_RUNNING:NO - WARNING!"
          fi
          echo ""
          echo "=== 3. 메모리 상태 ==="
          free -m | head -2
          echo ""
          echo "=== 4. OOM Killer 확인 ==="
          dmesg 2>/dev/null | grep -i "killed process" | tail -3 || echo "OOM 기록 없음 (또는 dmesg 접근 불가)"
          echo ""
          echo "=== 5. 진행 상태 파일 ==="
          cat /tmp/ec2_embed_progress.json 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print(f"PROGRESS_DONE:{len(d.get('done',[]))}, PROGRESS_FAILED:{len(d.get('failed',[]))}")" 2>/dev/null || echo "진행 파일 없음"
          echo ""
          echo "=== 6. DB 벡터 건수 ==="
          source /etc/f2r/env 2>/dev/null || true
          mysql -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" -N -e "SELECT CONCAT('DB_VECTOR_COUNT:', COUNT(*)) FROM newstart_knowledge_embedding;" 2>&1 | head -2
          echo ""
          echo "=== 7. enabled 설정 확인 ==="
          grep -E "EMBEDDING_ENABLED" /etc/f2r/env 2>/dev/null || echo "ENV에 EMBEDDING_ENABLED 없음 (기본값 false)"
          echo ""
          echo "=== 8. 원문 테이블 무변경 확인 (샘플) ==="
          mysql -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" -N -e "SELECT CONCAT('KNOWLEDGE_COUNT:', COUNT(*)) FROM newstart_knowledge_items WHERE status='ACTIVE';" 2>&1 | head -2
          SSMEOF
          )
          SSM_SCRIPT=$(printf '%s\n' "$SSM_BODY")
          PARAMS_JSON=$(python3 -c 'import json,sys; print(json.dumps({"commands": sys.stdin.read().splitlines()}))' <<< "$SSM_SCRIPT")
          CMD_ID=$(aws ssm send-command --instance-ids i-09d7cabb5a42d1135 --document-name AWS-RunShellScript --parameters "$PARAMS_JSON" --query 'Command.CommandId' --output text)
          for i in $(seq 1 12); do sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'Status' --output text)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'StandardOutputContent' --output text
