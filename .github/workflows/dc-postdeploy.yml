name: dc post-deploy verification (read-only)
on:
  push:
    branches: ['ci/dc-step1-readonly']
    paths: ['.github/workflows/dc-postdeploy.yml', 'ops/diagnostics/dc_postdeploy.py']
permissions:
  contents: read
  id-token: write
concurrency:
  group: dc-ec2-prep
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2
          role-duration-seconds: 900
          retry-max-attempts: 1
      - name: probe via SSM (read-only)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          Path('p.json').write_text(json.dumps({'commands': ["python3 - <<'PEOF'\n" + Path('ops/diagnostics/dc_postdeploy.py').read_text() + "\nPEOF\n"]}))
          PY
          id=$(aws ssm send-command --instance-ids i-09d7cabb5a42d1135 --document-name AWS-RunShellScript --parameters file://p.json --timeout-seconds 150 --query Command.CommandId --output text)
          for i in $(seq 1 50); do
            s=$(aws ssm get-command-invocation --command-id "$id" --instance-id i-09d7cabb5a42d1135 --query Status --output text 2>/dev/null || true)
            case "$s" in Success|Failed|TimedOut|Cancelled) break;; esac; sleep 3
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id i-09d7cabb5a42d1135 --query '{status:Status,out:StandardOutputContent,err:StandardErrorContent}' --output json
