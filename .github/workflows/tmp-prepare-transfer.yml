name: Tmp Prepare Transfer
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2
      - name: Prepare chunks on EC2
        run: |
          SSM_BODY=$(cat <<'SSMEOF'
          # S3에서 다운로드 (EC2는 접근 가능)
          aws s3 cp s3://f2r-tutor-uploads-prd-067573916809-ap-northeast-2-an/tmp/embedding/docs.jsonl /tmp/transfer_docs.jsonl 2>&1 | tail -1
          echo "Lines: $(wc -l < /tmp/transfer_docs.jsonl)"
          # gzip 압축
          gzip -c /tmp/transfer_docs.jsonl > /tmp/transfer_docs.jsonl.gz
          GZ_SIZE=$(stat -c%s /tmp/transfer_docs.jsonl.gz)
          echo "Gzipped: $GZ_SIZE bytes"
          # 48KB 청크로 분할 (base64 후 ~64KB, SSM 출력 제한 내)
          split -b 49152 /tmp/transfer_docs.jsonl.gz /tmp/chunk_
          echo "Chunks: $(ls /tmp/chunk_* | wc -l)"
          # 각 청크를 base64로 인코딩
          for f in /tmp/chunk_*; do base64 -w0 "$f" > "$f.b64"; done
          echo "B64 chunks ready: $(ls /tmp/chunk_*.b64 | wc -l)"
          ls -lh /tmp/chunk_aa.b64 | awk '{print "First chunk B64 size: " $5}'
          SSMEOF
          )
          SSM_SCRIPT=$(printf '%s\n' "$SSM_BODY")
          PARAMS_JSON=$(python3 -c 'import json,sys; print(json.dumps({"commands": sys.stdin.read().splitlines()}))' <<< "$SSM_SCRIPT")
          CMD_ID=$(aws ssm send-command --instance-ids i-09d7cabb5a42d1135 --document-name AWS-RunShellScript --parameters "$PARAMS_JSON" --query 'Command.CommandId' --output text)
          for i in $(seq 1 15); do sleep 10
            S=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'Status' --output text)
            case "$S" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'StandardOutputContent' --output text | tail -8
