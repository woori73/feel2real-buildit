name: Apply Wiki Question Edit
on:
  push:
    branches: [feat/wiki-question-db-edit]
    paths: [.github/workflows/wiki-question-edit-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wiki-question-db-edit
      - name: Apply patch
        run: python scripts/apply_wiki_question_edit.py
      - name: Backend syntax check
        run: python -m py_compile problem-generator/wiki-backend-src/backend/main.py
      - name: Frontend build
        working-directory: problem-generator/wiki-src
        run: npm ci && npm run build
      - name: Commit implementation and remove temporary patch machinery
        run: |
          rm scripts/apply_wiki_question_edit.py .github/workflows/wiki-question-edit-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(wiki): edit stored teacher questions in place"
          git push origin HEAD:feat/wiki-question-db-edit
