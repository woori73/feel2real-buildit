name: AWS retirement inventory (read-only)
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - account: '067573916809'
            role: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          - account: '425805163960'
            role: arn:aws:iam::425805163960:role/github-actions-f2r-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ matrix.role }}
          aws-region: ap-northeast-2
          role-session-name: f2r-retirement-readonly
          retry-max-attempts: 2
      - name: Inventory existing resources only (no billing values or secrets)
        env:
          EXPECTED_ACCOUNT: ${{ matrix.account }}
        run: python3 scripts/operations/aws-retirement-readonly.py
