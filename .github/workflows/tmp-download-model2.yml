name: Tmp Download Model2
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  dl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2
      - name: Download model via SSM
        run: |
          set -euo pipefail
          SSM_BODY=$(cat <<'SSMEOF'
          set -e
          echo "Installing huggingface_hub..."
          python3 -m pip install --quiet huggingface_hub 2>&1 | tail -1
          echo "Downloading model..."
          python3 << 'PYEOF2'
          from huggingface_hub import snapshot_download
          import os
          os.makedirs("/opt/embeddinggemma-2", exist_ok=True)
          try:
              path = snapshot_download(
                  repo_id="google/embeddinggemma-2",
                  local_dir="/opt/embeddinggemma-2",
                  local_dir_use_symlinks=False
              )
              print(f"Downloaded to: {path}")
          except Exception as e:
              print(f"Download failed: {e}")
              raise
          PYEOF2
          echo "Verifying..."
          ls -lh /opt/embeddinggemma-2/ | head -10
          echo "Config exists: $(test -f /opt/embeddinggemma-2/config.json && echo YES || echo NO)"
          SSMEOF
          )
          SSM_SCRIPT=$(printf '%s\n' "$SSM_BODY")
          PARAMS_JSON=$(python3 -c 'import json,sys; print(json.dumps({"commands": sys.stdin.read().splitlines()}))' <<< "$SSM_SCRIPT")
          CMD_ID=$(aws ssm send-command --instance-ids i-09d7cabb5a42d1135 --document-name AWS-RunShellScript --parameters "$PARAMS_JSON" --query 'Command.CommandId' --output text)
          echo "CMD: $CMD_ID"
          for i in $(seq 1 30); do sleep 30
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'Status' --output text)
            echo "[$i] $STATUS"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'StandardOutputContent' --output text | tail -15
