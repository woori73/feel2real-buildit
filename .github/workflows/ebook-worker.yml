name: Ebook order worker checks
on:
  pull_request:
    paths:
      - 'scripts/ebook/**'
      - '.github/workflows/ebook-worker.yml'
permissions:
  contents: read
jobs:
  ebook-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python3 -m unittest discover -s scripts/ebook -p 'test_*.py'
