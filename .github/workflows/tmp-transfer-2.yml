name: Tmp Transfer Chunks 2
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2
      - name: Transfer chunks 20-29 via SSM
        run: |
          SSM_BODY=$(cat <<'SSMEOF'
          echo 'CHUNK_20:'; cat /tmp/chunk_au.b64; echo 'CHUNK_21:'; cat /tmp/chunk_av.b64; echo 'CHUNK_22:'; cat /tmp/chunk_aw.b64; echo 'CHUNK_23:'; cat /tmp/chunk_ax.b64; echo 'CHUNK_24:'; cat /tmp/chunk_ay.b64; echo 'CHUNK_25:'; cat /tmp/chunk_az.b64; echo 'CHUNK_26:'; cat /tmp/chunk_ba.b64; echo 'CHUNK_27:'; cat /tmp/chunk_bb.b64; echo 'CHUNK_28:'; cat /tmp/chunk_bc.b64; echo 'CHUNK_29:'; cat /tmp/chunk_bd.b64;
          SSMEOF
          )
          SSM_SCRIPT=$(printf '%s\n' "$SSM_BODY")
          PARAMS_JSON=$(python3 -c 'import json,sys; print(json.dumps({"commands": sys.stdin.read().splitlines()}))' <<< "$SSM_SCRIPT")
          CMD_ID=$(aws ssm send-command --instance-ids i-09d7cabb5a42d1135 --document-name AWS-RunShellScript --parameters "$PARAMS_JSON" --query 'Command.CommandId' --output text)
          for i in $(seq 1 15); do sleep 10
            S=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'Status' --output text)
            case "$S" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'StandardOutputContent' --output text
