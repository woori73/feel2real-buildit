name: DesignCraft residual probe v4 (read-only, journal clues for versions loss)
on:
  push:
    branches: ['ci/dc-step1-readonly']
    paths: ['.github/workflows/dc-r-probe4.yml', 'ops/diagnostics/dc_r_probe4.py']
permissions:
  contents: read
  id-token: write
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2
          role-duration-seconds: 900
          retry-max-attempts: 1
      - name: Server read-only SELECT probe
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          Path('r4.json').write_text(json.dumps({'commands': ["python3 - <<'REOF'\n" + Path('ops/diagnostics/dc_r_probe4.py').read_text() + "\nREOF\n"]}))
          PY
          command_id=$(aws ssm send-command --instance-ids i-09d7cabb5a42d1135 --document-name AWS-RunShellScript --parameters file://r4.json --timeout-seconds 90 --query Command.CommandId --output text)
          for i in $(seq 1 30); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id i-09d7cabb5a42d1135 --query Status --output text 2>/dev/null || true)
            case "$status" in Success|Failed|TimedOut|Cancelled) break;; esac
            sleep 3
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id i-09d7cabb5a42d1135 --query '{status:Status,out:StandardOutputContent,err:StandardErrorContent}' --output json
