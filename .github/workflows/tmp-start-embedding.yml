name: Tmp Start Embedding Service
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2
      - name: Start service via SSM
        run: |
          set -euo pipefail
          SSM_BODY=$(cat <<'SSMEOF'
          python3 -m pip install --quiet fastapi uvicorn 2>&1 | tail -1
          echo 'SERVICE_B64' | base64 -d > /tmp/embedding_service.py
          pkill -f "embedding_service.py" || true
          sleep 2
          cd /tmp && nohup python3 -m uvicorn embedding_service:app --host 127.0.0.1 --port 8001 > /var/log/embedding-service.log 2>&1 &
          sleep 10
          curl -s http://127.0.0.1:8001/health || echo "health check failed (model may still be loading)"
          SSMEOF
          )
          SSM_BODY="${SSM_BODY/SERVICE_}"
          SSM_SCRIPT=$(printf '%s\n' "$SSM_BODY")
          PARAMS_JSON=$(python3 -c 'import json,sys; print(json.dumps({"commands": sys.stdin.read().splitlines()}))' <<< "$SSM_SCRIPT")
          CMD_ID=$(aws ssm send-command --instance-ids i-09d7cabb5a42d1135 --document-name AWS-RunShellScript --parameters "$PARAMS_JSON" --query 'Command.CommandId' --output text)
          for i in $(seq 1 10); do sleep 15
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'Status' --output text)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'StandardOutputContent' --output text | tail -10
