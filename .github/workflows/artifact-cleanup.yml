name: Artifact Storage Cleanup

# GitHub Actions 저장공간 자동 정리
# - 매주 일요일 오전 3시(KST) 실행
# - 운영 증빙은 최소 90일 보존. 기본은 삭제 없는 dry-run.
# - 최근 성공 배포 3개 버전 + 실행 중인 CI/배포의 아티팩트는 보존
#
# 2026-10-25: 장기 증빙 보존 정책에 맞춰 자동 삭제 중지. 명시적 수동 실행만 삭제 가능.

on:
  schedule:
    # 매주 일요일 03:00 KST = 토요일 18:00 UTC
    - cron: '0 18 * * 6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '시뮬레이션 모드 (true=삭제 없이 대상만 보고)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

# 스케줄은 계속 조회·보고하되 삭제하지 않는다.
env:
  DRY_RUN_DEFAULT: 'true'
  KEEP_DEPLOY_COUNT: '3'
  REPORT_RETENTION_DAYS: '90'

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Determine dry-run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "dry_run=${{ env.DRY_RUN_DEFAULT }}" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Cleanup old artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error
          from datetime import datetime, timezone, timedelta

          REPO = os.environ['REPO']
          TOKEN = os.environ['GH_TOKEN']
          DRY_RUN = os.environ.get('DRY_RUN', 'true').lower() == 'true'
          KEEP_DEPLOY_COUNT = int(os.environ.get('KEEP_DEPLOY_COUNT', '3'))
          REPORT_RETENTION_DAYS = max(90, int(os.environ.get('REPORT_RETENTION_DAYS', '90')))
          SUMMARY = os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null')
          API = 'https://api.github.com'

          def api(method, path, params=None):
              url = API + path
              if params:
                  url += '?' + '&'.join(f'{k}={v}' for k, v in params.items())
              req = urllib.request.Request(url, method=method)
              req.add_header('Authorization', f'Bearer {TOKEN}')
              req.add_header('Accept', 'application/vnd.github+json')
              req.add_header('X-GitHub-Api-Version', '2022-11-28')
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      body = resp.read().decode('utf-8')
                      return json.loads(body) if body.strip() else {}
              except urllib.error.HTTPError as e:
                  raise RuntimeError(f'{method} {path} -> HTTP {e.code}: {e.read().decode()[:300]}')

          def summary(lines):
              with open(SUMMARY, 'a') as f:
                  f.write('\n'.join(lines) + '\n')

          fatal = None
          try:
              now = datetime.now(timezone.utc)
              cutoff = now - timedelta(days=REPORT_RETENTION_DAYS)

              # 1. 전체 아티팩트 수집
              artifacts = []
              for page in range(1, 21):
                  d = api('GET', f'/repos/{REPO}/actions/artifacts',
                          {'per_page': '100', 'page': str(page)})
                  batch = d.get('artifacts', [])
                  if not batch:
                      break
                  artifacts.extend(batch)
                  if len(batch) < 100:
                      break
              size_before = sum(a.get('size_in_bytes', 0) for a in artifacts)

              # 2. 최근 성공 배포 SHA
              deployed_shas = []
              d = api('GET', f'/repos/{REPO}/actions/workflows/deploy-ec2.yml/runs',
                      {'per_page': '20', 'status': 'completed'})
              for r in d.get('workflow_runs', []):
                  if r.get('conclusion') == 'success':
                      sha = r['head_sha'][:8]
                      if sha not in deployed_shas:
                          deployed_shas.append(sha)
                      if len(deployed_shas) >= KEEP_DEPLOY_COUNT:
                          break

              # 3. 실행 중인 워크플로우 SHA
              running_shas = set()
              d = api('GET', f'/repos/{REPO}/actions/runs', {'per_page': '50'})
              for r in d.get('workflow_runs', []):
                  if r.get('status') in ('in_progress', 'queued', 'waiting', 'requested'):
                      running_shas.add(r['head_sha'][:8])

              keep_shas = set(deployed_shas) | running_shas

              # 4. 분류
              test_prefixes = ('build-check-test-report', 'deploy-gate-test-report',
                               'build-test-report', 'mysql-test-report')
              keep, delete, errors = [], [], []

              for a in artifacts:
                  name = a['name']
                  aid = a['id']
                  sha_part = None
                  if name.startswith('app-jar-'):
                      sha_part = name[len('app-jar-'):][:8]
                  elif name.startswith('wiki-backend-'):
                      sha_part = name[len('wiki-backend-'):][:8]

                  if sha_part and sha_part in keep_shas:
                      keep.append(a)
                      continue
                  if name.startswith(('app-jar-', 'wiki-backend-')) or name.startswith(test_prefixes):
                      created = datetime.fromisoformat(a['created_at'].replace('Z', '+00:00'))
                      if created < cutoff:
                          delete.append(a)
                      else:
                          keep.append(a)
                      continue
                  keep.append(a)

              # 5. 삭제
              deleted_count, deleted_bytes = 0, 0
              if not DRY_RUN:
                  for a in delete:
                      try:
                          api('DELETE', f"/repos/{REPO}/actions/artifacts/{a['id']}")
                          deleted_count += 1
                          deleted_bytes += a.get('size_in_bytes', 0)
                      except Exception as e:
                          errors.append(f"{a['name']}: {e}")
              else:
                  deleted_bytes = sum(a.get('size_in_bytes', 0) for a in delete)

              size_after = size_before - (0 if DRY_RUN else deleted_bytes)

              def mb(b):
                  return f"{b / 1024 / 1024:.1f} MB"

              lines = [
                  "## Artifact Storage Cleanup",
                  "",
                  f"- 모드: {'시뮬레이션 (삭제 없음)' if DRY_RUN else '실제 삭제'}",
                  f"- 실행 시각: {now.strftime('%Y-%m-%d %H:%M UTC')}",
                  f"- 보존 배포 SHA: {', '.join(deployed_shas) if deployed_shas else '(조회 실패)'}",
                  f"- 실행 중 워크플로우 SHA: {', '.join(sorted(running_shas)) if running_shas else '없음'}",
                  "",
                  "| 항목 | 건수 | 용량 |",
                  "|---|---|---|",
                  f"| 정리 전 전체 | {len(artifacts)} | {mb(size_before)} |",
                  f"| 삭제 대상 | {len(delete)} | {mb(sum(a.get('size_in_bytes', 0) for a in delete))} |",
                  f"| 보존 | {len(keep)} | {mb(sum(a.get('size_in_bytes', 0) for a in keep))} |",
              ]
              if DRY_RUN:
                  lines.append("| 실제 삭제 | 0 (시뮬레이션) | - |")
              else:
                  lines.append(f"| 실제 삭제 | {deleted_count} | {mb(deleted_bytes)} |")
              lines.append(f"| 정리 후 전체 | {len(artifacts) - (0 if DRY_RUN else deleted_count)} | {mb(size_after)} |")
              if errors:
                  lines += ["", "### 오류", ""]
                  lines += [f"- {e}" for e in errors[:20]]
                  if len(errors) > 20:
                      lines.append(f"- ... 외 {len(errors) - 20}건")
              if DRY_RUN:
                  lines += ["",
                            "> 시뮬레이션 모드입니다. 보존/삭제 대상을 검증한 뒤",
                            "> `DRY_RUN_DEFAULT`를 `'false'`로 변경하는 PR을 제출하세요."]
              summary(lines)
              print(f"mode={'dry-run' if DRY_RUN else 'delete'} "
                    f"total={len(artifacts)} delete={len(delete)} keep={len(keep)} errors={len(errors)}")
              if errors:
                  sys.exit(1)
          except Exception as e:
              fatal = f"{type(e).__name__}: {e}"
              summary(["## Artifact Storage Cleanup", "", f"**실패**: {fatal}"])
              print(f"FATAL: {fatal}", file=sys.stderr)
              sys.exit(1)
          PYEOF
