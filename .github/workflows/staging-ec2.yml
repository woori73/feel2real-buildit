name: Publishing Staging (manual)

# [코디 시험 서버 전용 — claude/codi-jar-8083 브랜치판]
# main의 staging-ec2.yml을 디스패치 가능 통로로 재사용한다. mode 값은 main 스키마(investigate/setup)와 동일하게 두고,
# 이 브랜치판에서 investigate=코디 precheck(읽기전용), setup=코디 deploy(설치·기동·내부검증)로 동작한다.
# 운영(8080, f2r-app) 무접촉. /etc/f2r/env·staging.env 미연결. codi-staging.service는 /etc/f2r-codi-staging/runtime.env만 읽는다.
# 외부 ALB/DNS/SG는 내부 검증 통과 후 별도. run_id/jar_sha는 main에 없는 입력이라 env 상수로 고정.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'investigate=코디 precheck(읽기전용) / setup=코디 deploy(설치·기동·내부검증)'
        required: true
        default: 'investigate'
        type: choice
        options:
          - investigate
          - setup

permissions:
  id-token: write
  contents: read
  actions: read

env:
  AWS_REGION: ap-northeast-2
  INSTANCE_ID: i-0414de33d2803c723
  S3_BUCKET: f2r-deploy-425805163960
  PORT: '8083'
  CODI_RUN_ID: '46119506710'
  CODI_JAR_SHA: 'e37d62dedea3a4a76412c472a3340d57bbc3a898'

jobs:
  codi-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::425805163960:role/github-actions-f2r-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Codi precheck (read-only)
        if: inputs.mode == 'investigate'
        shell: bash
        run: |
          set -euo pipefail
          echo '===== 8083 EXTERNAL EXPOSURE CHECK (read-only AWS describe) ====='
          echo '--- instance: public IP(없어야 안전) + SGs ---'
          aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query 'Reservations[].Instances[].{PublicIp:PublicIpAddress,PrivateIp:PrivateIpAddress,Subnet:SubnetId,SGs:SecurityGroups[].GroupId}' --output json || echo '(describe-instances denied — role perms?)'
          SGS=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query 'Reservations[].Instances[].SecurityGroups[].GroupId' --output text 2>/dev/null || true)
          echo '--- instance SG ingress covering 8083 (출발지는 ALB SG여야, 0.0.0.0/0이면 위험) ---'
          for sg in $SGS; do echo "SG $sg:"; aws ec2 describe-security-groups --group-ids "$sg" --query "SecurityGroups[].IpPermissions[?(FromPort==null || FromPort<=\`8083\`) && (ToPort==null || ToPort>=\`8083\`)].{From:FromPort,To:ToPort,Cidrs:IpRanges[].CidrIp,SrcSG:UserIdGroupPairs[].GroupId}" --output json || echo '(denied?)'; done
          echo '--- ALB: scheme + listeners(443/80만 있어야, 8083 리스너 없어야) ---'
          aws elbv2 describe-load-balancers --query 'LoadBalancers[].{Name:LoadBalancerName,Scheme:Scheme,DNS:DNSName,SGs:SecurityGroups,ARN:LoadBalancerArn}' --output json || echo '(elbv2 denied?)'
          for arn in $(aws elbv2 describe-load-balancers --query 'LoadBalancers[].LoadBalancerArn' --output text 2>/dev/null || true); do echo "Listeners $arn:"; aws elbv2 describe-listeners --load-balancer-arn "$arn" --query 'Listeners[].{Port:Port,Proto:Protocol}' --output json || true; done
          echo '--- 8083 target groups(ALB→인스턴스 내부 경로 확인용) ---'
          aws elbv2 describe-target-groups --query 'TargetGroups[?Port==`8083`].{Name:TargetGroupName,Port:Port,Proto:Protocol,ARN:TargetGroupArn}' --output json || echo '(denied?)'
          echo '--- ALB 443 리스너 규칙(호스트규칙 codi-staging.* → 8083 TG 확인) ---'
          for arn in $(aws elbv2 describe-load-balancers --query 'LoadBalancers[].LoadBalancerArn' --output text 2>/dev/null || true); do for larn in $(aws elbv2 describe-listeners --load-balancer-arn "$arn" --query 'Listeners[?Port==`443`].ListenerArn' --output text 2>/dev/null || true); do echo "Rules(443) $larn:"; aws elbv2 describe-rules --listener-arn "$larn" --query 'Rules[].{Host:Conditions[?Field==`host-header`].Values,Path:Conditions[?Field==`path-pattern`].Values,Act:Actions[].Type}' --output json || true; done; done
          echo '--- 8083 TG 타깃 헬스 ---'
          for tg in $(aws elbv2 describe-target-groups --query 'TargetGroups[?Port==`8083`].TargetGroupArn' --output text 2>/dev/null || true); do aws elbv2 describe-target-health --target-group-arn "$tg" --query 'TargetHealthDescriptions[].{Target:Target.Id,Port:Target.Port,State:TargetHealth.State}' --output json || true; done
          echo '===== END EXTERNAL EXPOSURE CHECK ====='
          python3 - > /tmp/codi-precheck.json <<'PY'
          import json
          cmds = [
            "echo '=== port 8083 (listener?) ==='",
            "ss -ltn 'sport = :8083' || true",
            "echo '=== runtime.env (meta only, no secrets) ==='",
            "if [ -f /etc/f2r-codi-staging/runtime.env ]; then stat -c '%a %U:%G %n' /etc/f2r-codi-staging/runtime.env; grep -oE '^(CODI_DB_HOST|CODI_DB_PORT|CODI_JWT_SECRET|CODI_DB_PASSWORD)=' /etc/f2r-codi-staging/runtime.env | sed 's/=.*/ = set/'; else echo '(runtime.env MISSING — DB 담당 선행 필요)'; fi",
            "echo '=== existing codi-staging unit? ==='",
            "systemctl cat codi-staging.service 2>/dev/null | head -50 || echo '(no unit yet)'",
            "echo '=== prod untouched (8080 / f2r-app) ==='",
            "ss -ltn 'sport = :8080' | tail -1 || true",
            "systemctl is-active f2r-app.service 2>/dev/null || true",
            "echo '=== java ==='",
            "java -version 2>&1 | head -1 || echo '(java not found)'",
            "echo '=== codi-staging status (why 8083 not up) ==='",
            "systemctl status codi-staging.service --no-pager 2>&1 | head -15 || true",
            "echo '=== codi-staging journal (last 140) ==='",
            "journalctl -u codi-staging.service -n 140 --no-pager 2>&1 | tail -120 || true",
            "echo '=== DONE ==='",
          ]
          print(json.dumps({"commands": cmds}))
          PY
          CID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --parameters file:///tmp/codi-precheck.json --query 'Command.CommandId' --output text)
          echo "SSM CommandId: $CID"
          for i in $(seq 1 20); do
            sleep 8
            S=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --query 'Status' --output text 2>&1)
            echo "status=$S ($i/20)"
            case "$S" in Success|Failed|Cancelled|TimedOut) break;; esac
          done
          echo '===== STDOUT ====='
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text
          echo '===== STDERR ====='
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --query 'StandardErrorContent' --output text || true

      - name: Download app-jar + stage ops to S3
        if: inputs.mode == 'setup'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$CODI_RUN_ID" -n "app-jar-$CODI_JAR_SHA" -D /tmp/jar --repo ${{ github.repository }}
          test -s /tmp/jar/app.jar || { echo "::error::app.jar not found"; exit 1; }
          echo "jar sha256: $(sha256sum /tmp/jar/app.jar | cut -d' ' -f1)"
          aws s3 cp --no-progress /tmp/jar/app.jar "s3://$S3_BUCKET/codi-staging/app.jar"
          aws s3 cp --no-progress ops/codi-staging/start-codi.py "s3://$S3_BUCKET/codi-staging/start-codi.py"
          aws s3 cp --no-progress ops/codi-staging/codi-staging.service "s3://$S3_BUCKET/codi-staging/codi-staging.service"

      - name: Codi deploy + internal verify (SSM)
        if: inputs.mode == 'setup'
        shell: bash
        run: |
          set -euo pipefail
          python3 - > /tmp/codi-deploy.json <<'PY'
          import json
          B = "s3://f2r-deploy-425805163960/codi-staging"
          cmds = [
            "set -e",
            "echo '=== S1: port 8083 free? ==='",
            "if ss -ltn 'sport = :8083' | grep -q ':8083'; then if systemctl is-active --quiet codi-staging.service; then echo '8083 owned by codi-staging — redeploy(restart로 교체)'; else echo 'PORT 8083 BUSY by non-codi unit — abort'; exit 3; fi; else echo 'port 8083 free'; fi",
            "echo '=== S2: runtime.env present? (DB 담당 선행) ==='",
            "test -f /etc/f2r-codi-staging/runtime.env || { echo 'runtime.env MISSING — abort(기동 안 함)'; exit 4; }",
            "chmod 0600 /etc/f2r-codi-staging/runtime.env || true",
            "echo '=== S2b: stop running codi (clean jar swap) ==='",
            "systemctl stop codi-staging.service 2>/dev/null || true",
            "echo '=== S3: install jar + ops files (from S3) ==='",
            "install -d -o root -g root -m 0755 /opt/f2r-codi-staging",
            "aws s3 cp --no-progress " + B + "/app.jar /opt/f2r-codi-staging/app.jar",
            "aws s3 cp --no-progress " + B + "/start-codi.py /opt/f2r-codi-staging/start-codi.py; chmod 0644 /opt/f2r-codi-staging/start-codi.py",
            "aws s3 cp --no-progress " + B + "/codi-staging.service /etc/systemd/system/codi-staging.service; chmod 0644 /etc/systemd/system/codi-staging.service",
            "echo '=== S4: start service ==='",
            "systemctl daemon-reload",
            "systemctl enable codi-staging.service",
            "systemctl restart codi-staging.service",
            "sleep 30",
            "systemctl is-active codi-staging.service || { journalctl -u codi-staging.service -n 80 --no-pager; exit 5; }",
            "echo '=== S5: internal health ==='",
            "for i in $(seq 1 18); do if curl -fsS --max-time 10 http://127.0.0.1:8083/actuator/health >/dev/null 2>&1; then echo \"health OK ($i)\"; break; fi; echo \"wait $i/18\"; sleep 10; done",
            "curl -fsS --max-time 10 http://127.0.0.1:8083/actuator/health; echo",
            "echo '=== S6: /codi entry (internal) ==='",
            "curl -s -o /dev/null -w '/codi http=%{http_code}\\n' --max-time 10 http://127.0.0.1:8083/codi",
            "curl -s --max-time 10 http://127.0.0.1:8083/codi | grep -o '<title>[^<]*</title>' | head -1 || true",
            "echo '=== S7: DB isolation (codi_staging / feel2real_codi_staging) ==='",
            "set +e; . /etc/f2r-codi-staging/runtime.env; if command -v mysql >/dev/null 2>&1; then mysql -h\"$CODI_DB_HOST\" -P\"${CODI_DB_PORT:-3306}\" -ucodi_staging -p\"$CODI_DB_PASSWORD\" feel2real_codi_staging -N -e 'SELECT DATABASE(); SELECT CURRENT_USER();' 2>&1 | head; mysql -h\"$CODI_DB_HOST\" -P\"${CODI_DB_PORT:-3306}\" -ucodi_staging -p\"$CODI_DB_PASSWORD\" -N -e 'SHOW GRANTS FOR CURRENT_USER();' 2>&1 | head; else echo '(mysql client not on host)'; fi; set -e",
            "echo '=== DONE (internal only; 외부 ALB/DNS는 별도) ==='",
          ]
          print(json.dumps({"commands": cmds}))
          PY
          CID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --parameters file:///tmp/codi-deploy.json --query 'Command.CommandId' --output text)
          echo "SSM CommandId: $CID"
          for i in $(seq 1 40); do
            sleep 10
            S=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --query 'Status' --output text 2>&1)
            echo "status=$S ($i/40)"
            case "$S" in Success|Failed|Cancelled|TimedOut) break;; esac
          done
          echo '===== STDOUT ====='
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text
          echo '===== STDERR ====='
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --query 'StandardErrorContent' --output text || true
          FINAL=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --query 'Status' --output text)
          echo "final SSM status: $FINAL"
          test "$FINAL" = "Success"
