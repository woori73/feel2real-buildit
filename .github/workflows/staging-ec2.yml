name: Publishing Staging (manual)

# DesignCraft 출판 스테이징 환경 구축·관리 전용 (수동 실행만).
# - 운영(f2r-app.service, /home/ec2-user/app.jar, 운영 DB)을 절대 건드리지 않는다.
# - 스테이징 전용: buildit-staging.service(8081), /opt/staging, feel2real_staging DB.
# - 모드: investigate(읽기 전용) / setup(구축) / teardown(철거).
# - 이 워크플로우는 P5 스테이징 검증용으로 생성됨. 검증 완료 후 제거 예정.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '동작 모드'
        required: true
        default: 'investigate'
        type: choice
        options:
          - investigate
          - setup
          - teardown
          - test-api

permissions:
  id-token: write
  contents: read
  actions: read

env:
  AWS_REGION: ap-northeast-2
  INSTANCE_ID: i-09d7cabb5a42d1135
  S3_BUCKET: feel2real-buildit-deploy
  CI_RUN_ID: 38460493933
  DEPLOY_SHA: 7cbcb22f36ca14309823ea3283a21f33ad0c30fb

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Investigate staging prerequisites (read-only)
        if: inputs.mode == 'investigate'
        shell: bash
        run: |
          set -euo pipefail
          python3 << 'PYEOF' > /tmp/ssm_investigate.json
          import json
          commands = [
              "for p in staging/actuator/health staging/index.html staging/css/style.css staging/js/app.js staging/js/publishing_api.js staging/api/publishing/templates; do code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:8081/$p); echo \"$p:$code\"; done",
              "grep -q STAGING_ACCESS_TOKEN /etc/f2r/staging.env && echo 'cookie:OK' || echo 'cookie:MISSING'",
              "grep -q 'SERVER_SERVLET_CONTEXT_PATH=/staging' /etc/f2r/staging.env && echo 'ctxpath:OK' || echo 'ctxpath:MISSING'",
          ]
          print(json.dumps({"commands": commands}))
          PYEOF
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm_test.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $CMD_ID"
          for i in $(seq 1 12); do
            sleep 15
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text 2>&1)
            echo "status=$STATUS (attempt $i/12)"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text | tee /tmp/staging-test-output.txt

      - name: Upload API test output
        if: inputs.mode == 'test-api'
        uses: actions/upload-artifact@v4
        with:
          name: staging-test-output
          path: /tmp/staging-test-output.txt
