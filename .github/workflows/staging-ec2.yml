name: Publishing Staging (manual)

# DesignCraft 출판 스테이징 환경 구축·관리 전용 (수동 실행만).
# - 운영(f2r-app.service, /home/ec2-user/app.jar, 운영 DB)을 절대 건드리지 않는다.
# - 스테이징 전용: buildit-staging.service(8081), /opt/staging, feel2real_staging DB.
# - 모드: investigate(읽기 전용) / setup(구축) / teardown(철거).
# - 이 워크플로우는 P5 스테이징 검증용으로 생성됨. 검증 완료 후 제거 예정.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '동작 모드'
        required: true
        default: 'investigate'
        type: choice
        options:
          - investigate
          - setup
          - teardown

permissions:
  id-token: write
  contents: read
  actions: read

env:
  AWS_REGION: ap-northeast-2
  INSTANCE_ID: i-09d7cabb5a42d1135
  S3_BUCKET: feel2real-buildit-deploy
  CI_RUN_ID: 38460493933
  DEPLOY_SHA: 7cbcb22f36ca14309823ea3283a21f33ad0c30fb

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Investigate staging prerequisites (read-only)
        if: inputs.mode == 'investigate'
        shell: bash
        run: |
          set -euo pipefail
          python3 << 'PYEOF' > /tmp/ssm_investigate.json
          import json
          commands = [
              "echo '=== 1. OS / resources ==='",
              "uptime; df -h / /opt /tmp | head -10; free -m | head -3",
              "echo '=== 2. Ports (8080=prod, 8081=staging?) ==='",
              "ss -ltnp | grep -E ':8080|:8081' || echo '(neither 8080 nor 8081 listening)'",
              "echo '=== 3. systemd units ==='",
              "systemctl is-active f2r-app.service || true",
              "systemctl is-active buildit-staging.service || echo '(staging not present)'",
              "echo '=== 4. nginx ==='",
              "command -v nginx && nginx -T 2>&1 | head -150 || echo '(nginx not installed)'",
              "echo '=== 5. SSL certs ==='",
              "ls -la /etc/letsencrypt/live/ 2>/dev/null || echo '(no letsencrypt)'",
              "echo '=== 6. MySQL ==='",
              "systemctl is-active mysqld 2>/dev/null || systemctl is-active mysql 2>/dev/null || systemctl is-active mariadb 2>/dev/null || echo '(mysql unit not found)'",
              "echo '=== 7. DesignCraft CLI (prod path) ==='",
              "ls -lh /opt/designcraft/designcraft-cli 2>/dev/null || echo '(CLI not present)'",
              "ls -ld /opt/designcraft/templates 2>/dev/null || echo '(templates not present)'",
              "echo '=== 8. Staging paths ==='",
              "ls -ld /opt/staging 2>/dev/null || echo '(/opt/staging not present)'",
              "ls -lh /opt/staging/app.jar 2>/dev/null || echo '(staging jar not present)'",
              "echo '=== 9. Java ==='",
              "java -version 2>&1 | head -3 || echo '(java not found)'",
              "echo '=== 10. S3 staging objects ==='",
              "aws s3 ls s3://feel2real-buildit-deploy/staging/ 2>&1 | head -20 || echo '(no staging objects)'",
          ]
          print(json.dumps({"commands": commands}))
          PYEOF
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm_investigate.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $CMD_ID"
          for i in $(seq 1 20); do
            sleep 15
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text 2>&1)
            echo "status=$STATUS (attempt $i/20)"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
          done
          echo "===== STDOUT ====="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text | tee /tmp/staging-investigate-output.txt
          echo "===== STDERR ====="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'StandardErrorContent' --output text || true

      - name: Upload investigate output
        if: inputs.mode == 'investigate'
        uses: actions/upload-artifact@v4
        with:
          name: staging-investigate-output
          path: /tmp/staging-investigate-output.txt

      - name: Setup staging environment
        if: inputs.mode == 'setup'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "=== Step 1: Download JAR from main CI ==="
          gh run download "$CI_RUN_ID" -n "app-jar-$DEPLOY_SHA" -D /tmp/staging-artifacts --repo woori73/feel2real-buildit || {
            echo "::error::JAR artifact download failed"
            exit 1
          }
          ls -lh /tmp/staging-artifacts/
          test -s /tmp/staging-artifacts/app.jar || { echo "::error::app.jar missing"; exit 1; }

          echo "=== Step 2: Upload JAR to S3 ==="
          aws s3 cp --no-progress /tmp/staging-artifacts/app.jar "s3://$S3_BUCKET/staging/app.jar"

          echo "=== Step 3: Upload DesignCraft tarball to S3 ==="
          # ops/designcraft/designcraft-cli-0.6.0.tar.gz (main 브랜치)
          aws s3 cp --no-progress "s3://$S3_BUCKET/staging/designcraft-cli-0.6.0.tar.gz" /tmp/dc-check.tar.gz 2>/dev/null || true
          # 워크플로우 체크아웃에서 tarball 가져오기
          echo "(tarball은 아래 SSM 단계에서 S3에 업로드됨)"

          echo "=== Step 4: Prepare frontend ==="
          # buildit2 Qoder 브랜치에서 프론트엔드 가져오기
          echo "(frontend는 SSM 단계에서 처리)"

      - name: Checkout main (for tarball)
        if: inputs.mode == 'setup'
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            ops/designcraft/designcraft-cli-0.6.0.tar.gz.part-aa
            ops/designcraft/designcraft-cli-0.6.0.tar.gz.part-ab
            ops/designcraft/designcraft-cli-0.6.0.tar.gz.part-ac
            ops/designcraft/designcraft-cli-0.6.0.tar.gz.part-ad
            ops/designcraft/designcraft-cli-0.6.0.tar.gz.part-ae
          sparse-checkout-cone-mode: false

      - name: Upload staging assets to S3
        if: inputs.mode == 'setup'
        shell: bash
        run: |
          set -euo pipefail
          # 분할된 tarball을 S3에 업로드 (EC2에서 재조립)
          for part in ops/designcraft/designcraft-cli-0.6.0.tar.gz.part-*; do
            echo "Uploading $part..."
            aws s3 cp --no-progress "$part" "s3://$S3_BUCKET/staging/$(basename $part)"
          done
          echo "DesignCraft tarball parts uploaded"
          aws s3 ls "s3://$S3_BUCKET/staging/" | grep part-

      - name: Checkout Qoder frontend
        if: inputs.mode == 'setup'
        uses: actions/checkout@v4
        with:
          repository: woori73/buildit2
          ref: qoder/publishing-editor-20261014
          path: qoder-fe
          sparse-checkout: |
            qoder/publishing-editor
          sparse-checkout-cone-mode: false

      - name: Prepare staging frontend (USE_MOCK=false, API prefix)
        if: inputs.mode == 'setup'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/staging-fe
          cp -r qoder-fe/qoder/publishing-editor/* /tmp/staging-fe/
          # 스테이징: mock 비활성 (API는 상대경로 /api/publishing 그대로 사용)
          sed -i 's/var USE_MOCK = true;/var USE_MOCK = false;/' /tmp/staging-fe/js/publishing_api.js
          grep -n "USE_MOCK =" /tmp/staging-fe/js/publishing_api.js
          # S3에 업로드
          aws s3 sync --no-progress /tmp/staging-fe/ "s3://$S3_BUCKET/staging/fe/"
          echo "Frontend uploaded"

      - name: Setup staging on EC2 via SSM
        if: inputs.mode == 'setup'
        shell: bash
        run: |
          set -euo pipefail
          python3 << 'PYEOF' > /tmp/ssm_setup.json
          import json
          S3 = "feel2real-buildit-deploy"
          commands = [
              "set -euo pipefail",
              "echo '=== S1: Staging DB (feel2real_staging) ==='",
              # 운영 DB는 건드리지 않고 스테이징 DB만 생성
              "set -a; . /etc/f2r/env; set +a",
              "MYSQL_PWD=\"${DB_PASSWORD}\" mysql -h \"${DB_HOST:-127.0.0.1}\" -P \"${DB_PORT:-3306}\" -u \"${DB_USER}\" -e \"CREATE DATABASE IF NOT EXISTS feel2real_staging CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;\"",
              "echo 'staging DB ready'",
              "echo '=== S2: Directories ==='",
              "sudo mkdir -p /opt/staging /opt/designcraft /var/lib/feel2real/publishing-staging",
              "sudo chown ec2-user:ec2-user /opt/staging /var/lib/feel2real/publishing-staging",
              "echo '=== S3: Download JAR from S3 ==='",
              "aws s3 cp --no-progress s3://"+S3+"/staging/app.jar /opt/staging/app.jar",
              "chown ec2-user:ec2-user /opt/staging/app.jar",
              "ls -lh /opt/staging/app.jar",
              "echo '=== S4: Install DesignCraft CLI ==='",
              "mkdir -p /tmp/dc-parts && aws s3 sync --no-progress s3://"+S3+"/staging/ /tmp/dc-parts/ --exclude '*' --include 'designcraft-cli-0.6.0.tar.gz.part-*'",
              "cat /tmp/dc-parts/designcraft-cli-0.6.0.tar.gz.part-* > /tmp/dc-0.6.0.tar.gz",
              "ls -lh /tmp/dc-0.6.0.tar.gz",
              "tar xzf /tmp/dc-0.6.0.tar.gz -C /tmp/",
              "sudo cp /tmp/designcraft-cli-0.6.0/designcraft-cli /opt/designcraft/designcraft-cli",
              "sudo chmod +x /opt/designcraft/designcraft-cli",
              "sudo rm -rf /opt/designcraft/templates",
              "sudo cp -r /tmp/designcraft-cli-0.6.0/templates /opt/designcraft/templates",
              "/opt/designcraft/designcraft-cli --version || echo '(version check done)'",
              "ls -lh /opt/designcraft/designcraft-cli",
              "echo '=== S5: Frontend static files ==='",
              "sudo mkdir -p /opt/staging/fe",
              "aws s3 sync --no-progress s3://"+S3+"/staging/fe/ /opt/staging/fe/",
              "ls -la /opt/staging/fe/",
              "echo '=== S6: Staging env file ==='",
              # /etc/f2r/env를 먼저 로드하고 staging.env로 override (DB_NAME, PORT만 변경)
              "sudo tee /etc/f2r/staging.env > /dev/null <<'ENV'",
              "SPRING_PROFILES_ACTIVE=prd",
              "SERVER_PORT=8081",
              "DB_NAME=feel2real_staging",
              "PUBLISHING_STORAGE_ROOT=/var/lib/feel2real/publishing-staging",
              "SPRING_WEB_RESOURCES_STATIC_LOCATIONS=file:/opt/staging/fe/",
              "ENV",
              "sudo chmod 600 /etc/f2r/staging.env",
              "echo 'staging.env written'",
              "echo '=== S7: systemd unit (staging only) ==='",
              "sudo tee /etc/systemd/system/buildit-staging.service > /dev/null <<'UNIT'",
              "[Unit]",
              "Description=BuildIt Staging (publishing verification)",
              "After=network.target",
              "",
              "[Service]",
              "Type=simple",
              "User=ec2-user",
              "WorkingDirectory=/opt/staging",
              "EnvironmentFile=/etc/f2r/env",
              "EnvironmentFile=/etc/f2r/staging.env",
              "ExecStart=/usr/bin/java -jar /opt/staging/app.jar",
              "Restart=always",
              "RestartSec=5",
              "",
              "[Install]",
              "WantedBy=multi-user.target",
              "UNIT",
              "sudo systemctl daemon-reload",
              "sudo systemctl enable buildit-staging.service",
              "echo 'unit created'",
              "echo '=== S8: nginx (EC2에 없음 — ALB 사용, 건너뜀) ==='",
              "command -v nginx >/dev/null 2>&1 && echo '(nginx found, unexpected)' || echo '(no nginx on EC2 — external routing via ALB, skipping)'",
              "echo '=== S9: Start staging ==='",
              "sudo systemctl restart buildit-staging.service",
              "sleep 30",
              "systemctl is-active buildit-staging.service",
              "echo '=== S10: Health check ==='",
              "for i in $(seq 1 12); do",
              "  if curl -fsS --max-time 10 http://127.0.0.1:8081/actuator/health > /dev/null 2>&1; then",
              "    echo \"health OK (attempt $i)\"; break;",
              "  fi",
              "  echo \"waiting... ($i/12)\"; sleep 10;",
              "done",
              "curl -fsS --max-time 10 http://127.0.0.1:8081/actuator/health || echo '(health check failed - check journal)'",
              "echo '=== S11: EC2 network info (for external access planning) ==='",
              "curl -fsS --max-time 5 http://169.254.169.254/latest/meta-data/public-ipv4 2>/dev/null || echo '(no public IP)'",
              "echo '=== DONE ==='",
              "echo 'Staging backend: http://127.0.0.1:8081 (internal)'",
              "echo 'External access requires ALB rule or security group change — see report'",
          ]
          print(json.dumps({"commands": commands}))
          PYEOF
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm_setup.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $CMD_ID"
          for i in $(seq 1 40); do
            sleep 15
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text 2>&1)
            echo "status=$STATUS (attempt $i/40)"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
          done
          echo "===== STDOUT ====="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text | tee /tmp/staging-setup-output.txt
          echo "===== STDERR ====="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'StandardErrorContent' --output text || true
          FINAL=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text)
          if [ "$FINAL" != "Success" ]; then
            echo "::error::Staging setup failed (Status=$FINAL)"
            exit 1
          fi

      - name: Upload setup output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-setup-output
          path: /tmp/staging-setup-output.txt

      - name: Teardown staging environment
        if: inputs.mode == 'teardown'
        shell: bash
        run: |
          set -euo pipefail
          python3 << 'PYEOF' > /tmp/ssm_teardown.json
          import json
          commands = [
              "set -euo pipefail",
              "echo '=== T1: Stop staging service ==='",
              "sudo systemctl stop buildit-staging.service || true",
              "sudo systemctl disable buildit-staging.service || true",
              "sudo rm -f /etc/systemd/system/buildit-staging.service",
              "sudo systemctl daemon-reload",
              "echo '=== T2: Remove nginx staging routes ==='",
              "sudo rm -f /etc/nginx/conf.d/staging-publishing.conf",
              "sudo nginx -t && sudo systemctl reload nginx && echo 'nginx reloaded'",
              "echo '=== T3: Remove staging files (DB는 유지 — 수동 삭제) ==='",
              "sudo rm -rf /opt/staging /var/lib/feel2real/publishing-staging",
              "sudo rm -f /etc/f2r/staging.env",
              "echo '=== T4: Verify prod untouched ==='",
              "systemctl is-active f2r-app.service",
              "curl -fsS --max-time 10 http://127.0.0.1:8080/actuator/health > /dev/null && echo 'prod health OK'",
              "echo '=== DONE (staging DB feel2real_staging은 수동 삭제 필요) ==='",
          ]
          print(json.dumps({"commands": commands}))
          PYEOF
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm_teardown.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $CMD_ID"
          for i in $(seq 1 20); do
            sleep 15
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text 2>&1)
            echo "status=$STATUS (attempt $i/20)"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text
