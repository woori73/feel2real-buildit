name: Tmp Pcap Analyze2 (read-only, manual)
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2
      - name: Analyze pcap via SSM
        run: |
          set -euo pipefail
          SSM_BODY=$(cat <<'SSMEOF'
          echo "===== EBOOK response packets ====="
          tcpdump -r /tmp/dl.pcap -n -A 2>/dev/null | grep -a -m 10 -E 'HTTP/1.1 (200|401|500)|Content-Disposition|Transfer-Encoding|Content-Length' | head -20
          echo ""
          echo "===== connections to port 55026 and 10018 (EBOOK clients) ====="
          tcpdump -r /tmp/dl.pcap -n 2>/dev/null | grep -E '55026|10018' | grep -a -m 30 -E 'HTTP: HTTP|Flags \[F|Flags \[R' | head -30
          echo ""
          echo "===== full stream for 172.31.28.210.55026 ====="
          tcpdump -r /tmp/dl.pcap -n 2>/dev/null | grep -a '172.31.28.210.55026' | head -25
          SSMEOF
          )
          SSM_SCRIPT=$(printf 'set -euo pipefail\n%s\n' "$SSM_BODY")
          PARAMS_JSON=$(python3 -c 'import json,sys; print(json.dumps({"commands": sys.stdin.read().splitlines()}))' <<< "$SSM_SCRIPT")
          CMD_ID=$(aws ssm send-command --instance-ids i-09d7cabb5a42d1135 --document-name AWS-RunShellScript --parameters "$PARAMS_JSON" --query 'Command.CommandId' --output text)
          for i in $(seq 1 15); do sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'Status' --output text)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'StandardOutputContent' --output text
