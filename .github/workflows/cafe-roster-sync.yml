name: Cafe roster sync
on:
  pull_request:
    paths:
      - 'scripts/cafe-runtime/**'
      - '.github/workflows/cafe-roster-sync.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts/cafe-runtime -p 'test_*.py'
