name: DesignCraft restart-safety read-only probe (approved)
on:
  push:
    branches: ['ci/dc-restart-readonly']
    paths: ['ops/diagnostics/designcraft_restart_safety_readonly.py', '.github/workflows/dc-restart-readonly.yml']
permissions:
  contents: read
  id-token: write
jobs:
  readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Assume existing role (no IAM modifications)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2
          role-duration-seconds: 900
          retry-max-attempts: 1
      - name: Read-only fixed probe
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          script="python3 - <<'DC_RESTART_PY'\n"+Path('ops/diagnostics/designcraft_restart_safety_readonly.py').read_text()+"\nDC_RESTART_PY"
          Path('dc-params.json').write_text(json.dumps({'commands':[script]}))
          PY
          command_id=$(aws ssm send-command --instance-ids i-09d7cabb5a42d1135 --document-name AWS-RunShellScript --parameters file://dc-params.json --query Command.CommandId --output text)
          for i in $(seq 1 40); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id i-09d7cabb5a42d1135 --query Status --output text 2>/dev/null || true)
            case "$status" in Success|Failed|TimedOut|Cancelled) break;; esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id i-09d7cabb5a42d1135 --output json > invocation.json
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('invocation.json').read_text());out={'ssm_status':v['Status'],'stderr_present':bool(v.get('StandardErrorContent'))}
          try:out['probe']=json.loads(v.get('StandardOutputContent',''))
          except ValueError:out['probe_output_not_json']=True
          Path('dc-restart-readonly.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          if v['Status']!='Success':raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dc-restart-readonly
          path: dc-restart-readonly.json
          if-no-files-found: warn
          retention-days: 7
