name: Tmp Download Model
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
          aws-region: ap-northeast-2
      - name: Download model via SSM
        run: |
          set -euo pipefail
          SSM_BODY=$(cat <<'SSMEOF'
          mkdir -p /opt/embeddinggemma-2
          cd /tmp && python3 -c "
          from transformers import AutoTokenizer, AutoModel
          MODEL = 'google/embeddinggemma-2'
          print('Downloading tokenizer...', flush=True)
          tok = AutoTokenizer.from_pretrained(MODEL, trust_remote_code=True)
          tok.save_pretrained('/opt/embeddinggemma-2')
          print('Downloading model...', flush=True)
          model = AutoModel.from_pretrained(MODEL, trust_remote_code=True)
          model.save_pretrained('/opt/embeddinggemma-2')
          print('Done', flush=True)
          "
          ls -lh /opt/embeddinggemma-2/ | head -10
          SSMEOF
          )
          SSM_SCRIPT=$(printf '%s\n' "$SSM_BODY")
          PARAMS_JSON=$(python3 -c 'import json,sys; print(json.dumps({"commands": sys.stdin.read().splitlines()}))' <<< "$SSM_SCRIPT")
          CMD_ID=$(aws ssm send-command --instance-ids i-09d7cabb5a42d1135 --document-name AWS-RunShellScript --parameters "$PARAMS_JSON" --query 'Command.CommandId' --output text)
          echo "CMD: $CMD_ID"
          for i in $(seq 1 30); do sleep 30
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'Status' --output text)
            echo "[$i] $STATUS"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09d7cabb5a42d1135 --query 'StandardOutputContent' --output text | tail -10
