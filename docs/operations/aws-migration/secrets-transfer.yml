name: Secrets transfer (old -> new account, public-key encrypted, manual)
# 비활성 초안(docs 아래). 실행·활성화는 별도 승인 후에만 가능하다. 이 PR에서는 실행하지 않았다.
# 목적: 구 서버의 /etc/f2r/env 중 이전이 필요한 값을 평문으로 로그·아티팩트·채팅에 노출하지 않고 신규 계정 SSM Parameter Store(SecureString)로 옮긴다.
# 흐름: [prepare: 신규 계정] 임시 RSA 키쌍 생성(개인키는 /f2r/transfer/privkey SecureString, 공개키만 출력)
#   -> [export: 구 계정, 기존 배포 역할] 구 서버에서 env를 공개키로 암호화(하이브리드)해 '암호문만' 출력
#   -> [import: 신규 계정] 복호화 -> 값마다 ::add-mask:: -> /f2r/app/<KEY> SecureString 저장 -> 개인키 파라미터 삭제
# 제외 키(이전하지 않음): GitHub Secrets에서 배포 때 다시 주입되는 키(META_VISION_API_KEY, META_JIPJIGI_API_KEY, KIS_APP_KEY, KIS_APP_SECRET, OPENROUTER*),
#   HWPX/ASSIST 스위치(배포가 관리), 구 RDS 접속 주소(신규 RDS 주소로 교체해야 함: SPRING_DATASOURCE_URL 등).
# 승인: prepare·import는 Environment f2r-infra-build(승인). export는 환경 없이 needs 체인으로 승인 이후에만 실행된다
#   (구 배포 역할 신뢰를 main 한정으로 좁혀도 sub가 ref:main 이라 깨지지 않게 하기 위함).
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: f2r-secrets-transfer
  cancel-in-progress: false
env:
  AWS_REGION: ap-northeast-2
  NEW_ROLE_ARN: arn:aws:iam::425805163960:role/f2r-infra-builder
  OLD_ROLE_ARN: arn:aws:iam::067573916809:role/github-actions-f2r-deploy
  OLD_INSTANCE_ID: i-09d7cabb5a42d1135
  EXCLUDE_RE: '^(META_VISION_API_KEY|META_JIPJIGI_API_KEY|KIS_APP_KEY|KIS_APP_SECRET|OPENROUTER[A-Z0-9_]*|HWPX[A-Z0-9_]*|ASSIST[A-Z0-9_]*|SPRING_DATASOURCE_[A-Z_]*|DB_[A-Z_]*)='
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: f2r-infra-build
    outputs:
      pubkey_b64: ${{ steps.keys.outputs.pubkey_b64 }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.NEW_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: f2r-secrets-prepare
      - id: keys
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          W=$(mktemp -d /dev/shm/f2r.XXXXXX); trap 'shred -u "$W"/* 2>/dev/null || true; rm -rf "$W"' EXIT
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$W/priv.pem" 2>/dev/null
          openssl pkey -in "$W/priv.pem" -pubout -out "$W/pub.pem"
          aws ssm put-parameter --name /f2r/transfer/privkey --type SecureString --tier Advanced --overwrite \
            --value "file://$W/priv.pem" >/dev/null
          echo "pubkey_b64=$(base64 -w0 "$W/pub.pem")" >> "$GITHUB_OUTPUT"
          echo "prepared: temporary key pair (private key stored in Parameter Store, public key only in output)"
  export:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cipher_b64: ${{ steps.exp.outputs.cipher_b64 }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OLD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: f2r-secrets-export
      - id: exp
        shell: bash
        env:
          PUB_B64: ${{ needs.prepare.outputs.pubkey_b64 }}
        run: |
          set -euo pipefail
          # 구 서버에서 실행할 스크립트: env에서 제외 키를 빼고, 무작위 AES 키로 암호화한 뒤 그 키를 공개키로 암호화한다.
          # 출력은 base64 암호문 한 덩어리뿐이다(평문·키 이름·값을 출력하지 않는다).
          REMOTE=$(cat <<'R'
          set -euo pipefail
          umask 077
          W=$(mktemp -d /dev/shm/f2r.XXXXXX); trap 'rm -rf "$W"' EXIT
          printf '%s' "__PUB__" | base64 -d > "$W/pub.pem"
          grep -vE '__EXCL__' /etc/f2r/env | grep -E '^[A-Za-z_][A-Za-z0-9_]*=' > "$W/env.txt" || true
          openssl rand -hex 32 > "$W/k"
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass "file:$W/k" -in "$W/env.txt" -out "$W/c.bin"
          openssl pkeyutl -encrypt -pubin -inkey "$W/pub.pem" -pkeyopt rsa_padding_mode:oaep -in "$W/k" -out "$W/k.bin"
          echo "F2RCIPHER:$(base64 -w0 "$W/k.bin"):$(base64 -w0 "$W/c.bin")"
          R
          )
          REMOTE=${REMOTE//__PUB__/$PUB_B64}
          REMOTE=${REMOTE//__EXCL__/$EXCLUDE_RE}
          PARAMS=$(python3 -c 'import json,sys; print(json.dumps({"commands":[sys.stdin.read()]}))' <<<"$REMOTE")
          CID=$(aws ssm send-command --instance-ids "$OLD_INSTANCE_ID" --document-name AWS-RunShellScript \
            --parameters "$PARAMS" --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$CID" --instance-id "$OLD_INSTANCE_ID"
          STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$OLD_INSTANCE_ID" --query Status --output text)
          [ "$STATUS" = Success ] || { echo "export failed: status=$STATUS"; exit 1; }
          OUT=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$OLD_INSTANCE_ID" --query StandardOutputContent --output text)
          LINE=$(grep -m1 '^F2RCIPHER:' <<<"$OUT" || true)
          [ -n "$LINE" ] || { echo "no ciphertext produced"; exit 1; }
          echo "cipher_b64=${LINE#F2RCIPHER:}" >> "$GITHUB_OUTPUT"
          echo "exported: ciphertext only"
  import:
    needs: export
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: f2r-infra-build
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.NEW_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: f2r-secrets-import
      - shell: bash
        env:
          CIPHER: ${{ needs.export.outputs.cipher_b64 }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          W=$(mktemp -d /dev/shm/f2r.XXXXXX)
          cleanup() { shred -u "$W"/* 2>/dev/null || true; rm -rf "$W"; aws ssm delete-parameter --name /f2r/transfer/privkey >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          aws ssm get-parameter --name /f2r/transfer/privkey --with-decryption --query Parameter.Value --output text > "$W/priv.pem"
          K_B64=${CIPHER%%:*}; C_B64=${CIPHER#*:}
          printf '%s' "$K_B64" | base64 -d > "$W/k.bin"; printf '%s' "$C_B64" | base64 -d > "$W/c.bin"
          openssl pkeyutl -decrypt -inkey "$W/priv.pem" -pkeyopt rsa_padding_mode:oaep -in "$W/k.bin" -out "$W/k"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass "file:$W/k" -in "$W/c.bin" -out "$W/env.txt"
          # 값은 로그에 나오기 전에 모두 마스킹한다. 값·키 이름은 출력하지 않고 개수만 출력한다.
          python3 - "$W" <<'PY'
          import re,sys,subprocess,os
          w=sys.argv[1]; n=0
          for line in open(os.path.join(w,'env.txt'),encoding='utf-8',errors='strict'):
              line=line.rstrip('\n')
              m=re.match(r'^([A-Za-z_][A-Za-z0-9_]*)=(.*)$',line)
              if not m: continue
              k,v=m.group(1),m.group(2)
              if len(v)>=2 and v[0]==v[-1] and v[0] in '"\'': v=v[1:-1]
              if not v: continue  # SSM 파라미터는 빈 값을 저장할 수 없다
              print('::add-mask::'+v, flush=True)
              p=os.path.join(w,'v'); open(p,'w',encoding='utf-8').write(v)
              subprocess.run(['aws','ssm','put-parameter','--name','/f2r/app/'+k,'--type','SecureString','--overwrite','--value','file://'+p],
                             check=True,stdout=subprocess.DEVNULL)
              n+=1
          print('imported parameter count:',n)
          PY
          echo "import done; transfer private key parameter deleted on exit"
