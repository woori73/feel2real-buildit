# DRAFT — 승인 전 활성화하지 않는다(.github/workflows 밖에 둠). 배포 직전 RDS 수동 스냅샷 1개 생성.
# 하는 일: 스냅샷 생성 → available 대기 → 상태 출력. 삭제·수정·복원 없음(복원=새 DB 인스턴스=별도 승인).
# 보호: GitHub Environment(f2r-production-snapshot, 소유자 승인) + 확인 문자열 SNAPSHOT-<sha8>.
# 역할: github-actions-f2r-snapshot (trust: main의 이 workflow만, policy: policy-f2r-predeploy-snapshot.json).
# DB 식별자는 Prod read-only status 의 db_instance_identifier 로 확인한 값을 넣는다(현재 f2r-db* 3개 존재).
name: RDS pre-deploy snapshot (manual, approval required)
on:
  workflow_dispatch:
    inputs:
      db_instance_id:
        description: '운영 앱이 실제로 쓰는 RDS 식별자(f2r-db 로 시작)'
        required: true
        type: string
      deploy_sha:
        description: '곧 배포할 main 커밋 SHA(40자리)'
        required: true
        type: string
      confirm:
        description: '확인: SNAPSHOT-<deploy_sha 앞 8자리>'
        required: true
        type: string
permissions:
  id-token: write
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: f2r-production-snapshot
    steps:
      - name: Validate inputs
        shell: bash
        env:
          DB: ${{ inputs.db_instance_id }}
          SHA: ${{ inputs.deploy_sha }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [[ "$DB" =~ ^f2r-db(-[0-9]{12})?$ ]] || { echo "::error::db_instance_id"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::deploy_sha"; exit 1; }
          [ "$CONFIRM" = "SNAPSHOT-${SHA:0:8}" ] || { echo "::error::confirm"; exit 1; }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::425805163960:role/github-actions-f2r-snapshot
          aws-region: ap-northeast-2
          role-session-name: f2r-predeploy-snapshot
      - name: Create snapshot and wait
        shell: bash
        env:
          DB: ${{ inputs.db_instance_id }}
          SHA: ${{ inputs.deploy_sha }}
        run: |
          set -euo pipefail
          SNAP="f2r-predeploy-$(date -u +%Y%m%d%H%M)-${SHA:0:8}"
          aws rds create-db-snapshot --db-instance-identifier "$DB" --db-snapshot-identifier "$SNAP" --query 'DBSnapshot.Status' --output text
          aws rds wait db-snapshot-available --db-snapshot-identifier "$SNAP"
          aws rds describe-db-snapshots --db-snapshot-identifier "$SNAP" --query 'DBSnapshots[].{Status:Status,Created:SnapshotCreateTime,Encrypted:Encrypted}' --output table
          echo "snapshot=$SNAP"
