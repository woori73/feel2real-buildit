<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수업 커뮤니티</title>
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <link rel="stylesheet" href="/css/lesson_community.css?v=20260619-public-inline">
</head>
<body>
  <div class="community-shell" th:attr="data-lesson-id=${lessonId}">
    <header class="community-topbar">
      <a class="brand" href="/home" aria-label="F2R 홈">
        <img src="/img/F2R_logo_pure.svg" alt="F2R">
      </a>
      <div class="topbar-actions">
        <a class="ghost-link" href="javascript:history.back()">← 뒤로가기</a>
        <th:block th:replace="~{fragments/_account_menu :: accountMenu('/stdt_dashboard', '학생 홈')}"></th:block>
      </div>
    </header>

    <main class="community-main">
      <section class="community-hero">
        <p class="eyebrow">Lesson Community</p>
        <h1 id="lessonTitle">수업 커뮤니티</h1>
        <p id="lessonMeta">수업 정보를 불러오는 중...</p>
      </section>

      <section class="community-toolbar">
        <div id="tabs" class="tabs" role="tablist" aria-label="커뮤니티 탭">
          <button class="tab active" data-tab="all" type="button">전체글</button>
          <button class="tab" data-tab="general" type="button">일반글</button>
          <button class="tab" data-tab="qna" type="button">Q&A</button>
          <button class="tab" data-tab="notice" type="button">공지</button>
        </div>
        <button id="openPostForm" class="primary-btn" type="button">새 글 작성</button>
        <button id="openTabManager" class="ghost-btn" type="button" hidden>탭 관리</button>
      </section>

      <div id="customTabModal" class="modal-backdrop" hidden>
        <section class="modal-card tab-manager-modal" role="dialog" aria-modal="true" aria-labelledby="tabManagerTitle">
          <div class="modal-header">
            <div>
              <h2 id="tabManagerTitle">탭 관리</h2>
              <p>커스텀 탭을 추가하거나 이름을 수정할 수 있습니다. 삭제한 탭의 글은 일반글로 이동합니다.</p>
            </div>
            <button id="closeTabManager" class="icon-btn" type="button" aria-label="탭 관리 닫기">×</button>
          </div>
          <form id="customTabForm" class="custom-tab-form">
            <input name="name" maxlength="50" placeholder="새 탭 이름">
            <button class="primary-btn" type="submit">탭 추가</button>
          </form>
          <div id="customTabList" class="custom-tab-list" aria-live="polite"></div>
        </section>
      </div>

      <div id="postFormModal" class="modal-backdrop" hidden>
        <section id="postFormCard" class="modal-card compose-card" role="dialog" aria-modal="true" aria-labelledby="postFormTitle">
          <div class="modal-header">
            <div>
              <h2 id="postFormTitle">새 글 작성</h2>
              <p>작성할 글의 종류를 선택한 뒤 내용을 입력하세요.</p>
            </div>
            <button id="closePostForm" class="icon-btn" type="button" aria-label="글 작성 닫기">×</button>
          </div>
          <form id="postForm">
            <label>글 종류
              <select name="postTab" id="postTab"></select>
            </label>
            <label>제목
              <input name="title" maxlength="150" required placeholder="제목을 입력하세요">
            </label>
            <label>본문
              <textarea name="content" maxlength="5000" required placeholder="최대 5000자까지 입력할 수 있습니다."></textarea>
            </label>
            <label>첨부파일 (최대 10개, 파일당 10MB 이하)
              <span id="fileDropZone" class="file-drop-zone">
                파일을 선택하거나 여기에 드래그해서 첨부하세요.
                <input id="postFiles" name="files" type="file" multiple>
              </span>
              <span id="selectedFileList" class="selected-file-list">선택된 첨부파일이 없습니다.</span>
            </label>
            <div class="form-actions">
              <div class="action-buttons">
                <button class="primary-btn" type="submit">등록</button>
                <button class="ghost-btn" id="cancelPostForm" type="button">취소</button>
              </div>
              <label class="checkbox-row public-inline" hidden>
                <span>공개</span>
                <input type="checkbox" name="qnaPublic" value="true">
              </label>
            </div>
          </form>
        </section>
      </div>

      <section class="community-content">
        <div id="postList" class="post-list">
          <div class="empty-state">게시글을 불러오는 중...</div>
        </div>
        <section id="postDetail" class="post-detail" aria-live="polite" hidden></section>
      </section>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/lesson_community.js?v=20260619-public-inline"></script>
</body>
</html>
