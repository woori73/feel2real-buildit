<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Mock 금융사이트 — 로그인</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 480px; margin: 80px auto; padding: 0 20px; }
  .badge { background: #fef3c7; color: #92400e; padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 24px; }
  button { font-size: 16px; padding: 12px 24px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; }
  button:hover { background: #1d4ed8; }
</style>
</head>
<body>
  <div class="badge">⚠ 이것은 EASY Visible Local Browser Collector 검증용 mock 페이지입니다. 실제 금융사이트가 아닙니다.</div>
  <h2>공동인증서 로그인</h2>
  <p>이 화면은 실제 서비스에서 사용자가 직접 인증서/비밀번호로 로그인하는 화면을 흉내낸 것입니다.
     Collector는 이 버튼을 절대 대신 클릭하지 않습니다 — 사람이 직접 눌러야 합니다.</p>
  <button id="loginBtn">공동인증서로 로그인</button>
  <script>
    document.getElementById('loginBtn').addEventListener('click', () => {
      // 실제 사이트라면 여기서 인증서 선택 + 비밀번호 입력 UI가 뜨고, 그 값은 이 페이지(브라우저)와
      // 금융기관 서버 사이에서만 오간다 — EASY/Collector 어느 쪽도 그 값을 보지 못한다.
      window.location.href = '/dashboard.html?auth=1';
    });
  </script>
</body>
</html>
