<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Mock 금융사이트 — 이용내역 조회</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 20px; }
  .badge { background: #dcfce7; color: #166534; padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 24px; }
  label { display: block; margin-top: 12px; font-size: 13px; color: #555; }
  input { font-size: 15px; padding: 8px; width: 100%; box-sizing: border-box; }
  button { font-size: 16px; padding: 12px 24px; margin-top: 20px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; }
  #results { margin-top: 24px; display: none; }
  #results a { display: inline-block; margin-top: 8px; }
</style>
</head>
<body id="dashboard-marker" data-authenticated="true">
  <div class="badge">✓ 로그인됨 (mock) — 이 화면 도달 자체가 "인증 완료" 신호입니다.</div>
  <h2>카드 이용내역 조회</h2>
  <label for="startDate">조회 시작일</label>
  <input type="date" id="startDate">
  <label for="endDate">조회 종료일</label>
  <input type="date" id="endDate">
  <button id="searchBtn">조회</button>
  <div id="results">
    <p>조회 결과 3건</p>
    <a id="downloadLink" href="/sample-download.csv" download>이용내역 다운로드 (CSV)</a>
  </div>
  <script>
    document.getElementById('searchBtn').addEventListener('click', () => {
      document.getElementById('results').style.display = 'block';
    });
  </script>
</body>
</html>
