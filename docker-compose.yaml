services:
  mysql:
    image: mysql:8.4
    container_name: f2r_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # DDL은 Spring Boot 부팅 시 Flyway(src/main/resources/db/migration)가 자동 적용한다.
      # 이 컨테이너는 빈 DB로 시작 → 첫 bootRun 시 V1__init_schema.sql 부터 순서대로 실행됨.
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  mysql_data: