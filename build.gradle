plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'f2r.tutor_solution'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// NewStart 네이버 간편로그인 재구축(STEP 1) — Spring Security 공식 OAuth2 Client.
	// docs/newstart/oauth/NAVER_LOGIN_REBUILD_DESIGN_2026-09-21.md에서 커스텀 REST 구현(V1/V2, 둘 다
	// 실패)을 기각하고 이 방식을 선정했다.
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect:4.0.1'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	// 감사회원 셀프 인증 예외 운영자 알림 메일(SMTP는 환경변수로만 설정, 미설정이면 발송만 건너뜀).
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'
	implementation 'org.jsoup:jsoup:1.17.2'
	implementation 'org.commonmark:commonmark:0.24.0'
	implementation 'com.anthropic:anthropic-java:2.27.0'

	// ImageIO 추가 포맷 지원 (WebP read, JPEG metadata 보강)
	// 업로드된 webp/png/jpeg를 JPEG으로 재인코딩(악성 메타 무력화) 하기 위해 필요
	implementation 'com.twelvemonkeys.imageio:imageio-webp:3.11.0'
	implementation 'com.twelvemonkeys.imageio:imageio-jpeg:3.11.0'

	// EXIF metadata 읽기 — 카메라 이미지의 orientation을 읽어 픽셀 회전을 적용한 뒤 재인코딩한다.
	// (재인코딩 시 EXIF가 제거되므로 회전 정보를 잃지 않으려면 픽셀에 반영해야 함)
	implementation 'com.drewnoakes:metadata-extractor:2.19.0'

	// PDF → 페이지별 JPEG 렌더링 (악성 PDF 무력화)
	implementation 'org.apache.pdfbox:pdfbox:3.0.5'

	implementation 'org.mapstruct:mapstruct:1.5.5.Final'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

	// Shinhan card statement parsing — legacy Excel 97-2003 (.xls, BIFF8) only, poi-ooxml not needed.
	implementation 'org.apache.poi:poi:5.5.1'
	// Financial collector's bounded, formula-free XLSX template reader.
	implementation 'org.apache.poi:poi-ooxml:5.5.1'

	// DB 마이그레이션 (Flyway).
	// Spring Boot 4부터 autoconfiguration이 모듈별로 분리되어, flyway-core만으로는 autoconfig가
	// 활성화되지 않는다. spring-boot-starter-flyway 명시가 필수.
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-mysql'   // MySQL 8 지원 모듈

	// JWT — HTTP-only Cookie 기반 인증. api/impl/jackson 3종 묶음으로 사용한다.
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly    'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly    'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// AWS SDK v2 — S3 파일 저장소. EC2의 IAM Instance Profile로 자동 인증 (access key 불필요).
	implementation platform('software.amazon.awssdk:bom:2.28.21')
	implementation 'software.amazon.awssdk:s3'

	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// Spring Boot 4.0 모듈 분리 — MockMvc autoconfig는 starter-webmvc-test에 격리됨.
	// 통합 테스트에서 @AutoConfigureMockMvc를 쓰려면 명시적으로 끌어와야 한다.
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// Spring Boot 4.0 모듈 분리 — @DataJpaTest / TestEntityManager도 별도 모듈로 격리됐다
	// (webmvc-test와 동일한 이유). Entity 매핑·JPQL 슬라이스 테스트용.
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.seleniumhq.selenium:selenium-java:4.27.0'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// @DataJpaTest용 임베디드 DB. 운영은 MySQL(Flyway)이며, 로컬에 MySQL이 없어도
	// Entity 매핑·JPQL을 빠르게 검증하기 위한 test 전용 의존성이다(Flyway는 이 슬라이스에서 비활성).
	testRuntimeOnly 'com.h2database:h2'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	// 전체 스위트는 서로 다른 Spring 컨텍스트가 많이 캐시된다. 기본 힙(512MB)에서는 OOM이 나므로 여유를 둔다.
	maxHeapSize = '2048m'
	// 최신 main의 MySQL 스위트는 여러 대형 컨텍스트를 만든다. 캐시 상한으로 JVM OOM을 막고 종료된 풀을 반환한다.
	systemProperty 'spring.test.context.cache.maxSize', '4'
	// 기존 테스트가 임의 사용자 ID로 ADMIN 토큰을 발급해도 되도록 ADMIN 세션 stamp 검사를 끈다(운영 기본값은 켜짐).
	// 이 검사 자체는 @TestPropertySource로 켠 전용 테스트(AdminSessionBinding*)가 검증한다.
	systemProperty 'app.security.admin-session-binding.enabled', 'false'
}
