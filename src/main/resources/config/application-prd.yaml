spring:
  application:
    name: private_tutor_solution_back
  datasource:
    # RDS 접속 정보는 EC2의 EnvironmentFile(/etc/f2r/env)에서 주입한다 (docs/AWS_DEPLOYMENT.md §6.4).
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:f2r_db}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate  # 스키마는 Flyway가 관리. Hibernate는 Entity ↔ DB 일치 검증만.
    show-sql: false       # 운영은 SQL 로그 끔 (성능 + 비용)
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    # 운영은 db/migration만 적용한다. dev-seed(admin/student 시드 계정, 더미 시험)는 들어가지 않는다.
    locations:
      - classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  servlet:
    multipart:
      # Academy 영상은 서버 multipart 경로를 사용한다. request는 multipart 경계 오버헤드만큼 여유를 둔다.
      max-file-size: 200MB
      max-request-size: 205MB
      # legacy multipart payload는 낮은 임계값에서 디스크로 스풀시킨다.
      file-size-threshold: 1MB

app:
  statistics:
    alb:
      # 운영에서 ALB access log S3 delivery와 EC2 IAM read 권한을 확인한 뒤에만 true로 전환한다.
      enabled: ${ALB_ACCESS_STATISTICS_ENABLED:false}
      bucket: ${ALB_ACCESS_LOG_BUCKET:}
      key-prefix: ${ALB_ACCESS_LOG_PREFIX:}
      region: ${ALB_ACCESS_LOG_REGION:ap-northeast-2}
      time-zone: Asia/Seoul
      poll-delay-ms: ${ALB_ACCESS_LOG_POLL_DELAY_MS:300000}
      max-objects-per-poll: ${ALB_ACCESS_LOG_MAX_OBJECTS_PER_POLL:100}
  video:
    # /tmp가 tmpfs인 운영 호스트에서도 raw/산출물이 RAM을 잠식하지 않도록 디스크 경로를 명시한다.
    validation-temp-dir: ${ACADEMY_VIDEO_VALIDATION_TEMP_DIR:/var/tmp/f2r/academy-video-validation}
    optimization-temp-dir: ${ACADEMY_VIDEO_OPTIMIZATION_TEMP_DIR:/var/tmp/f2r/academy-video-optimization}
    ffmpeg-path: ${APP_VIDEO_FFMPEG_PATH:/usr/local/bin/ffmpeg}
    ffprobe-path: ${APP_VIDEO_FFPROBE_PATH:/usr/local/bin/ffprobe}
  file:
    # 운영은 S3 사용. local profile은 'local'로 폴백.
    storage-type: s3
    # S3로 저장하지 않는 메타 (PDF 렌더링 DPI, 페이지 상한 등)은 동일.
    max-files-per-upload: 20
    jpeg-quality: 0.85
    accepted-extensions:
      - pdf
      - jpg
      - jpeg
      - png
      - webp
    pdf-dpi: 200
    max-pages-per-pdf: 30
  s3:
    bucket: ${S3_BUCKET}
    region: ${S3_REGION:ap-northeast-2}
    # prefix는 모든 키 앞에 붙는 폴더. 한 버킷을 여러 환경(dev/staging/prd)이 공유할 때 분리용.
    key-prefix: ${S3_KEY_PREFIX:prd}
  password-reset:
    # SMTP 발송 전까지 운영도 dev/stg와 동일하게 임시 비밀번호 직접 리셋을 사용한다.
    log-reset-link: ${PASSWORD_RESET_LOG_LINK:false}
    temporary-direct-reset: ${PASSWORD_RESET_TEMPORARY_DIRECT_RESET:true}
    temporary-default-password: ${PASSWORD_RESET_TEMPORARY_DEFAULT_PASSWORD:reset1234}
  jwt:
    # secret은 EC2 EnvironmentFile(/etc/f2r/env)의 JWT_SECRET으로 주입. 평문 박지 말 것.
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}    # 24h
    cookie-name: ACCESS_TOKEN
    secure-cookie: true                                    # 운영은 HTTPS → Secure 필수
    # 서브도메인({handle}.feel2real.co.kr)에서 강사 오너툴바가 동작하도록 쿠키를 등록도메인 전체로 공유.
    cookie-domain: .feel2real.co.kr
  public:
    # {handle}.feel2real.co.kr Host → academy 해석. 로컬/dev/stg는 미설정(서브도메인 라우팅 비활성).
    base-domain: feel2real.co.kr
  security:
    # 상태변경 /api/** 요청의 Origin/Referer 호스트 허용 suffix. apex + 모든 서브도메인 포함.
    # 서브도메인 same-site화 CSRF 방어(#172). 로컬/dev/stg는 미설정(비활성).
    allowed-origins:
      - feel2real.co.kr

anthropic:
  # api-key는 ANTHROPIC_API_KEY 환경변수로 주입
  model: ${ANTHROPIC_MODEL:claude-sonnet-4-6}
  classification:
    batch-size: 20
    max-tokens: 2048

# 서버 포트 — ALB target group이 8080을 expect하므로 변경하지 말 것
server:
  port: 8080
  # ALB 뒤에 있을 때 X-Forwarded-* 헤더 신뢰 (실제 client IP 로그 + redirect URL 정상)
  forward-headers-strategy: framework
