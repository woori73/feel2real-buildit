# stg 티어 프로필 — prd 마이그레이션 거울 (완전 동일 X, RDS 아닌 로컬 3310, 도커 안 내림).
# 활성화: SPRING_PROFILES_ACTIVE=local,stg  (local 위에 덮어씀)
# 핵심: flyway는 db/migration만 적용 → dev-seed 제외 = prd와 동일한 마이그레이션 집합.
#   → dev-seed 재번호 같은 로컬 변경에 안 깨지고, prd가 깨질 마이그레이션을 정확히 잡는다.
#   대표 테스트 데이터가 필요하면 dev-seed가 아닌 별도 1회 주입으로 채운다.
# 상세: docs/WORKFLOW.md §1
server:
  port: 8082

spring:
  application:
    name: private_tutor_solution_back
  datasource:
    url: jdbc:mysql://localhost:3310/f2r_stg?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
    username: ${SPRING_DATASOURCE_USERNAME:f2r_user}
    password: ${SPRING_DATASOURCE_PASSWORD:f2r_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    locations:
      - classpath:db/migration
    baseline-on-migrate: true   # 비어 있는 DB에서도, 기존 init.sql로 만들어진 DB에서도 안전하게 시작
    validate-on-migrate: true
  servlet:
    multipart:
      # Academy 영상은 서버 multipart 경로를 사용한다. request는 multipart 경계 오버헤드만큼 여유를 둔다.
      max-file-size: 200MB
      max-request-size: 205MB
      # legacy multipart payload는 낮은 임계값에서 디스크로 스풀시킨다.
      file-size-threshold: 1MB

app:
  file:
    # 로컬 개발은 디스크 사용. 운영(prd) profile은 's3'로 분기 (application-prd.yaml).
    storage-type: local
    upload-dir: ./raw_datas
    max-files-per-upload: 20         # 한 요청에 받을 수 있는 파일 수 상한
    jpeg-quality: 0.85               # 이미지 JPEG 재인코딩 품질 (0.0 ~ 1.0)
    accepted-extensions:             # 허용 확장자 (소문자, 점 없음). 그 외는 거부
      - pdf
      - jpg
      - jpeg
      - png
      - webp
    pdf-dpi: 200                     # PDF 페이지 → JPEG 변환 시 DPI (200 = OCR 친화적)
    max-pages-per-pdf: 30            # PDF 1개당 변환 페이지 상한 (악성 PDF 방어 + 메모리 보호)
  password-reset:
    # SMTP 실제 발송 전까지 dev/stg/local은 서버 로그에 reset link를 출력한다. 운영 기본값은 false.
    log-reset-link: true
    temporary-direct-reset: true
    temporary-default-password: reset1234
  jwt:
    # 로컬 default secret — HS256 최소 32 byte. 운영(prd)은 JWT_SECRET 환경변수로 override.
    secret: local-dev-jwt-secret-please-change-in-production-environment
    expiration-seconds: 86400      # 24h
    cookie-name: ACCESS_TOKEN
    secure-cookie: false           # 로컬은 http이므로 false. 운영(prd)은 true.

anthropic:
  # api-key는 ANTHROPIC_API_KEY 환경변수로 주입 (export ANTHROPIC_API_KEY=sk-ant-...)
  model: claude-sonnet-4-6
  classification:
    batch-size: 20         # Claude Vision 한 호출당 이미지 수 (1~20). 줄일 수는 있으나 늘리지 않음
    max-tokens: 2048       # 분류 응답이 짧으니 작게 충분
