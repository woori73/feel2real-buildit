<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><title>VLOG 편집 · CHOONGGI</title><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><th:block th:replace="~{fragments/_head :: favicon}"></th:block><link rel="stylesheet" th:href="@{/css/choonggi_creator.css}"></head><body><header><a href="/choonggi/admin">← 목록</a><b>CHOONGGI CREATOR</b></header><main class="editor" th:attr="data-post-id=${post?.id}"><aside>여권·비자·예약번호·연락처·정확한 주소·실시간 위치·회사 기밀·계약·팀원 개인정보·게임 전략은 올리지 마세요.</aside><label>Episode<select id="episode"><option th:each="n:${#numbers.sequence(0,8)}" th:value="${'EP'+#numbers.formatInteger(n,2)}" th:text="${'EP.'+#numbers.formatInteger(n,2)}" th:selected="${post!=null&&post.episode=='EP'+#numbers.formatInteger(n,2)}"></option></select></label><label>제목<input id="title" maxlength="120" placeholder="오늘 VLOG 제목" th:value="${post?.title}"></label><label>주소 슬러그<input id="slug" maxlength="140" placeholder="first-day-in-mumbai" th:value="${post?.slug}"></label><label>오늘의 기록<textarea id="body" maxlength="5000" rows="6" placeholder="짧게 기록하세요" th:text="${post?.body}"></textarea></label>
<div class="existing-media preview" id="existing-media" th:if="${post!=null&&!#lists.isEmpty(post.media)}">
  <figure th:each="m,it:${post.media}" th:attr="data-media-id=${m.id}" th:classappend="${m.cover}?'is-cover'">
    <img th:if="${m.type=='PHOTO'}" th:src="${m.url}" alt="">
    <video th:if="${m.type=='VIDEO'}" th:src="${m.url}" muted></video>
    <span class="badge" th:if="${m.cover}">커버</span>
    <div class="mini-actions">
      <button type="button" class="set-cover" th:if="${!m.cover}">커버로</button>
      <button type="button" class="move-up" th:if="${!it.first}">↑</button>
      <button type="button" class="move-down" th:if="${!it.last}">↓</button>
      <button type="button" class="delete-media danger">삭제</button>
    </div>
  </figure>
</div>
<label class="picker">사진/동영상 추가<input id="media" type="file" accept="image/*,video/mp4,video/quicktime" multiple></label><div id="preview" class="preview" aria-live="polite"></div><div class="actions"><button id="save">임시저장</button><button id="open-preview" class="secondary">미리보기</button><button id="publish" class="primary" th:if="${post!=null}">공개하기</button><button id="unpublish" class="danger" th:if="${post!=null&&post.status=='PUBLISHED'}">공개 취소</button></div><p id="message"></p></main><script defer th:src="@{/js/choonggi_creator.js}"></script></body></html>
