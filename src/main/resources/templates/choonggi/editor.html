<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><title>기록 올리기 · CHOONGGI</title><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><th:block th:replace="~{fragments/_head :: favicon}"></th:block><link rel="stylesheet" th:href="@{/css/choonggi_creator.css}"></head><body>
<header><a href="/choonggi/admin">← 목록</a><b>CHOONGGI CREATOR</b></header>
<main class="editor" th:attr="data-post-id=${post?.id}">
  <aside>여권·비자·예약번호·연락처·정확한 주소·실시간 위치·회사 기밀·계약·팀원 개인정보·게임 전략은 올리지 마세요.</aside>

  <label class="picker">＋ 사진 추가<input id="media" type="file" accept="image/*" multiple></label>
  <div id="existing-media" class="preview" th:if="${post!=null and !#lists.isEmpty(post.media)}">
    <figure th:each="m,it:${post.media}" th:attr="data-media-id=${m.id}" th:classappend="${m.cover}?'is-cover'">
      <img th:if="${m.type=='PHOTO'}" th:src="${m.url}" alt="">
      <video th:if="${m.type=='VIDEO'}" th:src="${m.url}" muted></video>
      <span class="badge" th:if="${m.cover}">대표</span>
      <div class="mini-actions">
        <button type="button" class="set-cover" th:if="${!m.cover}">대표로</button>
        <button type="button" class="move-up" th:if="${!it.first}">↑</button>
        <button type="button" class="move-down" th:if="${!it.last}">↓</button>
        <button type="button" class="delete-media danger">삭제</button>
      </div>
    </figure>
  </div>
  <div id="preview" class="preview" aria-live="polite"></div>

  <label>YouTube 영상
    <input id="youtube" type="url" inputmode="url" placeholder="YouTube 링크 붙여넣기" autocomplete="off" th:value="${post?.youtubeVideoId != null ? 'https://youtu.be/' + post.youtubeVideoId : ''}">
  </label>
  <div id="youtube-preview" aria-live="polite"></div>

  <label>제목<input id="title" maxlength="120" placeholder="오늘 기록 제목" th:value="${post?.title}"></label>
  <label>오늘의 기록<textarea id="body" maxlength="5000" rows="6" placeholder="짧게 기록하세요" th:text="${post?.body}"></textarea></label>

  <div class="actions">
    <button id="upload-publish" class="primary big">올리기</button>
    <button id="save-draft" class="secondary">임시저장</button>
    <button id="unpublish" class="tertiary" th:if="${post!=null and post.status=='PUBLISHED'}">비공개로 전환</button>
  </div>
  <p id="message" role="status"></p>
</main>
<script defer th:src="@{/js/choonggi_creator.js}"></script></body></html>
