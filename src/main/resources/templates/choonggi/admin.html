<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><title>CHOONGGI CREATOR</title><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><th:block th:replace="~{fragments/_head :: favicon}"></th:block><link rel="stylesheet" th:href="@{/css/choonggi_creator.css}"></head><body><header><b>CHOONGGI CREATOR</b><a href="/choonggi">공개 사이트</a></header><main><a class="primary" href="/choonggi/admin/posts/new">＋ 새 VLOG</a><section class="list"><article th:each="post:${posts}"><div><small th:text="${post.episodeCode+' · '+post.status}"></small><h2 th:text="${post.title}"></h2></div><a th:href="@{/choonggi/admin/posts/{id}/edit(id=${post.id})}">편집</a></article><p th:if="${#lists.isEmpty(posts)}">아직 작성한 VLOG가 없습니다.</p></section></main></body></html>
