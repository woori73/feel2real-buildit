<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/tp_base :: head('Exam in progress')}"></head>
<!-- 재원생 앱(/naesintest/app/tp-run)에서 열면 data-tp-app: 응시 API·돌아갈 곳을 앱으로 바꾸고 회원 메뉴를 숨긴다 -->
<body th:attr="data-tp-app=${tpApp} ? 'true' : null">
<th:block th:unless="${tpApp}"><nav th:replace="~{fragments/tp_base :: nav('practice')}"></nav></th:block>

<header class="run-head">
  <div class="wrap">
    <strong id="exam-title">Practice test</strong>
    <div class="sec-tabs" id="sec-tabs"></div>
    <span class="progress-line" id="progress">0 / 0 answered</span>
    <span class="timer" id="timer">--:--</span>
    <button class="btn btn-primary" id="btn-submit">Submit</button>
  </div>
</header>

<div class="wrap" id="stage">
  <p class="lead" style="margin-top:30px">Loading your attempt…<span class="ko">응시 정보를 불러오는 중…</span></p>
</div>

<th:block th:unless="${tpApp}"><div th:replace="~{fragments/tp_base :: footer}"></div></th:block>
<script defer src="/js/sat_rich.js"></script>
<script defer src="/js/testprep_run.js?v=20261124-app"></script>
</body>
</html>
