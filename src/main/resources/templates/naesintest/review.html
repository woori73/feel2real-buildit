<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <title>채점 결과 · 내신 실전 연습</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&amp;family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@400;600;700&amp;display=swap">
  <link rel="stylesheet" href="/css/naesin.css">
  <!-- 재원생 앱(/naesintest/app/run·review)에서 열면 학생용 앱 설치 정보(따로 만든 manifest)를 쓴다 -->
  <th:block th:if="${ntApp}"><link rel="manifest" href="/manifest-naesintest.json"><meta name="theme-color" content="#2D6590"><script defer src="/js/pwa.js"></script></th:block>
  <script defer src="/js/naesin_common.js"></script>
  <script defer src="/js/naesin_review.js"></script>
</head>
<body class="nt-body nt-review" th:attr="data-nt-app=${ntApp} ? 'true' : null">
<div class="nt-top">
  <div class="nt-top-l"><a class="nt-brand" href="/" aria-label="F2R영어 홈으로"><img src="/img/F2R_logo_pure.svg" alt="" width="30" height="30"><span>F2R영어</span></a><a class="nt-btn nt-btn-line" id="nt-back" href="/naesintest" th:href="${ntApp} ? '/naesintest/app' : '/naesintest'">목록으로</a></div>
  <span>F2R 예상문제 연습 점수이며 실제 학교 시험 점수가 아닙니다</span>
</div>
<main class="nt-sheet-wrap">
  <div class="nt-page" id="review"><p class="nt-msg">채점 결과를 불러오는 중입니다…</p></div>
</main>
</body>
</html>
