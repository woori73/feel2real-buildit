<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${academyName} + ' | 강의보기'">강의보기</title>
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <link rel="stylesheet" href="/css/lms_shell.css">
  <link rel="stylesheet" href="/css/lms_lecture.css">
</head>
<body>
<th:block th:replace="~{fragments/_lms_shell :: header}"></th:block>

<div class="lms-layout"
     th:attr="data-handle=${academyHandle},
              data-lms-base=${lmsBase},
              data-lms-user=${lmsUserKey},
              data-authenticated=${lmsAuthenticated},
              data-course-id=${courseId}">
  <th:block th:replace="~{fragments/_lms_shell :: sidebar('lecture')}"></th:block>

  <main class="lms-content">
    <div class="lecture-layout">
      <div class="panel">
        <div data-lecture-player>
          <div class="player-wrap">
            <div class="player-empty"><div class="empty-icon">🎬</div><p>강의 영상</p></div>
          </div>
        </div>
        <h1 class="lecture-title" data-lecture-title>-</h1>
        <div class="lecture-note" data-lecture-note>학습지와 함께 강의를 수강하세요.</div>
      </div>
      <div class="panel">
        <h2 class="section-title">강의 목록</h2>
        <div class="lecture-list" data-lecture-list></div>
      </div>
    </div>

    <div class="panel">
      <h2 class="section-title">수강후기</h2>
      <div class="review-notice">
        좋은 수강후기를 작성해 주신 분들께는 매월 우수 후기를 선정하여 소정의 선물을 드립니다.
      </div>

      <div data-review-list></div>

      <div class="review-form">
        <h2 class="section-title" style="font-size:18px">후기 작성</h2>
        <div class="star-select" data-star-select>
          <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
        </div>
        <div class="form-row">
          <label for="reviewContent">수강후기</label>
          <textarea id="reviewContent" data-review-content rows="3"
                    placeholder="강의에 대한 솔직한 후기를 남겨주세요."></textarea>
        </div>
        <div class="form-row">
          <label for="reviewNext">다음에 필요한 콘텐츠</label>
          <textarea id="reviewNext" data-review-next rows="2"
                    placeholder="앞으로 더 필요한 강의나 자료가 있다면 알려주세요."></textarea>
        </div>
        <button class="btn btn-auto" type="button" data-review-submit>후기 등록</button>
      </div>
    </div>
  </main>
</div>

<th:block th:replace="~{fragments/_lms_shell :: footer}"></th:block>

<script src="/js/lms_mock.js"></script>
<script src="/js/lms_data.js"></script>
<script src="/js/lms_state.js"></script>
<script src="/js/lms_shell.js"></script>
<script src="/js/lms_player.js"></script>
<script src="/js/lms_lecture.js"></script>
</body>
</html>
