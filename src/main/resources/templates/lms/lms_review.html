<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${academyName} + ' | 복습 강의보기'">복습 강의보기</title>
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <link rel="stylesheet" href="/css/lms_shell.css">
  <link rel="stylesheet" href="/css/lms_lecture.css">
  <link rel="stylesheet" href="/css/lms_review.css">
</head>
<body>
<th:block th:replace="~{fragments/_lms_shell :: header}"></th:block>

<div class="lms-layout"
     th:attr="data-handle=${academyHandle},
              data-lms-base=${lmsBase},
              data-lms-user=${lmsUserKey},
              data-authenticated=${lmsAuthenticated},
              data-lesson-id=${lessonId}">
  <th:block th:replace="~{fragments/_lms_shell :: sidebar('my')}"></th:block>

  <main class="lms-content">
    <div class="lecture-layout">
      <div class="panel">
        <div data-lecture-player>
          <div class="player-wrap">
            <div class="player-empty"><div class="empty-icon">🎬</div><p>영상을 선택하세요</p></div>
          </div>
        </div>
        <h1 class="lecture-title" data-lecture-title>-</h1>
        <div class="lecture-note" data-lecture-note></div>
      </div>
      <div class="panel">
        <h2 class="section-title" data-review-lesson-title>내 복습수업</h2>
        <div class="lecture-list" data-review-content-list></div>
      </div>
    </div>
  </main>
</div>

<th:block th:replace="~{fragments/_lms_shell :: footer}"></th:block>

<script src="/js/api.js"></script>
<script src="/js/lms_mock.js"></script>
<script src="/js/lms_data.js"></script>
<script src="/js/lms_state.js"></script>
<script src="/js/lms_shell.js"></script>
<script src="/js/lms_review.js"></script>
</body>
</html>
