<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${academyName} + ' | 결제'">결제</title>
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <link rel="stylesheet" href="/css/lms_shell.css">
  <link rel="stylesheet" href="/css/lms_checkout.css">
</head>
<body>
<th:block th:replace="~{fragments/_lms_shell :: header}"></th:block>

<div class="lms-layout"
     th:attr="data-handle=${academyHandle},
              data-lms-base=${lmsBase},
              data-lms-user=${lmsUserKey},
              data-authenticated=${lmsAuthenticated}">
  <th:block th:replace="~{fragments/_lms_shell :: sidebar('checkout')}"></th:block>

  <main class="lms-content">
    <div class="panel">
      <h1 class="page-title">결제</h1>
      <div class="form-row">
        <label>주문 강좌</label>
        <div data-pay-order-list>-</div>
      </div>
      <div class="form-row">
        <label for="payName">수강생 이름</label>
        <input type="text" id="payName" data-pay-name placeholder="이름 입력">
      </div>
      <div class="form-row">
        <label for="payPhone">연락처</label>
        <input type="text" id="payPhone" data-pay-phone placeholder="010-0000-0000">
      </div>
      <div class="form-row">
        <label for="payMethod">결제수단</label>
        <select id="payMethod" data-pay-method>
          <option>신용카드</option>
          <option>계좌이체</option>
          <option>간편결제</option>
        </select>
      </div>
      <div class="form-row">
        <label>교재 수령 방법</label>
        <div class="radio-row">
          <label><input type="radio" name="payDelivery" value="visit"> 학원 방문 수령 (무료)</label>
          <label><input type="radio" name="payDelivery" value="delivery"> 택배 배송 (+3,000원)</label>
        </div>
      </div>
      <div data-delivery-fields hidden>
        <div class="form-row">
          <label for="deliveryName">받는 사람</label>
          <input type="text" id="deliveryName" data-delivery-name placeholder="받는 사람 이름">
        </div>
        <div class="form-row">
          <label for="deliveryPhone">연락처</label>
          <input type="text" id="deliveryPhone" data-delivery-phone placeholder="010-0000-0000">
        </div>
        <div class="form-row">
          <label for="deliveryAddress">주소</label>
          <input type="text" id="deliveryAddress" data-delivery-address placeholder="배송받을 주소를 입력하세요">
        </div>
      </div>
      <div class="pay-summary">
        결제금액
        <strong data-pay-amount>0원</strong>
      </div>
      <button class="btn" type="button" data-pay-btn>결제하기</button>
    </div>
  </main>
</div>

<th:block th:replace="~{fragments/_lms_shell :: footer}"></th:block>

<script src="/js/lms_mock.js"></script>
<script src="/js/lms_data.js"></script>
<script src="/js/lms_state.js"></script>
<script src="/js/lms_shell.js"></script>
<script src="/js/lms_checkout.js"></script>
</body>
</html>
