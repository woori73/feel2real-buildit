<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${academyName} + ' | 강좌상세'">강좌상세</title>
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <link rel="stylesheet" href="/css/lms_shell.css">
  <link rel="stylesheet" href="/css/lms_course_detail.css">
</head>
<body>
<th:block th:replace="~{fragments/_lms_shell :: header}"></th:block>

<div class="lms-layout"
     th:attr="data-handle=${academyHandle},
              data-lms-base=${lmsBase},
              data-lms-user=${lmsUserKey},
              data-authenticated=${lmsAuthenticated},
              data-course-id=${courseId}">
  <th:block th:replace="~{fragments/_lms_shell :: sidebar('detail')}"></th:block>

  <main class="lms-content course-detail">
    <div class="panel">
      <div class="course-select" data-course-select></div>
      <div class="detail-hero">
        <div data-detail-player></div>
      </div>
      <div class="detail-body">
        <div class="detail-main">
          <!-- 목업의 contenteditable 인라인 편집은 공개 화면에서 제거했다(운영자 편집은 /manage). -->
          <h1 class="title" data-detail-title>-</h1>
          <section class="detail-block">
            <h2 class="block-title">강좌소개</h2>
            <p data-detail-desc>-</p>
          </section>
          <section class="detail-block">
            <h2 class="block-title">강사소개</h2>
            <p data-detail-instructor>-</p>
          </section>
          <section class="detail-block">
            <h2 class="block-title">수강대상</h2>
            <p data-detail-target>-</p>
          </section>
          <section class="detail-block">
            <h2 class="block-title">강의 구성</h2>
            <div class="curriculum-list" data-curriculum-list></div>
          </section>
        </div>
        <aside class="detail-side">
          <div class="price-box">
            <div class="price-label">수강료</div>
            <div class="price" data-detail-price>0원</div>
            <button class="btn" type="button" data-enroll-btn>수강신청</button>
            <button class="btn btn-outline" type="button" data-detail-trailer-btn style="margin-top:12px">
              🎬 2분 맛보기 다시보기
            </button>
          </div>
        </aside>
      </div>
    </div>
  </main>
</div>

<th:block th:replace="~{fragments/_lms_shell :: footer}"></th:block>
<th:block th:replace="~{fragments/_lms_shell :: trailerModal}"></th:block>

<script src="/js/lms_mock.js"></script>
<script src="/js/lms_data.js"></script>
<script src="/js/lms_state.js"></script>
<script src="/js/lms_shell.js"></script>
<script src="/js/lms_player.js"></script>
<script src="/js/lms_course_detail.js"></script>
</body>
</html>
