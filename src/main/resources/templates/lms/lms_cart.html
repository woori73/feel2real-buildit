<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${academyName} + ' | 장바구니'">장바구니</title>
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <link rel="stylesheet" href="/css/lms_shell.css">
  <link rel="stylesheet" href="/css/lms_cart.css">
</head>
<body>
<th:block th:replace="~{fragments/_lms_shell :: header}"></th:block>

<div class="lms-layout"
     th:attr="data-handle=${academyHandle},
              data-lms-base=${lmsBase},
              data-lms-user=${lmsUserKey},
              data-authenticated=${lmsAuthenticated}">
  <th:block th:replace="~{fragments/_lms_shell :: sidebar('cart')}"></th:block>

  <main class="lms-content">
    <div class="panel">
      <h1 class="page-title">장바구니</h1>
      <table>
        <thead><tr><th>강좌</th><th>결제금액</th><th></th></tr></thead>
        <tbody data-cart-body></tbody>
      </table>
      <div class="delivery-box">
        <h2 class="section-title" style="font-size:18px">교재 수령 방법</h2>
        <div class="radio-row">
          <label><input type="radio" name="cartDelivery" value="visit"> 학원 방문 수령 (무료)</label>
          <label><input type="radio" name="cartDelivery" value="delivery"> 택배 배송 (+3,000원)</label>
        </div>
      </div>
      <div class="total-row">
        <div>
          총 결제금액 <span class="amount" data-cart-total>0원</span>
          <div class="shipping-note" data-cart-shipping-note></div>
        </div>
        <button class="btn btn-auto" type="button" data-checkout-btn>결제하기</button>
      </div>
    </div>
  </main>
</div>

<th:block th:replace="~{fragments/_lms_shell :: footer}"></th:block>

<script src="/js/lms_mock.js"></script>
<script src="/js/lms_data.js"></script>
<script src="/js/lms_state.js"></script>
<script src="/js/lms_shell.js"></script>
<script src="/js/lms_cart.js"></script>
</body>
</html>
