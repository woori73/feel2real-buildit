<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페이지를 찾을 수 없습니다 (404) | Feel2Real</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
            background: #f8f9fa;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 480px;
        }
        .code {
            font-size: 96px;
            font-weight: 800;
            color: #dee2e6;
            line-height: 1;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        p {
            font-size: 15px;
            color: #6c757d;
            margin-bottom: 8px;
            line-height: 1.6;
        }
        .path {
            font-family: monospace;
            background: #e9ecef;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 13px;
            word-break: break-all;
            display: inline-block;
            margin: 8px 0 24px;
        }
        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .btn {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
        }
        .btn-primary {
            background: #4263eb;
            color: #fff;
        }
        .btn-primary:hover { background: #364fc7; }
        .btn-secondary {
            background: #fff;
            color: #495057;
            border: 1px solid #dee2e6;
        }
        .btn-secondary:hover { background: #f1f3f5; }
    </style>
</head>
<body>
<div class="container">
    <div class="code">404</div>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>요청하신 페이지가 존재하지 않거나 이동되었습니다.</p>
    <div th:if="${path}" class="path" th:text="${path}">/path</div>
    <div class="actions">
        <a href="/home" class="btn btn-primary">홈으로 이동</a>
        <button onclick="history.back()" class="btn btn-secondary">이전 페이지</button>
    </div>
</div>
</body>
</html>
