<body>
  <th:block th:replace="~{fragments/_admin_topnav :: topnav('newstart')}"></th:block>

  <div class="container">
    <div class="section-header">
      <div class="section-title">감사회원 본인확인 승인</div>
      <div class="section-subtitle">회원이 "내 카페 닉네임은 이 명단"이라고 요청한 건입니다. 승인해야만 roster와 연결되고 THANKS_MEMBER가 부여됩니다.</div>
    </div>
    <p class="tc-note">
      승인 전 확인: ① 카페 쪽지/안내 게시글 댓글로 받은 <strong>인증코드</strong>가 아래 코드와 같은지 ② 그 메시지를 보낸 <strong>카페 계정(닉네임)</strong>이
      명단 닉네임과 같은지. 아래 "이메일 접두부 일치"·"닉네임 일치"는 <strong>보조 정보일 뿐 승인 근거가 아닙니다</strong>(같은 접두부·공개 닉네임을 가진 일반회원이 있을 수 있습니다).
    </p>
    <div id="tc-msg" role="status"></div>
    <table class="tc-table">
      <thead>
        <tr><th>요청</th><th>NewStart 회원</th><th>명단(카페)</th><th>인증코드</th><th>보조 정보</th><th>처리</th></tr>
      </thead>
      <tbody id="tc-body"><tr><td colspan="6">불러오는 중…</td></tr></tbody>
    </table>
