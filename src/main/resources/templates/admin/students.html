<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 대시보드 - 학생 목록</title>
  <th:block th:replace="~{fragments/_admin_topnav :: head}"></th:block>
  <link rel="stylesheet" href="/css/admin_students.css">
</head>
<body>
  <th:block th:replace="~{fragments/_admin_topnav :: topnav('students')}"></th:block>

  <div class="container">
    <div class="section-header">
      <div class="section-title">학생 목록</div>
      <div class="section-subtitle" id="sectionSubtitle">학생을 선택하면 해당 학생의 대시보드를 조회할 수 있어요.</div>
    </div>

    <div id="studentGrid" class="student-grid">
      <div class="empty-state">불러오는 중...</div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    // 진입 가드: ADMIN만 접근 가능 (sessionStorage 비어도 JWT 쿠키로 복원 — 하단 init 참고)
    let currentUser = null;

    let studentMap = {};  // studentId → 학생 데이터 캐시 (클릭 핸들러에서 사용)

    async function loadStudents() {
      const grid = document.getElementById('studentGrid');
      try {
        const res = await fetchAuth('/api/admin/students');
        if (!res.ok) throw new Error();
        const students = await res.json();
        studentMap = {};
        for (const s of students) studentMap[s.studentId] = s;
        renderStudents(students);
      } catch {
        grid.innerHTML = '<div class="empty-state">학생 목록을 불러오지 못했습니다.</div>';
      }
    }

    function renderStudents(students) {
      const grid = document.getElementById('studentGrid');
      document.getElementById('sectionSubtitle').textContent =
        `총 ${students.length}명의 학생. 카드를 클릭하면 해당 학생의 대시보드를 조회합니다.`;

      if (students.length === 0) {
        grid.innerHTML = '<div class="empty-state">아직 등록된 학생이 없습니다.</div>';
        return;
      }

      grid.innerHTML = students.map(s => `
        <div class="student-card" data-student-id="${s.studentId}" onclick="impersonate(this.dataset.studentId)">
          <div class="student-name">${escapeHtml(s.name)}</div>
          <div class="student-info">
            ${escapeHtml(s.schoolName || '')}${s.grade ? ' · ' + s.grade + '학년' : ''}<br>
            <small>${escapeHtml(s.loginId)}</small>
          </div>
          <div class="student-stats">
            <div class="student-stat">
              <div class="stat-label">자료</div>
              <div class="stat-value">${s.sourceCount}개</div>
            </div>
            <div class="student-stat">
              <div class="stat-label">대화</div>
              <div class="stat-value">${s.conversationCount}개</div>
            </div>
          </div>
        </div>
      `).join('');
    }

    /**
     * 학생 카드 클릭 시 임퍼소네이트로 학생 대시보드 진입.
     * sessionStorage의 currentUser는 어드민으로 유지하고,
     * impersonatedStudent에 그 학생 정보 저장 → 학생 페이지들이 이를 감지해 빨간 배너 + 보기 전용 모드.
     */
    function impersonate(studentIdStr) {
      const student = studentMap[studentIdStr];
      if (!student) return;
      sessionStorage.setItem('impersonatedStudent', JSON.stringify(student));
      location.href = `/stdt_dashboard?asAdmin=1&studentId=${student.studentId}`;
    }

    async function handleLogout() {
      try { await fetch('/api/auth/logout', { method: 'POST' }); } catch (_) {}
      sessionStorage.removeItem('currentUser');
      sessionStorage.removeItem('currentStudent');
      sessionStorage.removeItem('impersonatedStudent');
      location.href = '/';
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    (async () => {
      currentUser = await ensureCurrentUser();
      if (!currentUser || currentUser.role !== 'ADMIN') { location.href = '/home'; return; }
      document.getElementById('userName').textContent = window.userDisplayName(currentUser);
      loadStudents();
    })();
  </script>
</body>
</html>
