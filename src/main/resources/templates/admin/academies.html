<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 - Academy 노출 관리</title>
  <th:block th:replace="~{fragments/_admin_topnav :: head}"></th:block>
  <link rel="stylesheet" href="/css/admin_academies.css">
</head>
<body>
  <th:block th:replace="~{fragments/_admin_topnav :: topnav('academies')}"></th:block>

  <div class="container">
    <div class="section-header">
      <div>
        <div class="section-title">Academy / Lesson 노출 관리</div>
        <div class="section-subtitle" id="sectionSubtitle">관리자는 숨김 상태의 Academy와 수업까지 모두 볼 수 있습니다.</div>
      </div>
      <button class="nav-link" style="color:#1a202c;border-color:#cbd5e0;" onclick="loadAcademies()">새로고침</button>
    </div>

    <div id="academyList" class="academy-list">
      <div class="empty-state">불러오는 중...</div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    // 진입 가드: ADMIN만 (sessionStorage 비어도 JWT 쿠키로 복원 — 하단 init)
    let currentUser = null;

    let academies = [];

    async function loadAcademies() {
      const list = document.getElementById('academyList');
      list.innerHTML = '<div class="empty-state">불러오는 중...</div>';
      try {
        const res = await fetchAuth('/api/admin/academies');
        if (!res.ok) throw new Error('Academy 목록 조회 실패');
        academies = await res.json();
        renderAcademies();
      } catch (error) {
        list.innerHTML = '<div class="empty-state">Academy 목록을 불러오지 못했습니다.</div>';
      }
    }

    function renderAcademies() {
      const list = document.getElementById('academyList');
      document.getElementById('sectionSubtitle').textContent =
        `총 ${academies.length}개 Academy. 숨김(false)은 public 검색/상세/신청 접근에서 제외됩니다.`;
      if (academies.length === 0) {
        list.innerHTML = '<div class="empty-state">등록된 Academy가 없습니다.</div>';
        return;
      }
      list.innerHTML = academies.map(renderAcademy).join('');
    }

    function renderAcademy(academy) {
      const hiddenClass = academy.isVisible ? '' : ' hidden-item';
      const lessonRows = (academy.lessons || []).length === 0
        ? '<div class="meta">등록된 수업이 없습니다.</div>'
        : academy.lessons.map(lesson => renderLesson(lesson)).join('');
      return `
        <article class="academy-card${hiddenClass}">
          <div class="academy-head">
            <div>
              <div class="academy-name">
                ${escapeHtml(academy.name)}
                ${visibilityPill(academy.isVisible)}
                <span class="pill pill-status">${escapeHtml(academy.status)}</span>
              </div>
              <div class="meta">
                slug: ${escapeHtml(academy.slug)} · tutor: ${escapeHtml(academy.tutorName)} (${escapeHtml(academy.tutorLoginId)})<br>
                Academy ID: ${academy.academyId} · Lessons: ${(academy.lessons || []).length}
              </div>
              ${renderVisitStatistics(academy.visitStatistics)}
            </div>
            <button class="toggle-btn ${academy.isVisible ? 'hide' : 'show'}"
                    onclick="toggleAcademy(${academy.academyId}, ${!academy.isVisible}, this)">
              ${academy.isVisible ? '숨기기' : '노출하기'}
            </button>
          </div>
          <div class="lesson-list">${lessonRows}</div>
        </article>`;
    }

    function renderVisitStatistics(statistics) {
      const data = statistics || { today: 0, total: 0, recentDays: [] };
      return `<div class="admin-visit-statistics">
        <div class="admin-visit-counter"><span>오늘 방문</span><strong>${formatCount(data.today)}</strong></div>
        <div class="admin-visit-counter"><span>누적 방문</span><strong>${formatCount(data.total)}</strong></div>
        <div class="admin-visit-chart">${renderVisitChart(data.recentDays || [])}</div>
      </div>`;
    }

    function renderVisitChart(days) {
      if (!days.length) return '<span class="meta">최근 방문 데이터 없음</span>';
      const width = 360;
      const height = 100;
      const max = Math.max(1, ...days.map(day => Number(day.count || 0)));
      const points = days.map((day, index) => {
        const x = 14 + index * (332 / Math.max(1, days.length - 1));
        const y = 74 - Number(day.count || 0) / max * 54;
        return { x, y, count: Number(day.count || 0), label: String(day.date).slice(5).replace('-', '.') };
      });
      return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="최근 7일 방문 횟수">
        <polyline points="${points.map(point => `${point.x},${point.y}`).join(' ')}"></polyline>
        ${points.map(point => `<g><circle cx="${point.x}" cy="${point.y}" r="3"></circle><text x="${point.x}" y="${Math.max(10, point.y - 7)}">${point.count}</text><text class="date" x="${point.x}" y="94">${point.label}</text></g>`).join('')}
      </svg>`;
    }

    function formatCount(value) {
      return Number(value || 0).toLocaleString('ko-KR');
    }

    function renderLesson(lesson) {
      const hiddenClass = lesson.isVisible ? '' : ' hidden-item';
      return `
        <div class="lesson-row${hiddenClass}">
          <div>
            <div class="lesson-name">
              ${escapeHtml(lesson.name)}
              ${visibilityPill(lesson.isVisible)}
              <span class="pill pill-status">${escapeHtml(lesson.status)}</span>
            </div>
            <div class="lesson-detail">
              ${escapeHtml(lesson.priceSummary || '-')} · ${escapeHtml(lesson.scheduleSummary || '-')} · 정원 ${lesson.currentCount}/${lesson.maxCapacity}
            </div>
          </div>
          <div class="meta">Lesson ID: ${lesson.lessonId}</div>
          <button class="toggle-btn ${lesson.isVisible ? 'hide' : 'show'}"
                  onclick="toggleLesson(${lesson.lessonId}, ${!lesson.isVisible}, this)">
            ${lesson.isVisible ? '숨기기' : '노출하기'}
          </button>
        </div>`;
    }

    function visibilityPill(isVisible) {
      return isVisible
        ? '<span class="pill pill-visible">VISIBLE</span>'
        : '<span class="pill pill-hidden">HIDDEN</span>';
    }

    async function toggleAcademy(academyId, isVisible, button) {
      await patchVisibility(`/api/admin/academies/${academyId}/visibility`, isVisible, button);
    }

    async function toggleLesson(lessonId, isVisible, button) {
      await patchVisibility(`/api/admin/lessons/${lessonId}/visibility`, isVisible, button);
    }

    async function patchVisibility(url, isVisible, button) {
      const oldText = button.textContent;
      button.disabled = true;
      button.textContent = '저장 중...';
      try {
        const res = await fetchAuth(url, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ isVisible })
        });
        if (!res.ok) throw new Error('노출 상태 변경 실패');
        await loadAcademies();
      } catch (error) {
        alert('노출 상태 변경에 실패했습니다.');
        button.disabled = false;
        button.textContent = oldText;
      }
    }

    async function handleLogout() {
      try { await fetch('/api/auth/logout', { method: 'POST' }); } catch (_) {}
      sessionStorage.removeItem('currentUser');
      sessionStorage.removeItem('currentStudent');
      sessionStorage.removeItem('impersonatedStudent');
      location.href = '/';
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    (async () => {
      currentUser = await ensureCurrentUser();
      if (!currentUser || currentUser.role !== 'ADMIN') { location.href = '/home'; return; }
      document.getElementById('userName').textContent = window.userDisplayName(currentUser);
      loadAcademies();
    })();
  </script>
</body>
</html>
