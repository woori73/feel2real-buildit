<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F2R - 관리자 로그인</title>
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <link rel="stylesheet" href="/css/admin_login.css">
</head>
<body>
  <div class="card">
    <span class="badge">ADMIN</span>
    <h1>관리자 로그인</h1>
    <p class="subtitle">관리자 계정으로 로그인해 주세요.</p>

    <div class="form-group">
      <label for="loginId">아이디</label>
      <input type="text" id="loginId" placeholder="아이디 입력">
    </div>
    <div class="form-group">
      <label for="password">비밀번호</label>
      <input type="password" id="password" placeholder="비밀번호 입력">
    </div>

    <button class="btn-primary" onclick="handleAdminLogin()">로그인</button>
    <p class="error-msg" id="errorMsg"></p>
  </div>

  <script>
    async function handleAdminLogin() {
      const loginId = document.getElementById('loginId').value.trim();
      const password = document.getElementById('password').value;

      if (!loginId || !password) {
        showError('아이디와 비밀번호를 모두 입력해 주세요.');
        return;
      }

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ loginId, password })
        });

        if (!res.ok) {
          showError('아이디 또는 비밀번호가 올바르지 않습니다.');
          return;
        }

        const user = await res.json();
        if (user.role !== 'ADMIN') {
          showError('관리자 계정이 아닙니다.');
          return;
        }

        sessionStorage.setItem('currentUser', JSON.stringify(user));
        location.href = '/admin/students';
      } catch (e) {
        showError('서버 연결에 실패했습니다.');
      }
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleAdminLogin();
    });
  </script>
</body>
</html>
