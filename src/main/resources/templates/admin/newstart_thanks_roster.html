<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 - 감사회원 명단 관리</title>
  <th:block th:replace="~{fragments/_admin_topnav :: head}"></th:block>
  <link rel="stylesheet" href="/css/admin_students.css">
  <style>
    .tr-table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; }
    .tr-table th, .tr-table td { padding: 10px 12px; font-size: 13px; text-align: left; border-bottom: 1px solid #edf2f7; vertical-align: top; }
    .tr-table th { background: #f7fafc; color: #4a5568; font-weight: 700; }
    .tr-form { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 18px 20px; margin-bottom: 18px; }
    .tr-form h3 { margin: 0 0 12px; font-size: 14px; font-weight: 700; color: #2d3748; }
    .tr-form-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
    .tr-field { display: flex; flex-direction: column; gap: 4px; }
    .tr-field label { font-size: 12px; color: #4a5568; font-weight: 600; }
    .tr-field input { border: 1px solid #cbd5e0; border-radius: 8px; padding: 8px 10px; font-size: 13px; width: 160px; }
    .tr-btn { border: 1px solid #cbd5e0; background: #fff; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 13px; }
    .tr-btn.primary { background: #2b6cb0; border-color: #2b6cb0; color: #fff; }
    .tr-btn.danger { background: #fff; border-color: #fc8181; color: #c53030; }
    .tr-note { font-size: 12.5px; color: #718096; line-height: 1.6; margin: 8px 0 14px; }
    #tr-msg { font-size: 13px; margin: 8px 0; min-height: 18px; }
    #tr-msg.ok { color: #276749; }
    #tr-msg.err { color: #c53030; }
    .tr-badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #edf2f7; color: #4a5568; }
    .tr-badge.linked { background: #c6f6d5; color: #22543d; }
  </style>
</head>
<body>
  <th:block th:replace="~{fragments/_admin_topnav :: topnav('newstart')}"></th:block>

  <div class="container">
    <div class="section-header">
      <div class="section-title">감사회원 명단 관리</div>
      <div class="section-subtitle">네이버 카페 감사멤버를 NewStart 감사회원 명단에 수동 등록합니다. 등록 즉시 회원가입 시 자동 매칭에 반영됩니다.</div>
    </div>

    <div class="tr-form">
      <h3>신규 등록</h3>
      <div class="tr-form-row">
        <div class="tr-field">
          <label for="tr-nickname">닉네임</label>
          <input id="tr-nickname" type="text" placeholder="예: 스쿨" maxlength="50">
        </div>
        <div class="tr-field">
          <label for="tr-prefix">네이버ID 앞 4자리</label>
          <input id="tr-prefix" type="text" placeholder="예: hees" maxlength="10">
        </div>
        <div class="tr-field">
          <label for="tr-date">등급 변경일</label>
          <input id="tr-date" type="date">
        </div>
        <button class="tr-btn primary" id="tr-add-btn" type="button">등록</button>
      </div>
      <p class="tr-note">카페 화면에서 닉네임·네이버ID 앞자리·등급 변경일을 확인하고 입력하세요. 등록 후 해당 회원이 가입하면 감사회원(THANKS_MEMBER)이 자동 부여됩니다.</p>
      <div id="tr-msg" role="status"></div>
    </div>

    <table class="tr-table">
      <thead>
        <tr><th>ID</th><th>닉네임</th><th>ID 앞자리</th><th>등급</th><th>등급 변경일</th><th>상태</th><th>관리</th></tr>
      </thead>
      <tbody id="tr-body"><tr><td colspan="7">불러오는 중…</td></tr></tbody>
    </table>
  </div>
  <script src="/js/admin_newstart_thanks_roster.js?v=20261013-1" defer></script>
</body>
</html>
