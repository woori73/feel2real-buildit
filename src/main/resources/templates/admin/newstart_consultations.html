      <div class="section-subtitle">회원이 비공개로 남긴 개인 상담. 상담을 열면 닉네임·연결을 허용한 채무상황·현재 A to Z 단계·이번 질문·이전 대화·관련 지피지기 사례를 한 화면에서 봅니다.</div>
    </div>
    <p class="cn-note">
      회원 닉네임 외 개인정보는 상담에 필요한 최소지만 노출됩니다. <strong>지피지기 조사</strong>는 회원 질문을
      <strong>익명화한 뒤</strong> 수행하며 결과는 <strong>운영자에게만</strong> 보입니다(회원에게 자동 전송되지 않습니다).
      답변을 보내려면 운영자가 읽고 수정·보완한 뒤 <strong>회원에게 답변</strong>을 눌러야 합니다.
    </p>
