<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 - 감사회원 인증 예외</title>
  <th:block th:replace="~{fragments/_admin_topnav :: head}"></th:block>
  <link rel="stylesheet" href="/css/admin_students.css">
  <style>
    .tx-table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; }
    .tx-table th, .tx-table td { padding: 10px 12px; font-size: 13px; text-align: left; border-bottom: 1px solid #edf2f7; vertical-align: top; }
    .tx-table th { background: #f7fafc; color: #4a5568; font-weight: 700; }
    .tx-reason { font-weight: 700; color: #9c4221; }
    .tx-btn { border: 1px solid #cbd5e0; background: #fff; border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 12.5px; margin: 0 4px 4px 0; }
    .tx-btn.primary { background: #2b6cb0; border-color: #2b6cb0; color: #fff; }
    .tx-note { font-size: 12.5px; color: #718096; line-height: 1.6; margin: 8px 0 14px; }
    #tx-msg { font-size: 13px; margin: 8px 0; min-height: 18px; }
  </style>
</head>
<body>
  <th:block th:replace="~{fragments/_admin_topnav :: topnav('newstart')}"></th:block>

  <div class="container">
    <div class="section-header">
      <div class="section-title">감사회원 인증 예외</div>
      <div class="section-subtitle">회원 셀프 인증이 자동으로 안전하게 끝나지 못한 건만 올라옵니다. 정상 인증(자동 1:1 연결 + 감사회원 부여)은 여기 나오지 않습니다.</div>
    </div>
    <p class="tx-note">
      예외가 생기면 설정된 운영자 이메일로 즉시 알림이 갑니다(닉네임·사유·발생시각·이 화면 링크만 포함).
      <strong>연결 승인</strong>은 해당 회원에게 감사회원 권한을 부여하고 명단과 1:1로 연결합니다. 카페에서 닉네임·가입 이력 등을 확인한 뒤에만 승인하세요.
      승인하지 않을 건은 <strong>종료</strong>로 닫습니다.
    </p>
    <div id="tx-msg" role="status"></div>
    <table class="tx-table">
      <thead>
        <tr><th>발생</th><th>사유</th><th>입력한 카페 닉네임</th><th>NewStart 회원</th><th>대상 명단</th><th>메일</th><th>처리</th></tr>
      </thead>
      <tbody id="tx-body"><tr><td colspan="7">불러오는 중…</td></tr></tbody>
    </table>
  </div>
  <script src="/js/admin_newstart_thanks_exceptions.js?v=20261001-2" defer></script>
</body>
</html>
