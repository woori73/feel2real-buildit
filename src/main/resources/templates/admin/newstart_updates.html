<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 - 새출발 업데이트</title>
  <th:block th:replace="~{fragments/_admin_topnav :: head}"></th:block>
  <style>
    .updates-admin { max-width: 1240px; margin: 0 auto; padding: 24px; }
    .updates-admin h2 { margin: 0 0 6px; }
    .updates-admin .hint { color: #718096; font-size: 13px; margin: 0 0 20px; }
    .update-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 18px; margin-bottom: 20px; background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 12px; }
    .update-form label { display: grid; gap: 4px; font-size: 12px; font-weight: 700; color: #4a5568; }
    .update-form input, .update-form textarea, .update-form select { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #cbd5e0; border-radius: 6px; background: #fff; }
    .update-form .wide { grid-column: 1 / -1; }
    .update-form button { justify-self: start; }
    .updates-table-wrap { overflow-x: auto; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; }
    .updates-table { width: 100%; border-collapse: collapse; min-width: 1100px; }
    .updates-table th, .updates-table td { padding: 11px 12px; border-bottom: 1px solid #edf2f7; text-align: left; vertical-align: top; font-size: 13px; }
    .updates-table th { background: #f7fafc; color: #4a5568; }
    .updates-table td small { display: block; color: #718096; margin-top: 4px; }
    .update-actions { display: flex; gap: 5px; flex-wrap: wrap; }
    .update-actions button { border: 1px solid #cbd5e0; border-radius: 6px; background: #fff; padding: 5px 8px; cursor: pointer; }
    .update-actions button:hover { border-color: #3182ce; color: #2b6cb0; }
    .priority-critical { color: #c53030; font-weight: 700; }
    .priority-high { color: #dd6b20; font-weight: 700; }
    .priority-normal { color: #3182ce; }
    .priority-irrelevant { color: #718096; text-decoration: line-through; }
    @media (max-width: 680px) { .updates-admin { padding: 16px; } .update-form { grid-template-columns: 1fr; } .update-form .wide { grid-column: auto; } }
  </style>
</head>
<body>
  <th:block th:replace="~{fragments/_admin_topnav :: topnav('newstartUpdates')}"></th:block>
  <main class="updates-admin">
    <h2>새출발 최신 업데이트 관리</h2>
    <p class="hint">공식자료는 먼저 REVIEW로 등록됩니다. URL이 없는 자료는 게시할 수 없습니다. 자동 수집·자동 게시를 사용하지 않습니다.</p>
    <form id="update-form" class="update-form">
      <label>출처 유형<select name="sourceType" required><option value="NEWSTART_FUND">새출발기금</option><option value="FSC">금융위원회</option><option value="CCRS">신용회복위원회</option><option value="FSS">금융감독원</option><option value="PUBLIC_AGENCY">기타 공공기관</option><option value="HOPE_RETURN_PACKAGE">희망리턴패키지</option></select></label>
      <label>출처명<input name="sourceName" required placeholder="금융위원회"></label>
      <label class="wide">제목<input name="title" required maxlength="200"></label>
      <label class="wide">짧은 요약<textarea name="summary" required rows="3"></textarea></label>
      <label>공식 문서 ID<input name="officialDocumentId"></label>
      <label>공식 원문 URL<input name="originalUrl" type="url" placeholder="https://"></label>
      <label>공식 발표 시각<input name="publishedAt" type="datetime-local"></label>
      <label>적용 시작 시각<input name="effectiveFrom" type="datetime-local"></label>
      <label>적용 종료 시각<input name="effectiveTo" type="datetime-local"></label>
      <label>분류<select name="category" required><option value="POLICY">제도 변경</option><option value="ELIGIBILITY">지원 대상</option><option value="APPLICATION">신청·접수</option><option value="DEBT_ADJUSTMENT">채무조정</option><option value="NOTICE">공지</option><option value="OTHER">기타</option></select></label>
      <button class="btn btn-primary" type="submit">REVIEW 후보 등록</button>
      <span id="form-message" class="hint"></span>
    </form>
    <div class="updates-table-wrap"><table class="updates-table"><thead><tr><th>상태</th><th>중요도</th><th>출처 / 제목</th><th>발견일시</th><th>날짜</th><th>URL</th><th>관리</th></tr></thead><tbody id="updates-body"><tr><td colspan="7">불러오는 중...</td></tr></tbody></table></div>
  </main>
  <script src="/js/admin_newstart_updates.js?v=20260922-1" defer></script>
</body>
</html>
