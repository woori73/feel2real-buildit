<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 - 계정 보안</title>
  <th:block th:replace="~{fragments/_admin_topnav :: head}"></th:block>
  <link rel="stylesheet" href="/css/admin_students.css">
  <style>
    .ac-card { background:#fff; border:1px solid #edf2f7; border-radius:12px; padding:22px; max-width:560px; box-shadow:0 4px 20px rgba(0,0,0,.05); }
    .ac-card label { display:block; font-size:13px; font-weight:700; color:#2d3748; margin:14px 0 6px; }
    .ac-card input { width:100%; box-sizing:border-box; padding:11px 12px; border:1px solid #cbd5e0; border-radius:8px; font-size:15px; }
    .ac-hint { font-size:12px; color:#718096; margin:6px 0 0; }
    .ac-warn { background:#fffaf0; border:1px solid #fbd38d; border-radius:8px; padding:12px 14px; font-size:13px; color:#744210; margin:0 0 6px; }
    .ac-btn { margin-top:20px; width:100%; padding:13px; border:none; border-radius:8px; background:#2b6cb0; color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
    .ac-btn:disabled { opacity:.6; cursor:default; }
    .ac-msg { margin-top:14px; font-size:13px; display:none; }
    .ac-msg.err { color:#c53030; display:block; }
    .ac-msg.ok { color:#2f855a; display:block; }
  </style>
</head>
<body>
  <th:block th:replace="~{fragments/_admin_topnav :: topnav('account')}"></th:block>

  <div class="container">
    <div class="section-header">
      <div class="section-title">계정 보안</div>
      <div class="section-subtitle">관리자 로그인 ID와 비밀번호를 함께 바꿉니다. 새 ID·비밀번호는 이 화면에서 직접 입력하세요(다른 곳에 전달하지 않습니다).</div>
    </div>

    <form class="ac-card" id="acForm" autocomplete="off">
      <p class="ac-warn">변경하면 <b>이전 ID·비밀번호로는 로그인할 수 없고</b>, 이미 로그인된 모든 관리자 세션이 종료됩니다. 변경 후 새 ID·비밀번호로 다시 로그인합니다. 관리자 권한과 운영 데이터는 그대로 유지됩니다.</p>

      <label for="acCurrent">현재 비밀번호</label>
      <input id="acCurrent" type="password" autocomplete="current-password" required>

      <label for="acLoginId">새 로그인 ID</label>
      <input id="acLoginId" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      <p class="ac-hint">영문·숫자로 시작하는 6~50자 (영문, 숫자, . _ - 사용). 추측하기 쉬운 ID(admin 등)는 피하세요.</p>

      <label for="acNew">새 비밀번호</label>
      <input id="acNew" type="password" autocomplete="new-password" required>
      <p class="ac-hint">16자 이상. 새 로그인 ID를 포함하거나 현재 비밀번호와 같으면 안 됩니다.</p>

      <label for="acConfirm">새 비밀번호 확인</label>
      <input id="acConfirm" type="password" autocomplete="new-password" required>

      <button type="submit" class="ac-btn" id="acSubmit">로그인 ID·비밀번호 변경</button>
      <div class="ac-msg" id="acMsg" role="status" aria-live="polite"></div>
    </form>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin_account.js"></script>
</body>
</html>
