<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>예상문제 의뢰 관리 — Feel2Real</title>
  <style>
    body{margin:0;background:#f4f7fd;color:#1a2540;font-family:-apple-system,"Noto Sans KR",sans-serif}
    .w{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
    a{color:#1560ff;text-decoration:none}
    table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:14px}
    th,td{padding:10px;border-bottom:1px solid #e3e9f5;text-align:left;vertical-align:top}
    th{background:#eaf1ff}
    .scroll{overflow-x:auto}
  </style>
</head>
<body>
<div class="w">
  <p><a href="/admin/hub">← 관리자 허브</a> · <a href="/">홈으로</a></p>
  <h1>예상문제 의뢰 관리</h1>
  <div class="scroll"><table>
    <thead><tr><th>접수일</th><th>학교/학년/회차</th><th>시험범위</th><th>연락처</th><th>요청사항</th><th>상태</th></tr></thead>
    <tbody id="rows"><tr><td colspan="6">불러오는 중...</td></tr></tbody>
  </table></div>
</div>
<script>
(function(){
  var ST=[['RECEIVED','접수'],['IN_PROGRESS','제작 중'],['DONE','전달 완료'],['CANCELED','취소']];
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function load(){
    fetch('/api/admin/exam-requests',{credentials:'same-origin'}).then(function(r){return r.ok?r.json():[];}).then(function(list){
      var b=document.getElementById('rows');
      if(!list.length){b.innerHTML='<tr><td colspan="6">접수된 의뢰가 없습니다.</td></tr>';return;}
      b.innerHTML=list.map(function(x){
        var opts=ST.map(function(s){return '<option value="'+s[0]+'"'+(s[0]===x.status?' selected':'')+'>'+s[1]+'</option>';}).join('');
        return '<tr><td>'+esc((x.createdAt||'').replace('T',' ').slice(0,16))+'</td><td>'+esc(x.schoolName)+' / '+esc(x.grade)+' / '+esc(x.examRound)+'</td><td>'+esc(x.examScope)+'</td><td>'+esc(x.contact)+'</td><td>'+esc(x.memo)+'</td><td><select data-id="'+x.id+'">'+opts+'</select></td></tr>';
      }).join('');
    });
  }
  document.addEventListener('change',function(e){
    var id=e.target.getAttribute&&e.target.getAttribute('data-id');
    if(!id)return;
    fetch('/api/admin/exam-requests/'+id+'/status',{method:'PATCH',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:e.target.value})})
      .then(function(r){if(!r.ok)alert('상태 변경에 실패했습니다.');load();});
  });
  load();
})();
</script>
</body>
</html>
