<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 - 시험 분석 자료 관리</title>
  <th:block th:replace="~{fragments/_admin_topnav :: head}"></th:block>
  <link rel="stylesheet" href="/css/admin_analyzes.css">
</head>
<body>
  <th:block th:replace="~{fragments/_admin_topnav :: topnav('analyzes')}"></th:block>

  <main class="main">
    <div class="section-header">
      <div>
        <h2 class="section-title">학교 시험 분석 자료</h2>
        <span class="section-hint">최근 학습기록 카드처럼 분석 자료를 관리합니다. 새 분석자료를 눌러 HTML 파일을 업로드하세요.</span>
      </div>
      <button class="btn btn-primary" onclick="openCreateModal()">+ 새 분석자료</button>
    </div>

    <section id="analysisList" class="analysis-grid" aria-live="polite">
      <div class="empty-card">불러오는 중...</div>
    </section>
  </main>

  <div id="analysisModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="formTitle">
      <div class="modal-header">
        <h2 id="formTitle" class="modal-title">분석 자료 등록</h2>
        <button class="modal-close" type="button" onclick="closeModal()" aria-label="닫기">×</button>
      </div>
      <div class="modal-body">
        <form id="analysisForm">
          <input id="analysisId" type="hidden">
          <div class="form-grid">
            <div class="field full"><label for="title">제목</label><input id="title" required placeholder="압구정중 2학년 1학기 중간 영어 분석"></div>
            <div class="field"><label for="schoolName">학교명</label><input id="schoolName" required placeholder="압구정중"></div>
            <div class="field"><label for="grade">학년</label><input id="grade" type="number" min="1" max="12" required placeholder="2"></div>
            <div class="field"><label for="semesterSelect">학기</label><select id="semesterSelect"><option>1학기</option><option>2학기</option><option>기타</option></select></div>
            <div class="field other-row" id="semesterOtherRow"><label for="semesterOther">기타 학기</label><input id="semesterOther" placeholder="자유 입력"></div>
            <div class="field"><label for="examTypeSelect">시험 종류</label><select id="examTypeSelect"><option>중간</option><option>기말</option><option>기타</option></select></div>
            <div class="field other-row" id="examTypeOtherRow"><label for="examTypeOther">기타 시험 종류</label><input id="examTypeOther" placeholder="자유 입력"></div>
            <div class="field"><label for="subjectId">과목</label><select id="subjectId" required></select></div>
            <div class="field"><label for="file">HTML 파일 <span id="fileHint" class="muted"></span></label><input id="file" type="file" accept=".html,.htm"></div>
            <label class="check-row"><input id="visible" type="checkbox" checked> 공개</label>
          </div>
          <div class="form-actions">
            <button class="btn btn-secondary" type="button" onclick="closeModal()">취소</button>
            <button class="btn btn-primary" type="submit">저장</button>
          </div>
          <p id="formMessage" class="muted" style="margin-top:12px;"></p>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin_analyzes.js"></script>
</body>
</html>
