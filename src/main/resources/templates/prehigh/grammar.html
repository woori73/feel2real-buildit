<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <title th:text="${examTitle} + ' · 예비고1 어법 모의고사'">예비고1 어법 모의고사</title>
  <link rel="stylesheet" href="/css/naesin.css?v=pre-high-grammar-pdf-1">
  <script defer src="/js/naesin_common.js"></script>
  <script defer src="/js/pre_high_grammar.js?v=2"></script>
</head>
<body class="nt-body nt-run">
<div class="nt-top"><div class="nt-top-l">
  <a class="nt-brand" href="/"><img src="/img/F2R_logo_pure.svg" width="30" height="30" alt="">F2R영어</a>
  <a class="nt-btn nt-btn-line" href="/naesintest/pre-high#grammar">어법 모의고사 목록</a>
</div><span>숫자 1~5로도 답을 고를 수 있습니다</span></div>
<main class="nt-sheet-wrap" id="ph-grammar" th:data-api="${examApi}" th:data-seconds="${seconds}">
  <header class="nt-paperhead">
    <h1 class="nt-paperhead-title">예비고1 어법 모의고사</h1>
    <p class="nt-paperhead-title nt-paperhead-sub" th:text="${examTitle}">CH 3 · 수동태</p>
    <table>
      <tr><th scope="col">영역</th><th scope="col">문항</th><th scope="col" id="ph-grammar-time-label">문항당 제한 시간</th></tr>
      <tr><td>어법</td><td th:text="${count}">20</td><td id="nt-timer-box"><span class="nt-time" id="ph-grammar-time" role="timer" th:text="'00:' + ${seconds}">00:20</span></td></tr>
    </table>
  </header>
  <details class="nt-page ph-grammar-pdf" th:if="${pdfPath != null}">
    <summary>문항별 PDF 다운로드</summary>
    <div class="ph-grammar-pdf-links">
      <a th:each="number : ${#numbers.sequence(1, count)}" class="nt-btn nt-btn-line"
         th:href="|${pdfPath}/${number}/pdf|" th:text="|${number}번|" th:aria-label="|${number}번 문제지 PDF 다운로드|">1번</a>
    </div>
  </details>
  <p id="ph-grammar-status" role="status" hidden></p>
  <div id="ph-grammar-body">
    <section class="nt-page">
      <p th:text="${count} + '문항을 한 문제씩 풉니다. ' + ${seconds} + '초 안에 답을 고르지 않으면 미응답으로 처리되고 다음 문항이 열립니다.'">20문항을 한 문제씩 풉니다.</p>
      <button class="nt-btn" type="button" data-action="start">시험 시작 / 이어 풀기</button>
    </section>
  </div>
</main>
</body>
</html>
