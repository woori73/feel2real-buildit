<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy 장부 - 검토함</title>
  <th:block th:replace="~{fragments/_admin_topnav :: head}"></th:block>
  <link rel="stylesheet" href="/css/easy.css">
</head>
<body>
<th:block th:replace="~{fragments/_admin_topnav :: topnav('easy')}"></th:block>
<div class="easy-container">
  <div class="easy-title" id="pageTitle">장부 검토함</div>
  <p class="easy-sub">승인은 거래 수정·정정 기록·재분개·검토 종료를 한 번에 처리합니다. 보류는 저장하지 않습니다.</p>
  <div class="easy-card">
    <div class="form-row">
      <div class="form-group"><label for="business">사업체</label><select id="business"></select></div>
      <div class="form-group"><label for="kind">검토 유형</label><select id="kind">
        <option value="">전체</option><option value="UNCLASSIFIED">계정 미분류</option>
        <option value="EVIDENCE">증빙</option><option value="WITHHOLDING">강사 원천징수</option>
        <option value="BUSINESS">사업체</option><option value="DUPLICATE_SUSPECT">중복 의심</option>
        <option value="IMPORT_UNCONFIRMED">가져오기 대기</option><option value="MISSING_EXPENSE">누락 비용</option>
      </select></div>
    </div>
    <button class="btn-secondary" id="search" type="button">조회하기</button>
  </div>
  <div class="easy-card">
    <div class="section-head"><h2>확인 필요 항목</h2><span class="s" id="count"></span></div>
    <ul class="item-list" id="reviews"></ul>
  </div>
</div>
<script src="/js/api.js"></script><script src="/js/easy_api.js"></script>
<script src="/js/easy_reviews.js"></script>
</body>
</html>
