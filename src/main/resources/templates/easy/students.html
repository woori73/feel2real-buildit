<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy 회계 - 학생 원장</title>
  <th:block th:replace="~{fragments/_admin_topnav :: head}"></th:block>
  <link rel="stylesheet" href="/css/easy.css">
</head>
<body>
  <th:block th:replace="~{fragments/_admin_topnav :: topnav('easy')}"></th:block>

  <div class="easy-container">
    <div class="easy-title" id="pageTitle">학생 원장</div>
    <p class="easy-sub">회계 내부 원장입니다 (Wiki 계정과 연결하지 않음).</p>

    <div id="listView">
      <div class="easy-card">
        <div class="section-head">
          <h2>학생 등록</h2>
          <button class="btn-edit-link" id="toggleForm" type="button">접기 ›</button>
        </div>
        <div id="studentForm">
          <div class="form-row">
            <div class="form-group">
              <label for="fName" class="required">학생 이름</label>
              <input type="text" id="fName" placeholder="예: 김OO">
            </div>
            <div class="form-group">
              <label for="fStatus">재원 상태</label>
              <select id="fStatus">
                <option value="ENROLLED">재원</option>
                <option value="WITHDRAWN">퇴원</option>
                <option value="GRADUATED">졸업</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="fSchool">학교</label>
              <input type="text" id="fSchool" placeholder="예: 압구정중">
            </div>
            <div class="form-group">
              <label for="fGrade">학년</label>
              <input type="number" id="fGrade" min="0" max="12" step="1" placeholder="예: 2">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="fPhone">연락처</label>
              <input type="text" id="fPhone" placeholder="선택">
            </div>
            <div class="form-group">
              <label for="fParentPhone">학부모 연락처</label>
              <input type="text" id="fParentPhone" placeholder="선택">
            </div>
          </div>
          <div class="form-group">
            <label for="fEnrolledOn">등록일</label>
            <input type="date" id="fEnrolledOn">
          </div>
          <div class="form-group">
            <label for="fMemo">메모</label>
            <input type="text" id="fMemo">
          </div>
          <button class="btn-primary" id="btnSave" type="button">등록하기</button>
          <p class="error-msg" id="formError"></p>
        </div>
      </div>

      <div class="easy-card">
        <h2>학생 목록</h2>
        <p class="desc">이름을 누르면 수납 내역을 볼 수 있습니다.</p>
        <ul class="item-list" id="studentList"></ul>
      </div>
    </div>

    <div id="detailView" style="display:none">
      <div class="easy-card">
        <div class="section-head">
          <h2 id="detailName"></h2>
          <a href="/easy/students">목록으로 ›</a>
        </div>
        <p class="desc" id="detailInfo"></p>
        <div class="stat-grid" id="detailStats"></div>
      </div>
      <div class="easy-card">
        <div class="section-head">
          <h2>수납 내역</h2>
          <a href="/easy/payments">수납 등록 ›</a>
        </div>
        <ul class="item-list" id="detailPayments"></ul>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/easy_api.js"></script>
  <script src="/js/easy_students.js"></script>
</body>
</html>
