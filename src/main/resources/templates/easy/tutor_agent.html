<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy AI 장부</title>
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <link rel="stylesheet" href="/css/easy.css">
  <link rel="stylesheet" href="/css/easy_tutor_agent.css">
</head>
<body>
<header class="tutor-easy-head">
  <a class="tutor-easy-brand" href="/tutor/academy">BuildIt Easy</a>
  <div class="tutor-easy-head-actions">
    <label for="businessSelect">장부</label>
    <select id="businessSelect" aria-label="장부 사업체"></select>
    <a href="/tutor/academy">내 Academy</a>
  </div>
</header>

<main class="tutor-easy-shell">
  <section class="tutor-easy-main" aria-labelledby="agentTitle">
    <div class="agent-heading">
      <div><h1 id="agentTitle">AI 장부 도우미</h1><p>조회와 변경 제안을 도와드려요. 변경은 승인 버튼을 눌러야 반영됩니다.</p></div>
      <span id="connectionState" class="agent-status">연결 중</span>
    </div>

    <div class="quick-prompts" aria-label="빠른 질문">
      <button type="button" data-prompt="이번 달 매출과 지출 알려줘">이번 달 요약</button>
      <button type="button" data-prompt="아직 분류하지 않은 거래 보여줘">미분류 거래</button>
      <button type="button" data-prompt="장부에 반영해줘">장부 반영</button>
      <button type="button" data-prompt="시산표 확인해줘">시산표 확인</button>
    </div>

    <div id="chatMessages" class="chat-messages" role="log" aria-live="polite" aria-busy="false">
      <div class="chat-empty">무엇을 도와드릴까요? CSV를 올리거나 장부에 관해 질문해 보세요.</div>
    </div>

    <form id="chatForm" class="chat-composer">
      <label class="sr-only" for="chatInput">장부 요청</label>
      <textarea id="chatInput" rows="2" maxlength="2000" placeholder="예: 23번 거래는 임차료로 분류해줘" required></textarea>
      <button id="sendButton" type="submit">보내기</button>
    </form>
    <p id="chatError" class="agent-error" role="alert" hidden></p>
  </section>

  <aside class="tutor-easy-side">
    <section class="side-card" aria-labelledby="uploadTitle">
      <div class="side-card-head"><h2 id="uploadTitle">CSV 가져오기</h2><span>원본 보존</span></div>
      <form id="uploadForm" class="upload-form">
        <input id="csvFile" type="file" accept=".csv,text/csv" required>
        <button id="uploadButton" type="submit">업로드</button>
      </form>
      <p id="uploadResult" class="side-note" aria-live="polite">업로드 후 기존 분류 규칙으로 추천합니다.</p>
    </section>

    <section class="side-card" aria-labelledby="batchTitle">
      <div class="side-card-head"><h2 id="batchTitle">가져온 거래</h2><button id="refreshBatches" type="button">새로고침</button></div>
      <div id="batchList" class="batch-list"><p class="side-note">거래를 불러오는 중입니다.</p></div>
    </section>

    <section class="side-card" aria-labelledby="bookTitle">
      <div class="side-card-head"><h2 id="bookTitle">장부 조회</h2><span id="bookPeriod"></span></div>
      <div class="book-actions">
        <button type="button" data-prompt="총계정원장 보여줘">총계정원장</button>
        <button id="trialBalanceButton" type="button">시산표</button>
      </div>
      <div id="bookResult" class="book-result"><p class="side-note">대화 또는 버튼으로 조회하세요.</p></div>
    </section>
  </aside>
</main>

<script src="/js/api.js"></script>
<script src="/js/easy_tutor_agent.js"></script>
</body>
</html>
