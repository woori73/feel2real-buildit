<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy 회계 - 카드 이벤트 검토</title>
  <th:block th:replace="~{fragments/_admin_topnav :: head}"></th:block>
  <link rel="stylesheet" href="/css/easy.css">
</head>
<body>
  <th:block th:replace="~{fragments/_admin_topnav :: topnav('easy')}"></th:block>

  <div class="easy-container">
    <div class="easy-title">카드 이벤트 검토</div>
    <p class="easy-sub">검토 대기 중인 카드 관찰 건을 확인하고, 계정을 확정한 뒤 승인하면 장부에 반영됩니다.</p>

    <div class="easy-card">
      <div class="form-group">
        <label for="qBusiness">사업체</label>
        <select id="qBusiness"></select>
      </div>
      <button class="btn-secondary" id="btnRefresh" type="button">새로고침</button>
      <p class="error-msg" id="listError"></p>
      <p class="success-msg" id="listOk"></p>
      <ul class="item-list" id="reviewList" style="margin-top:12px"></ul>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/easy_api.js"></script>
  <script src="/js/easy_card_review.js"></script>
</body>
</html>
