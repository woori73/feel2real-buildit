<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy 회계 - 대시보드</title>
  <th:block th:replace="~{fragments/_admin_topnav :: head}"></th:block>
  <link rel="stylesheet" href="/css/easy.css">
</head>
<body>
  <th:block th:replace="~{fragments/_admin_topnav :: topnav('easy')}"></th:block>

  <div class="easy-container">
    <div class="easy-title">회계 대시보드</div>
    <p class="easy-sub" id="scopeLabel">지금 상태를 먼저 보고 필요한 작업으로 이동하세요.</p>

    <div class="biz-switch" id="bizSwitch"></div>

    <div class="month-nav">
      <button id="prevMonth" type="button">‹ 이전 달</button>
      <span class="month-label" id="monthLabel"></span>
      <button id="nextMonth" type="button">다음 달 ›</button>
    </div>

    <div class="stat-grid" id="statGrid"></div>

    <div class="easy-card">
      <div class="section-head">
        <h2>올해 vs 작년 동기</h2>
        <span class="s" id="yoyRange" style="font-size:12px;color:#a0aec0"></span>
      </div>
      <p class="desc">1월 1일 ~ 오늘과 작년 같은 기간을 비교합니다.</p>
      <div class="yoy-grid" id="yoyGrid"></div>
    </div>

    <div class="easy-card">
      <div class="section-head">
        <h2>AI가 확인할 장부</h2>
        <button class="btn-edit-link" id="btnRebuild" type="button">다시 찾기 ›</button>
      </div>
      <p class="desc">판정이 아니라 확인 필요 목록입니다.</p>
      <div class="review-grid" id="reviewGrid"></div>
    </div>

    <div class="easy-card">
      <div class="section-head">
        <h2>경영 브리핑</h2>
      </div>
      <ul class="brief-list" id="briefList"></ul>
    </div>

    <div class="easy-card">
      <div class="section-head">
        <h2>종합소득세 예상</h2>
      </div>
      <p class="desc" id="taxPreview">실제 장부·신고 자료 확보 후 계산합니다.</p>
    </div>

    <div class="easy-card">
      <div class="section-head">
        <h2>최근 거래</h2>
        <a href="/easy/transactions">전체 보기 ›</a>
      </div>
      <ul class="item-list" id="recentList"></ul>
    </div>

    <div class="easy-card">
      <div class="section-head">
        <h2>미수 학생</h2>
        <a href="/easy/payments">수납 관리 ›</a>
      </div>
      <ul class="item-list" id="overdueList"></ul>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/easy_api.js"></script>
  <script src="/js/easy_dashboard.js"></script>
  <script src="/js/easy_insight.js"></script>
</body>
</html>
