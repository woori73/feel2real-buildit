<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academy 블로그 관리</title>
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <link rel="stylesheet" href="/css/tutor_academy.css">
  <link rel="stylesheet" href="/css/academy_blog.css">
</head>
<body>
  <main class="page">
    <div class="topbar">
      <div><div class="brand">Academy 블로그</div><p class="muted">한글 글과 이미지를 작성해 공개 Academy SEO 콘텐츠로 발행합니다.</p></div>
      <div class="topbar-actions">
        <a class="btn btn-ghost" href="/tutor/academy">내 Academy</a>
        <th:block th:replace="~{fragments/_account_menu :: accountMenu('/tutor/academy', '강사 홈')}"></th:block>
        <a class="btn btn-primary" href="/tutor/academy/posts/new">새 글 작성 +</a>
      </div>
    </div>
    <section class="card">
      <div class="topbar"><h2>글 목록</h2><span id="postCount" class="muted"></span></div>
      <div id="postList" class="blog-post-list"><p class="muted">글을 불러오는 중...</p></div>
    </section>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/tutor_academy_posts.js"></script>

</body>
</html>
