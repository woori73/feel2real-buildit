<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F2R - 대시보드</title>
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <link rel="stylesheet" href="/css/tutor_dashboard.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <img src='/img/F2R_logo_pure.svg' alt='F2R' style='height:32px;'>
    <div class="header-right">
      <span class="tutor-name" id="tutorNameDisplay"></span>
      <a class="btn-profile" href="/my/profile">내 프로필</a>
      <button class="btn-logout" onclick="handleLogout()">로그아웃</button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main">
    <div class="section-header">
      <div>
        <h2 class="section-title">내 학생 목록</h2>
        <p class="student-count" id="studentCount"></p>
      </div>
    </div>

    <div class="student-grid" id="studentGrid">
      <!-- 학생 카드가 여기에 동적으로 추가됩니다 -->
    </div>
  </main>

  <!-- 학생 추가 모달 -->
  <div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
    <div class="modal">
      <h3 class="modal-title">새 학생 추가</h3>

      <div class="form-row">
        <div class="form-group">
          <label for="studentLoginId">아이디 <span class="required">*</span></label>
          <input type="text" id="studentLoginId" placeholder="로그인 아이디">
        </div>
        <div class="form-group">
          <label for="studentPassword">비밀번호 <span class="required">*</span></label>
          <input type="password" id="studentPassword" placeholder="8자 이상">
        </div>
        <div class="form-group">
          <label for="studentName">이름 <span class="required">*</span></label>
          <input type="text" id="studentName" placeholder="학생 이름">
        </div>
        <div class="form-group">
          <label for="studentNickname">닉네임 <span class="required">*</span></label>
          <input type="text" id="studentNickname" placeholder="커뮤니티 표시명" maxlength="20">
        </div>
        <div class="form-group">
          <label for="studentPhone">전화번호</label>
          <input type="tel" id="studentPhone" placeholder="010-0000-0000">
        </div>
        <div class="form-group">
          <label for="studentSchool">학교명 <span class="required">*</span></label>
          <input type="text" id="studentSchool" placeholder="○○중학교">
        </div>
        <div class="form-group">
          <label for="studentGrade">학년 <span class="required">*</span></label>
          <select id="studentGrade">
            <option value="">선택</option>
            <option value="1">1학년</option>
            <option value="2">2학년</option>
            <option value="3">3학년</option>
          </select>
        </div>
        <div class="form-group">
          <label for="studentSubject">과목 <span class="required">*</span></label>
          <select id="studentSubject">
            <option value="">선택</option>
          </select>
        </div>
      </div>

      <p class="error-msg" id="modalErrorMsg"></p>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">취소</button>
        <button class="btn-primary" id="submitBtn" onclick="handleAddStudent()">학생 추가</button>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;

    async function init() {
      // sessionStorage 비어도 JWT 쿠키로 복원 (탭/브라우저 재시작 대응)
      currentUser = await ensureCurrentUser();
      if (!currentUser) {
        location.href = '/home';
        return;
      }

      // 강사가 아니면 접근 불가 (추후 역할별 대시보드로 분기 가능)
      if (currentUser.role !== 'TUTOR') {
        alert('강사 계정으로 로그인해 주세요.');
        location.href = '/home';
        return;
      }

      document.getElementById('tutorNameDisplay').textContent = `${window.userDisplayName(currentUser)} 강사님`;

      await Promise.all([loadStudents(), loadSubjects()]);
    }

    async function loadStudents() {
      try {
        const res = await fetch(`/api/users/tutors/${currentUser.userId}/students`);
        if (!res.ok) throw new Error();
        const students = await res.json();
        renderStudents(students);
      } catch {
        renderStudents([]);
      }
    }

    async function loadSubjects() {
      try {
        const res = await fetch('/api/subjects');
        if (!res.ok) return;
        const subjects = await res.json();
        const select = document.getElementById('studentSubject');
        subjects.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.subjectId;
          opt.textContent = s.nameKo;
          select.appendChild(opt);
        });
      } catch { /* 과목 로드 실패 시 빈 드롭다운 유지 */ }
    }

    function renderStudents(students) {
      const grid = document.getElementById('studentGrid');
      const count = document.getElementById('studentCount');

      count.textContent = `총 ${students.length}명`;
      grid.innerHTML = '';

      if (students.length === 0) {
        grid.innerHTML = `
          <div style="grid-column:1/-1">
            <div class="empty-state">
              <p>아직 등록된 학생이 없습니다.</p>
              <small>아래 + 버튼을 눌러 첫 번째 학생을 추가해 보세요.</small>
            </div>
          </div>`;
      } else {
        students.forEach(student => {
          const card = document.createElement('div');
          card.className = 'student-card';
          const subjectTags = student.subjects.map(s =>
            `<span class="subject-tag">${s.nameKo}</span>`
          ).join('');
          card.innerHTML = `
            <div class="student-name">${escapeHtml(student.name)}</div>
            <div class="student-info">
              ${escapeHtml(student.schoolName)} · ${student.grade}학년<br>
              ${student.loginId}
            </div>
            <div class="subject-tags">${subjectTags}</div>
          `;
          card.onclick = () => {
            sessionStorage.setItem('currentStudent', JSON.stringify(student));
            location.href = '/stdt_dashboard';
          };
          grid.appendChild(card);
        });
      }

      // + 버튼 카드는 항상 마지막에
      const addCard = document.createElement('div');
      addCard.className = 'add-card';
      addCard.onclick = openModal;
      addCard.innerHTML = `
        <div class="add-icon">+</div>
        <span class="add-label">학생 추가</span>
      `;
      grid.appendChild(addCard);
    }

    function openModal() {
      document.getElementById('modalOverlay').classList.add('open');
      document.getElementById('studentLoginId').focus();
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
      clearModal();
    }

    function handleOverlayClick(e) {
      if (e.target === document.getElementById('modalOverlay')) closeModal();
    }

    function clearModal() {
      ['studentLoginId', 'studentPassword', 'studentName', 'studentNickname', 'studentPhone',
       'studentSchool'].forEach(id => {
        document.getElementById(id).value = '';
      });
      document.getElementById('studentGrade').value = '';
      document.getElementById('studentSubject').value = '';
      hideModalError();
    }

    async function handleAddStudent() {
      const loginId = document.getElementById('studentLoginId').value.trim();
      const password = document.getElementById('studentPassword').value;
      const name = document.getElementById('studentName').value.trim();
      const nickname = document.getElementById('studentNickname').value.trim();
      const phone = document.getElementById('studentPhone').value.trim();
      const schoolName = document.getElementById('studentSchool').value.trim();
      const grade = document.getElementById('studentGrade').value;
      const subjectId = document.getElementById('studentSubject').value;

      if (!loginId || !password || !name || !nickname || !schoolName || !grade || !subjectId) {
        showModalError('필수 항목을 모두 입력해 주세요.');
        return;
      }
      if (password.length < 8) {
        showModalError('비밀번호는 8자 이상이어야 합니다.');
        return;
      }
      if (!isValidNickname(nickname)) {
        showModalError('닉네임은 한글/영문/숫자/공백/_/- 조합 2~20자로 입력해 주세요.');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '추가 중...';

      try {
        const body = {
          tutorId: currentUser.userId,
          subjectId: parseInt(subjectId),
          loginId,
          password,
          name,
          nickname,
          phone: phone || null,
          schoolName,
          grade: parseInt(grade),
        };

        const res = await fetch('/api/users/students', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          showModalError(err.message || '학생 추가에 실패했습니다.');
          return;
        }

        closeModal();
        await loadStudents();
      } catch {
        showModalError('서버 연결에 실패했습니다.');
      } finally {
        btn.disabled = false;
        btn.textContent = '학생 추가';
      }
    }

    function isValidNickname(nickname) {
      return /^[가-힣A-Za-z0-9 _-]{2,20}$/.test(nickname.trim());
    }

    function showModalError(msg) {
      const el = document.getElementById('modalErrorMsg');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function hideModalError() {
      document.getElementById('modalErrorMsg').style.display = 'none';
    }

    async function handleLogout() {
      try { await fetch('/api/auth/logout', { method: 'POST' }); } catch (_) {}
      sessionStorage.removeItem('currentUser');
      location.href = '/';
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    init();
  </script>
</body>
</html>
