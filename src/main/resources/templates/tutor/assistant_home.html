<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="robots" content="noindex"/>
  <title>AI 홈페이지 만들기 — BuildIt</title>
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/assistant_home.css?v=20261012-4"/>
</head>
<body>
<div class="ah-app" id="ahApp">
  <header class="ah-top">
    <strong class="ah-brand">BuildIt</strong>
    <a class="ah-classic" href="/builder?classic=1" id="ahClassic">기존 빌더로 돌아가기</a>
  </header>

  <!-- 시작 화면 -->
  <main class="ah-start" id="ahStart">
    <h1>어떤 학원 홈페이지를 만들까요?</h1>
    <p class="ah-sub">학원 이름만 알려 주세요. 나머지는 대화하면서 채워요.</p>
    <form class="ah-card" id="ahStartForm" autocomplete="off">
      <label class="ah-label" for="ahName">학원 이름</label>
      <input class="ah-input" id="ahName" maxlength="100" placeholder="예: 새봄영어학원" required/>
      <label class="ah-label" for="ahDesc">어떤 학원인지 알려 주세요 (선택)</label>
      <textarea class="ah-input" id="ahDesc" rows="3" maxlength="1000"
                placeholder="예: 중학생 영어 내신을 소수정예로 지도해요"></textarea>
      <div class="ah-chosen" id="ahChosen" hidden>
        <span>선택한 샘플: <b id="ahChosenName"></b></span>
        <button type="button" id="ahChosenClear" class="ah-link">해제</button>
      </div>
      <button class="ah-primary" type="submit" id="ahStartBtn">홈페이지 만들기</button>
    </form>
    <h2 class="ah-h2">샘플로 시작하기</h2>
    <div class="ah-samples" id="ahSamples" aria-label="디자인 샘플"></div>
  </main>

  <!-- 대화 -->
  <section class="ah-chat" id="ahChat" hidden>
    <div class="ah-messages" id="ahMessages" role="log" aria-live="polite"></div>
    <form class="ah-composer" id="ahComposer" autocomplete="off">
      <input class="ah-input" id="ahInput" maxlength="1000" placeholder="메시지를 입력하세요"/>
      <button class="ah-send" type="submit" id="ahSend" aria-label="보내기">보내기</button>
    </form>
  </section>

  <!-- 작업 화면: 결과물(미리보기) 중심 + 하단 대화 입력. 생성 직후와 재진입 모두 이 화면에서 수정한다. -->
  <section class="ah-work" id="ahWork" hidden aria-label="홈페이지 작업 화면">
    <header class="ah-bar">
      <strong class="ah-brand">BuildIt</strong>
      <span class="ah-status" id="ahStatus" aria-live="polite"></span>
      <div class="ah-bar-actions">
        <button class="ah-ghost ah-undo" type="button" id="ahUndo" disabled aria-label="되돌리기">↶ 되돌리기 <b id="ahUndoCount">0</b></button>
        <button class="ah-primary ah-small" type="button" id="ahPublish">게시하기</button>
      </div>
    </header>
    <div class="ah-subbar">
      <div class="ah-seg" role="group" aria-label="화면 크기">
        <button type="button" data-dev="mobile" class="on" aria-pressed="true">모바일</button>
        <button type="button" data-dev="tablet" aria-pressed="false">태블릿</button>
        <button type="button" data-dev="desktop" aria-pressed="false">PC</button>
      </div>
      <span class="ah-draftnote">미리보기는 비공개 작업본이에요</span>
      <a class="ah-classic" href="/builder?classic=1" id="ahClassicWork">기존 빌더</a>
    </div>

    <div class="ah-stage" id="ahStage">
      <div class="ah-framewrap" id="ahFrameWrap"><div class="ah-device" id="ahDevice"><iframe id="ahFrame" title="홈페이지 미리보기"></iframe></div></div>
      <div class="ah-busy" id="ahBusy" hidden role="status" aria-live="polite">
        <div class="ah-busy-card"><ul class="ah-steps" id="ahBusySteps"></ul></div>
      </div>
    </div>

    <div class="ah-dock">
      <div class="ah-strip" id="ahStrip" hidden>
        <div class="ah-strip-text" id="ahStripText"></div>
        <ul class="ah-changes" id="ahChanges"></ul>
        <div class="ah-strip-actions"><button type="button" class="ah-link" id="ahStripUndo" hidden>이 수정 되돌리기</button><button type="button" class="ah-link" id="ahShowHistory">대화 보기</button></div>
      </div>
      <div class="ah-chips" id="ahChips" role="group" aria-label="추천 요청"></div>
      <form class="ah-composer" id="ahWorkComposer" autocomplete="off">
        <input class="ah-input" id="ahWorkInput" maxlength="1000" placeholder="예: 더 고급스러운 분위기로 바꿔 줘" aria-label="수정 요청"/>
        <button class="ah-send" type="submit" id="ahWorkSend" aria-label="보내기">보내기</button>
      </form>
    </div>

    <div class="ah-sheet" id="ahHistory" hidden role="dialog" aria-modal="true" aria-label="대화 기록">
      <div class="ah-sheet-head"><strong>대화 기록</strong><button class="ah-ghost" type="button" id="ahHistoryClose">닫기</button></div>
      <div class="ah-messages" id="ahHistoryList" role="log"></div>
    </div>

    <div class="ah-modal" id="ahConfirm" hidden role="dialog" aria-modal="true" aria-labelledby="ahConfirmTitle">
      <div class="ah-modal-card">
        <h2 id="ahConfirmTitle">홈페이지를 게시할까요?</h2>
        <p id="ahConfirmText"></p>
        <pre class="ah-overwrite" id="ahConfirmDetail" hidden></pre>
        <div class="ah-modal-actions">
          <button class="ah-secondary" type="button" id="ahConfirmCancel">취소</button>
          <button class="ah-primary" type="button" id="ahConfirmOk">게시하기</button>
        </div>
      </div>
    </div>
    <div class="ah-toast" id="ahToast" role="status" hidden></div>
  </section>
</div>
<script src="/js/assistant_home.js?v=20261013-1"></script>
</body>
</html>
