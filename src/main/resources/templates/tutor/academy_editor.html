<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${academyName != null ? '홈페이지 편집 — ' + academyName : '홈페이지 편집'}">홈페이지 편집</title>
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>

  <!-- GrapesJS CSS -->
  <link rel="stylesheet" href="https://unpkg.com/grapesjs@0.23.6/dist/css/grapes.min.css">

  <style>
    /* 편집기 레이아웃 */
    .editor-layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .editor-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: #1f2937;
      color: #fff;
      flex-shrink: 0;
    }
    .editor-toolbar .title {
      font-weight: 700;
      font-size: 16px;
      margin-right: auto;
    }
    .editor-toolbar button {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    .btn-device {
      background: #374151;
      color: #fff;
    }
    .btn-device.active {
      background: #3b82f6;
    }
    .btn-save {
      background: #10b981;
      color: #fff;
    }
    .btn-preview {
      background: #6b7280;
      color: #fff;
    }
    .btn-publish {
      background: #f59e0b;
      color: #fff;
    }
    .btn-back {
      background: transparent;
      color: #9ca3af;
      border: 1px solid #4b5563 !important;
    }
    .editor-main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .editor-sidebar-left {
      width: 260px;
      flex-shrink: 0;
      background: #f9fafb;
      border-right: 1px solid #e5e7eb;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .editor-canvas-wrap {
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    #gjs-canvas {
      height: 100%;
    }
    .editor-sidebar-right {
      width: 280px;
      flex-shrink: 0;
      background: #f9fafb;
      border-left: 1px solid #e5e7eb;
      overflow-y: auto;
    }
    .sidebar-tab {
      display: flex;
      border-bottom: 1px solid #e5e7eb;
    }
    .sidebar-tab button {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: #6b7280;
    }
    .sidebar-tab button.active {
      color: #1f2937;
      border-bottom: 2px solid #3b82f6;
    }
    .sidebar-panel {
      display: none;
      padding: 12px;
    }
    .sidebar-panel.active {
      display: block;
    }
    .preset-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .preset-btn {
      padding: 12px 8px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
    }
    .preset-btn:hover {
      border-color: #3b82f6;
    }
    .preset-btn.active {
      border-color: #3b82f6;
      background: #eff6ff;
    }
    .save-status {
      font-size: 12px;
      color: #9ca3af;
      padding: 8px 16px;
    }
    .save-status.saving { color: #f59e0b; }
    .save-status.saved { color: #10b981; }
    .panel-close-btn {
      display: none;
      position: absolute;
      top: 8px;
      right: 8px;
      width: 32px;
      height: 32px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      font-size: 16px;
      z-index: 10;
    }
    @media (max-width: 1024px) {
      .editor-sidebar-left.mobile-open .panel-close-btn,
      .editor-sidebar-right.mobile-open .panel-close-btn {
        display: block;
      }
      .editor-sidebar-left, .editor-sidebar-right {
        position: relative;
      }
    }

    /* GrapesJS 패널 스타일 조정 */
    .gjs-pn-panel { position: relative; }
    #gjs-canvas .gjs-cv-canvas { width: 100%; height: 100%; }

    /* 모바일 대응 */
    @media (max-width: 1024px) {
      .editor-sidebar-left { display: none; }
      .editor-sidebar-left.mobile-open {
        display: flex;
        position: fixed;
        left: 0; top: 0; bottom: 0;
        z-index: 100;
        box-shadow: 2px 0 8px rgba(0,0,0,0.1);
      }
      .editor-sidebar-right {
        width: 240px;
      }
    }
    @media (max-width: 768px) {
      .editor-sidebar-right { display: none; }
      .editor-sidebar-right.mobile-open {
        display: block;
        position: fixed;
        right: 0; top: 0; bottom: 0;
        z-index: 100;
        box-shadow: -2px 0 8px rgba(0,0,0,0.1);
      }
      .editor-toolbar { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
<div class="editor-layout">
  <!-- 상단 툴바 -->
  <div class="editor-toolbar">
    <button class="btn-back" onclick="history.back()">← 돌아가기</button>
    <button class="btn-device" id="toggleLeftPanel" title="블록 패널">📦</button>
    <button class="btn-device" id="toggleRightPanel" title="스타일 패널">🎨</button>
    <span class="title" th:text="${academyName ?: '홈페이지 편집'}">홈페이지 편집</span>

    <!-- 디바이스 전환 -->
    <button class="btn-device active" data-device="Desktop" title="PC">🖥️ PC</button>
    <button class="btn-device" data-device="Tablet" title="태블릿">📱 태블릿</button>
    <button class="btn-device" data-device="Mobile" title="모바일">📲 모바일</button>

    <button class="btn-preview" id="previewBtn">미리보기</button>
    <button class="btn-save" id="saveBtn">💾 저장</button>
    <button class="btn-publish" id="publishBtn" disabled title="게시 기능은 준비 중입니다">🚀 게시 (준비 중)</button>
  </div>
  <div class="save-status" id="saveStatus">변경사항이 없습니다.</div>

  <!-- 메인 영역 -->
  <div class="editor-main">
    <!-- 좌측: 블록 패널 -->
    <div class="editor-sidebar-left" id="blocksPanel">
      <button class="panel-close-btn" id="closeLeftPanel" title="닫기">✕</button>
      <div class="sidebar-tab">
        <button class="active" data-panel="blocks">블록</button>
        <button data-panel="presets">프리셋</button>
      </div>
      <div class="sidebar-panel active" id="panel-blocks">
        <div id="gjs-blocks"></div>
      </div>
      <div class="sidebar-panel" id="panel-presets">
        <h4 style="margin: 0 0 8px; font-size: 14px;">디자인 프리셋</h4>
        <div class="preset-grid">
          <button class="preset-btn" data-preset="EXAM">📝<br>입시</button>
          <button class="preset-btn" data-preset="ENGLISH">🔤<br>영어</button>
          <button class="preset-btn" data-preset="ARTS">🎨<br>예체능</button>
          <button class="preset-btn" data-preset="STUDY">📚<br>스터디</button>
          <button class="preset-btn" data-preset="ONLINE">💻<br>온라인</button>
        </div>
        <p style="font-size: 12px; color: #6b7280;">
          프리셋을 선택하면 해당 스타일의 섹션을 추가할 수 있습니다.
        </p>
      </div>
    </div>

    <!-- 중앙: 캔버스 -->
    <div class="editor-canvas-wrap">
      <div id="gjs-canvas">
        <!-- 기존 P0 HTML이 여기에 로드됨 -->
        <div th:if="${pageHtml != null}" th:utext="${pageHtml}"></div>
        <div th:if="${pageHtml == null}" style="padding: 40px; text-align: center; color: #9ca3af;">
          <h2>홈페이지가 없습니다</h2>
          <p>좌측 블록 패널에서 섹션을 추가하여 홈페이지를 만드세요.</p>
        </div>
      </div>
    </div>

    <!-- 우측: 스타일/레이어 패널 -->
    <div class="editor-sidebar-right" id="stylePanel">
      <button class="panel-close-btn" id="closeRightPanel" title="닫기">✕</button>
      <div class="sidebar-tab">
        <button class="active" data-panel="style">스타일</button>
        <button data-panel="layers">레이어</button>
        <button data-panel="traits">설정</button>
      </div>
      <div class="sidebar-panel active" id="panel-style">
        <div id="gjs-styles"></div>
      </div>
      <div class="sidebar-panel" id="panel-layers">
        <div id="gjs-layers"></div>
      </div>
      <div class="sidebar-panel" id="panel-traits">
        <div id="gjs-traits"></div>
      </div>
    </div>
  </div>
</div>

<!-- GrapesJS -->
<script src="https://unpkg.com/grapesjs@0.23.6/dist/grapes.min.js"></script>
<script th:inline="javascript">
/*<![CDATA[*/
const ACADEMY_ID = /*[[${academyId}]]*/ null;
const CSRF_TOKEN = /*[[${_csrf?.token}]]*/ '';
const CSRF_HEADER = /*[[${_csrf?.headerName}]]*/ 'X-CSRF-TOKEN';
/*]]>*/
</script>
<script>
(function() {
  'use strict';

  // GrapesJS 초기화
  const editor = grapesjs.init({
    container: '#gjs-canvas',
    fromElement: true,
    height: '100%',
    width: 'auto',
    storageManager: false,  // 서버 저장 사용

    // 디바이스 (PC/태블릿/모바일)
    deviceManager: {
      devices: [
        { name: 'Desktop', width: '' },
        { name: 'Tablet', width: '768px', widthMedia: '992px' },
        { name: 'Mobile', width: '375px', widthMedia: '768px' },
      ]
    },

    // 패널 연결
    blockManager: { appendTo: '#gjs-blocks' },
    layerManager: { appendTo: '#gjs-layers' },
    styleManager: {
      appendTo: '#gjs-styles',
      sectors: [
        { name: '일반', buildProps: ['float', 'display', 'position', 'top', 'right', 'left', 'bottom'] },
        { name: '크기', buildProps: ['width', 'height', 'max-width', 'min-height', 'margin', 'padding'] },
        { name: '타이포그래피', buildProps: ['font-family', 'font-size', 'font-weight', 'letter-spacing', 'color', 'line-height', 'text-align', 'text-shadow'] },
        { name: '장식', buildProps: ['border-radius', 'border', 'box-shadow', 'background'] },
        { name: '배경', buildProps: ['background-color', 'background-image'] },
      ],
    },
    traitManager: { appendTo: '#gjs-traits' },

    // 한글 폰트 기본 설정
    canvas: {
      styles: [
        'https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css'
      ],
    },
  });

  // ===== 커스텀 블록 정의 (P0 프리셋 기반) =====

  const blockManager = editor.BlockManager;

  // 기본 블록
  blockManager.add('text-block', {
    label: '📝 텍스트',
    category: '기본',
    content: '<p style="padding: 10px;">텍스트를 입력하세요. 클릭하여 수정할 수 있습니다.</p>',
  });

  blockManager.add('heading-block', {
    label: '📌 제목',
    category: '기본',
    content: '<h2 style="padding: 10px; font-size: 28px; font-weight: 700;">제목을 입력하세요</h2>',
  });

  blockManager.add('image-block', {
    label: '🖼️ 이미지',
    category: '기본',
    content: '<img src="https://via.placeholder.com/800x400?text=이미지" alt="이미지" style="max-width: 100%; height: auto;"/>',
  });

  blockManager.add('button-block', {
    label: '🔘 버튼',
    category: '기본',
    content: '<a href="#" style="display: inline-block; padding: 12px 32px; background: #3b82f6; color: #fff; border-radius: 8px; text-decoration: none; font-weight: 600;">버튼</a>',
  });

  blockManager.add('divider-block', {
    label: '➖ 구분선',
    category: '기본',
    content: '<hr style="margin: 20px 0; border: none; border-top: 1px solid #e5e7eb;"/>',
  });

  // 학원 섹션 블록 (P0 프리셋 기반)
  const presets = {
    EXAM: { name: '입시', color: '#1e40af', bg: '#eff6ff' },
    ENGLISH: { name: '영어', color: '#047857', bg: '#ecfdf5' },
    ARTS: { name: '예체능', color: '#7c3aed', bg: '#f5f3ff' },
    STUDY: { name: '스터디', color: '#b45309', bg: '#fffbeb' },
    ONLINE: { name: '온라인', color: '#0e7490', bg: '#ecfeff' },
  };

  Object.entries(presets).forEach(([key, p]) => {
    blockManager.add(`hero-${key.toLowerCase()}`, {
      label: `🏫 히어로 (${p.name})`,
      category: '학원 섹션',
      content: `
        <section data-preset="${key}" style="padding: 60px 20px; background: ${p.bg}; text-align: center;">
          <h1 style="font-size: 36px; font-weight: 800; color: ${p.color}; margin-bottom: 16px;">학원 이름을 입력하세요</h1>
          <p style="font-size: 18px; color: #4b5563; margin-bottom: 32px;">학원 소개 문구를 입력하세요</p>
          <a href="#" style="display: inline-block; padding: 14px 40px; background: ${p.color}; color: #fff; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 16px;">상담 신청하기</a>
        </section>
      `,
    });

    blockManager.add(`features-${key.toLowerCase()}`, {
      label: `✨ 특징 (${p.name})`,
      category: '학원 섹션',
      content: `
        <section data-preset="${key}" style="padding: 40px 20px;">
          <h2 style="font-size: 28px; font-weight: 700; text-align: center; margin-bottom: 32px; color: ${p.color};">우리 학원의 특징</h2>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto;">
            <div style="padding: 24px; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
              <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 8px;">특징 1</h3>
              <p style="color: #6b7280;">설명을 입력하세요</p>
            </div>
            <div style="padding: 24px; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
              <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 8px;">특징 2</h3>
              <p style="color: #6b7280;">설명을 입력하세요</p>
            </div>
            <div style="padding: 24px; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
              <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 8px;">특징 3</h3>
              <p style="color: #6b7280;">설명을 입력하세요</p>
            </div>
          </div>
        </section>
      `,
    });
  });

  // CTA 섹션
  blockManager.add('cta-section', {
    label: '📞 상담 신청 (CTA)',
    category: '학원 섹션',
    content: `
      <section class="sec-cta" style="padding: 60px 20px; background: #1f2937; text-align: center;">
        <h2 style="font-size: 32px; font-weight: 800; color: #fff; margin-bottom: 16px;">지금 상담 신청하세요</h2>
        <p style="font-size: 18px; color: #d1d5db; margin-bottom: 32px;">전문 상담원이 친절하게 안내해 드립니다</p>
        <a href="#" style="display: inline-block; padding: 16px 48px; background: #f59e0b; color: #fff; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 18px;">무료 상담 신청</a>
      </section>
    `,
  });

  // ===== 디바이스 전환 (패널 토글과 독립) =====
  document.querySelectorAll('.btn-device').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.btn-device').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      editor.setDevice(btn.dataset.device);
    });
  });

  // ===== 사이드바 탭 전환 =====
  document.querySelectorAll('.sidebar-tab button').forEach(btn => {
    btn.addEventListener('click', () => {
      const panel = btn.dataset.panel;
      const container = btn.closest('.editor-sidebar-left, .editor-sidebar-right');
      container.querySelectorAll('.sidebar-tab button').forEach(b => b.classList.remove('active'));
      container.querySelectorAll('.sidebar-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      container.querySelector(`#panel-${panel}`).classList.add('active');
    });
  });

  // ===== 저장 상태 표시 =====
  const saveStatus = document.getElementById('saveStatus');
  let saveTimer = null;
  let hasChanges = false;

  function markChanged() {
    hasChanges = true;
    saveStatus.textContent = '● 저장되지 않은 변경사항이 있습니다.';
    saveStatus.className = 'save-status saving';

    // 30초 후 자동 임시 저장
    clearTimeout(saveTimer);
    saveTimer = setTimeout(autoSave, 30000);
  }

  function markSaved() {
    hasChanges = false;
    saveStatus.textContent = '✓ 저장되었습니다.';
    saveStatus.className = 'save-status saved';
  }

  editor.on('change', markChanged);

  // ===== 저장 (revision 낙관적 잠금) =====
  let isSaving = false;
  let pendingSave = false;
  let currentRevision = 0;

  async function saveContent() {
    if (isSaving) {
      pendingSave = true;
      return false;
    }

    isSaving = true;
    pendingSave = false;

    const html = editor.getHtml();
    const css = editor.getCss();
    const projectData = JSON.stringify(editor.getProjectData());

    saveStatus.textContent = '저장 중...';
    saveStatus.className = 'save-status saving';

    try {
      const headers = { 'Content-Type': 'application/json' };
      if (CSRF_TOKEN) headers[CSRF_HEADER] = CSRF_TOKEN;

      const res = await fetch('/api/tutor/academy/page-settings/visual-editor/draft', {
        method: 'PUT',
        headers,
        body: JSON.stringify({ html, css, projectData, revision: currentRevision }),
      });

      // 409: 동시 수정 충돌
      if (res.status === 409) {
        const errData = await res.json().catch(() => ({}));
        saveStatus.textContent = '⚠️ ' + (errData.message || '다른 세션에서 수정되었습니다. 새로고침 후 다시 시도하세요.');
        saveStatus.className = 'save-status';
        if (confirm('다른 세션에서 수정되었습니다. 최신 초안을 불러오시겠습니까?\n(현재 수정 내용은 사라집니다)')) {
          await loadDraft();
        }
        isSaving = false;
        return false;
      }

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.message || `저장 실패 (${res.status})`);
      }

      const data = await res.json();
      currentRevision = data.revision;
      lastSavedAt = data.updatedAt || new Date().toISOString();

      if (pendingSave) {
        isSaving = false;
        return saveContent();
      }

      markSaved();
      isSaving = false;
      return true;
    } catch (e) {
      saveStatus.textContent = '❌ 저장 실패: ' + e.message + ' (다시 시도해 주세요)';
      saveStatus.className = 'save-status';
      console.error('저장 오류:', e);
      isSaving = false;
      return false;
    }
  }

  async function autoSave() {
    if (hasChanges) {
      await saveContent(true);
    }
  }

  document.getElementById('saveBtn').addEventListener('click', () => saveContent());

  // 게시 기능은 실제 로직 구현 전까지 비활성화

  // ===== 미리보기 (sandbox iframe) =====
  document.getElementById('previewBtn').addEventListener('click', () => {
    const html = editor.getHtml();
    const css = editor.getCss();

    // 모달로 미리보기 표시 (sandbox iframe)
    let modal = document.getElementById('previewModal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'previewModal';
      modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center;';
      modal.innerHTML = `
        <div style="background:#fff;border-radius:12px;width:90%;max-width:1000px;height:90%;display:flex;flex-direction:column;overflow:hidden;">
          <div style="padding:12px 16px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">
            <strong>미리보기</strong>
            <button id="closePreview" style="padding:6px 12px;border:1px solid #d1d5db;border-radius:6px;background:#fff;cursor:pointer;">닫기</button>
          </div>
          <iframe id="previewFrame" sandbox="" style="flex:1;border:none;width:100%;"></iframe>
        </div>
      `;
      document.body.appendChild(modal);
      modal.querySelector('#closePreview').addEventListener('click', () => {
        modal.style.display = 'none';
      });
      modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.style.display = 'none';
      });
    }

    const frame = modal.querySelector('#previewFrame');
    // srcdoc 사용: contentDocument에 직접 접근하지 않음
    // sandbox="" 로 스크립트 실행 차단 및 부모 창 격리
    const escapedHtml = html.replace(/`/g, '&#96;');
    const escapedCss = css.replace(/`/g, '&#96;');
    frame.srcdoc = `<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>${escapedCss}</style></head>
<body>${escapedHtml}</body>
</html>`;

    modal.style.display = 'flex';
  });

  // ===== 페이지 이탈 시 경고 =====
  window.addEventListener('beforeunload', (e) => {
    if (hasChanges) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  // ===== 초안 불러오기 =====
  let lastSavedAt = null;

  async function loadDraft() {
    try {
      const headers = {};
      if (CSRF_TOKEN) headers[CSRF_HEADER] = CSRF_TOKEN;

      const res = await fetch('/api/tutor/academy/page-settings/visual-editor/draft', {
        headers,
      });

      if (!res.ok) {
        console.warn('초안 불러오기 실패:', res.status);
        return;
      }

      const data = await res.json();
      currentRevision = data.revision || 0;
      if (data.html) {
        // 저장된 projectData가 있으면 사용, 없으면 HTML로 로드
        if (data.projectData && data.projectData !== '{}') {
          try {
            editor.loadProjectData(JSON.parse(data.projectData));
          } catch (e) {
            console.warn('projectData 파싱 실패, HTML로 로드:', e);
            editor.setComponents(data.html);
            editor.setStyle(data.css || '');
          }
        } else {
          editor.setComponents(data.html);
          editor.setStyle(data.css || '');
        }
        lastSavedAt = data.updatedAt;
        saveStatus.textContent = '✓ 초안을 불러왔습니다.' + (lastSavedAt ? ` (${new Date(lastSavedAt).toLocaleString('ko-KR')})` : '');
        saveStatus.className = 'save-status saved';
        hasChanges = false;
      }
    } catch (e) {
      console.error('초안 불러오기 오류:', e);
    }
  }

  // ===== 모바일 패널 토글 =====
  const leftPanel = document.getElementById('blocksPanel');
  const rightPanel = document.getElementById('stylePanel');
  const toggleLeftBtn = document.getElementById('toggleLeftPanel');
  const toggleRightBtn = document.getElementById('toggleRightPanel');

  function updateToggleButtons() {
    toggleLeftBtn.classList.toggle('active', leftPanel.classList.contains('mobile-open'));
    toggleRightBtn.classList.toggle('active', rightPanel.classList.contains('mobile-open'));
  }

  toggleLeftBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    leftPanel.classList.toggle('mobile-open');
    // 우측 패널이 열려있으면 닫기
    rightPanel.classList.remove('mobile-open');
    updateToggleButtons();
  });

  toggleRightBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    rightPanel.classList.toggle('mobile-open');
    // 좌측 패널이 열려있으면 닫기
    leftPanel.classList.remove('mobile-open');
    updateToggleButtons();
  });

  // 패널 외부 클릭 시 닫기 (모바일)
  document.addEventListener('click', (e) => {
    if (window.innerWidth <= 1024) {
      if (!leftPanel.contains(e.target) && e.target !== toggleLeftBtn) {
        leftPanel.classList.remove('mobile-open');
      }
      if (!rightPanel.contains(e.target) && e.target !== toggleRightBtn) {
        rightPanel.classList.remove('mobile-open');
      }
      updateToggleButtons();
    }
  });

  // 모바일 패널 닫기 버튼
  document.getElementById('closeLeftPanel').addEventListener('click', () => {
    leftPanel.classList.remove('mobile-open');
    updateToggleButtons();
  });
  document.getElementById('closeRightPanel').addEventListener('click', () => {
    rightPanel.classList.remove('mobile-open');
    updateToggleButtons();
  });

  // ===== 게시 버튼 비활성화 =====
  // 실제 게시 로직 구현 전까지 비활성화 유지
  const publishBtn = document.getElementById('publishBtn');
  publishBtn.disabled = true;
  publishBtn.style.opacity = '0.5';
  publishBtn.style.cursor = 'not-allowed';

  // 전역 노출 (디버깅용)
  window.editor = editor;

  // 초기화 시 초안 불러오기
  loadDraft();

  console.log('BuildIt 시각 편집기 초기화 완료');
})();
</script>
</body>
</html>
