<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F2R · 강사 업로드 자료</title>
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <link rel="stylesheet" href="/css/conversation_dashboard.css">
  <link rel="stylesheet" href="/css/conversation_materials.css">
  <link rel="stylesheet" href="/css/conversation_upload.css">
  <link rel="stylesheet" href="/css/tutor_conversation_dashboard.css">
</head>
<body data-page="tutor-materials">

  <div class="app-shell tutor-conversation-detail-shell">
    <aside class="sidebar tutor-sidebar">
      <div class="sidebar-head">
        <a class="sidebar-logo" href="/tutor/conversation_dashboard">
          <img src="/img/F2R_logo_pure.svg" alt="F2R" class="sidebar-logo-img">
          <div class="sidebar-logo-text">
            <div class="sidebar-logo-brand">Feel to Real</div>
            <div class="sidebar-logo-tag">Tutor Workspace</div>
          </div>
        </a>
      </div>

      <nav class="sidebar-nav" aria-label="강사 대화 메뉴">
        <a class="sidebar-link" th:classappend="${activeMenu == 'dashboard'} ? 'active'" data-menu="dashboard" href="#">
          <span class="dot"></span><span>종합 현황판</span>
        </a>
        <a class="sidebar-link" th:classappend="${activeMenu == 'exam-materials'} ? 'active'" data-menu="exam-materials" href="#">
          <span class="dot"></span><span>시험지 대시보드</span>
        </a>
        <a class="sidebar-link" th:classappend="${activeMenu == 'study-materials'} ? 'active'" data-menu="study-materials" href="#">
          <span class="dot"></span><span>학습자료 대시보드</span>
        </a>
        <a class="sidebar-link" th:classappend="${activeMenu == 'materials'} ? 'active'" data-menu="materials" href="#">
          <span class="dot"></span><span>학교 자료 모음</span>
        </a>
        <a class="sidebar-link" th:classappend="${activeMenu == 'chat'} ? 'active'" data-menu="chat" href="#">
          <span class="dot"></span><span>AI Chat</span>
        </a>
      </nav>

      <div class="sidebar-student tutor-sidebar-card" id="sidebarStudent">
        <div class="sidebar-student-name">강사 기록</div>
        <div class="sidebar-student-meta">업로드한 자료를 모아서 확인합니다.</div>
      </div>
    </aside>

    <main class="main">
      <header class="main-header">
        <div class="main-header-left">
          <h1 class="main-title" th:text="${pageTitle}">학교 자료 모음</h1>
          <p class="main-subtitle" th:text="${pageSubtitle}">강사 기록에 첨부된 시험지와 일반 자료를 한눈에 확인합니다.</p>
        </div>
        <div class="main-header-right">
          <a class="btn-community-header" id="backToTutorDashboard" href="/tutor/conversation_dashboard">대시보드</a>
          <button type="button" class="btn-upload-header" id="btnMaterialsUpload" onclick="openMaterialsUpload()">+ 파일 추가</button>
          <span class="header-chip" id="materialsCountChip">0개</span>
        </div>
      </header>

      <section id="materialsGrid" class="materials-grid">
        <div class="empty-state" id="emptyState">아직 첨부된 자료가 없어요.</div>
      </section>
    </main>
  </div>

  <div class="lightbox" id="lightbox" style="display:none" onclick="lightboxBackdropClick(event)">
    <button class="lightbox-close" type="button" onclick="closeLightbox()" aria-label="닫기">✕</button>
    <a class="lightbox-download" id="lightboxDownload" href="#" title="현재 페이지 다운로드" aria-label="다운로드">⬇</a>
    <button class="lightbox-nav lightbox-prev" type="button" onclick="lightboxPrev()" aria-label="이전">‹</button>
    <img class="lightbox-image" id="lightboxImage" alt="미리보기">
    <button class="lightbox-nav lightbox-next" type="button" onclick="lightboxNext()" aria-label="다음">›</button>
    <div class="lightbox-counter" id="lightboxCounter">1 / 1</div>
  </div>

  <script th:inline="javascript">window.MATERIAL_FILTER = /*[[${materialFilter}]]*/ 'ALL'; window.MATERIAL_CONTEXT = 'TUTOR';</script>
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/conversation_upload.js"></script>
  <script src="/js/conversation_materials.js"></script>
</body>
</html>
