<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F2R · 강사 대화 기록</title>
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <link rel="stylesheet" href="/css/stdt_dashboard.css">
  <link rel="stylesheet" href="/css/tutor_conversation_dashboard.css">
</head>
<body data-page="dashboard">

  <header class="header tutor-dashboard-header">
    <a class="header-logo" href="/tutor/academy" aria-label="F2R 강사 홈">
      <img src="/img/F2R_logo_pure.svg" alt="F2R" style="height:32px;">
    </a>
    <div class="header-right">
      <a class="btn-new-chat btn-header-academy" href="/tutor/academy">강사 홈</a>
      <span class="user-name" id="userNameDisplay"></span>
      <button class="btn-logout" id="logoutButton" type="button">로그아웃</button>
    </div>
  </header>

  <main class="main tutor-main">

    <section class="student-info-card tutor-info-card" aria-label="강사 대화 기록 정보">
      <div class="student-meta">
        <div class="avatar" id="avatarText">강</div>
        <div>
          <div class="student-name" id="tutorName">강사 대화 기록</div>
          <div class="student-detail" id="tutorDetail">수업 준비 · 상담 메모 · 개인 AI 대화 기록</div>
        </div>
      </div>
      <button type="button" class="btn-new-chat" id="newConversationButton">+ 새 기록</button>
    </section>

    <section id="statusBanner" class="status-banner hidden" role="alert"></section>

    <section class="section learning-records-section tutor-learning-records-section">
      <div class="section-header section-header-row">
        <div>
          <h2 class="section-title section-title-large">최근 학습기록</h2>
          <span class="section-hint">최근 활동한 강사용 대화 기록이 먼저 보입니다. 수업 기록과 분리된 개인 기록을 관리하세요.</span>
        </div>
        <div class="section-actions">
          <span class="section-count" id="conversationCount">불러오는 중...</span>
          <button id="refreshButton" class="btn-profile" type="button">새로고침</button>
        </div>
      </div>
      <div id="conversationList" class="conversation-list">
        <div class="loading-placeholder">학습기록을 불러오는 중...</div>
      </div>
    </section>


  </main>

  <script src="/js/api.js"></script>
  <script src="/js/tutor_conversation_dashboard.js"></script>
</body>
</html>
