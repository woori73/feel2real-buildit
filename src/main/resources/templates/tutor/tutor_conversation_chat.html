<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F2R · 강사 AI Chat</title>
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <link rel="stylesheet" href="/css/conversation_dashboard.css">
  <link rel="stylesheet" href="/css/conversation.css">
  <link rel="stylesheet" href="/css/conversation_upload.css">
  <link rel="stylesheet" href="/css/tutor_conversation_dashboard.css">
</head>
<body>

<div class="app-shell tutor-conversation-detail-shell">
  <aside class="sidebar tutor-sidebar">
    <div class="sidebar-head">
      <a class="sidebar-logo" href="/tutor/conversation_dashboard">
        <img src="/img/F2R_logo_pure.svg" alt="F2R" class="sidebar-logo-img">
        <div class="sidebar-logo-text">
          <div class="sidebar-logo-brand">Feel to Real</div>
          <div class="sidebar-logo-tag">Tutor Workspace</div>
        </div>
      </a>
    </div>

    <nav class="sidebar-nav" aria-label="강사 대화 메뉴">
      <a class="sidebar-link" data-menu="dashboard" href="#">
        <span class="dot"></span><span>종합 현황판</span>
      </a>
      <a class="sidebar-link" data-menu="exam-materials" href="#">
        <span class="dot"></span><span>시험지 대시보드</span>
      </a>
      <a class="sidebar-link" data-menu="study-materials" href="#">
        <span class="dot"></span><span>학습자료 대시보드</span>
      </a>
      <a class="sidebar-link" data-menu="materials" href="#">
        <span class="dot"></span><span>학교 자료 모음</span>
      </a>
      <a class="sidebar-link active" data-menu="chat" href="#">
        <span class="dot"></span><span>AI Chat</span>
      </a>
    </nav>

    <div class="sidebar-student tutor-sidebar-card" id="sidebarStudent">
      <div class="sidebar-student-name">강사 기록</div>
      <div class="sidebar-student-meta">자료를 참고해 AI Chat을 이어갑니다.</div>
    </div>
  </aside>

  <div class="chat-main">
    <header class="header">
      <div class="header-left">
        <button class="btn-back" id="btnBackToTutorDashboard" onclick="location.href='/tutor/conversation_dashboard'">← 대시보드</button>
        <span class="conv-title" id="convTitle">새 대화</span>
      </div>
      <div class="header-right">
        <span class="user-name" id="userNameDisplay"></span>
      </div>
    </header>

    <div class="layout">
      <aside class="file-panel">
        <div class="panel-header">
          <span class="panel-title">첨부 파일</span>
          <button class="btn-add-file" id="btnAddFile" onclick="triggerFileInput()">+ 파일 추가</button>
        </div>

        <div id="fileList" class="file-list">
          <div class="file-empty">파일을 추가하면<br>AI가 내용을 참고해요</div>
        </div>

        <div class="analysis-banner" id="analysisBanner" style="display:none">
          <span id="analysisBannerText">자료 분석 중...</span>
        </div>
      </aside>

      <main class="chat-panel">
        <div class="message-list" id="messageList">
          <div class="welcome-msg">
            <div class="welcome-icon">🎓</div>
            <p>안녕하세요! 파일을 업로드하거나 바로 질문해보세요.</p>
          </div>
        </div>

        <div class="chat-input-wrap">
          <textarea
            id="chatInput"
            class="chat-input"
            placeholder="메시지를 입력하세요... (Shift+Enter로 줄 바꿈, Enter로 전송)"
            rows="1"
            onkeydown="handleKeyDown(event)"
            oninput="autoResize(this)"
          ></textarea>
          <button class="btn-send" id="btnSend" onclick="sendMessage()">전송</button>
        </div>
      </main>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox" style="display:none" onclick="lightboxBackdropClick(event)">
  <button class="lightbox-close" type="button" onclick="closeLightbox()" aria-label="닫기">✕</button>
  <a class="lightbox-download" id="lightboxDownload" href="#" title="현재 페이지 다운로드" aria-label="다운로드">⬇</a>
  <button class="lightbox-nav lightbox-prev" type="button" onclick="lightboxPrev()" aria-label="이전">‹</button>
  <img class="lightbox-image" id="lightboxImage" alt="미리보기">
  <button class="lightbox-nav lightbox-next" type="button" onclick="lightboxNext()" aria-label="다음">›</button>
  <div class="lightbox-counter" id="lightboxCounter">1 / 1</div>
</div>

<script>window.CONVERSATION_CONTEXT = 'TUTOR';</script>
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/conversation_upload.js"></script>
<script src="/js/conversation.js"></script>
</body>
</html>
