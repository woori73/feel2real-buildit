<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>예상문제 의뢰 — Feel2Real | EDUNOVA</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root{--navy:#0b1b3b;--blue:#1560ff;--line:#e3e9f5;--sub:#5a6785}
    *{box-sizing:border-box}
    body{margin:0;background:#f4f7fd;color:#1a2540;font-family:"Pretendard Variable",Pretendard,-apple-system,"Noto Sans KR",sans-serif;line-height:1.6}
    .xr-top{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:60px;background:#fff;border-bottom:1px solid var(--line)}
    .xr-top a{font-weight:800;color:var(--navy);text-decoration:none;font-size:20px}
    .xr-top a.home{font-size:15px;font-weight:600;color:var(--blue)}
    .xr-wrap{max-width:720px;margin:0 auto;padding:24px 16px 64px}
    h1{font-size:26px;margin:8px 0 4px;color:var(--navy)}
    .xr-price{margin:0 0 16px;color:var(--sub);font-size:16px}
    .xr-price b{color:var(--blue);font-size:20px}
    .xr-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
    label{display:block;font-weight:700;font-size:15px;margin:14px 0 6px}
    input,textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid #c9d4ea;border-radius:10px;background:#fff}
    textarea{min-height:110px;resize:vertical}
    button.xr-submit{margin-top:20px;width:100%;padding:15px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:17px;font-weight:700;cursor:pointer}
    button.xr-submit:disabled{opacity:.6;cursor:default}
    .xr-note{font-size:14px;color:var(--sub);margin:8px 0 0}
    .xr-msg{margin-top:14px;padding:12px;border-radius:10px;font-size:15px;display:none}
    .xr-msg.ok{display:block;background:#e8f7ee;color:#116236}
    .xr-msg.err{display:block;background:#fdecec;color:#a11a1a}
    .xr-item{padding:12px 0;border-top:1px solid var(--line);font-size:15px}
    .xr-item:first-child{border-top:0}
    .xr-st{display:inline-block;padding:2px 10px;border-radius:999px;background:#eaf1ff;color:var(--blue);font-size:13px;font-weight:700;margin-left:6px}
  </style>
</head>
<body>
<div class="xr-top"><a href="/">Feel2Real | EDUNOVA</a><a class="home" href="/">홈으로</a></div>
<div class="xr-wrap">
  <h1>내신 영어 예상문제 의뢰</h1>
  <p class="xr-price"><b>1회 20,000원</b> · 40문항 · 정답·해설 제공</p>
  <form class="xr-card" id="xrForm" novalidate>
    <label for="schoolName">학교명</label>
    <input id="schoolName" name="schoolName" maxlength="60" required placeholder="예: 한빛고등학교">
    <label for="grade">학년</label>
    <input id="grade" name="grade" maxlength="20" required placeholder="예: 고2">
    <label for="examRound">시험 회차</label>
    <input id="examRound" name="examRound" maxlength="40" required placeholder="예: 2학기 중간고사">
    <label for="examScope">시험범위</label>
    <textarea id="examScope" name="examScope" maxlength="1000" required placeholder="교과서 단원, 부교재, 프린트 범위 등"></textarea>
    <label for="contact">연락처</label>
    <input id="contact" name="contact" maxlength="60" required placeholder="휴대폰 번호 또는 이메일">
    <label for="memo">요청사항 (선택)</label>
    <textarea id="memo" name="memo" maxlength="500"></textarea>
    <button class="xr-submit" id="xrSubmit" type="submit">예상문제 의뢰하기</button>
    <p class="xr-note">접수 후 담당자가 연락처로 결제 방법과 일정을 안내합니다. 이 화면에서는 결제가 진행되지 않습니다.</p>
    <div class="xr-msg" id="xrMsg" role="status"></div>
  </form>
  <div class="xr-card">
    <strong>내 접수 내역</strong>
    <div id="xrList"><p class="xr-note">불러오는 중...</p></div>
  </div>
</div>
<script>
(function(){
  var STATUS={RECEIVED:'접수',IN_PROGRESS:'제작 중',DONE:'전달 완료',CANCELED:'취소'};
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function msg(t,k){var m=document.getElementById('xrMsg');m.textContent=t;m.className='xr-msg '+k;}
  function loadList(){
    fetch('/api/exam-requests/me',{credentials:'same-origin'}).then(function(r){
      if(r.status===401){location.href='/home';return null;}
      return r.ok?r.json():[];
    }).then(function(list){
      if(!list)return;
      var el=document.getElementById('xrList');
      if(!list.length){el.innerHTML='<p class="xr-note">아직 접수한 의뢰가 없습니다.</p>';return;}
      el.innerHTML=list.map(function(x){
        return '<div class="xr-item"><b>'+esc(x.schoolName)+' '+esc(x.grade)+' '+esc(x.examRound)+'</b><span class="xr-st">'+esc(STATUS[x.status]||x.status)+'</span><br><span class="xr-note">'+esc((x.createdAt||'').replace('T',' ').slice(0,16))+' · '+x.questionCount+'문항 · '+x.priceKrw.toLocaleString()+'원</span></div>';
      }).join('');
    });
  }
  document.getElementById('xrForm').addEventListener('submit',function(e){
    e.preventDefault();
    var f=e.target,btn=document.getElementById('xrSubmit');
    var body={};['schoolName','grade','examRound','examScope','contact','memo'].forEach(function(k){body[k]=f[k].value.trim();});
    for(var k of ['schoolName','grade','examRound','examScope','contact']){if(!body[k]){msg('필수 항목을 모두 입력해 주세요.','err');return;}}
    btn.disabled=true;
    fetch('/api/exam-requests',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){
        if(r.status===401){location.href='/home';return null;}
        if(!r.ok)return r.json().catch(function(){return {};}).then(function(j){throw new Error(j.message||'접수에 실패했습니다. 입력 내용을 확인해 주세요.');});
        return r.json();
      })
      .then(function(j){if(!j)return;msg('의뢰가 접수되었습니다. 담당자가 연락처로 안내드립니다.','ok');f.reset();loadList();})
      .catch(function(err){msg(err.message,'err');})
      .then(function(){btn.disabled=false;});
  });
  loadList();
})();
</script>
</body>
</html>
