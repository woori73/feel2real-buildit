<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/public(bodyClass='community-body')}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>질문 · F2R 커뮤니티</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="/css/account_menu.css">
  <link rel="stylesheet" href="/css/community.css">
</head>
<body class="community-body">
<th:block layout:fragment="content">

  <header class="community-topbar">
    <a class="brand" href="/community"><img src="/img/F2R_logo_pure.svg" alt="F2R"><b>커뮤니티</b></a>
    <div class="spacer"></div>
    <button type="button" id="btnAsk" class="btn-ask">+ 질문하기</button>
    <th:block th:replace="~{fragments/_account_menu :: accountMenu('/stdt_dashboard', '학생 홈')}"></th:block>
  </header>

  <main class="detail-wrap">
    <nav class="breadcrumb">
      <a href="/community">전체</a> <span>›</span> <span id="bcCategory">질문</span>
    </nav>

    <article id="questionDetail" aria-live="polite">
      <div class="feed-empty">불러오는 중...</div>
    </article>

    <section id="answersSection" hidden>
      <div class="section-title" id="answersTitle">답변</div>
      <div id="answersList"></div>

      <div id="answerComposeWrap" hidden>
        <div class="section-title">답변 작성</div>
        <div class="editor-toolbar" id="answerToolbar">
          <button type="button" data-cmd="bold"><b>B</b></button>
          <button type="button" data-cmd="italic"><i>I</i></button>
          <button type="button" data-cmd="strike"><s>S</s></button>
          <button type="button" data-cmd="bulletList">•</button>
          <button type="button" data-cmd="code">&lt;/&gt;</button>
          <button type="button" data-cmd="link">🔗</button>
          <button type="button" data-cmd="image">🖼</button>
        </div>
        <div class="editor-box"><div id="answerEditor"></div></div>
        <input type="file" id="answerImageInput" accept="image/*" hidden>
        <div class="write-actions">
          <button type="button" id="submitAnswer" class="btn-primary">답변 등록</button>
        </div>
      </div>
      <p id="answerLoginHint" class="login-hint" hidden>답변은 로그인 후 작성할 수 있어요.</p>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/account_menu.js"></script>
  <script type="module" src="/js/community_post.js"></script>
</th:block>
</body>
</html>
