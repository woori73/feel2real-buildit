<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/public}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학교 시험 분석 찾기</title>
  <link rel="stylesheet" href="/css/tutor_academy.css">
  <link rel="stylesheet" href="/css/public_analyzes.css">
</head>
<body>
<th:block layout:fragment="content">
  <main class="page">
    <div class="topbar">
      <div>
        <div class="brand">학교 시험 분석 찾기</div>
        <p class="muted">학교, 학년, 학기, 시험 유형에 맞는 영어 내신 분석 리포트를 찾아보세요.</p>
      </div>
      <div><a class="btn btn-secondary" href="/home">홈으로</a></div>
    </div>

    <section class="card analysis-search-card">
      <form id="analysisSearchForm" class="grid">
        <div class="field"><label for="keyword">키워드</label><input id="keyword" placeholder="제목 또는 학교명"></div>
        <div class="field"><label for="schoolName">학교명</label><input id="schoolName" placeholder="압구정중"></div>
        <div class="field"><label for="grade">학년</label><input id="grade" type="number" min="1" max="12" placeholder="2"></div>
        <div class="field"><label for="semester">학기</label><select id="semester"><option value="">전체</option><option>1학기</option><option>2학기</option><option>기타</option></select></div>
        <div class="field"><label for="examType">시험 종류</label><select id="examType"><option value="">전체</option><option>중간</option><option>기말</option><option>기타</option></select></div>
        <div class="field"><label for="subjectId">과목</label><select id="subjectId"><option value="">전체</option></select></div>
        <div class="field"><label>&nbsp;</label><button class="btn btn-primary" type="submit">검색</button></div>
      </form>
    </section>

    <section class="card analysis-list-card">
      <div class="topbar"><h2>분석 자료 목록</h2><span id="analysisCount" class="muted"></span></div>
      <div id="analysisList" class="lesson-list"><p class="muted">분석 자료를 불러오는 중...</p></div>
    </section>
  </main>
  <script src="/js/analyzes.js"></script>
</th:block>
</body>
</html>
