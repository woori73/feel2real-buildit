<body><header><a href="/">Feel2Real</a><a href="/study/">공개 학습관</a></header><main class="article" itemscope itemtype="https://schema.org/LearningResource">

<p>자료 근거 · <a th:if="${!guide.sourceUrl.isEmpty()}" th:href="${guide.sourceUrl}" th:text="${guide.sourceName}"></a><span th:if="${guide.sourceUrl.isEmpty()}" th:text="${guide.sourceName}"></span></p>
<p>작성 · <span itemprop="author" itemscope itemtype="https://schema.org/Organization"><span itemprop="name">F2R 영어교습소</span></span><br>작성일 <time itemprop="datePublished" th:datetime="${guide.published}" th:text="${guide.published}"></time> · 수정일 <time itemprop="dateModified" th:datetime="${guide.modified}" th:text="${guide.modified}"></time></p>
<section th:if="${!updates.isEmpty()}"><h2>날짜별 추가 자료</h2><ul><li th:each="d : ${updates}"><a th:href="|${base}${d.date}|" th:text="${d.title}"></a></li></ul></section>
