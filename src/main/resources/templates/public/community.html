<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/public(bodyClass='community-body')}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>커뮤니티 · F2R</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="/css/account_menu.css">
  <link rel="stylesheet" href="/css/community.css">
</head>
<body class="community-body">
<th:block layout:fragment="content">

  <header class="community-topbar">
    <a class="brand" href="/home"><img src="/img/F2R_logo_pure.svg" alt="F2R"><b>커뮤니티</b></a>
    <div class="spacer"></div>
    <button type="button" id="btnAsk" class="btn-ask">+ 질문하기</button>
    <th:block th:replace="~{fragments/_account_menu :: accountMenu('/stdt_dashboard', '학생 홈')}"></th:block>
  </header>

  <div class="community-wrap">
    <section class="community-hero">
      <h1>무엇이든 물어보세요</h1>
      <p>자유게시판 · Q&A · 과목별로 질문하고 답변을 나눠요.</p>
      <div id="catTabs" class="cat-tabs">
        <button class="cat-tab active" data-board="">전체</button>
        <button class="cat-tab" data-board="FREE">자유게시판</button>
        <button class="cat-tab" data-board="QNA">Q&amp;A</button>
        <!-- 과목 탭은 community.js가 /api/subjects로 동적 추가 -->
      </div>
    </section>

    <div class="community-main-row">
      <main class="community-feed">
        <div class="feed-head">
          <div class="count" id="feedCount">질문</div>
          <form id="feedSearch" class="feed-search">
            <input type="search" name="keyword" maxlength="80" placeholder="제목 검색">
            <select name="sort" aria-label="정렬">
              <option value="latest">최신순</option>
              <option value="recommended">추천순</option>
            </select>
          </form>
        </div>
        <div id="feedList" class="feed-list">
          <div class="feed-empty">불러오는 중...</div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/account_menu.js"></script>
  <script src="/js/community.js"></script>
</th:block>
</body>
</html>
