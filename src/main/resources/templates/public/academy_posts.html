<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/public}">
<head>
  <link rel="canonical" href="https://feel2real.co.kr/academy-posts">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학원 블로그 글 모아보기</title>
  <link rel="stylesheet" href="/css/tutor_academy.css">
  <link rel="stylesheet" href="/css/academy_blog.css">
</head>
<body>
<th:block layout:fragment="content">
<main class="page academy-posts-page">
  <section class="card academy-posts-hero">
    <div>
      <p class="eyebrow">Academy Posts</p>
      <h1>학원 블로그 글 모아보기</h1>
      <p class="muted">공개된 학원 블로그 글을 최신순 또는 추천순으로 확인하세요.</p>
    </div>
    <a class="btn btn-ghost" href="/home">홈으로</a>
  </section>

  <section class="card academy-posts-filter" aria-label="블로그 글 검색과 정렬">
    <form id="academyPostsSearch" class="academy-posts-search">
      <input type="search" name="keyword" maxlength="80" placeholder="제목, 요약, 학원명으로 검색">
      <select name="sort" aria-label="정렬">
        <option value="latest">최신순</option>
        <option value="recommended">추천순</option>
      </select>
      <button type="submit" class="btn btn-primary">검색</button>
    </form>
  </section>

  <section id="academyPostsList" class="academy-posts-list" aria-live="polite">
    <p class="muted">글을 불러오는 중...</p>
  </section>
</main>
<script src="/js/academy_posts.js"></script>
</th:block>
</body>
</html>
