<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/public}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BUILD IT CHART | 지역 교육자 발견과 기록</title>
  <meta name="description" content="지역 교실에서 자신의 교육을 만들어가는 교육자를 발견하고 매주 공개 활동을 기록하는 BUILD IT CHART입니다.">
  <link rel="stylesheet" href="/css/chart.css?v=20260809-2">
</head>
<body>
<th:block layout:fragment="content">
  <header class="site-header">
    <div class="nav-left">
      <a class="logo bi nav-logo" href="/"><b>Build</b><i>It</i></a>
      <span class="nav-tag">CHART</span>
    </div>
    <a class="btn outline small" href="/#cta">BuildIt 시작하기</a>
  </header>

  <main id="top">
    <section class="chart-hero">
      <div class="hero-lines" aria-hidden="true">
        <svg viewBox="0 0 2400 900" xmlns="http://www.w3.org/2000/svg">
          <path d="M0,520 C 200,420 400,620 600,520 C 800,420 1000,620 1200,520 C1400,420 1600,620 1800,520 C2000,420 2200,620 2400,520" fill="none" stroke="#2563eb" stroke-width="1.4" opacity="0.22" />
          <path d="M0,470 C 200,570 400,370 600,470 C 800,570 1000,370 1200,470 C1400,570 1600,370 1800,470 C2000,570 2200,370 2400,470" fill="none" stroke="#c9d3e0" stroke-width="1.2" opacity="0.45" />
        </svg>
      </div>
      <p class="eyebrow">LOCAL EDUCATOR DISCOVERY · LIVING ARCHIVE</p>
      <h1>BUILD IT <span class="ext">CHART</span></h1>
      <h2>지역 교실에서 자신의 교육을 만들어가는 교육자를 발견합니다.</h2>
      <p class="lead">매주 새로운 활동과 아직 발견하지 못한 교육자를 찾고, 관리자가 확인한 기록만 공개합니다.</p>
      <p class="weekly-update" id="weeklyUpdate">이번 주 업데이트 확인 중</p>
    </section>

    <section class="rank-section" id="promisingSection" hidden>
      <div class="section-label">주목할 교육자 <span class="count">Potential Signals · 관리자 승인</span></div>
      <div class="chart-list" id="promisingList"></div>
    </section>
    <p class="chart-disclaimer" id="chartDisclaimer"></p>

    <section class="rank-section">
      <div class="section-label">TOP 10 <span class="count" id="topCount">이달의 주목 교육자</span></div>
      <div class="chart-list" id="topChartList" aria-live="polite"></div>
    </section>

    <section class="rank-section" id="restSection" hidden>
      <div class="section-label">11 – 100 <span class="count">전체 순위</span></div>
      <div class="chart-list" id="restChartList"></div>
    </section>
  </main>

  <div id="profileModalRoot"></div>
  <script src="/js/chart_public.js?v=20260809-2"></script>
</th:block>
</body>
</html>
