<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/public(bodyClass='wiki-body')}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모의고사 학습 자료 · BuildIt Wiki</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="/css/account_menu.css">
  <link rel="stylesheet" href="/css/wiki.css?v=20260904-1">
</head>
<body class="wiki-body">
<th:block layout:fragment="content">

  <header class="wiki-topbar">
    <a class="brand" href="/wiki"><b>BuildIt</b><span>Wiki</span></a>
    <p class="brand-tag">함께 나누고, AI와 함께 발전시킵니다.</p>
    <div class="spacer"></div>
    <a class="wiki-home-link" href="/">BuildIt 홈</a>
    <th:block th:replace="~{fragments/_account_menu :: accountMenu('/stdt_dashboard', '학생 홈')}"></th:block>
  </header>

  <main class="wiki-wrap list-page">
    <a class="back-link" href="/wiki">← BuildIt Wiki로 돌아가기</a>
    <div class="block-head">
      <h2>모의고사 학습 자료</h2>
      <button type="button" class="upload-link" id="btnUploadLearning">＋ 자료 올리기</button>
    </div>
    <p class="muted">회원이 함께 나누는 어휘 · Workbook · 변형문제 자료입니다. 다운로드는 로그인 후 이용할 수 있습니다.</p>
    <div id="gradeTabs" class="grade-tabs" role="tablist" style="margin-bottom:20px;">
      <button class="grade-tab active" data-grade="3">고3</button>
      <button class="grade-tab" data-grade="2">고2</button>
      <button class="grade-tab" data-grade="1">고1</button>
      <button class="grade-tab" data-grade="">전체</button>
    </div>
    <div id="list" class="learning-list"><p class="muted">불러오는 중...</p></div>
  </main>

  <th:block th:replace="~{fragments/_wiki_learning_upload :: modal}"></th:block>

  <script src="/js/api.js"></script>
  <script src="/js/account_menu.js"></script>
  <script src="/js/wiki_learning.js?v=20260904-2"></script>
</th:block>
</body>
</html>
