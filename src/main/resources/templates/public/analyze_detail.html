<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/public}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학교 시험 분석</title>
  <link rel="stylesheet" href="/css/tutor_academy.css">
  <link rel="stylesheet" href="/css/public_analyze_detail.css">
</head>
<body>
<th:block layout:fragment="content">
  <main class="page analysis-detail-page">
    <div class="topbar">
      <div>
        <div id="analysisTitle" class="brand">학교 시험 분석</div>
        <p id="analysisMeta" class="muted">분석 자료를 불러오는 중...</p>
        <div id="analysisBadges" class="meta-line"></div>
      </div>
      <div><a class="btn btn-secondary" href="/analyzes">전체 분석 보기</a></div>
    </div>

    <section class="card analysis-shell">
      <iframe id="analysisFrame" class="analysis-frame" title="학교 시험 분석 HTML 미리보기" sandbox="allow-scripts"></iframe>
    </section>
  </main>
  <script src="/js/analyze_detail.js"></script>
</th:block>

</html>
