<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F2R · 업로드 자료</title>
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <link rel="stylesheet" href="/css/conversation_dashboard.css">
  <link rel="stylesheet" href="/css/conversation_materials.css">
  <link rel="stylesheet" href="/css/conversation_upload.css">
</head>
<body>

  <div class="app-shell">

    <!-- 사이드바 (activeMenu는 ConversationMaterialsPageController가 주입: materials | exam-materials | study-materials) -->
    <th:block th:replace="~{fragments/_sidebar :: sidebar(${activeMenu})}"></th:block>

    <main class="main">
      <header class="main-header">
        <div class="main-header-left">
          <h1 class="main-title" th:text="${pageTitle}">학교 자료 모음</h1>
          <p class="main-subtitle" th:text="${pageSubtitle}">이 대화에 첨부된 모든 자료를 한눈에 확인해요.</p>
        </div>
        <div class="main-header-right">
          <button type="button" class="btn-upload-header" id="btnMaterialsUpload" onclick="openMaterialsUpload()">+ 파일 추가</button>
          <span class="header-chip" id="materialsCountChip">0개</span>
        </div>
      </header>

      <section id="materialsGrid" class="materials-grid">
        <div class="empty-state" id="emptyState">아직 첨부된 자료가 없어요.</div>
      </section>
    </main>

  </div>

  <!-- 라이트박스 (conversation_chat.html에서 그대로) -->
  <div class="lightbox" id="lightbox" style="display:none" onclick="lightboxBackdropClick(event)">
    <button class="lightbox-close" type="button" onclick="closeLightbox()" aria-label="닫기">✕</button>
    <a class="lightbox-download" id="lightboxDownload" href="#" title="현재 페이지 다운로드" aria-label="다운로드">⬇</a>
    <button class="lightbox-nav lightbox-prev" type="button" onclick="lightboxPrev()" aria-label="이전">‹</button>
    <img class="lightbox-image" id="lightboxImage" alt="미리보기">
    <button class="lightbox-nav lightbox-next" type="button" onclick="lightboxNext()" aria-label="다음">›</button>
    <div class="lightbox-counter" id="lightboxCounter">1 / 1</div>
  </div>

  <!-- ContentKind 필터: ALL(학교 자료 모음) | EXAM(시험지 대시보드) | GENERAL(학습자료 대시보드) -->
  <script th:inline="javascript">window.MATERIAL_FILTER = /*[[${materialFilter}]]*/ 'ALL';</script>
  <script src="/js/api.js"></script>
  <script src="/js/conversation_upload.js"></script>
  <script src="/js/conversation_materials.js"></script>
</body>
</html>
