<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F2R · 오답노트</title>
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <link rel="stylesheet" href="/css/conversation_dashboard.css">
  <link rel="stylesheet" href="/css/conversation_review.css">
</head>
<body>

  <div class="app-shell">

    <!-- 사이드바 -->
    <th:block th:replace="~{fragments/_sidebar :: sidebar('review')}"></th:block>

    <!-- 메인 -->
    <main class="main">
      <header class="main-header">
        <div class="main-header-left">
          <h1 class="main-title">오답노트</h1>
          <p class="main-subtitle">틀린 문제 사진/PDF를 직접 올려 시험기간 오답을 대화별로 모아 관리해요.</p>
        </div>
      </header>

      <section id="reviewSection" class="review-section">
        <section class="manual-note-panel">
          <div class="manual-note-header">
            <div>
              <h2>오답 업로드</h2>
              <p>숙제 부여처럼 제목, 설명, 파일만 올립니다. PDF와 이미지 파일을 여러 개까지 보관하고 문제 추출/OCR은 하지 않습니다.</p>
            </div>
          </div>
          <form id="wrongNoteForm" class="wrong-note-form">
            <div class="form-grid single">
              <label>제목
                <input name="title" maxlength="150" placeholder="예: 중간고사 문법 오답" required>
              </label>
            </div>
            <label class="memo-label">설명
              <textarea name="description" rows="3" placeholder="오답 이유, 다시 풀 때 볼 힌트, 강사 코멘트 등을 적어주세요."></textarea>
            </label>
            <div class="upload-row">
              <input name="files" type="file" accept="image/*,application/pdf" multiple required>
              <button type="submit" class="btn-upload">오답 올리기</button>
            </div>
          </form>
        </section>

        <section class="manual-note-list-section">
          <div class="section-title-row">
            <h2>업로드된 오답</h2>
            <span id="manualNoteCount" class="muted"></span>
          </div>
          <div id="manualNoteEmpty" class="empty-state" style="display:none">
            아직 업로드된 오답이 없어요. 틀린 문제를 사진으로 찍어 올려보세요.
          </div>
          <div id="manualNoteList" class="manual-note-list"></div>
        </section>

        <details class="auto-wrong-details">
          <summary>시험지에서 자동 추출된 오답 보기</summary>
          <div class="auto-wrong-toolbar">
            <div id="categoryFilter" class="category-filter"></div>
          </div>
          <div id="reviewEmpty" class="empty-state" style="display:none">
            아직 자동 추출된 오답이 없어요.
          </div>
          <div id="examGroups" class="exam-groups"></div>
        </details>
      </section>
    </main>

  </div>

  <script src="/js/api.js"></script>
  <script src="/js/conversation_review.js"></script>
</body>
</html>
