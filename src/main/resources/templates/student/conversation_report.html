<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F2R · Achievement Report</title>
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <link rel="stylesheet" href="/css/conversation_dashboard.css">
</head>
<body>

  <div class="app-shell">

    <!-- 사이드바 -->
    <th:block th:replace="~{fragments/_sidebar :: sidebar('report')}"></th:block>

    <main class="main">
      <header class="main-header">
        <div class="main-header-left">
          <h1 class="main-title">Achievement Report</h1>
          <p class="main-subtitle">학생 맞춤 종합 분석 리포트가 곧 추가될 예정이에요.</p>
        </div>
      </header>

      <section class="card-grid">
        <article class="card" style="grid-column: 1 / -1;">
          <div class="card-body">
            <div class="empty-state" style="min-height: 320px; flex-direction: column; gap: 14px;">
              <div style="font-size: 40px;">📊</div>
              <div style="font-size: 16px; font-weight: 600; color: #4a5568;">준비 중입니다</div>
              <div style="max-width: 420px; line-height: 1.5;">
                지금까지 풀이한 시험과 카테고리별 정답률, 성장 추세를 종합한 맞춤 리포트가 곧 제공돼요.<br>
                먼저 <strong>English Dashboard</strong>에서 성취도 그래프를 확인해 보세요.
              </div>
            </div>
          </div>
        </article>
      </section>
    </main>

  </div>

  <script src="/js/api.js"></script>
  <script src="/js/conversation_report.js"></script>
</body>
</html>
