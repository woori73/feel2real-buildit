<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시험지 확인 - F2R</title>
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <link rel="stylesheet" href="/css/exam_review.css">
</head>
<body>

  <header class="header">
    <a class="back-link" id="backLink" href="/stdt_dashboard">← 이전 화면</a>
    <span class="header-title">시험지 확인</span>
    <span class="user-name" id="userNameDisplay"></span>
  </header>

  <main class="main">

    <div id="loadingMsg" class="info-msg">분석 결과를 불러오는 중...</div>
    <div id="errorMsg" class="error-msg" hidden></div>

    <form id="reviewForm" hidden>
      <p class="intro-text">
        AI가 분석한 결과가 아래와 같아요.<br>
        틀린 정보가 있으면 수정한 뒤 <strong>전체 확정</strong>을 눌러주세요.
      </p>

      <section class="card">
        <h2 class="card-title">📄 파일</h2>
        <div class="file-name" id="fileName"></div>
      </section>

      <section class="card">
        <h2 class="card-title">📝 시험 정보</h2>
        <div class="meta-grid">
          <label>학교
            <input id="schoolName" type="text" placeholder="00중학교">
          </label>
          <label>학년
            <select id="grade">
              <option value="">-</option>
              <option value="1">1학년</option>
              <option value="2">2학년</option>
              <option value="3">3학년</option>
              <option value="4">4학년</option>
              <option value="5">5학년</option>
              <option value="6">6학년</option>
            </select>
          </label>
          <label>시험 종류
            <select id="examType">
              <option value="">-</option>
              <option value="MIDTERM">중간고사</option>
              <option value="FINAL">기말고사</option>
              <option value="MOCK">모의고사</option>
              <option value="OTHER">기타</option>
            </select>
          </label>
          <label>연도
            <input id="examYear" type="number" min="2000" max="2099" placeholder="2026">
          </label>
          <label>학기
            <select id="examSemester">
              <option value="">-</option>
              <option value="1">1학기</option>
              <option value="2">2학기</option>
            </select>
          </label>
        </div>
      </section>

      <section class="card">
        <h2 class="card-title">✏️ 채점 결과 <span class="score-summary" id="scoreSummary"></span></h2>
        <p class="card-hint">AI가 표시한 정/오답이 틀렸으면 ◯/✕ 칩을 눌러 뒤집고, 배점이 다르면 숫자칸을 수정해주세요. <strong>배점이 0이면 점수 합산에서 빠지고 정답률만 계산됩니다.</strong></p>
        <div id="answersList" class="answers-list"></div>
      </section>

      <div class="action-row">
        <button type="button" class="btn-secondary" id="btnCancel">나중에</button>
        <button type="submit" class="btn-primary" id="submitBtn">전체 확정</button>
      </div>
    </form>

  </main>

  <script src="/js/api.js"></script>
  <script src="/js/exam_review.js"></script>
</body>
</html>
