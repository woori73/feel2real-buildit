<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학습지 | F2R</title>
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <link rel="stylesheet" href="/css/worksheets.css?v=20261122-4">
</head>
<body class="pp" data-no-assistant-welcome>
<th:block th:replace="~{fragments/_prep_shell :: topbar}"></th:block>
<div class="pp-body">
  <th:block th:replace="~{fragments/_prep_shell :: rail('worksheets')}"></th:block>
  <main class="pp-main">
    <p class="pp-msg" id="msg"></p>
    <section class="pp-card">
      <div class="pp-tabs" role="tablist" aria-label="학습지 목록 구분">
        <button type="button" role="tab" data-tab="ACADEMY" aria-selected="true">우리 학원</button>
        <button type="button" role="tab" data-tab="MINE" aria-selected="false">내 학습지</button>
        <button type="button" role="tab" data-tab="FAVORITE" aria-selected="false">즐겨찾기</button>
        <button type="button" role="tab" data-tab="TRASH" aria-selected="false">휴지통</button>
      </div>
      <div class="pp-toolbar">
        <button type="button" class="pp-chip" data-kind="" aria-pressed="true">전체</button>
        <button type="button" class="pp-chip" data-kind="내신" aria-pressed="false">내신</button>
        <button type="button" class="pp-chip" data-kind="어법" aria-pressed="false">어법</button>
        <button type="button" class="pp-chip" data-kind="혼합" aria-pressed="false">혼합</button>
        <select class="pp-input" id="business" aria-label="사업체"></select>
        <input class="pp-input pp-grow" id="search" type="search" placeholder="학습지 이름, 만든 사람 검색" aria-label="학습지 검색">
        <a class="pp-btn primary" id="newLink" href="/dashboard/worksheets/edit">+ 학습지 만들기</a>
      </div>
      <table class="pp-table">
        <thead><tr><th>타입</th><th>학년</th><th>학습지명</th><th>만든 날</th><th>만든 사람</th><th>배정</th><th></th></tr></thead>
        <tbody id="list"></tbody>
      </table>
      <p class="pp-empty" id="empty" hidden></p>
    </section>
  </main>
</div>
<script src="/js/api.js"></script>
<script src="/js/worksheet_core.js?v=20261122-2"></script>
<script src="/js/worksheets.js?v=20261122-2"></script>
</body>
</html>
