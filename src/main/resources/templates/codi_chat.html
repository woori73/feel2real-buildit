<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f8f9f5">
  <meta name="robots" content="noindex,nofollow">
  <title>F2R 코디 · 자유대화</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/codi_chat.css?v=m1-1">
  <script defer src="/js/codi_chat.js?v=m1-1"></script>
</head>
<body>
  <main id="codiChat">
    <header class="codi-bar">
      <h1><span>F2R</span> 코디</h1>
      <button type="button" id="codiMenuToggle" aria-label="캐릭터 메뉴" aria-expanded="false" aria-controls="codiMenu">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 8h14M5 16h14"/></svg>
      </button>
      <div id="codiMenu" hidden>
        <fieldset>
          <legend>캐릭터 선택</legend>
          <button type="button" data-codi-look="codi" aria-pressed="true">새싹 코디</button>
          <button type="button" data-codi-look="seven" aria-pressed="false">세븐</button>
          <button type="button" data-codi-look="suni" aria-pressed="false">서수니</button>
        </fieldset>
      </div>
    </header>
    <section id="codiPresence" aria-label="코디 자유대화">
      <div id="codiAvatar" data-look="codi" data-pose="idle" role="img" aria-label="새싹 코디, 대기 중">
        <img id="codiPortrait" src="/img/agents/codi/idle.webp?v=matte-2" width="512" height="512" alt="">
      </div>
      <div class="codi-greeting"><h2>무엇이 궁금하세요?</h2><p>코디와 자유롭게 대화하세요.</p></div>
      <p id="codiActivity" role="status"><span aria-hidden="true"></span><span id="codiPoseText">자유대화</span></p>
    </section>
    <div id="codiStream">
      <div id="codiLog" role="log" aria-label="코디와 나눈 대화" aria-live="polite" aria-relevant="additions"></div>
      <button type="button" id="codiLatest" hidden>최신 메시지 ↓</button>
    </div>
    <footer>
      <p id="codiStatus" role="status"></p>
      <form id="codiComposer" aria-label="메시지 작성">
        <textarea id="codiCommand" rows="1" maxlength="2000" aria-label="메시지" aria-describedby="codiPrivacy" placeholder="코디에게 메시지" enterkeyhint="enter"></textarea>
        <button type="submit" id="codiSend" aria-label="메시지 보내기" disabled>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>
        </button>
      </form>
      <p id="codiPrivacy">개인정보와 학원 업무 자료는 입력하지 마세요.</p>
    </footer>
  </main>
</body>
</html>
