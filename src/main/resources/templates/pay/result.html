<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>결제 결과</title>
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <link rel="stylesheet" href="/css/easy.css">
</head>
<body>
  <div class="easy-container">
    <div class="easy-title" th:text="${ok} ? '결제가 완료되었습니다' : '결제가 완료되지 않았습니다'">결과</div>
    <p class="easy-sub">시험 모드 — 실제 결제가 아닙니다.</p>
    <div class="easy-card">
      <p class="success-msg" style="display:block" th:if="${ok}">납부가 확인되었습니다. 감사합니다.</p>
      <p class="error-msg" style="display:block" th:unless="${ok}" th:text="${message}">안내</p>
      <div style="margin-top:12px">
        <a class="btn-secondary" style="display:block;text-align:center;text-decoration:none" th:href="@{/pay/{t}(t=${token})}">청구 안내로 돌아가기</a>
      </div>
    </div>
  </div>
</body>
</html>
