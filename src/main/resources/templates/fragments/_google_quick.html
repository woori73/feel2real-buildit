<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="quick(buttonClass)">
  <form method="post" action="/auth/google/quick">
    <button type="submit" name="confirm14" value="true" th:class="${buttonClass}">Google 간편 로그인</button>
    <p class="login-modal-social-note">처음이면 일반 회원으로 바로 가입됩니다. 신규 가입 시 버튼을 누르면 만 14세 이상임을 확인하고 <a href="/policies/privacy">Google 이메일·계정 식별자 이용</a>에 동의합니다.</p>
  </form>
  <p class="login-modal-social-note"><a href="/auth/google/options">강사·학생 가입</a> · <a href="/auth/google/enrolled">만 14세 미만 재원생 가입</a></p>
</th:block>
</body>
</html>
