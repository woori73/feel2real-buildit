<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  NewStart 전용 인증 UI. 공통 fragments/_account_menu.html(회원가입/학생·강사 회원가입/ID·PW 로그인
  모달 포함)은 BuildIt/Wiki 등 기존 교육 서비스가 그대로 쓰므로 건드리지 않는다. NewStart는 로그인
  방법이 네이버 로그인 하나뿐이라는 방향은 유지한다(회원가입 없음, 학생/강사 선택 없음, ID/PW 없음).

  STEP 4(2026-09-21): 네이버 로그인 버튼을 Spring Security OAuth2 Client의 표준 authorization
  endpoint(/oauth2/authorization/naver, registrationId=naver — SecurityConfig가 STEP 1에서
  ClientRegistrationRepository 빈이 있을 때만 oauth2Login을 구성)로 직접 연결한다. 목적지를
  파라미터로 받지 않는 고정 링크이므로 open redirect 여지가 없다.

  account_menu.js는 그대로 재사용한다(fragments/_head.html에서 이미 로드됨) — 이 JS는
  [data-auth-actions]/[data-account-menu]/[data-account-menu-trigger]/[data-account-menu-panel]/
  [data-account-logout]을 범용 선택자로만 다루므로 내용(마크업)만 새로 짜도 그대로 동작한다.
  단, [data-account-home]은 의도적으로 넣지 않는다 — 있으면 account_menu.js의 roleHome()이
  role=STUDENT를 "학생 홈"(/stdt_dashboard)으로 오해석해 잘못 표시한다(NewStart 사용자는 교육
  서비스의 학생이 아니다). 로그인 후 홈 이동은 NewStart 자체 링크로 고정한다.

  별명(2026-09-21): "내 프로필" 메뉴 + 모달은 account_menu.js가 아니라 이 페이지들에서만
  로드하는 별도 js/newstart-profile.js가 담당한다(공용 account_menu.js/css는 건드리지 않는다
  — BuildIt/Wiki 등 다른 서비스가 그대로 쓰기 때문). users.nickname(공용, 다른 서비스와 공유)과
  달리 NewStart 표시 별명은 완전히 별도 테이블(newstart_member_profiles)이다.
-->
<th:block th:fragment="authControls">
  <div class="auth-actions" data-auth-actions hidden>
    <a class="ns-btn ns-btn-primary" href="/newstart/login">로그인 · 회원가입</a>
    <a class="ns-btn ns-btn-ghost" href="/oauth2/authorization/naver">네이버 로그인</a>
  </div>

  <div class="account-menu" data-account-menu hidden>
    <button class="account-menu-trigger" type="button" aria-label="계정 메뉴 열기" aria-haspopup="true" aria-expanded="false" data-account-menu-trigger>
      <span class="account-menu-icon" aria-hidden="true">👤</span>
    </button>
    <div class="account-menu-panel" role="menu" data-account-menu-panel hidden>
      <button class="account-menu-item" role="menuitem" type="button" data-ns-profile-trigger>내 프로필</button>
      <a class="account-menu-item" role="menuitem" href="/newstart/chat">회원 채팅</a>
      <a class="account-menu-item" role="menuitem" href="/newstart/password/set">비밀번호 변경</a>
      <button class="account-menu-item account-menu-logout" role="menuitem" type="button" data-account-logout>로그아웃</button>
    </div>
  </div>

  <div class="ns-profile-modal" data-ns-profile-modal hidden>
    <div class="ns-profile-modal-card" role="dialog" aria-modal="true" aria-label="내 프로필">
      <button class="ns-profile-modal-close" type="button" data-ns-profile-close aria-label="닫기">×</button>
      <h2 class="ns-profile-modal-title">내 프로필</h2>
      <label class="ns-label" for="ns-profile-nickname">별명</label>
      <input class="ns-input" id="ns-profile-nickname" type="text" maxlength="20"
        placeholder="예: 새출발러73" autocomplete="off" data-ns-profile-input>
      <p class="ns-note ns-profile-modal-message" data-ns-profile-message hidden></p>
      <button class="ns-btn ns-btn-primary ns-profile-modal-save" type="button" data-ns-profile-save>저장</button>
    </div>
  </div>
</th:block>
</body>
</html>
