<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  NewStart 전용 인증 UI. 공통 fragments/_account_menu.html(회원가입/학생·강사 회원가입/ID·PW 로그인
  모달 포함)은 BuildIt/Wiki 등 기존 교육 서비스가 그대로 쓰므로 건드리지 않는다. NewStart는 로그인
  방법이 "네이버로 로그인" 하나뿐이라 별도 fragment로 완전히 분리했다 — 회원가입 없음, 학생/강사
  선택 없음, ID/PW 없음.

  로그인 시작점은 /oauth2/authorization/naver(공식 Spring Security OAuth2 Client 표준 흐름,
  #341) 하나로 통일한다. 손수 작성한 V1(/oauth/naver/start)·V2(/auth/naver/v2/start)는 코드
  자체는 삭제하지 않았지만, NewStart UI는 더 이상 그쪽을 가리키지 않는다 — 실사용자 검증(PC 직접
  URL 진입)에서 공식 흐름은 PROFILE_FETCHED→USER_CREATED→LOGIN_SUCCESS까지 완주했고, V2는
  프로필 파싱("result" 키가 실제 네이버 응답의 "response"와 다름)에서 매번 실패했다.

  account_menu.js는 그대로 재사용한다(fragments/_head.html에서 이미 로드됨) — 이 JS는
  [data-auth-actions]/[data-account-menu]/[data-account-menu-trigger]/[data-account-menu-panel]/
  [data-account-logout]을 범용 선택자로만 다루므로 내용(마크업)만 새로 짜도 그대로 동작한다.
  단, [data-account-home]은 의도적으로 넣지 않는다 — 있으면 account_menu.js의 roleHome()이
  role=STUDENT를 "학생 홈"(/stdt_dashboard)으로 오해석해 잘못 표시한다(NewStart 사용자는 교육
  서비스의 학생이 아니다). 로그인 후 홈 이동은 NewStart 자체 링크로 고정한다.
-->
<th:block th:fragment="authControls">
  <div class="auth-actions" data-auth-actions hidden>
    <a class="ns-btn ns-btn-primary" href="/oauth2/authorization/naver">네이버로 로그인</a>
  </div>

  <div class="account-menu" data-account-menu hidden>
    <button class="account-menu-trigger" type="button" aria-label="계정 메뉴 열기" aria-haspopup="true" aria-expanded="false" data-account-menu-trigger>
      <span class="account-menu-icon" aria-hidden="true">👤</span>
    </button>
    <div class="account-menu-panel" role="menu" data-account-menu-panel hidden>
      <a class="account-menu-item" role="menuitem" href="/newstart/chat">회원 채팅</a>
      <button class="account-menu-item account-menu-logout" role="menuitem" type="button" data-account-logout>로그아웃</button>
    </div>
  </div>
</th:block>
</body>
</html>
