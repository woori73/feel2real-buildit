<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="head">
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <link rel="stylesheet" href="/css/admin_topnav.css">
  <script defer src="/js/service_home_navigation.js?v=20261019-1"></script>
</th:block>

  <th:block th:fragment="topnav(activeMenu)">
    <div class="topbar">
      <h1><img src="/img/F2R_logo_pure.svg" alt="F2R" style="height:32px;"><span class="badge">ADMIN</span></h1>
      <div class="user-info">
        <a data-f2r-home href="/" style="display:inline-flex;align-items:center;min-height:44px;white-space:nowrap;">홈으로</a>
        <span id="userName">-</span>
        <th:block th:replace="~{fragments/_account_menu :: accountMenu('/admin/students', '어드민 홈')}"></th:block>
      </div>
    </div>

    <div class="admin-nav-wrap">
      <!-- 자주 쓰는 곳 5개만 바로 보이고, 나머지는 「전체 메뉴」 안에 묶음별로 둔다(모든 경로·권한은 그대로). -->
      <nav class="admin-nav" aria-label="관리자 메뉴">
        <a class="admin-nav-link admin-nav-main" th:classappend="${activeMenu == 'hub'} ? ' active' : ''" href="/admin/hub">통합 대시보드</a>
        <a class="admin-nav-link admin-nav-main admin-nav-service" href="/dashboard/assistant">AI 업무 비서</a>
        <a class="admin-nav-link admin-nav-main" th:classappend="${activeMenu == 'easy'} ? ' active' : ''" href="/easy">에듀홀릭 장부</a>
        <a class="admin-nav-link admin-nav-main" href="/easy/attendance">출결부</a>
        <a class="admin-nav-link admin-nav-main" href="/admin/student-roster">학생명단(시간표)</a>
        <details class="admin-nav-more" data-admin-nav-more>
          <summary class="admin-nav-link" th:classappend="${#lists.contains({'academyMove', 'students', 'members', 'academies', 'lessonCommunities', 'naesinWiki', 'testprep', 'builder', 'wemade', 'choonggi', 'chart', 'sns', 'landing', 'newstart', 'newstartUpdates', 'newstartWiki', 'jipijigiAgent', 'analytics', 'account'}, activeMenu)} ? ' active' : ''">전체 메뉴 ▾</summary>
          <div class="admin-nav-groups">
            <div class="admin-nav-group"><div class="admin-nav-group-title">학원 운영</div>
            <a class="admin-nav-link" th:classappend="${activeMenu == 'academyMove'} ? ' active' : ''" href="/admin/academy-move">학원이사 / 모두의창업2기</a>
            <a class="admin-nav-link" th:classappend="${activeMenu == 'students'} ? ' active' : ''" href="/admin/students">학생 목록</a>
            <a class="admin-nav-link" th:classappend="${activeMenu == 'members'} ? ' active' : ''" href="/admin/members">회원 전체</a>
            <a class="admin-nav-link" th:classappend="${activeMenu == 'academies'} ? ' active' : ''" href="/admin/academies">Academy 노출 관리</a>
            <a class="admin-nav-link" th:classappend="${activeMenu == 'lessonCommunities'} ? ' active' : ''" href="/admin/lesson-communities">커뮤니티 검색</a>
            </div>
            <div class="admin-nav-group"><div class="admin-nav-group-title">장부·출결</div>
            <a class="admin-nav-link" th:classappend="${activeMenu == 'easy'} ? ' active' : ''" href="/easy">에듀홀릭 장부</a>
            <a class="admin-nav-link" href="/easy/attendance">출결부</a>
            <a class="admin-nav-link" href="/easy/connections">자동수집 연결</a>
            <a class="admin-nav-link" href="/admin/student-roster">학생명단(시간표)</a>
            </div>
            <div class="admin-nav-group"><div class="admin-nav-group-title">콘텐츠·제작</div>
            <a class="admin-nav-link" th:classappend="${activeMenu == 'naesinWiki'} ? ' active' : ''" href="/problem-generator">내신위키</a>
            <a class="admin-nav-link" th:classappend="${activeMenu == 'testprep'} ? ' active' : ''" href="/testprep">TESTPREP</a>
            <a class="admin-nav-link" th:classappend="${activeMenu == 'builder'} ? ' active' : ''" href="/builder">홈페이지 빌더</a>
            <a class="admin-nav-link" th:classappend="${activeMenu == 'wemade'} ? ' active' : ''" href="/wemade">위메이드</a>
            <a class="admin-nav-link" th:classappend="${activeMenu == 'choonggi'} ? ' active' : ''" href="/choonggi/admin">충기</a>
            <a class="admin-nav-link" th:classappend="${activeMenu == 'chart'} ? ' active' : ''" href="/admin/chart">BUILD IT CHART</a>
            <a class="admin-nav-link" th:classappend="${activeMenu == 'sns'} ? ' active' : ''" href="/admin/sns">인스타 자동 피드</a>
            <a class="admin-nav-link" th:classappend="${activeMenu == 'landing'} ? ' active' : ''" href="/admin/landing">랜딩 페이지 관리</a>
            </div>
            <div class="admin-nav-group"><div class="admin-nav-group-title">새출발</div>
            <a class="admin-nav-link" th:classappend="${activeMenu == 'newstart'} ? ' active' : ''" href="/admin/newstart">새출발</a>
            <a class="admin-nav-link" th:classappend="${activeMenu == 'newstartUpdates'} ? ' active' : ''" href="/admin/newstart/updates">새출발 업데이트</a>
            <a class="admin-nav-link" th:classappend="${activeMenu == 'newstartWiki'} ? ' active' : ''" href="/admin/newstart/wiki">부실차주 Wiki</a>
            <a class="admin-nav-link" th:classappend="${activeMenu == 'jipijigiAgent'} ? ' active' : ''" href="/admin/newstart/jipijigi">지피지기 Agent</a>
            </div>
            <div class="admin-nav-group"><div class="admin-nav-group-title">관리</div>
            <a class="admin-nav-link" th:classappend="${activeMenu == 'analytics'} ? ' active' : ''" href="/admin/analytics">통합 Analytics</a>
            <a class="admin-nav-link" th:classappend="${activeMenu == 'account'} ? ' active' : ''" href="/admin/account">계정 보안</a>
            </div>
          </div>
        </details>
      </nav>
    </div>
    <script>
      // 전체 메뉴: 바깥을 누르거나 Esc를 누르면 닫는다.
      (function () {
        var more = document.querySelector('[data-admin-nav-more]');
        if (!more) return;
        document.addEventListener('click', function (e) { if (more.open && !more.contains(e.target)) more.removeAttribute('open'); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') more.removeAttribute('open'); });
      })();
    </script>
  </th:block>
</body>
</html>
