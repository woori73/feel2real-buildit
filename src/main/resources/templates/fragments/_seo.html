<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <!--
    SEO 공용 메타태그 프래그먼트.
    사용법 (각 페이지 <head>의 <title>·description 다음에 삽입):
    <th:block th:replace="~{fragments/_seo :: seo (
      keywords='키워드1, 키워드2',
      canonical='https://feel2real.co.kr/경로',
      ogTitle='OG 제목',
      ogDescription='OG 설명',
      ogImage=null)}"></th:block>
    - keywords: 네이버 서치어드바이저용. 페이지별 노출 키워드를 콤마로 구분.
    - canonical: 정규 URL. 중복 콘텐츠 방지.
    - ogTitle/ogDescription: SNS·AI 검색 미리보기용. 보통 title·description과 동일.
    - ogImage: 대표 이미지 절대 URL (없으면 null).
    - 네이버 소유확인 메타태그는 발급 후 각 페이지가 아닌 layouts/public.html에 추가한다.
  -->
  <th:block th:fragment="seo (keywords, canonical, ogTitle, ogDescription, ogImage)">
    <meta name="keywords" th:content="${keywords}">
    <link rel="canonical" th:href="${canonical}">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:site_name" content="Feel2Real">
    <meta property="og:title" th:content="${ogTitle}">
    <meta property="og:description" th:content="${ogDescription}">
    <meta property="og:url" th:content="${canonical}">
    <meta property="og:image" th:content="${ogImage}" th:if="${ogImage != null}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" th:content="${ogTitle}">
    <meta name="twitter:description" th:content="${ogDescription}">
  </th:block>
</head>
</html>
