<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  학원 LMS 8개 화면 공통 셸. 파일 1개 안에 fragment 2개(header / sidebar)를 둔다
  — 각 fragment의 DOM이 스스로 닫혀 있어야 하므로 통합 shell fragment로 만들지 않는다.
  페이지는 <div class="lms-layout">를 직접 열고 닫는다.

  유효한 activeMenu 값: list | detail | cart | checkout | my | lecture | manage | contents
  (URL 마지막 세그먼트와 같은 이름이다. 어긋나면 오타가 조용히 통과한다)
  신규 review(/review/{lessonId}) 화면은 "내 강의실" 하위 흐름이라 activeMenu='my'를 그대로 쓴다.

  모델 속성은 AcademyLmsShellModel이 주입한다: academyName / academyHandle / lmsBase /
  lmsAuthenticated / lmsUserKey / lmsIsOwner / lmsDisplayName / lmsMainTitle / lmsIntro /
  lmsSectionName / lmsEnabled(Builder "LMS 설정" 패널, 에듀홀릭 LMS Phase 1 §7).
  activeMenu만 Thymeleaf 파라미터 프래그먼트 바인딩 — Spring 모델 속성 아님.

  ⚠ lmsIsOwner는 "메뉴를 보여줄지"만 결정한다. 접근 통제가 아니다 —
    실제 차단은 SecurityConfig 매처 + AcademyLmsManagePageController.requireOwner가 한다.
-->

<th:block th:fragment="header">
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" th:href="${lmsBase}" th:text="${lmsDisplayName}">학원명</a>
      <!-- 검색은 목록 페이지로 GET 이동한다. 목록 페이지에서 q 파라미터로 필터가 채워진다. -->
      <form class="header-search" method="get" th:action="${lmsBase}">
        <input type="text" name="q" placeholder="강좌 검색" aria-label="강좌 검색">
        <button type="submit">검색</button>
      </form>
      <div class="header-right">
        <a class="cart-link" th:href="${lmsBase} + '/cart'">
          장바구니<span class="cart-count" data-cart-count hidden>0</span>
        </a>
        <th:block th:replace="~{fragments/_account_menu :: accountMenu(${lmsBase} + '/my', '내 강의실')}"></th:block>
      </div>
    </div>
  </header>
</th:block>

<th:block th:fragment="sidebar(activeMenu)">
  <aside class="side-menu">
    <a th:href="${lmsBase}"
       th:classappend="${activeMenu == 'list'} ? 'active'">📚 온라인 내신특강</a>
    <!-- 상세/강의보기는 courseId가 필요하다. 1단계 데이터는 MOCK이므로 첫 강좌(1)로 보낸다. -->
    <a th:href="${lmsBase} + '/courses/1'"
       th:classappend="${activeMenu == 'detail'} ? 'active'">📄 강좌상세</a>
    <a th:href="${lmsBase} + '/cart'"
       th:classappend="${activeMenu == 'cart'} ? 'active'">🛒 장바구니</a>
    <a th:href="${lmsBase} + '/checkout'"
       th:classappend="${activeMenu == 'checkout'} ? 'active'">💳 결제</a>
    <a th:href="${lmsBase} + '/my'"
       th:classappend="${activeMenu == 'my'} ? 'active'">🎓 내 강의실</a>
    <a th:href="${lmsBase} + '/lecture/1'"
       th:classappend="${activeMenu == 'lecture'} ? 'active'">▶️ 강의보기</a>
    <a th:if="${lmsIsOwner}" th:href="${lmsBase} + '/manage'"
       th:classappend="${activeMenu == 'manage'} ? 'active'">🛠 강좌관리</a>
    <a th:if="${lmsIsOwner}" th:href="${lmsBase} + '/contents'"
       th:classappend="${activeMenu == 'contents'} ? 'active'">🎬 콘텐츠 관리</a>
    <!-- 캠페인 행이 있는 학원(에듀홀릭)에만 노출. 접근 통제는 SecurityConfig + 컨트롤러 requireOwner. -->
    <a th:if="${lmsIsOwner and lmsMidtermEnabled}" th:href="${lmsBase} + '/midterm-live'"
       th:classappend="${activeMenu == 'midterm-live'} ? 'active'">📣 내신 LIVE 관리</a>
  </aside>
</th:block>

<!-- 2분 맛보기 모달. 트레일러를 여는 화면(목록·강좌상세)만 포함한다. -->
<th:block th:fragment="trailerModal">
  <div class="modal-backdrop" data-trailer-modal>
    <div class="modal-box">
      <div class="modal-head">
        <h3 data-trailer-modal-title>2분 맛보기</h3>
        <button class="modal-close" type="button" data-trailer-modal-close aria-label="닫기">✕</button>
      </div>
      <div data-trailer-modal-player></div>
      <button class="btn" type="button" data-trailer-modal-enroll style="margin-top:18px">수강신청</button>
    </div>
  </div>
</th:block>

<th:block th:fragment="footer">
  <footer class="site-footer">© 2026 <span th:text="${lmsDisplayName}">학원명</span></footer>
</th:block>

</body>
</html>
