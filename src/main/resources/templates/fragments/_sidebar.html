<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  유효한 activeMenu 값: dashboard | exam-materials | study-materials | materials | tutor-materials | homework | review | chat
  (report 라우트/페이지는 유지하되 사이드바에는 노출하지 않는다 — 성취도는 종합 현황판 카드에 포함)
  role은 RoleModelInterceptor가 자동 주입 — 파라미터 전달 불필요
  activeMenu는 Thymeleaf 파라미터 프래그먼트 바인딩 — Spring 모델 속성 아님
-->
<th:block th:fragment="sidebar(activeMenu)">
  <aside class="sidebar">
    <div class="sidebar-head">
      <a class="sidebar-logo" href="/stdt_dashboard">
        <img src="/img/F2R_logo_pure.svg" alt="F2R" class="sidebar-logo-img">
        <div class="sidebar-logo-text">
          <div class="sidebar-logo-brand">Feel to Real</div>
          <div class="sidebar-logo-tag">AI English 내신</div>
        </div>
      </a>
      <th:block th:replace="~{fragments/_account_menu :: accountMenu('/stdt_dashboard', '학생 홈')}"></th:block>
    </div>

    <nav class="sidebar-nav" id="sidebarNav">
      <!-- JS(sidebar href 세팅)가 conversationId 채워서 href 세팅 / active는 Thymeleaf th:classappend로 설정 -->
      <a class="sidebar-link" th:classappend="${activeMenu == 'dashboard'} ? 'active'" data-menu="dashboard">
        <span class="dot"></span><span>종합 현황판</span>
      </a>
      <a class="sidebar-link" th:classappend="${activeMenu == 'exam-materials'} ? 'active'" data-menu="exam-materials">
        <span class="dot"></span><span>시험지 대시보드</span>
      </a>
      <a class="sidebar-link" th:classappend="${activeMenu == 'study-materials'} ? 'active'" data-menu="study-materials">
        <span class="dot"></span><span>학습자료 대시보드</span>
      </a>
      <a class="sidebar-link" th:classappend="${activeMenu == 'materials'} ? 'active'" data-menu="materials">
        <span class="dot"></span><span>학교 자료 모음</span>
      </a>
      <a class="sidebar-link" th:classappend="${activeMenu == 'tutor-materials'} ? 'active'" data-menu="tutor-materials">
        <span class="dot"></span><span>시험대비 자료</span>
      </a>
      <a class="sidebar-link" th:classappend="${activeMenu == 'homework'} ? 'active'" data-menu="homework">
        <span class="dot"></span><span>숙제 및 피드백</span>
      </a>
      <a class="sidebar-link" th:classappend="${activeMenu == 'review'} ? 'active'" data-menu="review">
        <span class="dot"></span><span>오답 노트</span>
      </a>
      <!-- chat: th:if로 STUDENT 제외 (강사/Admin 전용), th:classappend로 active 설정 -->
      <a class="sidebar-link" th:classappend="${activeMenu == 'chat'} ? 'active'"
         data-menu="chat" th:if="${role == 'ADMIN' or role == 'TUTOR'}">
        <span class="dot"></span><span>AI Chat</span>
      </a>
    </nav>

    <div class="sidebar-student" id="sidebarStudent"></div>
  </aside>
</th:block>

</body>
</html>
