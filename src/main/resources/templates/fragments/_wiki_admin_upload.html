<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  BuildIt Wiki 자료 업로드 모달 (모의고사 원본 / 분석 자료).
  /wiki, /wiki/originals, /wiki/analysis 에서 공유한다.
  ⚠ 서버 role 조건부 렌더 안 함 — 버튼/모달/스크립트는 항상 HTML에 존재한다.
  실제 권한은 wiki_admin_upload.js 가 클릭 시점에 /api/auth/me 로 확인하고,
  최종 권한은 POST /api/admin/wiki/** (Spring Security hasRole('ADMIN')) 이 결정한다.
-->
<th:block th:fragment="modal">
  <div id="wikiUploadModal" class="wiki-upload-backdrop" aria-hidden="true">
    <div class="wiki-upload-dialog" role="dialog" aria-modal="true" aria-labelledby="wikiUploadTitle">
      <div class="wiki-upload-head">
        <h3 id="wikiUploadTitle">원본 업로드</h3>
        <button type="button" class="wiki-upload-close" data-upload-close aria-label="닫기">×</button>
      </div>

      <form id="originalUploadForm" class="wiki-upload-form" data-upload-form="original">
        <div class="uf-grid">
          <label class="uf">제목<input type="text" name="title" required placeholder="고1 2026 10월 모의고사 문제풀이 해설"></label>
          <label class="uf">학년
            <select name="grade"><option value="3">고3</option><option value="2">고2</option><option value="1">고1</option></select>
          </label>
          <label class="uf">자료 종류
            <select name="docType">
              <option value="EXPLANATION">문제풀이 해설</option>
              <option value="SYNTAX">구문독해</option>
              <option value="QUESTION">문제지</option>
              <option value="ANSWER">정답지</option>
            </select>
          </label>
          <label class="uf">시험 연도<input type="number" name="year" min="2000" max="2100" value="2026" required></label>
          <label class="uf">시행 월
            <select name="examMonth">
              <option value="1">1월</option><option value="2">2월</option><option value="3">3월</option>
              <option value="4">4월</option><option value="5">5월</option><option value="6">6월</option>
              <option value="7">7월</option><option value="8">8월</option><option value="9">9월</option>
              <option value="10" selected>10월</option><option value="11">11월</option><option value="12">12월</option>
            </select>
          </label>
          <label class="uf">공개 상태
            <select name="visible">
              <option value="true">바로 공개</option>
              <option value="false">임시저장 (비공개)</option>
            </select>
          </label>
          <label class="uf uf-full">파일 <span class="muted">(PDF · HWP · HWPX · HTML · PNG · JPG)</span><input type="file" name="file"
                 accept=".pdf,.hwp,.hwpx,.html,.htm,.png,.jpg,.jpeg,.webp,application/pdf,text/html,image/png,image/jpeg,image/webp" required></label>
        </div>
        <div class="uf-preview" data-file-preview hidden></div>
        <p class="uf-msg" data-upload-msg></p>
        <div class="uf-actions">
          <button type="button" class="btn-ghost" data-upload-close>취소</button>
          <button type="submit" class="btn-primary" data-upload-submit>업로드</button>
        </div>
      </form>

      <form id="analysisUploadForm" class="wiki-upload-form" data-upload-form="analysis" hidden>
        <div class="uf-grid">
          <label class="uf uf-full">제목<input type="text" name="title" required placeholder="신사고 3학년 1학기 기말 영어 분석"></label>
          <label class="uf uf-full">설명 <span class="muted">(선택)</span><input type="text" name="description" placeholder="자료 요약"></label>
          <label class="uf">학교명 <span class="muted">(선택, 비우면 전국)</span><input type="text" name="schoolName" placeholder="비우면 전국"></label>
          <label class="uf">학년
            <select name="grade"><option value="3">고3</option><option value="2">고2</option><option value="1">고1</option></select>
          </label>
          <label class="uf">연도<input type="number" name="year" min="2000" max="2100" value="2026" required></label>
          <label class="uf">학기<input type="text" name="semester" value="1학기" required></label>
          <label class="uf">시험<input type="text" name="examType" value="기말" required></label>
          <label class="uf">과목<input type="text" name="subject" value="영어"></label>
          <label class="uf uf-full">파일 <span class="muted">(PDF · HWP · HWPX · DOCX · HTML 등 문서)</span><input type="file" name="file"
                 accept=".pdf,.hwp,.hwpx,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.html,.htm,text/html" required></label>
        </div>
        <p class="uf-msg" data-upload-msg></p>
        <div class="uf-actions">
          <button type="button" class="btn-ghost" data-upload-close>취소</button>
          <button type="submit" class="btn-primary" data-upload-submit>업로드</button>
        </div>
      </form>
    </div>
  </div>
  <script src="/js/wiki_admin_upload.js?v=20261020-1"></script>
</th:block>
</body>
</html>
