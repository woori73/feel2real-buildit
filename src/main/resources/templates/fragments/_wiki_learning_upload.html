<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  "모의고사 학습 자료" 업로드 모달 — /wiki, /wiki/learning 공용.
  ⚠ 서버 role 조건부 렌더 안 함 — 버튼/모달/스크립트는 항상 HTML에 존재한다.
  비회원 클릭 → 안내 후 로그인/회원가입. 회원이면 3단계(종류·파일·올리기)만.
  학년은 현재 Wiki 학년 탭에서 자동으로 채운다(모달에서 다시 고르지 않는다).
  최종 권한은 POST /api/wiki/learning-materials (Spring Security 인증) 이 결정한다.
-->
<th:block th:fragment="modal">
  <div id="wikiLearningModal" class="wiki-upload-backdrop" aria-hidden="true">
    <div class="wiki-upload-dialog" role="dialog" aria-modal="true" aria-labelledby="wikiLearningTitle">
      <div class="wiki-upload-head">
        <h3 id="wikiLearningTitle">자료 올리기</h3>
        <button type="button" class="wiki-upload-close" data-learning-close aria-label="닫기">×</button>
      </div>

      <form id="wikiLearningForm" class="wiki-upload-form">
        <div class="uf-grid">
          <div class="uf uf-full">자료 종류
            <div class="wl-type-group" id="wlTypeGroup" role="group" aria-label="자료 종류">
              <button type="button" class="wl-type-btn active" data-type="VOCAB">어휘</button>
              <button type="button" class="wl-type-btn" data-type="WORKBOOK">Workbook</button>
              <button type="button" class="wl-type-btn" data-type="VARIANT">변형문제</button>
              <button type="button" class="wl-type-btn" data-type="WEEKLY">WEEKLY</button>
              <button type="button" class="wl-type-btn" data-type="ETC">기타</button>
            </div>
          </div>
          <label class="uf uf-full">파일 <span class="muted">(PDF · HWP · HWPX · DOCX · HTML 등 문서)</span>
            <input type="file" name="file" required
                   accept=".pdf,.hwp,.hwpx,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.html,.htm,text/html">
          </label>
          <label class="uf uf-full">제목 <span class="muted">(파일명에서 자동 입력 — 수정 가능)</span>
            <input type="text" name="title" maxlength="200" placeholder="자료 제목">
          </label>
        </div>
        <p class="uf-msg" data-learning-msg></p>
        <div class="uf-actions">
          <button type="button" class="btn-ghost" data-learning-close>취소</button>
          <button type="submit" class="btn-primary" data-learning-submit>올리기</button>
        </div>
      </form>
    </div>
  </div>
  <script src="/js/wiki_learning_upload.js?v=20260904-2"></script>
</th:block>
</body>
</html>
