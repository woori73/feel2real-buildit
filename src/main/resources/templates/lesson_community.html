<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수업 커뮤니티 · F2R</title>
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="/css/account_menu.css">
  <link rel="stylesheet" href="/css/community.css">
  <link rel="stylesheet" href="/css/lesson_community.css">
</head>
<body class="community-body">
  <div class="community-shell" th:attr="data-lesson-id=${lessonId}">
    <header class="community-topbar">
      <a class="brand" href="/community"><img src="/img/F2R_logo_pure.svg" alt="F2R"><b>커뮤니티</b></a>
      <div class="spacer"></div>
      <a class="lesson-back-link" href="javascript:history.back()">← 수업으로</a>
      <button type="button" id="openPostForm" class="btn-ask">+ 글쓰기</button>
      <th:block th:replace="~{fragments/_account_menu :: accountMenu('/stdt_dashboard', '학생 홈')}"></th:block>
    </header>

    <div class="community-wrap">
      <section class="community-hero lesson-community-hero">
        <p class="lesson-eyebrow">Lesson Community</p>
        <h1 id="lessonTitle">수업 커뮤니티</h1>
        <p id="lessonMeta">수업 정보를 불러오는 중...</p>
        <div id="tabs" class="cat-tabs" role="tablist" aria-label="수업 커뮤니티 탭">
          <button class="cat-tab tab active" data-tab="all" type="button">전체글</button>
          <button class="cat-tab tab" data-tab="general" type="button">일반글</button>
          <button class="cat-tab tab" data-tab="qna" type="button">Q&amp;A</button>
          <button class="cat-tab tab" data-tab="notice" type="button">공지</button>
        </div>
      </section>

      <div class="community-main-row">
        <main class="community-feed">
          <div class="feed-head">
            <div class="count" id="feedCount">게시글</div>
            <button id="openTabManager" class="lesson-manage-btn" type="button" hidden>탭 관리</button>
          </div>
          <div id="postList" class="feed-list post-list">
            <div class="feed-empty">게시글을 불러오는 중...</div>
          </div>
          <section id="postDetail" class="post-detail" aria-live="polite" hidden></section>
        </main>
      </div>
    </div>

    <div id="customTabModal" class="modal-backdrop" hidden>
      <section class="modal-card tab-manager-modal" role="dialog" aria-modal="true" aria-labelledby="tabManagerTitle">
        <div class="modal-header">
          <div>
            <h2 id="tabManagerTitle">탭 관리</h2>
            <p>커스텀 탭을 추가하거나 이름을 수정할 수 있습니다. 삭제한 탭의 글은 일반글로 이동합니다.</p>
          </div>
          <button id="closeTabManager" class="icon-btn" type="button" aria-label="탭 관리 닫기">×</button>
        </div>
        <form id="customTabForm" class="custom-tab-form">
          <input name="name" maxlength="50" placeholder="새 탭 이름">
          <button class="btn-primary" type="submit">탭 추가</button>
        </form>
        <div id="customTabList" class="custom-tab-list" aria-live="polite"></div>
      </section>
    </div>

    <div id="postFormModal" class="modal-backdrop" hidden>
      <section id="postFormCard" class="modal-card compose-card" role="dialog" aria-modal="true" aria-labelledby="postFormTitle">
        <div class="modal-header">
          <div>
            <h2 id="postFormTitle">새 글 작성</h2>
            <p>수업 참여자에게만 보이는 커뮤니티 글을 작성합니다.</p>
          </div>
          <button id="closePostForm" class="icon-btn" type="button" aria-label="글 작성 닫기">×</button>
        </div>
        <form id="postForm">
          <div class="field">
            <label for="postTab">게시판</label>
            <select name="postTab" id="postTab"></select>
          </div>
          <div class="field">
            <label>제목 <span class="req">*</span></label>
            <input name="title" type="text" maxlength="150" required placeholder="제목을 입력하세요">
          </div>
          <div class="field">
            <label>본문 <span class="req">*</span></label>
            <textarea name="content" maxlength="5000" required placeholder="최대 5000자까지 입력할 수 있습니다."></textarea>
          </div>
          <div class="field">
            <label>첨부파일</label>
            <p class="hint">최대 10개, 파일당 10MB 이하</p>
            <span id="fileDropZone" class="file-drop-zone">
              파일을 선택하거나 여기에 드래그해서 첨부하세요.
              <input id="postFiles" name="files" type="file" multiple>
            </span>
            <span id="selectedFileList" class="selected-file-list">선택된 첨부파일이 없습니다.</span>
          </div>
          <div class="write-actions lesson-write-actions">
            <button class="btn-primary" type="submit">등록</button>
            <button class="btn-ghost" id="cancelPostForm" type="button">취소</button>
            <label class="checkbox-row public-inline" hidden>
              <span>공개 Q&amp;A</span>
              <input type="checkbox" name="qnaPublic" value="true">
            </label>
          </div>
        </form>
      </section>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/account_menu.js"></script>
  <script src="/js/lesson_community.js"></script>
</body>
</html>
