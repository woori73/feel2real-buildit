<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FBFAF5">
  <title>학원 홈</title>
  <script>
    // 호환: 예전 /dashboard#ai(AI 대화)와 /dashboard?ask=(통합 대시보드에서 넘긴 부탁)는 AI 업무 비서 화면으로 옮긴다.
    // #all과 주소만 있는 /dashboard는 이 학원 홈을 그대로 연다.
    (function () {
      function move() {
        var q = location.search || '';
        if (location.hash === '#ai' || /[?&]ask=/.test(q)) location.replace('/dashboard/assistant' + q + '#ai');
      }
      move();
      // 홈에 있는 채로 #ai 링크를 눌러도(해시만 바뀜) 같은 규칙으로 옮긴다.
      window.addEventListener('hashchange', move);
    })();
  </script>
  <link rel="stylesheet" href="/css/academy_home.css?v=20261111-1">
  <script defer src="/js/academy_home_view.js?v=20261111-1"></script>
  <script defer src="/js/academy_home.js?v=20261111-1"></script>
</head>
<body>
  <header class="ah-top">
    <div class="ah-top-in">
      <div class="ah-academy">
        <span class="ah-academy-name" id="ahAcademyName">학원 확인 중</span>
        <label class="ah-academy-pick" id="ahAcademyPickWrap" hidden><span class="ah-sr">학원 선택</span>
          <select id="ahAcademyPick" aria-label="학원 선택"></select>
        </label>
      </div>
      <nav class="ah-nav" aria-label="학원 업무">
        <a href="/dashboard" aria-current="page">학원 홈</a>
        <a id="ahNavStudents" href="/academycraft/screens/MBR-01-student-list.html">학생</a>
        <a href="/academycraft/screens/CLS-01-class-list.html">반/수업</a>
        <a id="ahNavAttendance" href="/academycraft/screens/ATT-03-attendance-roster.html">출결</a>
        <a href="/academycraft/screens/CNS-03-inquiry-inbox.html">상담</a>
      </nav>
    </div>
  </header>

  <main class="ah-main" id="ahMain" aria-busy="true">
    <p class="ah-date" id="ahDate"></p>
    <div class="ah-title-row">
      <h1>오늘의 학원</h1>
      <a class="ah-count" id="ahStudentCount" href="/academycraft/screens/MBR-01-student-list.html" aria-live="polite">재원생 확인 중</a>
    </div>
    <p class="ah-alert" id="ahAlert" role="alert" hidden></p>

    <section class="ah-banner" id="ahBanner" aria-labelledby="ahBannerTitle">
      <div class="ah-banner-text">
        <span class="ah-banner-kind" id="ahBannerKind">수업 확인 중</span>
        <h2 id="ahBannerTitle">오늘 수업을 불러오고 있습니다</h2>
        <p id="ahBannerMeta"></p>
        <p class="ah-banner-desc" id="ahBannerDesc" hidden></p>
      </div>
      <a class="ah-banner-btn" id="ahBannerAction" href="/academycraft/screens/ATT-03-attendance-roster.html" hidden>출결부 열기</a>
    </section>

    <div class="ah-grid">
      <section class="ah-panel ah-lessons" aria-labelledby="ahLessonsTitle">
        <h2 id="ahLessonsTitle">오늘 수업</h2>
        <ol class="ah-lesson-list" id="ahLessons"><li class="ah-skel" aria-hidden="true"></li><li class="ah-skel" aria-hidden="true"></li></ol>
        <p class="ah-note" id="ahLessonsNote" hidden></p>
      </section>

      <div class="ah-side">
        <section class="ah-panel" aria-labelledby="ahCareTitle">
          <h2 id="ahCareTitle">학생 챙기기</h2>
          <ul class="ah-care-list" id="ahCare"><li class="ah-skel" aria-hidden="true"></li></ul>
          <p class="ah-note" id="ahCareNote" hidden></p>
        </section>

        <section class="ah-panel" aria-labelledby="ahFocusTitle">
          <h2 id="ahFocusTitle">이번 주 중점 업무</h2>
          <div id="ahFocus"><p class="ah-empty">확인 중입니다.</p></div>
        </section>
      </div>
    </div>

    <nav class="ah-more" aria-label="다른 업무">
      <a href="/dashboard/info">정보 · 올린 자료 읽기</a>
      <a href="/ledger">재무 · 장부 열기</a>
      <a href="/dashboard/assistant">AI 업무 비서</a>
    </nav>
  </main>

  <script src="/js/api.js"></script>
</body>
</html>
