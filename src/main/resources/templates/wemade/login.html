<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 — 위메이드 개인주주 분석</title>
<link rel="stylesheet" th:href="@{/css/wemade.css}" href="/css/wemade.css">
</head>
<body>
<header class="appbar">
  <div class="appbar-inner">
    <div class="brand"><a th:href="@{/wemade}" href="/wemade" class="brand-link"><span class="brand-name">위메이드</span><span class="brand-code">112040</span></a></div>
  </div>
</header>
<main class="page narrow">
  <section class="card" aria-labelledby="t-login">
    <h2 class="sec-title" id="t-login">로그인</h2>
    <div class="muted small" style="margin-bottom:12px">네이버 ID를 회원 ID로 사용하고, 사이트 전용 비밀번호로 로그인합니다.</div>
    <form id="login-form">
      <label class="fld"><span>네이버 ID</span><input type="text" id="login-id" name="loginId" autocomplete="username" placeholder="영문 소문자·숫자·_·-"></label>
      <label class="fld"><span>비밀번호</span><input type="password" id="login-pw" name="password" autocomplete="current-password" placeholder="사이트 전용 비밀번호"></label>
      <div class="form-msg" id="login-msg" role="alert"></div>
      <button type="submit" class="btn wide">로그인</button>
    </form>
    <div class="hr">처음이신가요?</div>
    <form id="signup-form">
      <label class="fld"><span>네이버 ID</span><input type="text" id="signup-id" name="loginId" autocomplete="username" placeholder="영문 소문자·숫자·_·- 3~30자"></label>
      <label class="fld"><span>비밀번호 (8자 이상)</span><input type="password" id="signup-pw" name="password" autocomplete="new-password" placeholder="직접 정하는 사이트 전용 비밀번호"></label>
      <div class="form-msg" id="signup-msg" role="alert"></div>
      <button type="submit" class="btn wide secondary">회원가입</button>
    </form>
  </section>
</main>
<script>
(function () {
  'use strict';
  function msg(id, t, ok) {
    var m = document.getElementById(id);
    m.textContent = t || '';
    m.className = 'form-msg' + (t ? (ok ? ' ok' : ' err') : '');
  }
  function post(url, body) {
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); });
  }
  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    msg('login-msg', '');
    var id = document.getElementById('login-id').value.trim();
    var pw = document.getElementById('login-pw').value;
    post('/api/auth/login', { loginId: id, password: pw }).then(function (res) {
      if (res.status === 200) { location.href = '/wemade'; return; }
      msg('login-msg', (res.body && res.body.message) || '로그인에 실패했습니다. ID와 비밀번호를 확인해 주세요.');
    }).catch(function () { msg('login-msg', '로그인 요청에 실패했습니다.'); });
  });
  document.getElementById('signup-form').addEventListener('submit', function (e) {
    e.preventDefault();
    msg('signup-msg', '');
    var id = document.getElementById('signup-id').value.trim();
    var pw = document.getElementById('signup-pw').value;
    post('/api/wemade/auth/signup', { loginId: id, password: pw }).then(function (res) {
      if (res.status === 200 && res.body && res.body.ok) { location.href = '/wemade'; return; }
      msg('signup-msg', (res.body && res.body.message) || '가입에 실패했습니다.');
    }).catch(function () { msg('signup-msg', '가입 요청에 실패했습니다.'); });
  });
})();
</script>
</body>
</html>
