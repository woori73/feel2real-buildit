<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- KRX vs NXT 시장 비교 (실시간) -->
<div th:fragment="market">
  <section class="card" aria-labelledby="t-market">
    <div class="sec-head">
      <h2 class="sec-title" id="t-market">KRX vs NXT</h2>
      <span class="live-badge" id="market-live">장 시간 외</span>
    </div>
    <div class="muted small">KRX와 NXT 데이터를 출처 없이 합산하지 않습니다. 통합(UNIFIED)은 별도 표시.</div>
    <div class="market-grid">
      <div class="market-col" id="mkt-krx">
        <h3>KRX</h3>
        <div class="mkt-price" id="mkt-krx-price">-</div>
        <div class="mkt-sub" id="mkt-krx-sub">-</div>
        <div class="mkt-rows">
          <div><span>호가불균형</span><b id="mkt-krx-imb">-</b></div>
          <div><span>세션</span><b id="mkt-krx-session">-</b></div>
        </div>
      </div>
      <div class="market-col" id="mkt-nxt">
        <h3>NXT</h3>
        <div class="mkt-price" id="mkt-nxt-price">-</div>
        <div class="mkt-sub" id="mkt-nxt-sub">-</div>
        <div class="mkt-rows">
          <div><span>호가불균형</span><b id="mkt-nxt-imb">-</b></div>
          <div><span>세션</span><b id="mkt-nxt-session">-</b></div>
        </div>
      </div>
      <div class="market-col" id="mkt-gap">
        <h3>괴리</h3>
        <div class="mkt-price" id="mkt-gap-val">-</div>
        <div class="mkt-sub" id="mkt-gap-sub">NXT - KRX</div>
        <div class="mkt-rows">
          <div><span>괴리율</span><b id="mkt-gap-rate">-</b></div>
          <div><span>NXT 프리→KRX 시초 갭</span><b id="mkt-pregap">-</b></div>
        </div>
      </div>
    </div>
    <div class="fine">세션: PRE(프리) / REGULAR(정규) / AFTER(애프터) / CLOSE(종가) — KIS MARKET_CLS_CODE 기준.
    08:01 "거래 없음"은 KRX 기준이었음. NXT 프리마켓(08:00~08:50)은 별도 거래됨.</div>
    <div id="market-anomaly"><div class="state">이상수급 지표 로딩 중…</div></div>
  </section>
</div>
</body>
</html>
