<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>비밀번호 설정 | 새출발기금 부실차주</title>
  <meta name="robots" content="noindex">
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <link rel="stylesheet" href="/css/newstart.css?v=20260930-1">
  <style>
    .ns-auth-card{max-width:440px;margin:18px auto 0;border:1px solid var(--ns-line);border-radius:16px;background:#fff;padding:18px}
    .ns-auth-card label{display:block;font-size:13px;font-weight:700;margin:12px 0 4px}
    .ns-auth-card input{width:100%;min-height:46px;border:1px solid var(--ns-line);border-radius:10px;padding:0 12px;font-size:16px;box-sizing:border-box}
    .ns-pw-who{margin:0;font-size:14px;color:#4a5568}
    .ns-pw-notice{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:#fff7e6;border:1px solid #f0c36d;font-size:14px;line-height:1.6}
    .ns-auth-msg{margin:12px 0 0;font-size:14px;line-height:1.6}
    .ns-auth-msg[data-error="true"]{color:#c0392b}
    .ns-auth-submit{width:100%;min-height:48px;margin-top:16px}
  </style>
</head>
<body>
  <div class="newstart-page">
    <div class="newstart-shell">
      <header class="newstart-top">
        <a class="newstart-brand" href="/newstart" aria-label="새출발기금 부실차주 홈">새출발기금 부실차주</a>
      </header>
      <main>
        <section class="ns-auth-card" aria-labelledby="ns-pw-title">
          <h1 id="ns-pw-title" style="margin:0 0 8px;font-size:20px"
              th:text="${changeRequired} ? '새 비밀번호 설정' : '비밀번호 변경'">새 비밀번호 설정</h1>
          <p class="ns-pw-who" th:text="'로그인 계정: ' + ${loginId}">로그인 계정</p>
          <p class="ns-pw-notice" th:if="${changeRequired}">
            운영자가 임시 비밀번호로 초기화했습니다. 새 비밀번호를 정하기 전까지는 다른 기능을 이용할 수 없습니다.
          </p>

          <!-- 서버가 principal로 대상을 정한다. 이 폼에는 대상 회원 식별자가 없다 — 본인 계정만 바뀐다. -->
          <form id="ns-pw-form" autocomplete="on">
            <label for="ns-pw-current" th:text="${changeRequired} ? '임시 비밀번호' : '현재 비밀번호'">현재 비밀번호</label>
            <input id="ns-pw-current" name="currentPassword" type="password" autocomplete="current-password" required>
            <label for="ns-pw-new">새 비밀번호 (<th:block th:text="${minPasswordLength}">8</th:block>자 이상)</label>
            <input id="ns-pw-new" name="newPassword" type="password" autocomplete="new-password"
                   th:attr="minlength=${minPasswordLength}" required>
            <label for="ns-pw-confirm">새 비밀번호 확인</label>
            <input id="ns-pw-confirm" name="confirmPassword" type="password" autocomplete="new-password"
                   th:attr="minlength=${minPasswordLength}" required>
            <button class="ns-btn ns-btn-primary ns-auth-submit" type="submit"
                    th:attr="data-change-required=${changeRequired}" data-ns-pw-submit>저장</button>
          </form>
          <p class="ns-auth-msg" id="ns-pw-msg" role="status" hidden></p>
        </section>
      </main>
    </div>
  </div>
  <script src="/js/newstart-password-set.js?v=20261002-1" defer></script>
</body>
</html>
