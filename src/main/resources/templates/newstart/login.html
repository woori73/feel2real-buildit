<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>로그인·회원가입 | 새출발기금 부실차주</title>
  <meta name="robots" content="noindex">
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <link rel="stylesheet" href="/css/newstart.css?v=20260930-1">
  <style>
    .ns-auth-card{max-width:440px;margin:18px auto 0;border:1px solid var(--ns-line);border-radius:16px;background:#fff;padding:18px}
    .ns-auth-tabs{display:flex;gap:8px;margin-bottom:14px}
    .ns-auth-tabs button{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--ns-line);background:#fff;font-weight:800;cursor:pointer}
    .ns-auth-tabs button[aria-selected="true"]{background:var(--ns-blue);color:#fff;border-color:var(--ns-blue)}
    .ns-auth-card label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
    .ns-auth-card input{width:100%;min-height:46px;border:1px solid var(--ns-line);border-radius:10px;padding:0 12px;font-size:16px;box-sizing:border-box}
    .ns-auth-msg{margin:12px 0 0;font-size:14px;line-height:1.6}
    .ns-auth-msg[data-error="true"]{color:#c0392b}
    .ns-auth-submit{width:100%;min-height:48px;margin-top:14px}
  </style>
</head>
<body>
  <div class="newstart-page">
    <div class="newstart-shell">
      <header class="newstart-top">
        <a class="newstart-brand" href="/newstart" aria-label="새출발기금 부실차주 홈">새출발기금 부실차주</a>
      </header>
      <main>
        <section class="ns-auth-card" aria-labelledby="ns-auth-title">
          <h1 id="ns-auth-title" style="margin:0 0 12px;font-size:20px">로그인 · 회원가입</h1>
          <div class="ns-auth-tabs" role="tablist">
            <button type="button" role="tab" id="ns-tab-login" aria-selected="true" data-ns-tab="login">로그인</button>
            <button type="button" role="tab" id="ns-tab-signup" aria-selected="false" data-ns-tab="signup">회원가입</button>
          </div>
          <form id="ns-login-form" autocomplete="on">
            <label for="ns-login-id">네이버 ID</label>
            <input id="ns-login-id" name="loginId" type="text" autocomplete="username" autocapitalize="none" required>
            <label for="ns-login-pw">비밀번호</label>
            <input id="ns-login-pw" name="password" type="password" autocomplete="current-password" required>
            <button class="ns-btn ns-btn-primary ns-auth-submit" type="submit">로그인</button>
          </form>
          <form id="ns-signup-form" autocomplete="on" hidden>
            <label for="ns-signup-id">네이버 ID</label>
            <input id="ns-signup-id" name="loginId" type="text" autocomplete="username" autocapitalize="none" placeholder="본인의 네이버 아이디" required>
            <label for="ns-signup-nick">카페 닉네임</label>
            <input id="ns-signup-nick" name="cafeNickname" type="text" maxlength="50" placeholder="부실차주 카페에서 쓰는 닉네임" required>
            <label for="ns-signup-pw">비밀번호 (직접 정하세요, 8자 이상)</label>
            <input id="ns-signup-pw" name="password" type="password" autocomplete="new-password" minlength="8" required>
            <p class="ns-note">카페 감사회원 명단과 확실히 일치하면 감사회원으로, 아니면 일반회원으로 가입됩니다. 일반회원도 로그인할 수 있고, 감사회원 전환은 운영자가 확인합니다.</p>
            <button class="ns-btn ns-btn-primary ns-auth-submit" type="submit">회원가입</button>
          </form>
          <p class="ns-auth-msg" id="ns-auth-msg" role="status" hidden></p>
        </section>
      </main>
    </div>
  </div>
  <script src="/js/newstart-login.js?v=20261001-1" defer></script>
</body>
</html>
