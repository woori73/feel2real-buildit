<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>최신 업데이트 | 새출발기금 부실차주</title>
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <link rel="stylesheet" href="/css/newstart.css?v=20260921-3">
</head>
<body>
  <div class="newstart-page">
    <div class="newstart-shell">
      <header class="newstart-top">
        <a class="newstart-brand" href="/newstart" aria-label="새출발기금 부실차주 홈">새출발기금 부실차주</a>
        <nav class="newstart-topbar" aria-label="기본 메뉴">
          <a class="ns-btn ns-btn-ghost" href="/newstart">홈</a>
        </nav>
      </header>
      <main>
        <section class="ns-content-section" aria-labelledby="updates-title">
          <div class="ns-section-heading">
            <p class="ns-section-kicker">OFFICIAL UPDATES</p>
            <h1 id="updates-title">최신 업데이트</h1>
            <p class="ns-note">관리자 검토를 마친 공식자료만 표시합니다. 제목을 누르면 공식 원문으로 이동합니다.</p>
          </div>
          <div class="ns-update-filters" role="group" aria-label="출처 필터">
            <button class="ns-btn ns-btn-primary" type="button" data-source="">전체</button>
            <button class="ns-btn" type="button" data-source="NEWSTART_FUND">새출발기금</button>
            <button class="ns-btn" type="button" data-source="FSC">금융위원회</button>
            <button class="ns-btn" type="button" data-source="CCRS">신용회복위원회</button>
          </div>
          <div id="ns-updates-list" class="ns-update-list" aria-live="polite">
            <p class="ns-empty">불러오는 중...</p>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="/js/newstart-updates.js?v=20260921-1" defer></script>
</body>
</html>
