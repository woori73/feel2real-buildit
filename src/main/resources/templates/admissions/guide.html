<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>입시상담 가이드</title>
  <meta name="description" content="2027학년도 입시 정보를 공식 자료 기반으로 안내합니다">
  <link rel="stylesheet" href="/css/admissions-guide.css?v=20261015-1">
</head>
<body>
  <div class="admissions-page">
    <!-- 첫 화면 -->
    <section id="ag-welcome" class="ag-welcome" aria-label="입시상담 가이드 시작">
      <div class="ag-welcome-inner">
        <h1 class="ag-title">입시상담 가이드</h1>
        <p class="ag-subtitle">2027학년도 입시 정보를 공식 자료 기반으로 안내합니다</p>
        <div class="ag-year-badge" role="status">
          <span class="ag-badge">2027학년도 확정 기준</span>
        </div>
        <div class="ag-profile" aria-label="학생 정보">
          <label>학년<select id="ag-grade"><option value="">선택</option><option>고1</option><option>고2</option><option>고3</option><option>재수 이상</option></select></label>
          <label>희망 대학<input id="ag-target-universities" type="text" maxlength="200" placeholder="예: 서울대, 연세대"></label>
          <label>희망 전공<input id="ag-target-majors" type="text" maxlength="200" placeholder="예: 경영학과"></label>
          <label>관심 전형<select id="ag-admission-track"><option value="">선택</option><option>학생부교과</option><option>학생부종합</option><option>논술</option><option>정시</option><option>미정</option></select></label>
          <label class="ag-profile-wide">성적 요약<textarea id="ag-academic-summary" maxlength="500" rows="2" placeholder="개인식별정보 없이 내신·모의고사 상황을 간단히 적어주세요"></textarea></label>
        </div>
        <form id="ag-welcome-form" class="ag-input-form ag-welcome-form">
          <input id="ag-welcome-input" class="ag-input" type="text"
                 placeholder="질문을 입력하세요..." maxlength="2000"
                 aria-label="질문 입력" autocomplete="off">
          <button class="ag-send" type="submit" aria-label="전송">↑</button>
        </form>
        <div class="ag-examples" aria-label="예시 질문">
          <p class="ag-examples-label">예시 질문</p>
          <button class="ag-example" type="button" data-q="2027학년도 수시 원서접수 일정 알려줘">2027 수시 일정 알려줘</button>
          <button class="ag-example" type="button" data-q="서울대 2027학년도 정시 전형은?">서울대 정시 전형은?</button>
          <button class="ag-example" type="button" data-q="2027학년도 경영학과 모집인원은?">경영학과 모집인원은?</button>
        </div>
        <p class="ag-privacy">입력한 내용은 상담 품질 개선에만 사용됩니다. 개인정보를 입력하지 마세요.</p>
      </div>
    </section>

    <!-- 대화 화면 -->
    <section id="ag-chat" class="ag-chat" hidden aria-label="입시상담 대화">
      <header class="ag-header">
        <button id="ag-back" class="ag-back" type="button" aria-label="뒤로">←</button>
        <span class="ag-header-title">입시상담 가이드</span>
        <button id="ag-year-toggle" class="ag-year-toggle" type="button" aria-label="학년도 선택">
          <span id="ag-year-label">2027 확정</span>
        </button>
      </header>
      <div id="ag-messages" class="ag-messages" aria-live="polite" aria-label="대화 메시지"></div>
      <form id="ag-form" class="ag-input-form ag-chat-form">
        <input id="ag-input" class="ag-input" type="text"
               placeholder="질문을 입력하세요..." maxlength="2000"
               aria-label="질문 입력" autocomplete="off">
        <button class="ag-send" type="submit" aria-label="전송">↑</button>
      </form>
    </section>
  </div>
  <script src="/js/admissions-guide.js?v=20261015-1" defer></script>
</body>
</html>
