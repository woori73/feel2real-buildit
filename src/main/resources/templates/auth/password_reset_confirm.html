<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F2R - 새 비밀번호 설정</title>
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <link rel="stylesheet" href="/css/password_reset.css?v=20260630">
  <script defer src="/js/password_reset_confirm.js?v=20260629"></script>
</head>
<body>
  <main class="reset-page">
    <section class="reset-panel" aria-labelledby="passwordResetConfirmTitle">
      <img class="reset-logo" src="/img/F2R_logo_pure.svg" alt="F2R">
      <h1 id="passwordResetConfirmTitle">새 비밀번호 설정</h1>
      <p class="reset-copy">새 비밀번호를 입력해 주세요.<br>비밀번호는 8자 이상이어야 합니다</p>

      <form class="reset-form" data-password-reset-confirm-form novalidate>
        <input type="hidden" name="token">
        <label class="sr-only" for="newPassword">새 비밀번호</label>
        <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" placeholder="새 비밀번호" required minlength="8">
        <label class="sr-only" for="newPasswordConfirm">새 비밀번호 확인</label>
        <input id="newPasswordConfirm" name="newPasswordConfirm" type="password" autocomplete="new-password" placeholder="새 비밀번호 확인" required minlength="8">
        <p class="reset-error" data-password-reset-error hidden></p>
        <p class="reset-success" data-password-reset-success hidden>비밀번호가 변경되었습니다. 새 비밀번호로 로그인해 주세요.</p>
        <button class="reset-submit" type="submit">비밀번호 변경하기</button>
        <a class="reset-login-link" href="/home">로그인 화면으로 돌아가기</a>
      </form>
    </section>
  </main>
</body>
</html>
