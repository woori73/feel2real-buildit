<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가입 정보 확인 · F2R</title><link rel="stylesheet" href="/css/study-hub.css"></head><body><header><a href="/">Feel2Real</a></header><main class="article"><h1>가입·연결 확인</h1><form method="post" action="/auth/google/complete"><input type="hidden" name="nonce" th:value="${nonce}">
<fieldset th:if="${kind == 'student'}"><legend>학생</legend><label>학교 <input name="school" maxlength="80" required></label><label>학년 <input name="grade" maxlength="12" required></label></fieldset>
<fieldset th:if="${kind == 'teacher'}"><legend>강사·원장</legend><p><label>학원명 <input name="academy" maxlength="80" required></label></p><p><label>담당 과목 <input name="subject" maxlength="80" required></label></p><p><label>학원 지역 <input name="area" maxlength="80" required></label></p><p><label>카카오톡 또는 전화 <input name="contact" maxlength="100" required></label></p><label>사업자 여부 <select name="business" required><option value="">선택</option><option value="yes">예</option><option value="no">아니요</option></select></label></fieldset>
<p th:if="${kind == 'general'}">학부모·일반 회원은 추가 입력 없이 가입할 수 있습니다.</p><p th:if="${kind == 'login'}">현재 로그인한 기존 회원에 같은 이메일을 확인한 Google 계정을 연결합니다.</p><button>확인하고 시작</button></form></main></body></html>
