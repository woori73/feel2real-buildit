<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>F2R - 새 비밀번호 설정</title>
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <link rel="stylesheet" href="/css/password_reset.css?v=20260712">
  <script src="/js/api.js"></script>
  <script defer src="/js/password_change_required.js?v=20261116"></script>
</head>
<body>
  <main class="reset-page">
    <section class="reset-panel" aria-labelledby="passwordChangeTitle">
      <img class="reset-logo" src="/img/F2R_logo_pure.svg" alt="F2R">
      <h1 id="passwordChangeTitle">새 비밀번호 설정</h1>
      <p class="reset-copy">임시 비밀번호로 로그인했습니다.<br>새 비밀번호를 정해야 다른 화면을 쓸 수 있습니다.</p>

      <form class="reset-form" data-password-change-form novalidate>
        <p class="reset-copy" data-password-change-account hidden></p>
        <label class="sr-only" for="newPassword">새 비밀번호</label>
        <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" placeholder="새 비밀번호 (8자 이상)" required>
        <label class="sr-only" for="confirmPassword">새 비밀번호 확인</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="새 비밀번호 확인" required>
        <p class="reset-error" data-password-change-error hidden></p>
        <button class="reset-submit" type="submit">새 비밀번호로 바꾸기</button>
      </form>
      <p class="reset-copy"><button type="button" class="reset-secondary" data-password-change-logout>로그아웃</button></p>
    </section>
  </main>
</body>
</html>
