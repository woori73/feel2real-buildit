<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F2R - 회원가입</title>
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <link rel="stylesheet" href="/css/auth_register.css">
</head>
<body>
  <div class="card">
    <a class="back-link" id="backLink" href="/home">&#8592; 이전 페이지로 돌아가기</a>

    <h1>회원가입</h1>

    <div class="role-tabs">
      <button type="button" class="role-tab active" id="tabTutor" onclick="switchRole('tutor')">강사</button>
      <button type="button" class="role-tab" id="tabStudent" onclick="switchRole('student')">학생</button>
    </div>

    <p class="subtitle" id="roleSubtitle">가입 후 바로 Academy 생성 화면으로 이동합니다</p>

    <!-- ── 학생 폼 ── -->
    <div id="studentForm" style="display:none">

    <!-- ── 계정 정보 ── -->
    <div class="section-divider">계정 정보</div>

    <div class="form-group">
      <label for="loginId" class="required">아이디</label>
      <div class="input-with-button">
        <input type="text" id="loginId" placeholder="영문, 숫자 4~20자"
               oninput="resetLoginIdCheck('student')">
        <button type="button" class="btn-check" onclick="checkLoginId('student')">중복 아이디 체크</button>
      </div>
      <p class="field-hint" id="loginIdStatus">영문, 숫자 4~20자</p>
    </div>

    <div class="form-group">
      <label for="password" class="required">비밀번호</label>
      <input type="password" id="password" placeholder="8자 이상 입력">
    </div>

    <div class="form-group">
      <label for="passwordConfirm" class="required">비밀번호 확인</label>
      <input type="password" id="passwordConfirm" placeholder="비밀번호를 다시 입력">
    </div>

    <!-- ── 학생 정보 ── -->
    <div class="section-divider">학생 정보</div>

    <div class="form-group">
      <label for="name" class="required">이름</label>
      <input type="text" id="name" placeholder="실명 입력">
    </div>

    <div class="form-group">
      <label for="nickname" class="required">닉네임</label>
      <input type="text" id="nickname" placeholder="커뮤니티에 표시될 이름" maxlength="20">
      <p class="field-hint">한글/영문/숫자/공백/_/- 2~20자, 중복 가능</p>
    </div>

    <div class="form-group">
      <label for="email">이메일</label>
      <input type="email" id="email" placeholder="example@domain.com">
      <p class="field-hint">선택 — 분석 완료 등 알림 수신</p>
    </div>

    <div class="form-group">
      <label for="phone">연락처</label>
      <input type="tel" id="phone" placeholder="010-0000-0000" maxlength="13" oninput="formatPhoneInput(this)">
      <p class="field-hint">선택 입력</p>
    </div>

    <div class="form-group">
      <label for="schoolName" class="required">학교명</label>
      <input type="text" id="schoolName" placeholder="재학 중인 학교명 (예: 00중학교)">
    </div>

    <div class="form-group">
      <label for="grade" class="required">학년</label>
      <select id="grade">
        <option value="">학년 선택</option>
        <option value="1">1학년</option>
        <option value="2">2학년</option>
        <option value="3">3학년</option>
      </select>
    </div>

    <!-- ── 학부모 정보 ── -->
    <div class="section-divider">학부모 정보 (선택)</div>

    <div class="form-group">
      <label for="parentName">학부모 이름</label>
      <input type="text" id="parentName" placeholder="학부모 성함">
    </div>

    <div class="form-group">
      <label for="parentPhone">학부모 연락처</label>
      <input type="tel" id="parentPhone" placeholder="010-0000-0000" maxlength="13" oninput="formatPhoneInput(this)">
    </div>

    <button class="btn-primary" id="submitBtn" onclick="handleRegister()">회원가입</button>
    </div><!-- /studentForm -->

    <!-- ── 강사 폼 ── -->
    <div id="tutorForm">
      <div class="section-divider">계정 정보</div>
      <div class="form-group">
        <label for="t_loginId" class="required">아이디</label>
        <div class="input-with-button">
          <input type="text" id="t_loginId" placeholder="영문, 숫자 4~20자"
                 oninput="resetLoginIdCheck('tutor')">
          <button type="button" class="btn-check" onclick="checkLoginId('tutor')">중복 아이디 체크</button>
        </div>
        <p class="field-hint" id="t_loginIdStatus">영문, 숫자 4~20자</p>
      </div>
      <div class="form-group">
        <label for="t_password" class="required">비밀번호</label>
        <input type="password" id="t_password" placeholder="8자 이상 입력">
      </div>
      <div class="form-group">
        <label for="t_passwordConfirm" class="required">비밀번호 확인</label>
        <input type="password" id="t_passwordConfirm" placeholder="비밀번호를 다시 입력">
      </div>
      <div class="section-divider">강사 정보</div>
      <div class="form-group">
        <label for="t_name" class="required">이름</label>
        <input type="text" id="t_name" placeholder="실명 입력">
      </div>
      <div class="form-group">
        <label for="t_nickname" class="required">닉네임</label>
        <input type="text" id="t_nickname" placeholder="커뮤니티에 표시될 이름" maxlength="20">
        <p class="field-hint">한글/영문/숫자/공백/_/- 2~20자, 중복 가능</p>
      </div>
      <div class="form-group">
        <label for="t_email">이메일</label>
        <input type="email" id="t_email" placeholder="example@domain.com">
      </div>
      <div class="form-group">
        <label for="t_phone">연락처</label>
        <input type="tel" id="t_phone" placeholder="010-0000-0000" maxlength="13" oninput="formatPhoneInput(this)">
      </div>
      <button class="btn-primary" id="tutorSubmitBtn" onclick="handleTutorRegister()">가입하고 Academy 만들기</button>
    </div><!-- /tutorForm -->

    <p class="error-msg" id="errorMsg"></p>
    <p class="success-msg" id="successMsg"></p>
  </div>

  <script>

    const registerReturnUrl = window.safeInternalReturnUrl(new URLSearchParams(location.search).get('returnUrl'));
    document.getElementById('backLink')?.setAttribute('href', registerReturnUrl);

    const loginIdCheckState = {
      student: { value: '', available: false },
      tutor: { value: '', available: false }
    };

    document.addEventListener('DOMContentLoaded', () => {
      const role = new URLSearchParams(location.search).get('role');
      if (role === 'student') switchRole('student');
    });

    function switchRole(role) {
      const isStudent = role === 'student';
      document.getElementById('studentForm').style.display = isStudent ? '' : 'none';
      document.getElementById('tutorForm').style.display = isStudent ? 'none' : '';
      document.getElementById('tabStudent').classList.toggle('active', isStudent);
      document.getElementById('tabTutor').classList.toggle('active', !isStudent);
      document.getElementById('roleSubtitle').textContent = isStudent
        ? '학교 자료를 업로드하고 AI 분석 결과를 받아보세요'
        : '가입 후 바로 Academy 생성 화면으로 이동합니다';
      hideMessages();
    }

    function loginIdElements(role) {
      const isTutor = role === 'tutor';
      return {
        input: document.getElementById(isTutor ? 't_loginId' : 'loginId'),
        status: document.getElementById(isTutor ? 't_loginIdStatus' : 'loginIdStatus')
      };
    }

    function resetLoginIdCheck(role) {
      const { input, status } = loginIdElements(role);
      loginIdCheckState[role] = { value: input.value.trim(), available: false };
      input.classList.remove('error');
      status.className = 'field-hint';
      status.textContent = '영문, 숫자 4~20자';
    }

    async function checkLoginId(role) {
      const { input, status } = loginIdElements(role);
      const loginId = input.value.trim();
      loginIdCheckState[role] = { value: loginId, available: false };

      if (!loginId) {
        status.className = 'field-hint';
        status.textContent = '영문, 숫자 4~20자';
        return false;
      }
      if (!/^[A-Za-z0-9]{4,20}$/.test(loginId)) {
        input.classList.add('error');
        status.className = 'field-hint error';
        status.textContent = '아이디는 영문/숫자 4~20자로 입력해주세요.';
        return false;
      }

      status.className = 'field-hint';
      status.textContent = '아이디 중복 확인 중...';
      try {
        const res = await fetch(`/api/users/check-login-id?loginId=${encodeURIComponent(loginId)}`);
        if (!res.ok) throw new Error();
        const data = await res.json();
        if (data.available) {
          input.classList.remove('error');
          status.className = 'field-hint ok';
          status.textContent = '사용 가능한 아이디입니다.';
          loginIdCheckState[role] = { value: loginId, available: true };
          return true;
        }
        input.classList.add('error');
        status.className = 'field-hint error';
        status.textContent = '이미 사용 중인 아이디입니다.';
        return false;
      } catch (_) {
        status.className = 'field-hint error';
        status.textContent = '아이디 중복 확인에 실패했습니다. 잠시 후 다시 시도해주세요.';
        return false;
      }
    }

    async function ensureLoginIdAvailable(role) {
      const { input } = loginIdElements(role);
      const loginId = input.value.trim();
      const state = loginIdCheckState[role];
      if (state.value === loginId && state.available) return true;
      return checkLoginId(role);
    }

    async function handleTutorRegister() {
      hideMessages();
      const loginId = document.getElementById('t_loginId').value.trim();
      const password = document.getElementById('t_password').value;
      const passwordConfirm = document.getElementById('t_passwordConfirm').value;
      const name = document.getElementById('t_name').value.trim();
      const nickname = document.getElementById('t_nickname').value.trim();
      const email = document.getElementById('t_email').value.trim();
      const phone = document.getElementById('t_phone').value.replace(/\D/g, '');

      if (!loginId || !password || !passwordConfirm || !name || !nickname) {
        showError('필수 항목(*)을 모두 입력해 주세요.');
        return;
      }
      if (!isValidNickname(nickname)) {
        showError('닉네임은 한글/영문/숫자/공백/_/- 조합 2~20자로 입력해 주세요.');
        return;
      }
      if (password !== passwordConfirm) {
        showError('비밀번호가 일치하지 않습니다.');
        return;
      }
      if (password.length < 8) {
        showError('비밀번호는 8자 이상이어야 합니다.');
        return;
      }
      if (!(await ensureLoginIdAvailable('tutor'))) {
        showError('아이디 중복 확인을 완료해 주세요.');
        return;
      }

      const btn = document.getElementById('tutorSubmitBtn');
      btn.disabled = true;
      btn.textContent = '처리 중...';

      try {
        const res = await fetch('/api/users/tutors', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ loginId, password, name, nickname, email: email || null, phone: phone || null })
        });
        if (!res.ok) {
          showError(await res.text() || '회원가입에 실패했습니다.');
          return;
        }
        const loginRes = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ loginId, password })
        });
        if (loginRes.ok) sessionStorage.setItem('currentUser', JSON.stringify(await loginRes.json()));
        showSuccess('회원가입 완료! 이전 페이지로 이동합니다...');
        setTimeout(() => location.href = registerReturnUrl, 1500);
      } catch (e) {
        showError('서버 연결에 실패했습니다.');
      } finally {
        btn.disabled = false;
        btn.textContent = '가입하고 Academy 만들기';
      }
    }

    function isValidNickname(nickname) {
      return /^[가-힣A-Za-z0-9 _-]{2,20}$/.test(nickname.trim());
    }

    function formatPhoneInput(el) {
      const digits = el.value.replace(/\D/g, '').slice(0, 11);
      if (digits.length < 4) {
        el.value = digits;
      } else if (digits.length < 8) {
        el.value = digits.slice(0, 3) + '-' + digits.slice(3);
      } else {
        el.value = digits.slice(0, 3) + '-' + digits.slice(3, 7) + '-' + digits.slice(7);
      }
    }

    async function handleRegister() {
      hideMessages();

      // 필수 필드 — DOM 의 .value 바로 읽기 (HTML 에 모두 존재)
      const loginId         = document.getElementById('loginId').value.trim();
      const password        = document.getElementById('password').value;
      const passwordConfirm = document.getElementById('passwordConfirm').value;
      const name            = document.getElementById('name').value.trim();
      const nickname        = document.getElementById('nickname').value.trim();
      const schoolName      = document.getElementById('schoolName').value.trim();
      const grade           = document.getElementById('grade').value;

      // 선택 필드
      const email        = document.getElementById('email').value.trim();
      const phone        = document.getElementById('phone').value.replace(/\D/g, '');
      const parentName   = document.getElementById('parentName').value.trim();
      const parentPhone  = document.getElementById('parentPhone').value.replace(/\D/g, '');

      // 검증
      if (!loginId || !password || !passwordConfirm || !name || !nickname || !schoolName || !grade) {
        showError('필수 항목(*)을 모두 입력해 주세요.');
        return;
      }
      if (!isValidNickname(nickname)) {
        showError('닉네임은 한글/영문/숫자/공백/_/- 조합 2~20자로 입력해 주세요.');
        return;
      }
      if (password !== passwordConfirm) {
        showError('비밀번호가 일치하지 않습니다.');
        document.getElementById('passwordConfirm').classList.add('error');
        return;
      }
      if (password.length < 8) {
        showError('비밀번호는 8자 이상이어야 합니다.');
        return;
      }
      if (!(await ensureLoginIdAvailable('student'))) {
        showError('아이디 중복 확인을 완료해 주세요.');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled    = true;
      btn.textContent = '처리 중...';

      try {
        const res = await fetch('/api/users/students', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            loginId,
            password,
            name,
            nickname,
            email:        email        || null,
            phone:        phone        || null,
            schoolName,
            grade:        Number(grade),
            parentName:   parentName   || null,
            parentPhone:  parentPhone  || null
          })
        });

        if (!res.ok) {
          const text = await res.text();
          showError(text || '회원가입에 실패했습니다.');
          return;
        }

        const loginRes = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ loginId, password })
        });
        if (loginRes.ok) sessionStorage.setItem('currentUser', JSON.stringify(await loginRes.json()));
        showSuccess('회원가입이 완료됐습니다! 이전 페이지로 이동합니다...');
        setTimeout(() => location.href = registerReturnUrl, 1500);
      } catch (e) {
        showError('서버 연결에 실패했습니다.');
      } finally {
        btn.disabled    = false;
        btn.textContent = '회원가입';
      }
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent   = msg;
      el.style.display = 'block';
    }

    function showSuccess(msg) {
      const el = document.getElementById('successMsg');
      el.textContent   = msg;
      el.style.display = 'block';
    }

    function hideMessages() {
      document.getElementById('errorMsg').style.display   = 'none';
      document.getElementById('successMsg').style.display = 'none';
      document.querySelectorAll('input, select').forEach(i => i.classList.remove('error'));
    }
  </script>
</body>
</html>
