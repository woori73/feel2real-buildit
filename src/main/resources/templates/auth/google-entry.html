<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Google 간편 로그인 · F2R</title>
  <link rel="stylesheet" href="/css/study-hub.css">
  <link rel="stylesheet" href="/css/account_menu.css">
</head>
<body>
<header><a href="/">Feel2Real</a></header>
<main class="article">
  <h1>로그인 · 가입</h1>
  <p th:if="${failed}" role="alert">Google 인증이 완료되지 않았습니다. 다시 시도해 주세요.</p>
  <p th:if="${existing}" role="alert">같은 이메일의 회원 계정이 있습니다. <a href="/?login=required">기존 아이디나 네이버로 로그인</a>한 뒤 계정 메뉴에서 ‘Google 계정 연결’을 눌러 주세요.</p>
  <p th:if="${unlinked}">아직 연결되지 않은 Google 계정입니다. 처음 오셨다면 아래 버튼으로 가입할 수 있습니다.</p>
  <th:block th:replace="~{fragments/_google_quick :: quick('login-modal-google')}"></th:block>
    <th:block th:replace="~{fragments/_kakao_quick :: quick}"></th:block>
</main>
</body>
</html>
