<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F2R - 계정 찾기 / 비밀번호 재설정</title>
  <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
  <link rel="stylesheet" href="/css/password_reset.css?v=20261002-1">
  <script defer src="/js/password_reset_request.js?v=20261002-1"></script>
</head>
<body>
  <main class="reset-page">
    <section class="reset-panel" aria-labelledby="passwordResetTitle">
      <img class="reset-logo" src="/img/F2R_logo_pure.svg" alt="F2R">
      <h1 id="passwordResetTitle">계정 찾기</h1>
      <p class="reset-copy">이메일로 아이디를 찾거나,<br>아이디와 이메일로 비밀번호 재설정 링크를 발급받으세요.</p>

      <form class="reset-form" data-login-id-find-form novalidate>
        <h2 class="reset-section-title">아이디 찾기</h2>
        <label class="sr-only" for="findEmail">이메일</label>
        <input id="findEmail" name="email" type="email" autocomplete="email" placeholder="가입한 이메일" required>
        <p class="reset-error" data-login-id-find-error hidden></p>
        <div class="login-id-result" data-login-id-find-result hidden></div>
        <button class="reset-submit" type="submit">아이디 찾기</button>
      </form>

      <form class="reset-form reset-form-spaced" data-password-reset-request-form novalidate>
        <h2 class="reset-section-title">비밀번호 재설정</h2>
        <label class="sr-only" for="resetLoginId">아이디</label>
        <input id="resetLoginId" name="loginId" type="text" autocomplete="username" placeholder="아이디" required>
        <label class="sr-only" for="resetEmail">이메일</label>
        <input id="resetEmail" name="email" type="email" autocomplete="email" placeholder="가입한 이메일" required>
        <p class="reset-error" data-password-reset-error hidden></p>
        <button class="reset-submit" type="submit">재설정 링크 발급받기</button>
      </form>
    </section>
  </main>

  <div class="reset-result-modal" data-password-reset-result hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="passwordResetResultTitle">
    <div class="reset-result-card">
      <h2 id="passwordResetResultTitle">재설정 링크 발급 완료</h2>
      <div class="reset-result-email"><span aria-hidden="true">✓</span><strong data-password-reset-result-email></strong></div>
      <p>아래 링크에서 새 비밀번호를 직접 정해 주세요.</p>
      <a class="reset-temp-password" data-password-reset-link hidden></a>
      <p class="reset-result-note">링크는 60분 동안 한 번만 사용할 수 있습니다. 다른 사람에게 보여주지 마세요.</p>
      <div class="reset-result-actions">
        <button type="button" class="reset-secondary" data-reset-go-back>이전 페이지로</button>
        <a class="reset-primary" href="/home">메인 페이지로</a>
      </div>
    </div>
  </div>
</body>
</html>
