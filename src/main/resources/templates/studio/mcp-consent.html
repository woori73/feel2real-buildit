<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Feel2Real · AI 연결 승인</title>
    <th:block th:replace="~{fragments/_head :: favicon}"></th:block>
    <link rel="stylesheet" href="/css/agent_studio.css" />
  </head>
  <body>
    <main>
      <section class="hero">
        <p class="eyebrow">FEEL2REAL · READ ONLY</p>
        <h1>AI 자료 조회 연결</h1>
        <p>
          <strong th:text="${clientName}"></strong>에서 사용할 자료 범위를
          선택하세요.
        </p>
      </section>
      <section class="panel">
        <p>
          연결된 AI는 현재 계정이 조회할 수 있는 자료만 읽습니다.
          학생·회원·금융·상담 자료는 필요한 목적의 범위만 선택하세요. 연결을
          통해 자료 수정·삭제·승인·배포를 할 수 없습니다.
        </p>
        <form action="/mcp/oauth/authorize" method="post">
          <input type="hidden" name="nonce" th:value="${nonce}" /><label
            th:each="scope : ${scopes}"
            ><input
              type="checkbox"
              name="scopes"
              th:value="${scope}"
              th:checked="${scope == 'catalog:read' or scope == 'studio:read'}"
              style="
                width: auto;
                display: inline;
                vertical-align: middle;
              " /><span th:text="${scopeLabels[scope]}"></span
          ></label>
          <p>
            offline_access는 최대 30일 동안 재인증 없이 연결을 갱신합니다.
            access token은 15분 후 만료됩니다.
          </p>
          <button>선택한 읽기 범위 연결</button> <a href="/">취소하고 홈으로</a>
        </form>
      </section>
    </main>
  </body>
</html>
