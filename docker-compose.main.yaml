services:
  mysql-main:
    image: mysql:8.4
    container_name: f2r_mysql_main
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-f2r_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-f2r_db}
      MYSQL_USER: ${MYSQL_USER:-f2r_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-f2r_password}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data_main:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  mysql_data_main:
